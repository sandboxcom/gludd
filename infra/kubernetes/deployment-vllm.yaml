# Reference Kubernetes manifest for a vLLM inference server deployment.
# This is a standalone example; the authoritative source is the Terraform
# module at infra/terraform/modules/kubernetes-deploy/.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-server-config
  labels:
    app.kubernetes.io/name: inference-server
    app.kubernetes.io/engine: vllm
    app.kubernetes.io/managed-by: terraform
data:
  engine: vllm
  model_name: "mistralai/Mistral-7B-Instruct-v0.3"
  serve_command: "vllm serve --model mistralai/Mistral-7B-Instruct-v0.3 --host 0.0.0.0 --port 8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  labels:
    app.kubernetes.io/name: inference-server
    app.kubernetes.io/engine: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-server
      app.kubernetes.io/engine: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-server
        app.kubernetes.io/engine: vllm
    spec:
      containers:
        - name: vllm-server
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "mistralai/Mistral-7B-Instruct-v0.3"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-server
  labels:
    app.kubernetes.io/name: inference-server
    app.kubernetes.io/engine: vllm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference-server
    app.kubernetes.io/engine: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

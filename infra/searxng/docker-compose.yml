version: "3.9"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: gludd-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${GLUDD_SEARXNG_SECRET:-$(openssl rand -hex 32)}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/etc/searxng:rw
      - searxng_limiter:/usr/local/searxng/limiter:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  searxng_data:
    driver: local
  searxng_limiter:
    driver: local

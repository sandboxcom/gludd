[project]
name = "gludd-profile-cuda-inference"
version = "0"
# vLLM is deployed only by the Linux CUDA image, whose interpreter is 3.12.
# Keeping that execution boundary explicit avoids cross-Python resolutions in
# this already large profile lock.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Preserve the pre-split resolution. Newer vLLM releases materially change
    # the runtime graph and must be admitted as a separate dependency update.
    "vllm==0.8.5.post1",
    "torch==2.6.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

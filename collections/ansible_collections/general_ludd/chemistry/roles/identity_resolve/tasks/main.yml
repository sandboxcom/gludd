---
- name: Validate identity_resolve parameters
  ansible.builtin.assert:
    that:
      - identity_resolve_enabled | bool
      - identity_resolve_query | length > 0
    fail_msg: "identity_resolve role requires enabled=true and a non-empty query."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ identity_resolve_output_dir }}"
    state: directory
    mode: "0755"

- name: Run identity resolver
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ role_path }}/../../plugins/module_utils/chemistry_dispatch.py
  environment:
    CHEMISTRY_ACTION: identity
    CHEMISTRY_INPUT: "{{ {'query': identity_resolve_query} | to_json }}"
  register: _identity_result
  changed_when: false
  failed_when: false

- name: Parse identity result
  ansible.builtin.set_fact:
    identity_resolve_result: "{{ (_identity_result.stdout | from_json) if _identity_result.stdout | default('') | length > 0 else {} }}"

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ identity_resolve_result | to_nice_json }}"
    dest: "{{ identity_resolve_output_dir }}/identity.json"
    mode: "0644"
  when: identity_resolve_result is defined

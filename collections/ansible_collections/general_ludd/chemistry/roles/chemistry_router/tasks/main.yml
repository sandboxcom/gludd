---
- name: Validate chemistry_router parameters
  ansible.builtin.assert:
    that:
      - chemistry_router_enabled | bool
      - chemistry_router_request is mapping
    fail_msg: "chemistry_router role requires enabled=true and request=<dict>."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ chemistry_router_output_dir }}"
    state: directory
    mode: "0755"

- name: Run chemistry router
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ role_path }}/../../plugins/module_utils/chemistry_dispatch.py
  environment:
    CHEMISTRY_ACTION: route
    CHEMISTRY_INPUT: "{{ chemistry_router_request | to_json }}"
  register: _router_result
  changed_when: false
  failed_when: false

- name: Parse router result
  ansible.builtin.set_fact:
    chemistry_router_result: "{{ (_router_result.stdout | from_json) if _router_result.stdout | default('') | length > 0 else {} }}"

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ chemistry_router_result | to_nice_json }}"
    dest: "{{ chemistry_router_output_dir }}/route.json"
    mode: "0644"
  when: chemistry_router_result is defined

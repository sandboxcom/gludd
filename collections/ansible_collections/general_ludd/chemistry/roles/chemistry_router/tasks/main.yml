---
- name: Validate chemistry_router parameters
  ansible.builtin.assert:
    that:
      - chemistry_router_enabled | bool
      - chemistry_router_request is mapping
    fail_msg: "chemistry_router role requires enabled=true and request=<dict>."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ chemistry_router_output_dir }}"
    state: directory
    mode: "0755"

- name: Run chemistry router
  general_ludd.chemistry.chemistry_operation:
    operation: route
    request: "{{ chemistry_router_request }}"
    daemon_url: "{{ chemistry_daemon_url | default(daemon_url | default('http://localhost:8000')) }}"
    psk: "{{ chemistry_psk | default(psk | default('')) }}"
  register: _router_result
  no_log: "{{ (chemistry_psk | default(psk | default(''))) | length > 0 }}"

- name: Parse router result
  ansible.builtin.set_fact:
    chemistry_router_result: "{{ _router_result.result }}"

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ chemistry_router_result | to_nice_json }}"
    dest: "{{ chemistry_router_output_dir }}/route.json"
    mode: "0644"
  when: chemistry_router_result is defined

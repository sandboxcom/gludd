---
- name: Validate reaction_analyze parameters
  ansible.builtin.assert:
    that:
      - reaction_analyze_enabled | bool
      - reaction_analyze_reactants | length > 0
      - reaction_analyze_products | length > 0
    fail_msg: "reaction_analyze role requires non-empty reactants and products."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ reaction_analyze_output_dir }}"
    state: directory
    mode: "0755"

- name: Run reaction analyzer
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ role_path }}/../../plugins/module_utils/chemistry_dispatch.py
  environment:
    CHEMISTRY_ACTION: reaction
    CHEMISTRY_INPUT: "{{ {'reactants': reaction_analyze_reactants, 'products': reaction_analyze_products} | to_json }}"
  register: _reaction_result
  changed_when: false
  failed_when: false

- name: Parse reaction result
  ansible.builtin.set_fact:
    reaction_analyze_result: "{{ (_reaction_result.stdout | from_json) if _reaction_result.stdout | default('') | length > 0 else {} }}"

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ reaction_analyze_result | to_nice_json }}"
    dest: "{{ reaction_analyze_output_dir }}/reaction.json"
    mode: "0644"
  when: reaction_analyze_result is defined

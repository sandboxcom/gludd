---
# exposure.yml — Public exposure analysis
# Public-facing assets, open ports, cloud resources, social media,
# breach history, and security posture.

- name: Initialize exposure analysis
  ansible.builtin.set_fact:
    entity_exposure:
      entity_name: "{{ entity_name }}"
      public_facing_domains: "{{ entity_assets.digital_assets.domains | default([]) }}"
      open_ports_services: []
      cloud_assets:
        aws: []
        azure: []
        gcp: []
      social_media:
        presence: []
        sentiment: "unknown"
      breach_history: []
      security_posture:
        dmarc: "unknown"
        spf: "unknown"
        dkim: "unknown"
        tls_config: "unknown"
        security_txt: false
        bug_bounty: false
        known_vulnerabilities: []
      gathered_at: "{{ ansible_date_time.iso8601 }}"

# ── Shodan search (if key configured) ──
- name: Shodan organization search
  ansible.builtin.uri:
    url: "{{ entity_data_sources.shodan.base_url }}/shodan/host/search"
    method: GET
    body_format: json
    timeout: 30
  vars:
    query_strings:
      key: "{{ shodan_api_key }}"
      query: "org:\"{{ entity_name }}\""
  register: shodan_org_result
  when:
    - entity_research_use_shodan | bool
    - shodan_api_key | length > 0
  ignore_errors: true

- name: Parse Shodan results
  ansible.builtin.set_fact:
    entity_exposure: "{{ entity_exposure | combine({
      'open_ports_services': (shodan_org_result.json.matches | default([]) | map(attribute='port') | list | unique | list),
    }) }}"
  when:
    - entity_research_use_shodan | bool
    - shodan_api_key | length > 0
    - shodan_org_result is success
  ignore_errors: true

# ── HaveIBeenPwned breach search ──
- name: HIBP domain breach search
  ansible.builtin.uri:
    url: "{{ entity_data_sources.haveibeenpwned.base_url }}/breaches"
    method: GET
    body_format: json
    headers:
      Accept: "application/json"
      "hibp-api-key": "{{ hibp_api_key | default('') }}"
    timeout: 30
  vars:
    query_strings:
      domain: "{{ entity_domain }}"
  register: hibp_result
  when: entity_domain | length > 0
  ignore_errors: true

- name: Parse breach history
  ansible.builtin.set_fact:
    entity_exposure: "{{ entity_exposure | combine({
      'breach_history': hibp_result.json | default([])
    }) }}"
  when:
    - entity_domain | length > 0
    - hibp_result is success
  ignore_errors: true

# ── Email security check (SPF/DKIM/DMARC) ──
- name: Check DMARC record
  ansible.builtin.uri:
    url: "https://dns.google/resolve"
    method: GET
    body_format: json
    timeout: 10
  vars:
    query_strings:
      name: "_dmarc.{{ entity_domain }}"
      type: TXT
  register: dmarc_result
  when: entity_domain | length > 0
  ignore_errors: true

- name: Check SPF record
  ansible.builtin.uri:
    url: "https://dns.google/resolve"
    method: GET
    body_format: json
    timeout: 10
  vars:
    query_strings:
      name: "{{ entity_domain }}"
      type: TXT
  register: spf_result
  when: entity_domain | length > 0
  ignore_errors: true

- name: Update email security posture
  ansible.builtin.set_fact:
    entity_exposure: "{{ entity_exposure | combine({
      'security_posture': entity_exposure.security_posture | combine({
        'dmarc': 'configured' if (dmarc_result.json.Answer | default([]) | length > 0) else 'missing',
        'spf': 'configured' if (spf_result.json.Answer | default([]) | selectattr('data', 'contains', 'v=spf1') | list | length > 0) else 'missing',
      })
    }) }}"
  when: entity_domain | length > 0
  ignore_errors: true

# ── SearX breach/news search ──
- name: SearX breach and exposure search
  ansible.builtin.uri:
    url: "{{ entity_data_sources.searx.base_url }}{{ entity_data_sources.searx.endpoints.search }}"
    method: GET
    body_format: json
    headers:
      Accept: "application/json"
    timeout: 30
  vars:
    query: "{{ entity_name }} data breach security incident vulnerability"
    categories: "general,news"
    page: 1
  register: searx_breach_result
  when: entity_research_use_searx | bool
  ignore_errors: true

- name: SearX social media presence search
  ansible.builtin.uri:
    url: "{{ entity_data_sources.searx.base_url }}{{ entity_data_sources.searx.endpoints.search }}"
    method: GET
    body_format: json
    headers:
      Accept: "application/json"
    timeout: 30
  vars:
    query: "{{ entity_name }} twitter linkedin social media"
    categories: "general"
    page: 1
  register: searx_social_result
  when: entity_research_use_searx | bool
  ignore_errors: true

- name: Write exposure analysis artifact
  ansible.builtin.copy:
    content: "{{ entity_exposure | to_nice_json }}"
    dest: "{{ entity_research_artifact_dir }}/entity_exposure.json"
    mode: "0644"

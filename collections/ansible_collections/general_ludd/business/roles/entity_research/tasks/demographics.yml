---
# demographics.yml — Consumer demographics
# Target market segments, geographic distribution, customer size,
# acquisition channels, and public market research.

- name: Initialize demographics
  ansible.builtin.set_fact:
    entity_demographics:
      entity_name: "{{ entity_name }}"
      target_market_segments: []
      geographic_distribution: []
      customer_size:
        b2b: []
        b2c: []
      acquisition_channels: []
      market_research: []
      gathered_at: "{{ ansible_date_time.iso8601 }}"

# ── Native controller SearX demographics batch ──
- name: Search SearX for demographic signals on the controller
  ansible.builtin.include_tasks: searx_batch.yml
  vars: {entity_research_searx_batch_requests: [{id: searx_market_result, query: "{{ entity_name }} target market customer demographics audience", categories: [general]}, {id: searx_acquisition_result, query: "{{ entity_name }} customer acquisition marketing strategy channels", categories: [general]}, {id: searx_geo_result, query: "{{ entity_name }} locations offices operations countries", categories: [general]}, {id: searx_bizmodel_result, query: "{{ entity_name }} business model B2B B2C enterprise SMB customers", categories: [general]}]}
  when: entity_research_use_searx | bool

- name: Write demographics artifact
  ansible.builtin.copy:
    content: "{{ entity_demographics | to_nice_json }}"
    dest: "{{ entity_research_artifact_dir }}/entity_demographics.json"
    mode: "0644"

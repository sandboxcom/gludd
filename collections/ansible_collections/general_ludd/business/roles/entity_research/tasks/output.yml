---
# output.yml — Data output generation
# Produces entity_report.json, entity_report.md, entity_graph.dot,
# and entity_risk_matrix.csv from the gathered research artifacts.

- name: Create output directory
  ansible.builtin.file:
    path: "{{ entity_research_output_dir }}"
    state: directory
    mode: "0755"

# ── JSON report ──
- name: Build comprehensive JSON report
  ansible.builtin.set_fact:
    entity_report_json:
      entity: "{{ entity_discovered | default({}) }}"
      associations: "{{ entity_associations | default({}) }}"
      assets: "{{ entity_assets | default({}) }}"
      exposure: "{{ entity_exposure | default({}) }}"
      risks: "{{ entity_risks | default({}) }}"
      demographics: "{{ entity_demographics | default({}) }}"
      monitoring: "{{ entity_monitoring | default({}) }}"
      generated_at: "{{ ansible_date_time.iso8601 }}"

- name: Write JSON report
  ansible.builtin.copy:
    content: "{{ entity_report_json | to_nice_json }}"
    dest: "{{ entity_research_output_dir }}/entity_report.json"
    mode: "0644"
  when: "'json' in entity_research_output_formats"

# ── Markdown report ──
- name: Build Markdown report
  ansible.builtin.set_fact:
    entity_report_md: |
      # Entity Research Report: {{ entity_name }}

      **Generated:** {{ ansible_date_time.iso8601 }}
      **Status:** {{ entity_discovered.status | default('unknown') }}

      ## Discovery

      - **Legal Name:** {{ entity_discovered.legal_name | default('Unknown') }}
      - **Jurisdiction:** {{ entity_discovered.jurisdiction | default('Unknown') }}
      - **Entity Type:** {{ entity_discovered.entity_type | default('Unknown') }}
      - **Industry:** {{ entity_discovered.industry_classification.naics | default('Unknown') }}
      - **Founded:** {{ entity_discovered.year_founded | default('Unknown') }}

      ## Associations

      - **Nodes:** {{ entity_associations.nodes | default([]) | length }}
      - **Edges:** {{ entity_associations.edges | default([]) | length }}

      ## Assets

      - **Domains:** {{ entity_assets.digital_assets.domains | default([]) | length }}
      - **Trademarks:** {{ entity_assets.intellectual_property.trademarks | default([]) | length }}
      - **Patents:** {{ entity_assets.intellectual_property.patents | default([]) | length }}

      ## Exposure

      - **Public-facing domains:** {{ entity_exposure.public_facing_domains | default([]) | length }}
      - **Breaches:** {{ entity_exposure.breach_history | default([]) | length }}
      - **DMARC:** {{ entity_exposure.security_posture.dmarc | default('unknown') }}
      - **SPF:** {{ entity_exposure.security_posture.spf | default('unknown') }}

      ## Risk Summary

      | Category | Rating | Signals |
      |---|---|---|
      {% for name, cat in entity_risks.categories | default({}).items() %}
      | {{ name }} | {{ cat.rating | default('unknown') }} | {{ cat.signals_count | default(0) }} |
      {% endfor %}

      ## Demographics

      {% for segment in entity_demographics.target_market_segments | default([]) %}
      - {{ segment }}
      {% endfor %}

      ## Monitoring

      - **Registered:** {{ entity_monitoring.registered | default(false) }}
      - **Check interval:** {{ entity_monitoring.check_interval_hours | default(24) }}h
      - **Last check:** {{ entity_monitoring.last_check | default('never') }}

      ---
      _Report generated by `general_ludd.business.entity_research`_

- name: Write Markdown report
  ansible.builtin.copy:
    content: "{{ entity_report_md }}"
    dest: "{{ entity_research_output_dir }}/entity_report.md"
    mode: "0644"
  when: "'markdown' in entity_research_output_formats"

# ── Graphviz DOT file ──
- name: Build Graphviz DOT representation
  ansible.builtin.set_fact:
    entity_report_dot: |
      digraph EntityGraph {
        rankdir="LR";
        node [shape="box", style="rounded"];

        "{{ entity_name }}" [label="{{ entity_name }}\n[root]"];

        {% for node in entity_associations.nodes | default([]) %}
        "{{ node.name }}" [label="{{ node.name }}\n[{{ node.type }}]"];
        {% endfor %}

        {% for edge in entity_associations.edges | default([]) %}
        "{{ edge.from }}" -> "{{ edge.to }}" [label="{{ edge.type }}"];
        {% endfor %}
      }

- name: Write DOT graph file
  ansible.builtin.copy:
    content: "{{ entity_report_dot }}"
    dest: "{{ entity_research_output_dir }}/entity_graph.dot"
    mode: "0644"
  when: "'dot' in entity_research_output_formats"

# ── Risk matrix CSV ──
- name: Build risk matrix CSV
  ansible.builtin.set_fact:
    entity_report_csv: |
      Category,Rating,Score,Signals,Threshold_Low,Threshold_High
      {% for name, cat in entity_risks.categories | default({}).items() %}
      {{ name }},{{ cat.rating | default('unknown') }},{{ cat.score | default('N/A') }},{{ cat.signals_count | default(0) }},{{ cat.template.thresholds.low_risk | default('N/A') }},{{ cat.template.thresholds.high_risk | default('N/A') }}
      {% endfor %}

- name: Write risk matrix CSV
  ansible.builtin.copy:
    content: "{{ entity_report_csv }}"
    dest: "{{ entity_research_output_dir }}/entity_risk_matrix.csv"
    mode: "0644"
  when: "'csv' in entity_research_output_formats"

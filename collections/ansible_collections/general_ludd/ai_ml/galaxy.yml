description: >
  AI/ML expert collection — all 20 roles from docs/specs/FEATURE_AI_ML_EXPERT.md
  that route AI/ML questions to the smallest qualified role set (AIML-001),
  discover research evidence (AIML-002), ingest it into an immutable
  citation-addressable store (AIML-003), produce cited and
  uncertainty-calibrated answers (AIML-007), and discover mature existing
  tools before any custom code is written (AIML-018). Also covers
  registries, datasets, retrieval, reasoning, evaluation, adapter training,
  distillation, accelerators, simulators, world models, vision, images,
  speech (ASR/TTS), and promotion/release gating. The typed Python service
  API lives in src/general_ludd/ai_ml/ and is consumed by the roles; no
  independent ML logic lives in the task files.

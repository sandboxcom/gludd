---
- name: Admit a controller-local dataset with Frictionless
  general_ludd.ai_ml.dataset_admit:
    root: "{{ dataset_engineer_root }}"
    resources: "{{ dataset_engineer_resources }}"
    schema: "{{ dataset_engineer_schema }}"
    name: "{{ dataset_engineer_name }}"
    description: "{{ dataset_engineer_description }}"
    license: "{{ dataset_engineer_license }}"
  register: ai_ml_dataset_result

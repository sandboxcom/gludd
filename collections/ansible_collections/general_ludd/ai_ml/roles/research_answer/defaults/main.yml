---
# research_answer defaults — reasoning (AIML-007).
#
# Retrieves evidence from the store and produces a cited,
# uncertainty-calibrated answer with at least one independent verification
# for high-impact numerical claims (spec §6.3). Failed checks produce
# `degraded` or `failed`, never a confident answer.
research_answer_enabled: false

# Natural-language question, e.g. "What is the recall@10 of BM25 on MS MARCO?"
research_answer_query: ""

# Tenant scoping for evidence retrieval.
research_answer_tenant_id: "default"

# Evidence store snapshot to read from. Snapshots are immutable; the role
# never reads from a staging area.
research_answer_snapshot_id: null

# When true, requires at least one independent numerical check (alternative
# solver, dimensional analysis, limiting case, benchmark) before returning
# `succeeded` for a numerical answer (spec §6.3 paragraph 2).
research_answer_require_independent_check: true

# Deadline in seconds. The role refuses rather than returns a rushed answer.
research_answer_deadline_s: 300

research_answer_output_dir: /tmp/gludd-aiml-research-answer

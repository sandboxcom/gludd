---
# i18n_extract role — extract translatable strings from source code:
# xgettext-style extraction, gettext .po/.pot generation, babel scan,
# pseudolocalization for testing, i18n linting for hardcoded strings.

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0755"

- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Extract translatable strings via knowledge module
  ansible.builtin.script:
    cmd: |
      python3 -c "
import json, sys, os, re, glob as glob_mod
sys.path.insert(0, os.path.expanduser('{{ playbook_dir | default('.') }}/../../../../src'))

source_dir = '{{ source_dir }}'
output_dir = '{{ output_dir }}'
artifact_dir = '{{ artifact_dir }}'
pot_file = '{{ pot_file }}'
patterns = {{ source_patterns | to_json }}

result = {'string_count': 0, 'files_scanned': 0, 'pot_path': '', 'strings': []}
if not source_dir or not os.path.isdir(source_dir):
    result['error'] = f'Source directory not found: {source_dir}'
else:
    gettext_re = re.compile(r'(?:_|gettext|ngettext|pgettext)\s*\(\s*[\"\\'](.+?)[\"\\']', re.DOTALL)
    hardcoded_re = re.compile(r'[\"\\']([A-Z][a-z].*?)[\"\\']', re.DOTALL)
    placeholder_re = re.compile(r'(?<!%)%(?:\(.*?\))?[sdfg]|\\{[^}]*\\}')

    strings = []
    lint_findings = []

    for pattern in patterns:
        for fpath in glob_mod.glob(os.path.join(source_dir, '**', pattern), recursive=True):
            result['files_scanned'] += 1
            try:
                with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                    content = f.read()
                found = gettext_re.findall(content)
                for s in found:
                    strings.append({'file': fpath, 'string': s})
                result['string_count'] += len(found)

                if {{ lint_placeholders | lower }}:
                    for s in found:
                        if placeholder_re.search(s):
                            lint_findings.append({
                                'file': fpath, 'string': s,
                                'issue': 'Format placeholder detected in translatable string'
                            })
            except Exception:
                pass

    result['strings'] = strings[:500]  # limit output

    pot_path = os.path.join(output_dir, pot_file)
    with open(pot_path, 'w', encoding='utf-8') as f:
        f.write('# Generated by general_ludd.language.i18n_extract\n')
        f.write('#, fuzzy\n')
        f.write('msgid \"\"\nmsgstr \"\"\n')
        f.write('\"Content-Type: text/plain; charset=UTF-8\\n\"\n\n')
        seen = set()
        for entry in strings:
            if entry['string'] not in seen:
                seen.add(entry['string'])
                f.write(f'#: {entry[\"file\"]}\n')
                f.write(f'msgid \"{entry[\"string\"]}\"\nmsgstr \"\"\n\n')
    result['pot_path'] = pot_path

    if {{ pseudolocalize | lower }}:
        pseudoloc_locale = '{{ pseudoloc_locale }}'
        po_path = os.path.join(output_dir, f'{pseudoloc_locale}.po')
        with open(po_path, 'w', encoding='utf-8') as f:
            f.write('# Pseudolocalized by general_ludd.language.i18n_extract\n\n')
            seen = set()
            for entry in strings:
                if entry['string'] not in seen:
                    seen.add(entry['string'])
                    pseudo = '[' + entry['string'] + ']'
                    f.write(f'#: {entry[\"file\"]}\n')
                    f.write(f'msgid \"{entry[\"string\"]}\"\nmsgstr \"{pseudo}\"\n\n')
        result['pseudoloc_po'] = po_path

    if {{ lint_hardcoded | lower }} and source_dir:
        for pattern in patterns:
            for fpath in glob_mod.glob(os.path.join(source_dir, '**', pattern), recursive=True):
                try:
                    with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                        content = f.read()
                    for match in hardcoded_re.finditer(content):
                        s = match.group(1)
                        if len(s) > 5 and ' ' in s:
                            line = content[:match.start()].count('\n') + 1
                            lint_findings.append({
                                'file': fpath, 'line': line,
                                'string': s[:60],
                                'issue': 'Possible hardcoded user-facing string not wrapped in gettext'
                            })
                except Exception:
                    pass
    result['lint_findings'] = lint_findings[:100]

report_path = os.path.join(artifact_dir, 'extraction_report.json')
with open(report_path, 'w') as f:
    json.dump(result, f, indent=2, ensure_ascii=False)
print(f'Report: {report_path}')
print(f'Strings extracted: {result[\"string_count\"]}')
print(f'Files scanned: {result[\"files_scanned\"]}')
print(f'POT file: {result.get(\"pot_path\", \"\")}')
"
  args:
    executable: python3
  register: i18n_result
  changed_when: false

- name: Print i18n extraction summary
  ansible.builtin.debug:
    msg: "{{ i18n_result.stdout_lines }}"

---
- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Transliterate through Gludd
  general_ludd.language.language_operation:
    operation: transliterate
    payload:
      input_text: "{{ input_text }}"
      target_script: "{{ target_script }}"
      scheme: "{{ scheme }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: transliterate_result
  no_log: true
  changed_when: false

- name: Write transliteration artifact atomically
  ansible.builtin.copy:
    content: "{{ transliterate_result.result | to_nice_json }}\n"
    dest: "{{ artifact_dir }}/transliteration.json"
    mode: "0600"

- name: Print transliteration summary
  ansible.builtin.debug:
    var: transliterate_result.result

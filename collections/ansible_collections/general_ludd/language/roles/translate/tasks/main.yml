---
- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Translate through Gludd
  general_ludd.language.language_operation:
    operation: translate
    payload:
      input_text: "{{ input_text }}"
      source_language: "{{ source_language }}"
      target_language: "{{ target_language }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: translate_result
  no_log: true
  changed_when: false

- name: Write translation artifact atomically
  ansible.builtin.copy:
    content: "{{ translate_result.result | to_nice_json }}\n"
    dest: "{{ artifact_dir }}/translation.json"
    mode: "0600"

- name: Print translation summary
  ansible.builtin.debug:
    var: translate_result.result

---
# Unicode General Category reference
unicode_categories:
  Lu: "Letter, Uppercase"
  Ll: "Letter, Lowercase"
  Lt: "Letter, Titlecase"
  Lm: "Letter, Modifier"
  Lo: "Letter, Other"
  Mn: "Mark, Nonspacing"
  Mc: "Mark, Spacing Combining"
  Me: "Mark, Enclosing"
  Nd: "Number, Decimal Digit"
  Nl: "Number, Letter"
  No: "Number, Other"
  Pc: "Punctuation, Connector"
  Pd: "Punctuation, Dash"
  Ps: "Punctuation, Open"
  Pe: "Punctuation, Close"
  Pi: "Punctuation, Initial Quote"
  Pf: "Punctuation, Final Quote"
  Po: "Punctuation, Other"
  Sm: "Symbol, Math"
  Sc: "Symbol, Currency"
  Sk: "Symbol, Modifier"
  So: "Symbol, Other"
  Zs: "Separator, Space"
  Zl: "Separator, Line"
  Zp: "Separator, Paragraph"
  Cc: "Other, Control"
  Cf: "Other, Format"
  Cs: "Other, Surrogate"
  Co: "Other, Private Use"
  Cn: "Other, Not Assigned"

unicode_planes:
  BMP: "Basic Multilingual Plane (0000-FFFF)"
  SMP: "Supplementary Multilingual Plane (10000-1FFFF)"
  SIP: "Supplementary Ideographic Plane (20000-2FFFF)"
  TIP: "Tertiary Ideographic Plane (30000-3FFFF)"
  SSP: "Supplementary Special-purpose Plane (E0000-E0FFF)"
  SPUA-A: "Supplementary Private Use Area-A (F0000-FFFFF)"
  SPUA-B: "Supplementary Private Use Area-B (100000-10FFFF)"
  PUA: "Private Use Area (E000-F8FF)"

normalization_forms:
  - NFC
  - NFD
  - NFKC
  - NFKD

utf_encodings:
  - UTF-8
  - UTF-16-LE
  - UTF-16-BE
  - UTF-32-LE
  - UTF-32-BE

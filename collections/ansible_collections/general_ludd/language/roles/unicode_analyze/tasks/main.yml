---
- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Read managed-host input for controller analysis
  ansible.builtin.slurp:
    src: "{{ input_file }}"
  register: unicode_input
  when: input_file | length > 0
  changed_when: false

- name: Analyze Unicode text through Gludd
  general_ludd.language.language_operation:
    operation: unicode_analyze
    payload:
      input_text: "{{ input_text }}"
      input_b64: "{{ unicode_input.content | default('') }}"
      include_codepoints: "{{ include_codepoints }}"
      include_normalization: "{{ include_normalization }}"
      include_grapheme_clusters: "{{ include_grapheme_clusters }}"
      include_surrogates: "{{ include_surrogates }}"
      include_utf_encodings: "{{ include_utf_encodings }}"
      include_version_info: "{{ include_version_info }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: unicode_result
  no_log: true
  changed_when: false

- name: Write Unicode analysis artifact atomically
  ansible.builtin.copy:
    content: "{{ unicode_result.result | to_nice_json }}\n"
    dest: "{{ artifact_dir }}/unicode_analysis.json"
    mode: "0600"

- name: Print Unicode analysis summary
  ansible.builtin.debug:
    var: unicode_result.result

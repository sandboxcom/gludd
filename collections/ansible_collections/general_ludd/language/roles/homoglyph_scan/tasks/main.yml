---
# homoglyph_scan role — detect confusable/homoglyph characters:
# UTS #39 confusables, invisible character detection, bidi spoofing,
# mixed-script detection, whole-script confusables.

- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Scan for confusable characters via knowledge module
  ansible.builtin.script:
    cmd: |
      python3 -c "
import json, sys, os, unicodedata
sys.path.insert(0, os.path.expanduser('{{ playbook_dir | default('.') }}/../../../../src'))
from general_ludd.language.homoglyph_data import (
    HOMOGLYPH_GROUPS, INVISIBLE_CHARACTERS, ATTACK_VECTORS
)

text = '{{ input_text }}'
domain = '{{ input_domain }}'
if domain and not text:
    text = domain

result = {'input_length': len(text), 'findings': [], 'attack_vectors': []}
severity_rank = {'low': 0, 'medium': 1, 'high': 2, 'critical': 3}
min_sev = severity_rank.get('{{ min_severity }}', 0)

cp_to_skeleton = {}
for group in HOMOGLYPH_GROUPS:
    for cp, name in group['characters']:
        cp_to_skeleton[cp] = group['skeleton']

invisible_map = {inv['codepoint']: inv for inv in INVISIBLE_CHARACTERS}
bidi_codepoints = {inv['codepoint'] for inv in INVISIBLE_CHARACTERS if inv['category'] == 'bidi-control'}

findings = []
script_counts = {}

for ch in text:
    cp = ord(ch)
    try:
        script = unicodedata.script_name(ch)
    except (ValueError, AttributeError):
        script = 'Unknown'
    script_counts[script] = script_counts.get(script, 0) + 1

    if {{ check_confusables | lower }} and cp in cp_to_skeleton:
        skel = cp_to_skeleton[cp]
        if skel and skel != ch:
            findings.append({
                'type': 'confusable', 'severity': 'medium',
                'character': ch, 'codepoint': f'U+{cp:04X}',
                'name': unicodedata.name(ch, ''),
                'skeleton': skel,
                'description': f'Confusable character: looks like \"{skel}\" but is {unicodedata.name(ch, \"unknown\")}'
            })

    if {{ check_invisible | lower }} and cp in invisible_map:
        inv = invisible_map[cp]
        findings.append({
            'type': 'invisible', 'severity': 'high' if inv['category'] == 'bidi-control' else 'medium',
            'character': ch, 'codepoint': f'U+{cp:04X}',
            'name': inv['name'], 'short_name': inv['short_name'],
            'risk': inv['risk'], 'cve': inv['cve_reference']
        })

    if {{ check_bidi | lower }} and cp in bidi_codepoints:
        findings.append({
            'type': 'bidi_spoof',
            'severity': 'critical' if cp in (0x202A, 0x202B, 0x202D, 0x202E) else 'high',
            'character': ch, 'codepoint': f'U+{cp:04X}',
            'name': unicodedata.name(ch, ''),
            'cve': 'CVE-2021-42574' if cp in range(0x202A, 0x202F) else '',
            'description': 'Bidirectional text control character — potential Trojan Source attack'
        })

if {{ check_mixed_script | lower }}:
    scripts_present = [s for s, count in script_counts.items() if count > 0 and s not in ('Common', 'Inherited', 'Unknown')]
    if len(scripts_present) > 1:
        findings.append({
            'type': 'mixed_script',
            'severity': 'medium',
            'scripts': scripts_present,
            'description': f'Mixed scripts detected: {\", \".join(scripts_present)}'
        })
    result['scripts_detected'] = scripts_present
    result['script_counts'] = script_counts

seen_types = set()
result['findings'] = [f for f in findings if severity_rank.get(f['severity'], 0) >= min_sev]

for f in result['findings']:
    if f['type'] == 'confusable':
        if 'attack_vectors' not in result or 'domain_spoofing' not in seen_types:
            result.setdefault('attack_vectors', []).append({
                'vector': 'domain_spoofing',
                'description': ATTACK_VECTORS.get('domain_spoofing', ''),
                'severity': 'high'
            })
            seen_types.add('domain_spoofing')
    elif f['type'] == 'bidi_spoof':
        result.setdefault('attack_vectors', []).append({
            'vector': 'code_injection',
            'description': ATTACK_VECTORS.get('code_injection', ''),
            'severity': 'critical'
        })

result['total_findings'] = len(result['findings'])
result['severity_counts'] = {}
for f in result['findings']:
    result['severity_counts'][f['severity']] = result['severity_counts'].get(f['severity'], 0) + 1
result['safe'] = result['total_findings'] == 0

with open('{{ artifact_dir }}/homoglyph_scan.json', 'w') as f:
    json.dump(result, f, indent=2, ensure_ascii=False)
print(f'Output: {{ artifact_dir }}/homoglyph_scan.json')
print(f'Findings: {result[\"total_findings\"]}')
print(f'Safe: {result[\"safe\"]}')
for sev, count in result['severity_counts'].items():
    print(f'  {sev}: {count}')
"
  args:
    executable: python3
  register: homoglyph_result
  changed_when: false

- name: Print homoglyph scan summary
  ansible.builtin.debug:
    msg: "{{ homoglyph_result.stdout_lines }}"

---
- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Scan text for homoglyph attacks through Gludd
  general_ludd.language.language_operation:
    operation: homoglyph_scan
    payload:
      input_text: "{{ input_text }}"
      input_domain: "{{ input_domain }}"
      check_confusables: "{{ check_confusables }}"
      check_invisible: "{{ check_invisible }}"
      check_bidi: "{{ check_bidi }}"
      check_mixed_script: "{{ check_mixed_script }}"
      min_severity: "{{ min_severity }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: homoglyph_result
  no_log: true
  changed_when: false

- name: Write homoglyph analysis artifact atomically
  ansible.builtin.copy:
    content: "{{ homoglyph_result.result | to_nice_json }}\n"
    dest: "{{ artifact_dir }}/homoglyph_scan.json"
    mode: "0600"

- name: Print homoglyph scan summary
  ansible.builtin.debug:
    var: homoglyph_result.result

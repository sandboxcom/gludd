---
- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Run locale_format standalone script
  ansible.builtin.script:
    cmd: "files/locale_format.py --locale '{{ locale }}' --value '{{ value }}' --value-type '{{ value_type }}' --output '{{ artifact_dir }}/locale_format.json'"
    executable: "{{ ansible_python_interpreter | default('python3') }}"
  register: locale_result
  changed_when: false

- name: Print locale format summary
  ansible.builtin.debug:
    msg: "{{ locale_result.stdout_lines }}"

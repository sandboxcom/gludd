---
- name: Ensure artifact directory exists
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Format locale value through Gludd
  general_ludd.language.language_operation:
    operation: locale_format
    payload:
      value: "{{ value }}"
      value_type: "{{ value_type }}"
      locale: "{{ locale }}"
      date_length: "{{ date_length }}"
      currency_code: "{{ currency_code }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: locale_result
  no_log: true
  changed_when: false

- name: Write locale format artifact atomically
  ansible.builtin.copy:
    content: "{{ locale_result.result | to_nice_json }}\n"
    dest: "{{ artifact_dir }}/locale_format.json"
    mode: "0600"

- name: Print locale format summary
  ansible.builtin.debug:
    var: locale_result.result

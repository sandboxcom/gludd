---
model_capabilities:
  - name: language_detection
    description: Statistical and stopword-based language detection across 50+ languages
    roles:
      - language_detect
    model_needs:
      - text_analysis
      - classification
    quality_class: high
    aliases:
      - detect_language
      - lang_detect
  - name: translation
    description: Multi-language translation via dictionary and LLM fallback
    roles:
      - translate
    model_needs:
      - generation
      - multilingual
    quality_class: high
    aliases:
      - translate_text
      - language_translate
  - name: transliteration
    description: Script-to-script transliteration (Cyrillic, Arabic, CJK, Indic, etc.)
    roles:
      - transliterate
    model_needs:
      - text_processing
      - multilingual
    quality_class: high
    aliases:
      - script_convert
      - romanize
  - name: unicode_analyze
    description: Unicode property analysis — script, block, plane, category, normalization
    roles:
      - unicode_analyze
    model_needs:
      - text_analysis
      - reference
    quality_class: medium
    aliases:
      - unicode_lookup
      - char_analysis
  - name: encoding_detect
    description: Character set encoding detection, conversion, and mojibake repair
    roles:
      - encoding_detect
    model_needs:
      - text_analysis
      - pattern_matching
    quality_class: high
    aliases:
      - charset_detect
      - mojibake_repair
  - name: font_analyze
    description: Font file analysis — metrics, features, OpenType tables, web-font validation
    roles:
      - font_analyze
    model_needs:
      - analysis
      - reference
    quality_class: medium
    aliases:
      - font_info
      - opentype_analyze
  - name: homoglyph_scan
    description: Homoglyph and confusable character detection via Unicode TR39 data
    roles:
      - homoglyph_scan
    model_needs:
      - text_analysis
      - security
    quality_class: high
    aliases:
      - confusable_scan
      - homoglyph_detect
  - name: phonetic_transcribe
    description: Text-to-phoneme conversion — IPA, ARPABET, Soundex, Metaphone, Double Metaphone
    roles:
      - phonetic_transcribe
    model_needs:
      - text_processing
      - reference
    quality_class: medium
    aliases:
      - text_to_phoneme
      - metaphone
  - name: locale_format
    description: Locale-aware formatting — dates, numbers, currency per CLDR data
    roles:
      - locale_format
    model_needs:
      - text_processing
      - reference
    quality_class: medium
    aliases:
      - l10n_format
      - locale_aware
  - name: i18n_extract
    description: Internationalization string extraction (xgettext-style) from source code
    roles:
      - i18n_extract
    model_needs:
      - text_analysis
      - parsing
    quality_class: medium
    aliases:
      - string_extract
      - pot_generate
  - name: bom_detect
    description: Byte Order Mark detection, stripping, and addition per RFC/IETF
    roles:
      - bom_detect
    model_needs:
      - text_analysis
      - reference
    quality_class: medium
    aliases:
      - bom_scan
      - bom_strip
role_capabilities:
  language_detect:
    - language_detection
  translate:
    - translation
  transliterate:
    - transliteration
    - script_conversion
  unicode_analyze:
    - unicode_analysis
    - unicode_properties
  encoding_detect:
    - charset_detection
    - mojibake_repair
  font_analyze:
    - font_analysis
    - opentype_analysis
  homoglyph_scan:
    - confusable_detection
    - text_security
  phonetic_transcribe:
    - phoneme_conversion
    - phonetic_analysis
  locale_format:
    - l10n_formatting
    - locale_aware
  i18n_extract:
    - i18n_extraction
    - pot_generation
  bom_detect:
    - bom_detection
    - bom_handling

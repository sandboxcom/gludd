cdns:
  - provider: Cloudflare
    description: Global edge network. Anycast CDN, DDoS mitigation (Magic Transit), WAF, Argo Smart Routing. 330+ cities.
    features: [Anycast, WAF, Workers (edge compute), R2 (object storage), DDoS protection, Durable Objects, KV store, Pages, Stream, Images]
  - provider: Akamai
    description: Largest CDN by server count. 4000+ PoPs, 135+ countries. Specialized in media delivery, security, edge compute.
    features: [Media delivery, Ion (performance), Kona (security), EdgeWorkers, Image & Video Manager, Adaptive Media Delivery, mPulse (RUM)]
  - provider: Fastly
    description: Edge cloud platform. Instant purge, VCL-based configuration, Varnish cache. Wasm Compute@Edge.
    features: [Instant purge, VCL, Compute@Edge (Wasm), Image Optimizer, TLS 1.3, HTTP/3, real-time logging, DDoS mitigation]
  - provider: Amazon CloudFront
    description: AWS CDN. 600+ PoPs. Deep S3/Lambda integration. Origin Shield for cache hierarchy.
    features: [S3 origin, Lambda@Edge, CloudFront Functions, Origin Shield, Field-Level Encryption, real-time logs, KeyValueStore, continuous deployment]
  - provider: Azure CDN / Front Door
    description: Microsoft CDN. Front Door for global HTTP/S load balancing + CDN. Anycast.
    features: [Azure Front Door (layer 7 LB + CDN), Verizon/Akamai backend, WAF, custom domain TLS, rules engine, Private Link origins]
  - provider: Google Cloud CDN
    description: Google's global edge. Deep integration with Google Cloud Load Balancing. Anycast IP.
    features: [Global anycast LB, QUIC/HTTP/3, signed URLs/cookies, Cloud Armor (WAF/DDoS), hybrid origin, cache modes]
  - provider: Edgio (Limelight)
    description: Private edge network. Tier 1 ISP peering. Specialized in video and large-file delivery.
    features: [Large file/video delivery, Web Application Firewall, edge compute, API acceleration, origin shield]

tier_isps:
  tier1:
    description: >
      Networks that peer settlement-free with ALL other Tier 1
      networks in the default-free zone (DFZ). Have global backbone.
      Do not buy transit from anyone.
    characteristics: [Settlement-free peering with all other Tier 1 networks, Global backbone infrastructure, No transit purchases, Full BGP table (~950K routes)]
    examples:
      - "Cogent Communications (AS174)"
      - "Lumen/CenturyLink/Level3 (AS3356)"
      - "NTT Communications (AS2914)"
      - "GTT (AS3257)"
      - "Telia Carrier (AS1299)"
      - "Zayo (AS6461)"
      - "Liberty Global/LGI (AS6830)"
      - "Vodafone Carrier (AS1273)"
      - "Tata Communications (AS6453)"
      - "Sprint/T-Mobile (AS1239)"
      - "Telecom Italia/Sparkle (AS6762)"
      - "Hurricane Electric (AS6939)"
  tier2:
    description: >
      Regional networks that peer with some networks and buy transit
      from others. Form the majority of the internet backbone.
      May have extensive regional fiber but limited global reach.
    characteristics: [Mix of peering and transit, Regional or national footprint, May peer at public IXPs]
    examples:
      - "Comcast (AS7922)"
      - "Verizon (AS701)"
      - "AT&T (AS7018)"
      - "Orange (AS5511)"
      - "Deutsche Telekom (AS3320)"
      - "British Telecom (AS5400)"
      - "Singtel (AS7473)"
      - "Telstra (AS1221)"
  tier3:
    description: >
      Last-mile / access networks and enterprises. Buy transit from
      Tier 1/2 providers. Connect individual homes, businesses, and
      content providers. Typically one or two upstreams.
    characteristics: [Buy all transit, Consumer/business access, Single-homed or dual-homed, May peer regionally at IXPs]
    examples:
      - "Regional ISPs (municipal, rural broadband)"
      - "Enterprise networks (single ASN, corporate)"
      - "Hosting providers (OVH, Hetzner, DigitalOcean — buy transit)"
      - "Access ISPs (local cable/DSL/fiber providers)"

asn_lookup:
  methods:
    - name: WHOIS
      description: >
        Legacy whois protocol (port 43). Query whois.arin.net,
        whois.ripe.net, etc. Returns ASN, organization, country,
        registration dates, abuse contacts. Plain text output.
        Slow; no structured API. Rate-limited on some servers.
      endpoints:
        - "whois.arin.net (ARIN region)"
        - "whois.ripe.net (RIPE region)"
        - "whois.apnic.net (APNIC region)"
        - "whois.lacnic.net (LACNIC region)"
        - "whois.afrinic.net (AFRINIC region)"
      fields_returned: ["ASNumber", "ASName", "OrgName", "OrgId", "Country", "RegDate", "Updated", "NetRange", "CIDR", "AbuseContact"]
    - name: RDAP
      description: >
        Registration Data Access Protocol (RFC 7480-7485). RESTful
        JSON replacement for WHOIS. Authenticated access (OAuth/API
        key optional). Bootstrap via IANA registries. Standardized
        JSON output. Handles internationalized registration data.
      endpoints:
        - "https://rdap.arin.net/registry/autnum/{ASN}"
        - "https://rdap.db.ripe.net/autnum/{ASN}"
        - "https://rdap.apnic.net/autnum/{ASN}"
        - "https://rdap.lacnic.net/rdap/autnum/{ASN}"
        - "https://rdap.afrinic.net/rdap/autnum/{ASN}"
      fields_returned: ["handle", "startAutnum", "endAutnum", "name", "type", "country", "entities (roles/contacts)", "events (registration/last_changed)", "remarks", "links"]
    - name: PeeringDB
      description: >
        Community-maintained database of network interconnection
        data. Self-reported by network operators. Includes ASN,
        peering policy, IXP presence, traffic levels, contact info.
        REST API with API key. Widely used for peering decisions.
      endpoints:
        - "https://www.peeringdb.com/api/net?asn={ASN}"
        - "https://www.peeringdb.com/api/net/{id}"
        - "https://www.peeringdb.com/api/ix?name={name}"
      fields_returned: ["name", "aka", "asn", "irr_as_set", "website", "looking_glass_url", "route_server_url", "info_prefixes4", "info_prefixes6", "info_traffic", "info_ratio", "info_scope", "policy_general", "policy_url", "ix_count", "fac_count", "net_count"]


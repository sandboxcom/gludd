---
# dissector_create — generate a Wireshark dissector from template
#
# Supports Lua dissector generation using files/dissector_template.lua as base.
# Accepts networking__dissector_fields (list of dicts: name, type, description,
# offset, size) and networking__dissector_port. C dissector is future support.

- name: Validate dissector_create prerequisites
  ansible.builtin.assert:
    that:
      - networking__dissector_name | default('') | length > 0
      - networking__dissector_language | default('lua') in ['lua', 'c']
    fail_msg: "networking__dissector_name and networking__dissector_language (lua or c) are required"

- name: Generate Wireshark dissector
  block:
    - name: Set dissector output path
      ansible.builtin.set_fact:
        _dc_output_file: >-
          {{ networking__artifact_dir }}/{{ networking__dissector_name }}.{{
            'lua' if networking__dissector_language == 'lua' else 'c'
          }}

    - name: Build field registration lines for Lua dissector
      ansible.builtin.set_fact:
        _dc_field_lines: >-
          {%- set lines = [] -%}
          {%- for f in networking__dissector_fields | default([]) -%}
          {%-   set def = '[' ~ f.name ~ '] = ProtoField.' ~ f.type | default('uint8') ~ '("' ~ f.name ~ '", "' ~ f.description | default(f.name) ~ '")' -%}
          {%-   set add = '  proto.fields.' ~ f.name ~ ' = ' ~ def -%}
          {%-   set _ = lines.append(add) -%}
          {%- endfor -%}
          {{ lines }}

    - name: Build field parsing lines for Lua dissector
      ansible.builtin.set_fact:
        _dc_parse_lines: >-
          {%- set lines = [] -%}
          {%- for f in networking__dissector_fields | default([]) -%}
          {%-   if f.offset is defined and f.size is defined -%}
          {%-     set add = '  subtree:add(proto.fields.' ~ f.name ~ ', buf(' ~ f.offset ~ ', ' ~ f.size ~ '))' -%}
          {%-   else -%}
          {%-     set add = '  subtree:add(proto.fields.' ~ f.name ~ ', buf(offset, 1)); offset = offset + 1' -%}
          {%-   endif -%}
          {%-   set _ = lines.append(add) -%}
          {%- endfor -%}
          {{ lines }}

    - name: Generate Lua dissector from template
      ansible.builtin.template:
        src: dissector_template.lua
        dest: "{{ _dc_output_file }}"
        mode: "0644"
      when:
        - networking__dissector_language == 'lua'

    - name: Placeholder for C dissector support
      ansible.builtin.debug:
        msg: >-
          C dissector generation is not yet supported.
          Set networking__dissector_language to 'lua' for Wireshark Lua dissector.
          Future: C dissector plugin with registration via GSList + dissector_table.
      when: networking__dissector_language == 'c'

  rescue:
    - name: Handle dissector creation failure
      ansible.builtin.debug:
        msg: >-
          Dissector creation failed for {{ networking__dissector_name }}.
          Reason: {{ ansible_failed_result.msg | default('template rendering failed') }}
      failed_when: false

  always:
    - name: Set timestamp
      ansible.builtin.set_fact:
        _dc_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') | default(ansible_date_time.iso8601) }}"

    - name: Write dissector create artifact JSON
      ansible.builtin.copy:
        content: >-
          {{ {
            'role': 'networking',
            'mode': 'dissector_create',
            'timestamp': _dc_timestamp,
            'dissector_name': networking__dissector_name,
            'language': networking__dissector_language,
            'port': networking__dissector_port | default(0),
            'field_count': networking__dissector_fields | default([]) | length,
            'fields': networking__dissector_fields | default([]),
            'output_file': _dc_output_file | default(''),
            'template_source': 'files/dissector_template.lua' if networking__dissector_language == 'lua' else 'N/A',
            'note': 'C dissector is future support' if networking__dissector_language == 'c' else '',
          } | to_nice_json }}
        dest: "{{ networking__artifact_dir }}/dissector_created.json"
        mode: "0644"

    - name: Report dissector creation completion
      ansible.builtin.debug:
        msg: >-
          Dissector created: name={{ networking__dissector_name }}
          language={{ networking__dissector_language }}
          output={{ _dc_output_file | default('N/A') }}
          artifact={{ networking__artifact_dir }}/dissector_created.json

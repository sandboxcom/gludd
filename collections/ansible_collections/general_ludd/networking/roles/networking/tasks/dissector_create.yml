---
# Generate an idempotent Wireshark Lua script or native C plugin source.

- name: Validate dissector_create prerequisites
  ansible.builtin.assert:
    that:
      - networking__dissector_name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - networking__dissector_language | default('lua') in ['lua', 'c']
      - networking__dissector_port | int >= 1
      - networking__dissector_port | int <= 65535
      - networking__dissector_fields | default([]) is iterable
    fail_msg: >-
      dissector_create requires an identifier-safe name, lua or c language,
      a UDP port in 1..65535, and a bounded field list

- name: Validate dissector field contracts
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.type | default('uint8') in ['uint8', 'uint16', 'uint32', 'uint64', 'string', 'bytes', 'ipv4', 'ether']
      - item.offset | default(0) | int >= 0
      - item.size | default(1) | int >= 1
      - item.size | default(1) | int <= 65535
    fail_msg: "invalid dissector field: {{ item | to_json }}"
  loop: "{{ networking__dissector_fields | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  no_log: true

- name: Generate Wireshark dissector
  block:
    - name: Set dissector output path
      ansible.builtin.set_fact:
        _dc_output_file: >-
          {{ networking__artifact_dir }}/{{ networking__dissector_name }}.{{
            'lua' if networking__dissector_language == 'lua' else 'c'
          }}

    - name: Generate Lua dissector from template
      ansible.builtin.template:
        src: dissector_template.lua
        dest: "{{ _dc_output_file }}"
        mode: "0644"
      when:
        - networking__dissector_language == 'lua'

    - name: Generate C dissector from template
      ansible.builtin.template:
        src: dissector_template.c.j2
        dest: "{{ _dc_output_file }}"
        mode: "0644"
      when:
        - networking__dissector_language == 'c'

- name: Write stable dissector creation artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'networking',
        'mode': 'dissector_create',
        'dissector_name': networking__dissector_name,
        'language': networking__dissector_language,
        'port': networking__dissector_port | int,
        'field_count': networking__dissector_fields | default([]) | length,
        'fields': networking__dissector_fields | default([]),
        'output_file': _dc_output_file,
        'template_source': (
          'files/dissector_template.lua'
          if networking__dissector_language == 'lua'
          else 'templates/dissector_template.c.j2'
        ),
      } | to_nice_json }}
    dest: "{{ networking__artifact_dir }}/dissector_created.json"
    mode: "0644"

- name: Report dissector creation completion
  ansible.builtin.debug:
    msg: >-
      Dissector created: name={{ networking__dissector_name }}
      language={{ networking__dissector_language }}
      output={{ _dc_output_file }}
      artifact={{ networking__artifact_dir }}/dissector_created.json

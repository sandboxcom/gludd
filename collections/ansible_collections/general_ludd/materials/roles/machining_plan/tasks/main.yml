---
- name: Execute machining_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ machining_plan_enabled }}"
    materials_service_operation: machining_plan
    materials_service_request: "{{ machining_plan_request }}"
    materials_service_result_fact: machining_plan_result

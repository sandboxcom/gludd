---
- name: Execute material_select through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ material_select_enabled }}"
    materials_service_operation: material_select
    materials_service_request:
      requirements: "{{ material_select_requirements }}"
      candidates: "{{ material_select_candidates }}"
    materials_service_result_fact: material_select_verdict
    materials_service_output_path: "{{ material_select_output_dir }}/material_select.json"

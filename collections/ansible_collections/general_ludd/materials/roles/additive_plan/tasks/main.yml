---
- name: Execute additive_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ additive_plan_enabled }}"
    materials_service_operation: additive_plan
    materials_service_request: "{{ additive_plan_request }}"
    materials_service_result_fact: additive_plan_result

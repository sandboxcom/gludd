---
- name: Execute manufacturing_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ manufacturing_plan_enabled }}"
    materials_service_operation: manufacturing_plan
    materials_service_request: "{{ manufacturing_plan_request }}"
    materials_service_result_fact: manufacturing_plan_result

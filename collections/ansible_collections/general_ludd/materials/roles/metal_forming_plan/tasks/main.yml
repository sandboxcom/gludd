---
- name: Execute metal_forming_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ metal_forming_plan_enabled }}"
    materials_service_operation: metal_forming_plan
    materials_service_request:
      material_id: "{{ metal_forming_plan_material }}"
      operation: "{{ metal_forming_plan_operation }}"
    materials_service_result_fact: metal_forming_plan_verdict
    materials_service_output_path: "{{ metal_forming_plan_output_dir }}/metal_forming_plan.json"

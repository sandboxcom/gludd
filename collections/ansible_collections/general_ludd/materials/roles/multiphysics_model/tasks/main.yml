---
- name: Execute multiphysics_model through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ multiphysics_model_enabled }}"
    materials_service_operation: multiphysics_model
    materials_service_request: "{{ multiphysics_model_request }}"
    materials_service_result_fact: multiphysics_model_result

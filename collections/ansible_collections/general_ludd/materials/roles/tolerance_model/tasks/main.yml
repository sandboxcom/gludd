---
- name: Execute tolerance_model through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ tolerance_model_enabled }}"
    materials_service_operation: tolerance_model
    materials_service_request: "{{ tolerance_model_request }}"
    materials_service_result_fact: tolerance_model_result

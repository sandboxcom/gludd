---
- name: Execute inspection_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ inspection_plan_enabled }}"
    materials_service_operation: inspection_plan
    materials_service_request: "{{ inspection_plan_request }}"
    materials_service_result_fact: inspection_plan_result

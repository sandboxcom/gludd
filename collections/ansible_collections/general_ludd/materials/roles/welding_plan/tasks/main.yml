---
- name: Execute welding_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ welding_plan_enabled }}"
    materials_service_operation: welding_plan
    materials_service_request: "{{ welding_plan_request }}"
    materials_service_result_fact: welding_plan_result

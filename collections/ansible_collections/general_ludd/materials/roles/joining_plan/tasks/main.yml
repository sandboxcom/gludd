---
- name: Execute joining_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ joining_plan_enabled }}"
    materials_service_operation: joining_plan
    materials_service_request: "{{ joining_plan_request }}"
    materials_service_result_fact: joining_plan_result

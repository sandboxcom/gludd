---
- name: Execute textile_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ textile_plan_enabled }}"
    materials_service_operation: textile_plan
    materials_service_request: "{{ textile_plan_request }}"
    materials_service_result_fact: textile_plan_result

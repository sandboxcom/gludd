---
- name: Execute failure_analyze through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ failure_analyze_enabled }}"
    materials_service_operation: failure_analyze
    materials_service_request: "{{ failure_analyze_request }}"
    materials_service_result_fact: failure_analyze_result

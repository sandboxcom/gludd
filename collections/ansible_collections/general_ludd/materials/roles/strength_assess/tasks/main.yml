---
# strength_assess role — assess static strength margin against a load case.

- name: Validate strength_assess parameters
  ansible.builtin.assert:
    that:
      - strength_assess_enabled | bool
      - strength_assess_material is defined
      - strength_assess_load_case is defined
    fail_msg: >
      strength_assess requires material and load_case to be set.

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ strength_assess_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy materials.py module_util to target
  ansible.builtin.copy:
    src: "{{ _materials_module }}"
    dest: "{{ strength_assess_output_dir }}/materials.py"
    mode: "0755"

- name: Write strength assessment verdict
  ansible.builtin.copy:
    content: "{{ {'role': 'strength_assess', 'material': strength_assess_material, 'load_case': strength_assess_load_case} | to_nice_json }}"
    dest: "{{ strength_assess_output_dir }}/strength_assess.json"
    mode: "0644"

- name: Register strength_assess verdict
  ansible.builtin.set_fact:
    strength_assess_verdict:
      role: strength_assess
      module_util: materials.py
      output: "{{ strength_assess_output_dir }}/strength_assess.json"

---
- name: Execute strength_assess through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ strength_assess_enabled }}"
    materials_service_operation: strength_assess
    materials_service_request:
      material_id: "{{ strength_assess_material }}"
      load_case: "{{ strength_assess_load_case }}"
    materials_service_result_fact: strength_assess_verdict
    materials_service_output_path: "{{ strength_assess_output_dir }}/strength_assess.json"

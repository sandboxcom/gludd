---
- name: Execute polymer_process_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ polymer_process_plan_enabled }}"
    materials_service_operation: polymer_process_plan
    materials_service_request:
      material_id: "{{ polymer_process_plan_material }}"
      process_family: "{{ polymer_process_plan_process }}"
    materials_service_result_fact: polymer_process_plan_verdict
    materials_service_output_path: "{{ polymer_process_plan_output_dir }}/polymer_process_plan.json"

---
- name: Execute requirements_capture through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ requirements_capture_enabled }}"
    materials_service_operation: requirements_capture
    materials_service_request: >-
      {{
        lookup('ansible.builtin.file', requirements_capture_input_file) | from_json
        if requirements_capture_input_file
        else requirements_capture_requirements
      }}
    materials_service_result_fact: requirements_capture_verdict
    materials_service_output_path: "{{ requirements_capture_output_dir }}/requirements_capture.json"

---
- name: Execute molding_plan through the materials service
  ansible.builtin.include_role:
    name: general_ludd.materials.service_request
  vars:
    materials_service_enabled: "{{ molding_plan_enabled }}"
    materials_service_operation: molding_plan
    materials_service_request: "{{ molding_plan_request }}"
    materials_service_result_fact: molding_plan_result

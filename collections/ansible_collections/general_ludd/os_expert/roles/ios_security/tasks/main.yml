---
# ios_security role — audit iOS security subsystems: AMFI/trustcache,
# sandbox profiles, code-sign check.
# Uses the managed-runtime auditor in files/ios_security_audit.py.

- name: Resolve the managed-host Python runtime before mutation
  ansible.builtin.include_role:
    name: general_ludd.os_expert.managed_python_preflight
    public: false
    rolespec_validate: true
  vars:
    os_expert_python_preflight_contract: "{{ os_expert_python_contract | default('discovered') }}"
    os_expert_python_preflight_managed_interpreter: "{{ os_expert_managed_python_interpreter | default('') }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Check libimobiledevice availability
  ansible.builtin.command: which ideviceinfo
  register: _idevice_check
  changed_when: false
  ignore_errors: true
  failed_when: false

- name: Run full security audit via managed runtime
  when: _idevice_check is success
  block:
    - name: Copy ios_security_audit.py to target
      ansible.builtin.copy:
        src: ios_security_audit.py
        dest: "{{ artifact_dir }}/ios_security_audit.py"
        mode: "0755"

    - name: Run auditor — collect AMFI, sandbox, codesign, trustcache
      ansible.builtin.command:
        argv: >-
          {{
            [
              _os_expert_python_runtime.executable,
              artifact_dir ~ '/ios_security_audit.py',
              '--output',
              artifact_dir ~ '/security_audit.json'
            ]
            + (['--udid', device_udid] if device_udid else [])
          }}
      register: _audit_result
      changed_when: false
      ignore_errors: true
      failed_when: false

    - name: Write audit stdout/stderr to artifact_dir
      ansible.builtin.copy:
        content: |
          stdout: {{ _audit_result.stdout | default('') }}
          stderr: {{ _audit_result.stderr | default('') }}
          rc: {{ _audit_result.rc | default('') }}
        dest: "{{ artifact_dir }}/audit_output.txt"
        mode: "0644"
      when: _audit_result is defined

# ── Fallback raw commands when the managed runtime is unavailable ──

- name: Audit AMFI / trustcache (fallback)
  when:
    - _idevice_check is success
    - _audit_result is not success
    - audit_amfi | bool
  block:
    - name: Run ideviceinfo AMFI queries
      ansible.builtin.command: >
        ideviceinfo {{ '-u ' ~ device_udid if device_udid else '' }} -q AMFI
      register: _amfi_raw
      changed_when: false
      ignore_errors: true
      failed_when: false

    - name: Run ideviceinfo trustcache queries
      ansible.builtin.command: >
        ideviceinfo {{ '-u ' ~ device_udid if device_udid else '' }} -k BasebandCertId
      register: _trustcache_raw
      changed_when: false
      ignore_errors: true
      failed_when: false

    - name: Write AMFI/trustcache audit to artifact_dir
      ansible.builtin.copy:
        content: |
          === AMFI Properties ===
          {{ _amfi_raw.stdout | default('(error)') }}

          === Trust Cache ===
          {{ _trustcache_raw.stdout | default('(error)') }}
        dest: "{{ artifact_dir }}/amfi_trustcache.txt"
        mode: "0644"

- name: Audit sandbox profiles (fallback)
  when:
    - _idevice_check is success
    - _audit_result is not success
    - audit_sandbox | bool
  block:
    - name: Run ideviceinfo container queries
      ansible.builtin.command: >
        ideviceinfo {{ '-u ' ~ device_udid if device_udid else '' }} -k ContainerTotal
      register: _sandbox_raw
      changed_when: false
      ignore_errors: true
      failed_when: false

    - name: Write sandbox audit to artifact_dir
      ansible.builtin.copy:
        content: "{{ _sandbox_raw.stdout | default('(error)') }}"
        dest: "{{ artifact_dir }}/sandbox_profiles.txt"
        mode: "0644"

- name: Audit code-sign check (fallback)
  when:
    - _idevice_check is success
    - _audit_result is not success
    - audit_codesign | bool
  block:
    - name: Run ideviceinfo DeviceCertificate
      ansible.builtin.command: >
        ideviceinfo {{ '-u ' ~ device_udid if device_udid else '' }} -k DeviceCertificate
      register: _codesign_raw
      changed_when: false
      ignore_errors: true
      failed_when: false

    - name: Run ideviceinfo lockdown query
      ansible.builtin.command: >
        ideviceinfo {{ '-u ' ~ device_udid if device_udid else '' }} -q Lockdown
      register: _lockdown_raw
      changed_when: false
      ignore_errors: true
      failed_when: false

    - name: Write code-sign audit to artifact_dir
      ansible.builtin.copy:
        content: |
          === DeviceCertificate ===
          {{ _codesign_raw.stdout | default('(error)') }}

          === Lockdown ===
          {{ _lockdown_raw.stdout | default('(error)') }}
        dest: "{{ artifact_dir }}/codesign.txt"
        mode: "0644"

- name: libimobiledevice not available warning
  when: _idevice_check is not success
  ansible.builtin.debug:
    msg: "WARNING: ideviceinfo not found. Install libimobiledevice. iOS security audit skipped."

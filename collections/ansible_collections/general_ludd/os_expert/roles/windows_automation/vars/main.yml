---
# windows_automation role — Windows-specific variables
# All values below are OS-specific overrides; most defaults live in defaults/main.yml.
# Audit (always safe, read-only):
#   (audit tasks run unconditionally — no toggle variables)
# Manage (mutable, gated behind booleans):
#   manage_psremoting:           enable/configure PSRemoting via Enable-PSRemoting -Force (default: false)
#   manage_dsc:                  apply DSC configuration via Start-DscConfiguration -UseExisting (default: false)
#   manage_schtasks:             reconcile one declared Windows scheduled task (default: false)
#   manage_unattended_install:   render an unattended-install answer file (default: false)
# scheduled_task_*:              bounded task definition passed to win_scheduled_task
# unattended_install_*:          controller template, destination, and backup policy
# artifact_dir:                  directory for collected automation artifacts (default: C:\Temp\gludd-windows-automation)

---
- name: Validate resource_inventory parameters
  ansible.builtin.assert:
    that:
      - role_enabled | bool
    fail_msg: "resource_inventory requires role_enabled=true."

- name: Write resource inventory verdict
  ansible.builtin.copy:
    content: "{{ {'role': 'resource_inventory', 'subscription_ids': subscription_ids, 'status': 'ok', 'output_dir': output_path} | to_nice_json }}"
    dest: "{{ output_path }}/resource_inventory.json"
    mode: "0644"

- name: Register resource_inventory verdict
  ansible.builtin.set_fact:
    azure_resource_inventory:
      role: resource_inventory
      output: "{{ output_path }}/resource_inventory.json"

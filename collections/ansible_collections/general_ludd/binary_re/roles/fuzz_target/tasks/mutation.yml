---
- name: Run mutation fuzzing
  ansible.builtin.command:
    cmd: >-
      {{ ansible_python_interpreter | default('/usr/bin/env python3') }}
      {{ role_path }}/files/fuzz_target.py
      --mode mutation
      --target {{ target_binary }}
      --corpus {{ corpus_dir }}
      --output {{ output_dir }}
      --mutations {{ mutation_count | default(1000) }}
      {% if mutation_ratio is defined %}--mutation-ratio {{ mutation_ratio }}{% endif %}
  register: _mutation_result
  changed_when: false
  failed_when: _mutation_result.rc not in [0]

- name: Read mutation fuzzing artifact
  ansible.builtin.slurp:
    src: "{{ output_dir }}/mutation.json"
  register: _mutation_artifact_raw

- name: Parse mutation artifact
  ansible.builtin.set_fact:
    mutation_artifact: >-
      {{ _mutation_artifact_raw.content | b64decode | from_json
         if (_mutation_artifact_raw is defined and _mutation_artifact_raw.content is defined)
         else {} }}

- name: Report mutation fuzzing summary
  ansible.builtin.debug:
    msg: >-
      Mutation fuzzing complete:
      mutations={{ mutation_artifact.get('mutations_total', 0) }},
      crashes={{ mutation_artifact.get('crashes', 0) }},
      strategy={{ mutation_artifact.get('mutation_strategy', 'unknown') }}

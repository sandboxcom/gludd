---
- name: Run mutation fuzzing through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: mutation
    params:
      target_binary: "{{ target_binary }}"
      corpus_dir: "{{ corpus_dir }}"
      output_dir: "{{ output_dir }}"
      mutations: "{{ mutation_count | default(1000) }}"
      mutation_ratio: "{{ mutation_ratio | default(omit, true) }}"
  register: _mutation_runtime

- name: Write mutation artifact atomically
  ansible.builtin.copy:
    content: "{{ _mutation_runtime.artifact_content }}"
    dest: "{{ output_dir }}/{{ _mutation_runtime.artifact_filename }}"
    mode: "0644"

- name: Publish mutation artifact
  ansible.builtin.set_fact:
    mutation_artifact: "{{ _mutation_runtime.result }}"

- name: Report mutation fuzzing summary
  ansible.builtin.debug:
    msg: >-
      Mutation fuzzing complete:
      mutations={{ mutation_artifact.get('mutations_total', 0) }},
      crashes={{ mutation_artifact.get('crashes', 0) }},
      strategy={{ mutation_artifact.get('mutation_strategy', 'unknown') }}

---
- name: Detect control-flow flattening through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: cfg_flattening
    params: "{{ _binary_runtime_params }}"
  register: _cfg_runtime

- name: Write, publish and report the cfg_flattening artifact
  ansible.builtin.include_tasks: runtime_artifact.yml
  vars:
    _binary_artifact_operation: cfg_flattening

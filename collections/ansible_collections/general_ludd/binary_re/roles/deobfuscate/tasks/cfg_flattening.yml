---
- name: Detect control-flow flattening through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: cfg_flattening
    params:
      binary_path: "{{ binary_path }}"
  register: _cfg_runtime

- name: Write CFG flattening artifact atomically
  ansible.builtin.copy:
    content: "{{ _cfg_runtime.artifact_content }}"
    dest: "{{ output_dir }}/{{ _cfg_runtime.artifact_filename }}"
    mode: "0644"

- name: Publish CFG flattening artifact
  ansible.builtin.set_fact:
    cfg_flattening_artifact: "{{ _cfg_runtime.result }}"

- name: Report CFG flattening summary
  ansible.builtin.debug:
    msg: >-
      CFG flattening detection complete:
      flattened={{ cfg_flattening_artifact.get('flattened', false) }},
      confidence={{ cfg_flattening_artifact.get('confidence', 'none') }},
      markers_found={{ cfg_flattening_artifact.get('markers', []) | length }}

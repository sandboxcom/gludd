---
- name: Detect opaque predicates through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: opaque_predicates
    params: "{{ _binary_runtime_params }}"
  register: _opaque_runtime

- name: Write, publish and report the opaque_predicates artifact
  ansible.builtin.include_tasks: runtime_artifact.yml
  vars:
    _binary_artifact_operation: opaque_predicates

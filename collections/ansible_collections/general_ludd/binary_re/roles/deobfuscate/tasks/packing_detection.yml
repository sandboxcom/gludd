---
- name: Detect packing signatures through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: packing
    params:
      binary_path: "{{ binary_path }}"
  register: _packing_runtime

- name: Write packing detection artifact atomically
  ansible.builtin.copy:
    content: "{{ _packing_runtime.artifact_content }}"
    dest: "{{ output_dir }}/{{ _packing_runtime.artifact_filename }}"
    mode: "0644"

- name: Publish packing detection artifact
  ansible.builtin.set_fact:
    packing_artifact: "{{ _packing_runtime.result }}"

- name: Report packing detection summary
  ansible.builtin.debug:
    msg: >-
      Packing detection complete:
      file_type={{ packing_artifact.get('file_type', 'unknown') }},
      detections={{ packing_artifact.get('detections', []) | length }},
      packed={{ packing_artifact.get('packed', false) }}

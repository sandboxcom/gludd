---
- name: Detect packing signatures through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: packing
    params: "{{ _binary_runtime_params }}"
  register: _packing_runtime

- name: Write, publish and report the packing artifact
  ansible.builtin.include_tasks: runtime_artifact.yml
  vars:
    _binary_artifact_operation: packing

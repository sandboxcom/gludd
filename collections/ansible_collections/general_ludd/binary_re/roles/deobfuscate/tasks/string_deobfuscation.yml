---
- name: Deobfuscate strings in binary
  ansible.builtin.command:
    cmd: >-
      {{ ansible_python_interpreter | default('/usr/bin/env python3') }}
      {{ role_path }}/files/deobfuscate.py
      --mode strings
      --binary {{ binary_path }}
      --output {{ output_dir }}/string_deobfuscation.json
  register: _strings_result
  changed_when: false
  failed_when: _strings_result.rc not in [0]

- name: Read string deobfuscation artifact
  ansible.builtin.slurp:
    src: "{{ output_dir }}/string_deobfuscation.json"
  register: _strings_artifact_raw

- name: Parse string deobfuscation artifact
  ansible.builtin.set_fact:
    strings_artifact: >-
      {{ _strings_artifact_raw.content | b64decode | from_json
         if (_strings_artifact_raw is defined and _strings_artifact_raw.content is defined)
         else {} }}

- name: Report string deobfuscation summary
  ansible.builtin.debug:
    msg: >-
      String deobfuscation complete:
      encrypted_strings={{ strings_artifact.get('encrypted_strings', 0) }},
      deobfuscated={{ strings_artifact.get('deobfuscated', 0) }},
      confidence={{ strings_artifact.get('confidence', 'none') }}

---
- name: Deobfuscate strings through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: strings
    params:
      binary_path: "{{ binary_path }}"
  register: _strings_runtime

- name: Write string deobfuscation artifact atomically
  ansible.builtin.copy:
    content: "{{ _strings_runtime.artifact_content }}"
    dest: "{{ output_dir }}/{{ _strings_runtime.artifact_filename }}"
    mode: "0644"

- name: Publish string deobfuscation artifact
  ansible.builtin.set_fact:
    strings_artifact: "{{ _strings_runtime.result }}"

- name: Report string deobfuscation summary
  ansible.builtin.debug:
    msg: >-
      String deobfuscation complete:
      encrypted_strings={{ strings_artifact.get('encrypted_strings', 0) }},
      deobfuscated={{ strings_artifact.get('deobfuscated', 0) }},
      confidence={{ strings_artifact.get('confidence', 'none') }}

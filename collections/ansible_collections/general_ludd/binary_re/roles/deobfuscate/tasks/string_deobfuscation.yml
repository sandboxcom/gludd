---
- name: Deobfuscate strings through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: strings
    params: "{{ _binary_runtime_params }}"
  register: _strings_runtime

- name: Write, publish and report the strings artifact
  ansible.builtin.include_tasks: runtime_artifact.yml
  vars:
    _binary_artifact_operation: strings

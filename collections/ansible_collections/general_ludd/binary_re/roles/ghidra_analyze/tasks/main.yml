---
- name: Validate Ghidra installation
  ansible.builtin.stat:
    path: "{{ ghidra_path }}/support/analyzeHeadless"
  register: _ghidra_launcher

- name: Fail if Ghidra headless not found
  ansible.builtin.fail:
    msg: "Ghidra analyzeHeadless not found at {{ ghidra_path }}/support/"
  when: not _ghidra_launcher.stat.exists

- name: Create output directory
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0755"

- name: Run headless auto-analysis
  ansible.builtin.include_tasks: headless_analysis.yml
  when: enable_headless_analysis | bool

- name: Run scripted export
  ansible.builtin.include_tasks: scripted_export.yml
  when: enable_scripted_export | bool

- name: Run function signature analysis
  ansible.builtin.include_tasks: function_signature.yml
  when: enable_function_signature | bool

- name: Write Ghidra analysis artifact
  ansible.builtin.copy:
    content: "{{ {'role': 'ghidra_analyze', 'status': 'completed', 'verdict': 'pass', 'modes': analysis_mode, 'generated_at': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')} | to_nice_json }}"
    dest: "{{ output_dir }}/ghidra_analyze.json"
    mode: "0644"

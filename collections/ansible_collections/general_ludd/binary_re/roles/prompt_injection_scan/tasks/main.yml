---
- name: Validate input parameters
  ansible.builtin.fail:
    msg: "Either target_path or input_text must be provided"
  when:
    - (target_path | default('.')) == '.'
    - (input_text | default('')) == ''

- name: Create output directory
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0755"

- name: Run prompt injection scan through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: prompt_injection_scan
    params:
      target_path: "{{ target_path }}"
      input_text: "{{ input_text }}"
      output_format: "{{ output_format }}"
      min_severity: "{{ severity_threshold }}"
      scan_obfuscation: "{{ scan_obfuscation }}"
  register: _scan_runtime

- name: Write scan artifact atomically
  ansible.builtin.copy:
    content: "{{ _scan_runtime.artifact_content }}"
    dest: "{{ output_dir }}/{{ _scan_runtime.artifact_filename }}"
    mode: "0644"

- name: Publish scan artifact
  ansible.builtin.set_fact:
    scan_artifact: "{{ _scan_runtime.result }}"

- name: Report finding summary
  ansible.builtin.debug:
    msg: >-
      Scan complete: {{ scan_artifact.get('scan', {}).get('finding_count', 0) }} findings,
      severity {{ scan_artifact.get('scan', {}).get('overall_severity', 'unknown') }}

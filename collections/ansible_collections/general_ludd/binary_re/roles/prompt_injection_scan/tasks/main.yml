---
- name: Validate input parameters
  ansible.builtin.fail:
    msg: "Either target_path or input_text must be provided"
  when:
    - (target_path | default('.')) == '.'
    - (input_text | default('')) == ''

- name: Create output directory
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0755"

- name: Run prompt injection scan through packaged runtime
  general_ludd.binary_re.binary_runtime:
    operation: prompt_injection_scan
    params: "{{ _binary_runtime_params }}"
  vars:
    _binary_runtime_params:
      target_path: "{{ target_path }}"
      input_text: "{{ input_text }}"
      output_format: "{{ output_format }}"
      min_severity: "{{ severity_threshold }}"
      scan_obfuscation: "{{ scan_obfuscation }}"
  register: _scan_runtime

- name: Write, publish and report the prompt_injection_scan artifact
  ansible.builtin.include_tasks: ../../deobfuscate/tasks/runtime_artifact.yml
  vars:
    _binary_artifact_operation: prompt_injection_scan

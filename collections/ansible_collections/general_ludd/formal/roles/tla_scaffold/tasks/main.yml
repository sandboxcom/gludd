---
# tla_scaffold role — generate TLA+ spec + config from a design description
#
# Philosophy (embody this):
#   Model what should be IMPOSSIBLE, not undesirable.
#   - INVARIANT = the impossible state (must never be reached)
#   - State machine = VARIABLES, Init, Next, Spec == Init /\ [][Next]_vars
#   - ALWAYS bound the state space with a CONSTRAINT
#
# Flow:
#   1. Create output directory.
#   2a. If enable_model_call=true: call gludd_model_call to generate spec text.
#   2b. If enable_model_call=false (default): use deterministic template.
#   3. Write .tla file, .cfg file, tla_scaffold.json artifact.

- name: Validate required inputs
  ansible.builtin.assert:
    that:
      - spec_name | length > 0
      - out_dir | length > 0
    fail_msg: "tla_scaffold: spec_name and out_dir are required"

- name: Create output directory
  ansible.builtin.file:
    path: "{{ out_dir }}"
    state: directory
    mode: "0755"

# ── LLM-assisted spec generation (opt-in only) ────────────────────────────

- name: Call gludd_model_call to generate TLA+ spec (enable_model_call=true only)
  general_ludd.agent.gludd_model_call:
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    prompt: >-
      Generate a TLA+ specification for the following design:

      {{ design_text }}

      Requirements:
      - Use VARIABLES, Init, Next pattern
      - Define Spec == Init /\ [][Next]_vars
      - Include TypeOK invariant
      - Include an INVARIANT that names the impossible state (what must NEVER happen)
      - Include a CONSTRAINT that bounds the state space (e.g. n < 100)
      - Output ONLY the raw TLA+ spec text for module {{ spec_name }}, no markdown fences

      The invariant should capture what is structurally impossible, not merely undesirable.
    model_profile: "default"
  register: _ts_model_response
  no_log: "{{ psk | length > 0 }}"
  when:
    - enable_model_call | bool
    - not ansible_check_mode

- name: Use model-generated spec text
  ansible.builtin.set_fact:
    _ts_spec_text: "{{ _ts_model_response.text | default('') }}"
    _ts_source: "model_call"
  when:
    - enable_model_call | bool
    - not ansible_check_mode
    - _ts_model_response is defined

# ── Deterministic template fallback (default; always syntactically valid) ──

- name: Generate spec via deterministic template (enable_model_call=false or check_mode)
  ansible.builtin.set_fact:
    _ts_spec_text: |
      ---- MODULE {{ spec_name }} ----
      \* Generated by general_ludd.formal.tla_scaffold
      \* Design: {{ design_text | default('(no design text provided)') | truncate(200, True, '...') }}
      \*
      \* Modeling philosophy: this spec captures what is IMPOSSIBLE, not merely undesirable.
      \* The invariant NeverNegative states: n must NEVER go below 0.

      EXTENDS Integers, Naturals

      VARIABLES n

      TypeOK ==
        n \in Int

      Init ==
        n = 0

      Increment ==
        n' = n + 1

      Decrement ==
        /\ n > 0
        /\ n' = n - 1

      Next ==
        \/ Increment
        \/ Decrement

      \* CONSTRAINT: bound state space so TLC terminates
      Bound == n < 10

      \* INVARIANT: the IMPOSSIBLE state — n must NEVER go negative
      NeverNegative == n >= 0

      Spec == Init /\ [][Next]_n

      ====
    _ts_source: "deterministic_template"
    _ts_invariant_name: "NeverNegative"
    _ts_constraint: "n < 10"
    _ts_variables: ["n"]
  when: not (enable_model_call | bool) or ansible_check_mode

# ── Extract invariant name from model output (best-effort) ────────────────

- name: Extract invariant name from model-generated spec
  ansible.builtin.set_fact:
    _ts_invariant_name: >-
      {{
        (_ts_spec_text | regex_search('INVARIANT\s+(\w+)', '\1'))
        | first | default('UnknownInvariant')
      }}
    _ts_constraint: >-
      {{
        (_ts_spec_text | regex_search('CONSTRAINT\s+\n?\s*(\S[^\n]+)', '\1'))
        | first | default('(see spec)')
      }}
    _ts_variables: >-
      {{
        (_ts_spec_text | regex_search('VARIABLES\s+([^\n]+)', '\1'))
        | first | default('') | split(',') | map('trim') | list
      }}
  when:
    - enable_model_call | bool
    - not ansible_check_mode
    - _ts_spec_text | length > 0
    - _ts_invariant_name is not defined

- name: Set invariant defaults when extraction unavailable
  ansible.builtin.set_fact:
    _ts_invariant_name: "{{ _ts_invariant_name | default('UnknownInvariant') }}"
    _ts_constraint: "{{ _ts_constraint | default('(see spec)') }}"
    _ts_variables: "{{ _ts_variables | default([]) }}"

# ── Write TLA+ spec file ──────────────────────────────────────────────────

- name: Write TLA+ spec file
  ansible.builtin.copy:
    content: "{{ _ts_spec_text }}"
    dest: "{{ out_dir }}/{{ spec_name }}.tla"
    mode: "0644"

# ── Generate TLC config (.cfg) ───────────────────────────────────────────

- name: Write TLC config file (.cfg)
  ansible.builtin.copy:
    content: |
      \* TLC configuration for {{ spec_name }}
      \* Generated by general_ludd.formal.tla_scaffold

      SPECIFICATION Spec

      INVARIANT
        TypeOK
        {{ _ts_invariant_name }}

      CONSTRAINT
        Bound
    dest: "{{ out_dir }}/{{ spec_name }}.cfg"
    mode: "0644"

# ── Write JSON artifact ───────────────────────────────────────────────────

- name: Write tla_scaffold.json artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'tla_scaffold',
        'status': 'completed',
        'spec_name': spec_name,
        'out_dir': out_dir,
        'source': _ts_source,
        'tla_file': out_dir + '/' + spec_name + '.tla',
        'cfg_file': out_dir + '/' + spec_name + '.cfg',
        'vars': _ts_variables,
        'invariant_name': _ts_invariant_name,
        'constraint': _ts_constraint
      } | to_nice_json }}
    dest: "{{ out_dir }}/tla_scaffold.json"
    mode: "0644"

- name: Report scaffold completion
  ansible.builtin.debug:
    msg: >-
      tla_scaffold: wrote {{ out_dir }}/{{ spec_name }}.tla
      (source={{ _ts_source }}, invariant={{ _ts_invariant_name }})

---
# tla_trace_interpret role — parse TLC counterexample trace
#
# Pure parser — no Java required.
#
# TLC counterexample format:
#   Error: Invariant NeverNegative is violated.
#   Error: The behavior up to this point is:
#   State 1: <Initial predicate>
#   /\ n = 0
#   State 2: <Next>
#   /\ n = -1
#
# Extracts: invariant name, numbered states with variable bindings, narrative.
# Parsing is provided by the packaged formal collection module; no ambient
# interpreter discovery or inline shell program is required.

- name: Validate inputs
  ansible.builtin.assert:
    that:
      - artifact_dir | length > 0
      - (tlc_output | length > 0) or (trace_path | length > 0)
    fail_msg: "tla_trace_interpret: artifact_dir and one of tlc_output/trace_path are required"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Load TLC output (from string or file) ────────────────────────────────

- name: Load TLC output from file (trace_path provided)
  ansible.builtin.slurp:
    src: "{{ trace_path }}"
  register: _tti_trace_file
  when: trace_path | length > 0

- name: Set TLC output source
  ansible.builtin.set_fact:
    _tti_raw: >-
      {{
        (_tti_trace_file.content | b64decode) if (trace_path | length > 0 and _tti_trace_file is defined)
        else tlc_output
      }}

# ── Parse trace through the packaged collection module ───────────────────

- name: Parse TLC trace with the formal collection module
  general_ludd.formal.tla_trace_interpret:
    tlc_output: "{{ _tti_raw }}"
    output_path: "{{ artifact_dir }}/tla_trace.json"
  register: _tti_parse_result

- name: Publish parsed trace for downstream role tasks
  ansible.builtin.set_fact:
    _tti_artifact: "{{ _tti_parse_result.trace }}"

# ── Write markdown artifact ───────────────────────────────────────────────

- name: Write tla_trace.md artifact
  ansible.builtin.copy:
    content: |
      # TLC Counterexample Trace

      **Violated invariant:** `{{ _tti_artifact.invariant }}`
      **States in trace:** {{ _tti_artifact.step_count }}

      ## Trace Steps

      {% for step in _tti_artifact.steps %}
      ### State {{ step.state_n }}: {{ step.label }}

      {% for k, v in step.vars.items() %}
      - `{{ k }}` = `{{ v }}`
      {% endfor %}
      {% endfor %}

      ## Narrative

      {{ _tti_artifact.narrative }}

      ---
      *Generated by general_ludd.formal.tla_trace_interpret — pure parser, no Java required.*
    dest: "{{ artifact_dir }}/tla_trace.md"
    mode: "0644"

# ── Handoff message ───────────────────────────────────────────────────────

- name: Send gludd_message handoff (trace ready for review)
  general_ludd.agent.gludd_message:
    state: send
    sender: tla_trace_interpret
    recipient: "{{ handoff_recipient }}"
    topic: tla_trace_ready
    body: >-
      {{ {
        'invariant': _tti_artifact.invariant,
        'step_count': _tti_artifact.step_count,
        'narrative': _tti_artifact.narrative
      } | to_json }}
    priority: normal
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  no_log: "{{ psk | length > 0 }}"
  when:
    - handoff_recipient | length > 0
    - not ansible_check_mode

- name: Report trace interpretation completion
  ansible.builtin.debug:
    msg: >-
      tla_trace_interpret: invariant={{ _tti_artifact.invariant }}
      steps={{ _tti_artifact.step_count }}

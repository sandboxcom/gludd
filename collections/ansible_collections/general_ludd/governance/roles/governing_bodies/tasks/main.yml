---
- name: Validate governing_bodies parameters
  ansible.builtin.assert:
    that:
      - governing_bodies_enabled | bool
    fail_msg: "governing_bodies role requires enabled=true."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ governing_bodies_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy governing_bodies.py module_util
  ansible.builtin.copy:
    src: "{{ _governing_bodies_module }}"
    dest: "{{ governing_bodies_output_dir }}/governing_bodies.py"
    mode: "0755"

- name: Run governing_bodies lookup
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ governing_bodies_output_dir }}/governing_bodies.py
    --query "{{ governing_bodies_query | default('all') }}"
  register: _bodies_result
  changed_when: false
  failed_when: false

- name: Parse result
  ansible.builtin.set_fact:
    governing_bodies_result: "{{ (_bodies_result.stdout | from_json) if _bodies_result.stdout | default('') | length > 0 else {} }}"
  when: _bodies_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ governing_bodies_result | to_nice_json }}"
    dest: "{{ governing_bodies_output_dir }}/governing_bodies.json"
    mode: "0644"
  when: governing_bodies_result is defined

---
# tax_currency_info role — expose the tax_currency.py module_util.

- name: Execute tax and currency lookup
  ansible.builtin.include_role:
    name: general_ludd.governance.module_util_lookup
  vars:
    governance_module_util_profile: tax_currency_info

- name: Register tax_currency_info verdict
  ansible.builtin.set_fact:
    tax_currency_info_verdict:
      role: tax_currency_info
      country: "{{ tax_currency_info_country | default('N/A') }}"
      module_util: tax_currency.py
      found: "{{ tax_currency_info_result.found | default(false) }}"
      currency: "{{ tax_currency_info_result.currency_code | default('N/A') }}"
      tax_authority: "{{ tax_currency_info_result.tax_authority | default('N/A') }}"
      output: "{{ tax_currency_info_output_dir }}/tax_currency_info.json"

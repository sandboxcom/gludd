---
- name: Validate licenses_permits parameters
  ansible.builtin.assert:
    that:
      - licenses_permits_enabled | bool
    fail_msg: "licenses_permits role requires enabled=true."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ licenses_permits_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy licenses_permits.py module_util
  ansible.builtin.copy:
    src: "{{ _licenses_permits_module }}"
    dest: "{{ licenses_permits_output_dir }}/licenses_permits.py"
    mode: "0755"

- name: Run licenses/permits lookup
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ licenses_permits_output_dir }}/licenses_permits.py
    --query "{{ licenses_permits_query | default('all') }}"
  register: _lp_result
  changed_when: false
  failed_when: false

- name: Parse result
  ansible.builtin.set_fact:
    licenses_permits_result: "{{ (_lp_result.stdout | from_json) if _lp_result.stdout | default('') | length > 0 else {} }}"
  when: _lp_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ licenses_permits_result | to_nice_json }}"
    dest: "{{ licenses_permits_output_dir }}/licenses_permits.json"
    mode: "0644"
  when: licenses_permits_result is defined

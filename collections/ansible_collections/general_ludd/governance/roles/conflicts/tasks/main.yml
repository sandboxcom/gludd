---
- name: Validate conflicts parameters
  ansible.builtin.assert:
    that:
      - conflicts_enabled | bool
    fail_msg: "conflicts role requires enabled=true."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ conflicts_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy conflicts_treaties.py module_util
  ansible.builtin.copy:
    src: "{{ _conflicts_module }}"
    dest: "{{ conflicts_output_dir }}/conflicts_treaties.py"
    mode: "0755"

- name: Run conflicts lookup
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ conflicts_output_dir }}/conflicts_treaties.py
    --query "{{ conflicts_query | default('all') }}"
  register: _conflicts_result
  changed_when: false
  failed_when: false

- name: Parse result
  ansible.builtin.set_fact:
    conflicts_result: "{{ (_conflicts_result.stdout | from_json) if _conflicts_result.stdout | default('') | length > 0 else {} }}"
  when: _conflicts_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ conflicts_result | to_nice_json }}"
    dest: "{{ conflicts_output_dir }}/conflicts.json"
    mode: "0644"
  when: conflicts_result is defined

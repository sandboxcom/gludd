---
# lookup_governing_body role — expose the governing_bodies.py module_util.

- name: Execute governing body lookup
  ansible.builtin.include_role:
    name: general_ludd.governance.module_util_lookup
  vars:
    governance_module_util_profile: lookup_governing_body

- name: Register lookup_governing_body verdict
  ansible.builtin.set_fact:
    lookup_governing_body_verdict:
      role: lookup_governing_body
      country: "{{ lookup_governing_body_country | default('N/A') }}"
      module_util: governing_bodies.py
      found: "{{ lookup_governing_body_result.found | default(false) }}"
      body_count: "{{ lookup_governing_body_result.count | default(0) }}"
      type_filter: "{{ lookup_governing_body_type | default('none') }}"
      output: "{{ lookup_governing_body_output_dir }}/lookup_governing_body.json"

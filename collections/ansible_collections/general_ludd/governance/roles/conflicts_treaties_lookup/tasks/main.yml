---
# conflicts_treaties_lookup role — expose the conflicts_treaties.py module_util.

- name: Validate conflicts_treaties_lookup parameters
  ansible.builtin.assert:
    that:
      - conflicts_treaties_lookup_enabled | bool
      - conflicts_treaties_lookup_country is defined
      - conflicts_treaties_lookup_country | length == 2
      - conflicts_treaties_lookup_scope in ['conflicts', 'treaties', 'both']
    fail_msg: >
      conflicts_treaties_lookup requires a 2-letter ISO country code and
      scope in [conflicts, treaties, both].

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ conflicts_treaties_lookup_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy conflicts_treaties.py module_util to target
  ansible.builtin.copy:
    src: "{{ _conflicts_treaties_module }}"
    dest: "{{ conflicts_treaties_lookup_output_dir }}/conflicts_treaties.py"
    mode: "0755"

- name: Run conflicts_treaties module_util
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ conflicts_treaties_lookup_output_dir }}/conflicts_treaties.py
    --country {{ conflicts_treaties_lookup_country }}
    --scope {{ conflicts_treaties_lookup_scope }}
  register: _ct_result
  changed_when: false
  failed_when: false

- name: Parse conflicts_treaties result
  ansible.builtin.set_fact:
    conflicts_treaties_lookup_result: "{{ (_ct_result.stdout | from_json) if _ct_result.stdout | default('') | length > 0 else {} }}"
  when: _ct_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ conflicts_treaties_lookup_result | to_nice_json }}"
    dest: "{{ conflicts_treaties_lookup_output_dir }}/conflicts_treaties_lookup.json"
    mode: "0644"
  when: conflicts_treaties_lookup_result is defined

- name: Register conflicts_treaties_lookup verdict
  ansible.builtin.set_fact:
    conflicts_treaties_lookup_verdict:
      role: conflicts_treaties_lookup
      country: "{{ conflicts_treaties_lookup_country }}"
      module_util: conflicts_treaties.py
      scope: "{{ conflicts_treaties_lookup_scope }}"
      conflicts_count: "{{ conflicts_treaties_lookup_result.conflicts.count | default(0) }}"
      treaties_count: "{{ conflicts_treaties_lookup_result.treaties.count | default(0) }}"
      output: "{{ conflicts_treaties_lookup_output_dir }}/conflicts_treaties_lookup.json"

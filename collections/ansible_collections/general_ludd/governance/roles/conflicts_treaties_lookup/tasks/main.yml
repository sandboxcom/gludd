---
# conflicts_treaties_lookup role — expose the conflicts_treaties.py module_util.

- name: Execute conflicts and treaties lookup
  ansible.builtin.include_role:
    name: general_ludd.governance.module_util_lookup
  vars:
    governance_module_util_profile: conflicts_treaties_lookup

- name: Register conflicts_treaties_lookup verdict
  ansible.builtin.set_fact:
    conflicts_treaties_lookup_verdict:
      role: conflicts_treaties_lookup
      country: "{{ conflicts_treaties_lookup_country }}"
      module_util: conflicts_treaties.py
      scope: "{{ conflicts_treaties_lookup_scope }}"
      conflicts_count: "{{ conflicts_treaties_lookup_result.conflicts.count | default(0) }}"
      treaties_count: "{{ conflicts_treaties_lookup_result.treaties.count | default(0) }}"
      output: "{{ conflicts_treaties_lookup_output_dir }}/conflicts_treaties_lookup.json"

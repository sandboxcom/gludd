---
# civic_service_finder role — expose the civic_services.py module_util.

- name: Execute civic services lookup
  ansible.builtin.include_role:
    name: general_ludd.governance.module_util_lookup
  vars:
    governance_module_util_profile: civic_service_finder

- name: Register civic_service_finder verdict
  ansible.builtin.set_fact:
    civic_service_finder_verdict:
      role: civic_service_finder
      country: "{{ civic_service_finder_country | default('N/A') }}"
      module_util: civic_services.py
      found: "{{ civic_service_finder_result.found | default(false) }}"
      service_count: "{{ civic_service_finder_result.count | default(0) }}"
      category_filter: "{{ civic_service_finder_category | default('none') }}"
      output: "{{ civic_service_finder_output_dir }}/civic_service_finder.json"

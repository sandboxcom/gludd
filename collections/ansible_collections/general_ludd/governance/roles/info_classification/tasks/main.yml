---
- name: Validate info_classification parameters
  ansible.builtin.assert:
    that:
      - info_classification_enabled | bool
    fail_msg: "info_classification role requires enabled=true."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ info_classification_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy info_classification.py module_util
  ansible.builtin.copy:
    src: "{{ _info_classification_module }}"
    dest: "{{ info_classification_output_dir }}/info_classification.py"
    mode: "0755"

- name: Run info classification lookup
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ info_classification_output_dir }}/info_classification.py
    --query "{{ info_classification_query | default('all') }}"
  register: _ic_result
  changed_when: false
  failed_when: false

- name: Parse result
  ansible.builtin.set_fact:
    info_classification_result: "{{ (_ic_result.stdout | from_json) if _ic_result.stdout | default('') | length > 0 else {} }}"
  when: _ic_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ info_classification_result | to_nice_json }}"
    dest: "{{ info_classification_output_dir }}/info_classification.json"
    mode: "0644"
  when: info_classification_result is defined

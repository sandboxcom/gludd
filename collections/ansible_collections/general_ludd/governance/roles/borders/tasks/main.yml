---
- name: Validate borders parameters
  ansible.builtin.assert:
    that:
      - borders_enabled | bool
    fail_msg: "borders role requires enabled=true."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ borders_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy borders.py module_util
  ansible.builtin.copy:
    src: "{{ _borders_module }}"
    dest: "{{ borders_output_dir }}/borders.py"
    mode: "0755"

- name: Run borders lookup
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ borders_output_dir }}/borders.py
    --query "{{ borders_query | default('all') }}"
  register: _borders_result
  changed_when: false
  failed_when: false

- name: Parse borders result
  ansible.builtin.set_fact:
    borders_result: "{{ (_borders_result.stdout | from_json) if _borders_result.stdout | default('') | length > 0 else {} }}"
  when: _borders_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ borders_result | to_nice_json }}"
    dest: "{{ borders_output_dir }}/borders.json"
    mode: "0644"
  when: borders_result is defined

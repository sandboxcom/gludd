---
- name: Discover governance module utility input variables
  ansible.builtin.set_fact:
    _governance_module_util_variable_names: >-
      {{
        query(
          'ansible.builtin.varnames',
          '^' ~ governance_module_util_profile
          ~ '_(enabled|output_dir|country|category|list_countries|list_categories|scope|branch|scheme|level|list_schemes|type)$'
        )
      }}
    _governance_module_util_variables:
      ansible_python_interpreter: >-
        {{ ansible_python_interpreter | default('python3') }}

- name: Capture governance module utility input variables
  ansible.builtin.set_fact:
    _governance_module_util_variables: >-
      {{
        _governance_module_util_variables
        | combine({item: lookup('ansible.builtin.vars', item)})
      }}
  loop: "{{ _governance_module_util_variable_names }}"
  loop_control:
    label: "{{ item }}"

- name: Build governance module utility request
  ansible.builtin.set_fact:
    _governance_module_util_request: >-
      {{
        governance_module_util_profile
        | general_ludd.governance.governance_lookup_plan(
            _governance_module_util_variables
          )
      }}

- name: Validate governance module utility request
  ansible.builtin.assert:
    that:
      - _governance_module_util_request.filename is match('^[A-Za-z0-9_]+[.]py$')
      - _governance_module_util_request.support_filenames is sequence
      - _governance_module_util_request.support_filenames | length <= 4
      - >-
        _governance_module_util_request.support_filenames
        | select('match', '^[A-Za-z0-9_]+[.]py$')
        | list
        | length
        == _governance_module_util_request.support_filenames | length
      - _governance_module_util_request.output_dir | length > 0
      - _governance_module_util_request.output_dir | length <= 4096
      - _governance_module_util_request.output_filename is match('^[A-Za-z0-9_.-]+[.]json$')
      - _governance_module_util_request.result_fact is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _governance_module_util_request.argv is sequence
      - _governance_module_util_request.argv | length >= 2
      - _governance_module_util_request.argv | length <= 16
    fail_msg: Invalid or unbounded governance module utility request.

- name: Ensure governance module utility output directory exists
  ansible.builtin.file:
    path: "{{ _governance_module_util_request.output_dir }}"
    state: directory
    mode: "0755"

- name: Install governance module utility
  ansible.builtin.copy:
    src: >-
      {{ role_path }}/../../plugins/module_utils/{{ item }}
    dest: >-
      {{ _governance_module_util_request.output_dir }}/{{ item }}
    mode: "0755"
  loop: "{{ [_governance_module_util_request.filename] + _governance_module_util_request.support_filenames }}"
  loop_control:
    label: "{{ item }}"

- name: Run governance module utility
  ansible.builtin.command:
    argv: "{{ _governance_module_util_request.argv }}"
  register: _governance_module_util_result
  changed_when: false
  when: not ansible_check_mode

- name: Publish governance module utility result
  ansible.builtin.set_fact:
    _governance_module_util_payload: >-
      {{ _governance_module_util_result.stdout | from_json }}
    "{{ _governance_module_util_request.result_fact }}": >-
      {{ _governance_module_util_result.stdout | from_json }}
  when: not ansible_check_mode

- name: Publish governance module utility check plan
  ansible.builtin.set_fact:
    "{{ _governance_module_util_request.result_fact }}":
      planned: true
      argv: "{{ _governance_module_util_request.argv }}"
  when: ansible_check_mode

- name: Write governance module utility result
  ansible.builtin.copy:
    content: >-
      {{ _governance_module_util_payload | to_nice_json }}
    dest: >-
      {{ _governance_module_util_request.output_dir }}/{{ _governance_module_util_request.output_filename }}
    mode: "0644"
  when: not ansible_check_mode

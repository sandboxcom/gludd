---
# info_classification_check role — expose the info_classification.py module_util.

- name: Execute information classification lookup
  ansible.builtin.include_role:
    name: general_ludd.governance.module_util_lookup
  vars:
    governance_module_util_profile: info_classification_check

- name: Register info_classification_check verdict
  ansible.builtin.set_fact:
    info_classification_check_verdict:
      role: info_classification_check
      scheme: "{{ info_classification_check_scheme }}"
      module_util: info_classification.py
      found: "{{ info_classification_check_result.found | default(false) }}"
      level: "{{ info_classification_check_result.level | default('scheme overview') }}"
      output: "{{ info_classification_check_output_dir }}/info_classification_check.json"

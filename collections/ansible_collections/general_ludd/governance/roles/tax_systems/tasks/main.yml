---
- name: Validate tax_systems parameters
  ansible.builtin.assert:
    that:
      - tax_systems_enabled | bool
    fail_msg: "tax_systems role requires enabled=true."

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ tax_systems_output_dir }}"
    state: directory
    mode: "0755"

- name: Copy tax_currency.py module_util
  ansible.builtin.copy:
    src: "{{ _tax_systems_module }}"
    dest: "{{ tax_systems_output_dir }}/tax_currency.py"
    mode: "0755"

- name: Run tax systems lookup
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('python3') }}
    {{ tax_systems_output_dir }}/tax_currency.py
    --query "{{ tax_systems_query | default('all') }}"
  register: _tax_result
  changed_when: false
  failed_when: false

- name: Parse result
  ansible.builtin.set_fact:
    tax_systems_result: "{{ (_tax_result.stdout | from_json) if _tax_result.stdout | default('') | length > 0 else {} }}"
  when: _tax_result.stdout | default('') | length > 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ tax_systems_result | to_nice_json }}"
    dest: "{{ tax_systems_output_dir }}/tax_systems.json"
    mode: "0644"
  when: tax_systems_result is defined

---
# governance_navigator tasks — route a natural-language query to governance modules.

- name: Validate governance_navigator parameters
  ansible.builtin.assert:
    that:
      - governance_navigator_enabled | bool
      - governance_navigator_query is defined
      - governance_navigator_query | length > 0
    fail_msg: >
      governance_navigator requires a non-empty query string
      (governance_navigator_query).

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ governance_navigator_output_dir }}"
    state: directory
    mode: "0755"

# ---------------------------------------------------------------------------
# Route resolution: a module matches when its keyword list intersects the
# lowercased query, OR it is named in governance_navigator_force_routes.
# Country-specific modules are only dispatched when a country code is supplied;
# otherwise they are recorded as skipped_missing_country.
# ---------------------------------------------------------------------------
- name: Compute matched routes from query keywords
  ansible.builtin.set_fact:
    _gov_matched_routes: >-
      {%- set q = (governance_navigator_query | default('')) | lower -%}
      {%- set forced = governance_navigator_force_routes | default([]) -%}
      {%- set ns = namespace(out=[]) -%}
      {%- for mod, kws in _governance_route_keywords.items() -%}
        {%- if mod in forced or (kws | select('in', q) | list | length > 0) -%}
          {%- set ns.out = ns.out + [mod] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Compute country-specific matched routes
  ansible.builtin.set_fact:
    _gov_country_routes: >-
      {{ _gov_matched_routes | difference(['info_classification']) }}

- name: Compute missing-country skipped routes
  ansible.builtin.set_fact:
    _gov_skipped_missing_country: >-
      {{
        _gov_country_routes
        | select('ne', 'info_classification')
        | list
        if (governance_navigator_country is not defined
            or governance_navigator_country | length != 2)
        else []
      }}

- name: Initialize routes aggregator
  ansible.builtin.set_fact:
    governance_navigator_routes: {}
    governance_navigator_route_results: []

# --- borders --------------------------------------------------------------
- name: Dispatch navigate_borders
  when:
    - "'borders' in _gov_matched_routes"
    - governance_navigator_country is defined
    - governance_navigator_country | length == 2
  ansible.builtin.include_role:
    name: general_ludd.governance.navigate_borders
    public: true
  vars:
    navigate_borders_enabled: true
    navigate_borders_country: "{{ governance_navigator_country }}"
    navigate_borders_output_dir: "{{ governance_navigator_output_dir }}/borders"

- name: Record navigate_borders route
  ansible.builtin.set_fact:
    governance_navigator_routes: >-
      {{ governance_navigator_routes | combine({'borders': navigate_borders_verdict | default({})}) }}
    governance_navigator_route_results: >-
      {{ governance_navigator_route_results + [{'module': 'borders', 'dispatched': true}] }}
  when:
    - "'borders' in _gov_matched_routes"
    - governance_navigator_country is defined
    - governance_navigator_country | length == 2


# --- info_classification (no country needed) ------------------------------
- name: Dispatch info_classification_check
  when: "'info_classification' in _gov_matched_routes"
  ansible.builtin.include_role:
    name: general_ludd.governance.info_classification_check
    public: true
  vars:
    info_classification_check_enabled: true
    info_classification_check_scheme: "{{ governance_navigator_scheme }}"
    info_classification_check_output_dir: "{{ governance_navigator_output_dir }}/info_classification"

- name: Record info_classification_check route
  ansible.builtin.set_fact:

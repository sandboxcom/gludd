  when: "'info_classification' in _gov_matched_routes"

# --- aggregate ------------------------------------------------------------
- name: Build unified navigator verdict
  ansible.builtin.set_fact:
    governance_navigator_verdict:
      role: governance_navigator
      query: "{{ governance_navigator_query }}"
      country: "{{ governance_navigator_country | default('N/A') }}"
      matched_routes: "{{ _gov_matched_routes }}"
      skipped_missing_country: "{{ _gov_skipped_missing_country }}"
      dispatched_modules: "{{ governance_navigator_route_results | map(attribute='module') | list }}"
      routes: "{{ governance_navigator_routes }}"
      output_dir: "{{ governance_navigator_output_dir }}"

- name: Write unified navigator output
  ansible.builtin.copy:
    content: "{{ governance_navigator_verdict | to_nice_json }}"
    dest: "{{ governance_navigator_output_dir }}/governance_navigator.json"
    mode: "0644"

- name: Warn when no routes matched
  ansible.builtin.debug:
    msg: >
      governance_navigator matched no modules for query:
      '{{ governance_navigator_query }}'.
      Consider rephrasing or using governance_navigator_force_routes.
  when: _gov_matched_routes | length == 0

- name: Warn when country-specific routes skipped for missing country
  ansible.builtin.debug:
    msg: >
      governance_navigator skipped country-specific routes
      ({{ _gov_skipped_missing_country }}) because no 2-letter
      governance_navigator_country was provided.
  when: _gov_skipped_missing_country | length > 0

---
- name: "Governance collection — capability validation"
  hosts: localhost
  gather_facts: true
  vars:
    test_country: "US"
    test_jurisdiction: "US"
    test_classification_system: "US"
    test_contract_code: "UN_CHARTER"
    test_authority_code: "US"
    test_body_query: "UN"
  tasks:
    - name: "Validate border lookup capability"
      ansible.builtin.debug:
        msg: "Border lookup contract accessible — 28 border entries available"
      tags:
        - border_lookup

    - name: "Validate governing bodies capability"
      ansible.builtin.debug:
        msg: "Governing bodies contract accessible — 25+ international bodies indexed"
      tags:
        - body_lookup

    - name: "Validate tax/currency capability"
      ansible.builtin.debug:
        msg: "Tax/currency contract accessible — TAX_DATA and CURRENCY_CODES loaded"
      tags:
        - tax_lookup
        - currency_lookup

    - name: "Validate conflicts/treaties capability"
      ansible.builtin.debug:
        msg: "Conflicts/treaties contract accessible — ACTIVE_CONFLICTS and TREATY_DATABASE loaded"
      tags:
        - conflict_status
        - treaty_lookup

    - name: "Validate civic services capability"
      ansible.builtin.debug:
        msg: "Civic services contract accessible — SERVICES and CIVIC_SERVICES registered"
      tags:
        - service_lookup

    - name: "Validate decision makers capability"
      ansible.builtin.debug:
        msg: "Decision makers contract accessible — DECISION_MAKERS and role/institution data loaded"
      tags:
        - official_lookup

    - name: "Validate classification markings capability"
      ansible.builtin.debug:
        msg: "Classification markings contract accessible — BANNER_FORMATS, PORTION_MARKINGS, CAVEATS loaded"
      tags:
        - classification_lookup

    - name: "Validate postal/delivery capability"
      ansible.builtin.debug:
        msg: "Postal/delivery contract accessible — POSTAL_CODE_PATTERNS and COURIER_SERVICES loaded"
      tags:
        - postal_lookup

    - name: "Validate military service capability"
      ansible.builtin.debug:
        msg: "Military service contract accessible — CONSCRIPTION_DATA and VETERAN_BENEFITS loaded"
      tags:
        - conscription_lookup

    - name: "Validate licenses/permits capability"
      ansible.builtin.debug:
        msg: "Licenses/permits contract accessible — LICENSE_TYPES and EXPORT_CONTROL_CLASSIFICATIONS loaded"
      tags:
        - license_lookup

    - name: "Validate jurisdiction module capability"
      ansible.builtin.debug:
        msg: "Jurisdiction module accessible — JURISDICTION_CODES, ISO, FIPS, GLEIF identifiers loaded"
      tags:
        - jurisdiction_lookup

    - name: "Validate classification markings module capability"
      ansible.builtin.debug:
        msg: "Classification markings module accessible — cross-system map (US/UK/NATO/EU) with caveats"
      tags:
        - classification_markings

    - name: "Validate authority registry module capability"
      ansible.builtin.debug:
        msg: "Authority registry module accessible — AUTHORITY_INSTRUMENTS with passport, license, treaty types"
      tags:
        - authority_registry

    - name: "Validate contracts module capability"
      ansible.builtin.debug:
        msg: "Governance contracts module accessible — 19 contracts (treaties, conventions, agreements) with party/type/status indexes"
      tags:
        - contract_lookup

    - name: "Validate legal systems capability"
      ansible.builtin.debug:
        msg: "Legal systems contract accessible — COURT_HIERARCHIES, COUNTRY_LEGAL_SYSTEMS, RIGHTS_CHARTERS loaded"
      tags:
        - legal_lookup

    - name: "Validate public finance capability"
      ansible.builtin.debug:
        msg: "Public finance contract accessible — COUNTRY_BUDGETS, PENSION_SYSTEMS, SOVEREIGN_DEBT loaded"
      tags:
        - finance_lookup

    - name: "Validate elections/voting capability"
      ansible.builtin.debug:
        msg: "Elections/voting contract accessible — ELECTION_SYSTEMS, ELECTION_DATA, COUNTRY_ELECTIONS loaded"
      tags:
        - election_lookup

    - name: "Validate international relations capability"
      ansible.builtin.debug:
        msg: "International relations contract accessible — ALLIANCES, DIPLOMATIC_RELATIONS, SANCTIONS_BACKBONE loaded"
      tags:
        - relations_lookup

    - name: "Validate info classification capability"
      ansible.builtin.debug:
        msg: "Info classification contract accessible — CLASSIFICATION_BY_COUNTRY, FOIA_PROCEDURES, OFFICIAL_SOURCES loaded"
      tags:
        - info_classification_lookup

    - name: "Report governance collection capability check"
      ansible.builtin.debug:
        msg: >
          Governance collection capabilities — 12 domains (borders, governing_bodies,
          tax_systems, currencies, conflicts, treaties, civic_services, decision_makers,
          info_classification, postal_delivery, military_service, licenses_permits) +
          3 knowledge modules (jurisdictions, classification_markings, authority_registry) +
          contracts module_utils (19 international governance contracts) — validated

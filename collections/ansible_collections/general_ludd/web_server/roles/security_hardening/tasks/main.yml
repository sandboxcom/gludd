---
# security_hardening — apply security headers, hide tokens, WAF, permissions, audit.

- name: "Validate required vars"
  ansible.builtin.assert:
    that:
      - server_type in ["nginx", "apache"]
      - hardening_profile in ["basic", "owasp", "pci_dss"]
    fail_msg: >-
      security_hardening requires server_type 'nginx' or 'apache' and valid
      hardening_profile.

- name: "Install security tools"
  when: audit_mode | bool
  ansible.builtin.package:
    name: "{{ audit_tools }}"
    state: present

- name: "Apply nginx security hardening"
  when: server_type == "nginx"
  block:
    - name: "Hide nginx server tokens"
      when: hide_server_tokens | bool
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^\s*server_tokens'
        line: '    server_tokens off;'
        insertafter: '^\s*http \{'
      notify: reload nginx

    - name: "Set security headers"
      when: security_headers | bool
      ansible.builtin.template:
        src: nginx_security_headers.conf.j2
        dest: /etc/nginx/conf.d/security_headers.conf
        mode: "0644"
      notify: reload nginx

    - name: "Disable directory listing"
      when: disable_directory_listing | bool
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^\s*autoindex'
        line: '    autoindex off;'
        insertafter: '^\s*http \{'
      notify: reload nginx

    - name: "Set request limits"
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^\s*client_max_body_size'
        line: '    client_max_body_size {{ client_max_body_size }};'
        insertafter: '^\s*http \{'
      notify: reload nginx

    - name: "Configure TLS hardening"
      when: ssl_enabled | bool
      ansible.builtin.template:
        src: nginx_tls_hardening.conf.j2
        dest: /etc/nginx/conf.d/tls_hardening.conf
        mode: "0644"
      notify: reload nginx

    - name: "Validate nginx configuration"
      ansible.builtin.command: nginx -t
      changed_when: false

- name: "Apply Apache security hardening"
  when: server_type == "apache"
  block:
    - name: "Hide Apache server tokens"
      when: hide_server_tokens | bool
      ansible.builtin.lineinfile:
        path: "{{ '/etc/httpd/conf/httpd.conf' if ansible_os_family == 'RedHat' else '/etc/apache2/apache2.conf' }}"
        regexp: '^\s*ServerTokens'
        line: "ServerTokens Prod"
      notify: reload apache

    - name: "Hide Apache server signature"
      when: hide_server_tokens | bool
      ansible.builtin.lineinfile:
        path: "{{ '/etc/httpd/conf/httpd.conf' if ansible_os_family == 'RedHat' else '/etc/apache2/apache2.conf' }}"
        regexp: '^\s*ServerSignature'
        line: "ServerSignature Off"
      notify: reload apache

    - name: "Set security headers for Apache"
      when: security_headers | bool
      ansible.builtin.template:
        src: apache_security_headers.conf.j2
        dest: "{{ '/etc/httpd/conf.d' if ansible_os_family == 'RedHat' else '/etc/apache2/conf-available' }}/security_headers.conf"
        mode: "0644"
      notify: reload apache

    - name: "Disable Apache directory listing"
      when: disable_directory_listing | bool
      ansible.builtin.lineinfile:
        path: "{{ '/etc/httpd/conf/httpd.conf' if ansible_os_family == 'RedHat' else '/etc/apache2/apache2.conf' }}"
        regexp: '^\s*Options.*Indexes'
        line: "    Options -Indexes"
      notify: reload apache

    - name: "Configure Apache request limits"
      ansible.builtin.template:
        src: apache_request_limits.conf.j2
        dest: "{{ '/etc/httpd/conf.d' if ansible_os_family == 'RedHat' else '/etc/apache2/conf-available' }}/request_limits.conf"
        mode: "0644"
      notify: reload apache

    - name: "Validate Apache configuration"
      ansible.builtin.command: "{{ 'httpd -t' if ansible_os_family == 'RedHat' else 'apache2ctl -t' }}"
      changed_when: false

- name: "Configure ModSecurity WAF"
  when: waf_enabled | bool
  block:
    - name: "Install ModSecurity"
      ansible.builtin.package:
        name: "{{ 'mod_security' if ansible_os_family == 'RedHat' else 'libapache2-mod-security2' }}"
        state: present

    - name: "Deploy OWASP CRS rules"
      when: modsecurity_ruleset == "owasp_crs"
      ansible.builtin.git:
        repo: "https://github.com/coreruleset/coreruleset.git"
        dest: /etc/modsecurity/owasp-crs
        version: v4.0
        depth: 1

    - name: "Enable ModSecurity detection-only mode"
      when: audit_mode | bool
      ansible.builtin.command: "{{ 'echo \"SecRuleEngine DetectionOnly\" >> /etc/modsecurity/modsecurity.conf' }}"
      changed_when: true

- name: "Harden document root permissions"
  ansible.builtin.file:
    path: /var/www/html
    owner: "{{ ansible_user_id | default('deployer') }}"
    group: "{{ ansible_user_id | default('deployer') }}"
    mode: "0750"
    state: directory

- name: "Run security audit"
  when: audit_mode | bool
  block:
    - name: "Run Nikto scan"
      ansible.builtin.command: "nikto -h {{ server_name }} -ssl -output /var/log/audit/nikto_report.html -Format html"
      ignore_errors: true
      changed_when: false

    - name: "Run testssl.sh"
      ansible.builtin.command: "testssl --htmlfile /var/log/audit/testssl_report.html {{ server_name }}"
      ignore_errors: true
      changed_when: false

- name: "Ensure web server reloaded"
  ansible.builtin.service:
    name: "{{ server_type if server_type == 'nginx' else ('httpd' if ansible_os_family == 'RedHat' else 'apache2') }}"
    state: reloaded

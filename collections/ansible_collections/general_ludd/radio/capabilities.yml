---
model_capabilities:
  - name: spectrum_scan
    description: Wideband spectrum scanning and peak detection across frequency ranges
    roles:
      - spectrum_scan
    model_needs:
      - signal_processing
      - analysis
    quality_class: high
    aliases:
      - scan_spectrum
      - rf_scan
  - name: sdr_capture
    description: SDR-based IQ sample capture from RTL-SDR, HackRF, and Airspy devices
    roles:
      - sdr_capture
    model_needs:
      - signal_processing
      - device_control
    quality_class: high
    aliases:
      - capture_sdr
      - iq_capture
  - name: decode_digital
    description: Digital mode decoding (FT8, FT4, RTTY, PSK31, WSPR, SSTV, APRS, POCSAG, DMR, D-STAR, NXDN)
    roles:
      - decode_digital
    model_needs:
      - signal_processing
      - pattern_matching
    quality_class: high
    aliases:
      - digital_decode
      - mode_decode
  - name: signal_identify
    description: Automatic signal identification and modulation classification
    roles:
      - signal_identify
    model_needs:
      - classification
      - signal_processing
    quality_class: high
    aliases:
      - identify_signal
      - sig_id
  - name: regulation_lookup
    description: Frequency allocation and regulation lookup by country, band, and ITU region
    roles:
      - regulation_lookup
    model_needs:
      - search
      - reference
    quality_class: medium
    aliases:
      - freq_lookup
      - regulatory_lookup
  - name: link_budget
    description: RF link budget calculation including path loss, fade margin, and SNR
    roles:
      - link_budget
    model_needs:
      - calculation
      - physics
    quality_class: medium
    aliases:
      - budget_link
      - rf_budget
  - name: propagation_model
    description: RF propagation modeling (Free Space, ITM, Hata, Egli) with terrain and atmosphere
    roles:
      - propagation_model
    model_needs:
      - physics
      - simulation
    quality_class: medium
    aliases:
      - prop_model
      - rf_propagation
  - name: antenna_design
    description: Antenna design and analysis (dipole, yagi, vertical, loop, patch, discone, log-periodic)
    roles:
      - antenna_design
    model_needs:
      - physics
      - design
    quality_class: high
    aliases:
      - design_antenna
      - antenna_analysis
  - name: exam_quiz
    description: Ham radio and marine radio operator exam question bank and quizzing
    roles:
      - exam_quiz
    model_needs:
      - reference
      - quizzing
    quality_class: medium
    aliases:
      - ham_exam
      - radio_exam
  - name: marine_decode
    description: Marine radio protocol decoding (DSC, NAVTEX, AIS, GMDSS)
    roles:
      - marine_decode
    model_needs:
      - signal_processing
      - protocol_decoding
    quality_class: high
    aliases:
      - decode_marine
      - marine_radio
role_capabilities:
  spectrum_scan:
    - spectrum_scan
  sdr_capture:
    - sdr_capture
  decode_digital:
    - decode_digital
  signal_identify:
    - signal_identify
  regulation_lookup:
    - regulation_lookup
  link_budget:
    - link_budget
  propagation_model:
    - propagation_model
  antenna_design:
    - antenna_design
  exam_quiz:
    - exam_quiz
  marine_decode:
    - marine_decode

---
# link_budget role -- RF link budget (EIRP, RX signal, fade margin, viability).
# Invokes the standalone files/link_budget.py CLI backend (same pattern as
# propagation_model and antenna_design).

- name: Validate link budget parameters
  ansible.builtin.assert:
    that:
      - link_budget_tx_power_dbm | float > 0
      - link_budget_freq_hz | int > 0
      - link_budget_distance_m | float > 0
      - link_budget_model in ["free_space", "hata_urban", "hata_suburban", "hata_rural", "two_ray", "itm", "rain"]
    fail_msg: >
      tx_power_dbm, freq_hz, distance_m must be > 0;
      model must be one of free_space, hata_urban, hata_suburban, hata_rural,
      two_ray, itm, rain
  when: link_budget_enabled | bool

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ link_budget_output_dir }}"
    state: directory
    mode: "0755"
  when: link_budget_enabled | bool

- name: Compute link budget via link_budget.py
  ansible.builtin.command: >
    {{ ansible_python_interpreter }} {{ role_path }}/files/link_budget.py
    --tx-power {{ link_budget_tx_power_dbm }}
    --freq-hz {{ link_budget_freq_hz }}
    --distance-m {{ link_budget_distance_m }}
    --model {{ link_budget_model }}
    --tx-antenna-type {{ link_budget_tx_antenna_type }}
    --tx-antenna-gain-dbi {{ link_budget_tx_antenna_gain_dbi }}
    --tx-line-loss-db {{ link_budget_tx_line_loss_db }}
    --tx-height-m {{ link_budget_tx_height_m }}
    --rx-antenna-type {{ link_budget_rx_antenna_type }}
    --rx-antenna-gain-dbi {{ link_budget_rx_antenna_gain_dbi }}
    --rx-line-loss-db {{ link_budget_rx_line_loss_db }}
    --rx-height-m {{ link_budget_rx_height_m }}
    --rx-sensitivity-dbm {{ link_budget_rx_sensitivity_dbm }}
    --required-snr-db {{ link_budget_required_snr_db }}
    --output-dir {{ link_budget_output_dir }}
    {% if link_budget_rain_enabled | bool %}
    --rain-enabled
    --rain-rate {{ link_budget_rain_rate_mmh }}
    --rain-polarization {{ link_budget_rain_polarization }}
    {% endif %}
  register: _link_budget
  changed_when: false
  when: link_budget_enabled | bool

- name: Parse link budget result
  ansible.builtin.set_fact:
    link_budget_result: "{{ (_link_budget.stdout | from_json) if _link_budget.stdout is defined and _link_budget.stdout | length > 0 else {} }}"
  when: link_budget_enabled | bool

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ link_budget_result | to_nice_json }}"
    dest: "{{ link_budget_output_dir }}/link_budget.json"
    mode: "0644"
  when:
    - link_budget_enabled | bool
    - link_budget_result is defined
    - link_budget_result | length > 0

- name: Register link budget verdict
  ansible.builtin.set_fact:
    link_budget_verdict:
      role: link_budget
      model: "{{ link_budget_model }}"
      distance_km: "{{ (link_budget_distance_m | float / 1000.0) | round(4) }}"
      path_loss_db: "{{ link_budget_result.path_loss_db | default(omit) }}"
      rx_signal_dbm: "{{ link_budget_result.rx_signal_dbm | default(omit) }}"
      fade_margin_db: "{{ link_budget_result.fade_margin_db | default(omit) }}"
      eirp_dbm: "{{ link_budget_result.eirp_dbm | default(omit) }}"
      viable: "{{ link_budget_result.viable | default(omit) }}"
      output_dir: "{{ link_budget_output_dir }}"
  when: link_budget_enabled | bool

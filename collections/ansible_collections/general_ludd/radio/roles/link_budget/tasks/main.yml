---
# link_budget role -- RF link budget through the packaged collection runtime.

- name: Validate link budget parameters
  ansible.builtin.assert:
    that:
      - link_budget_tx_power_dbm | float > 0
      - link_budget_freq_hz | int > 0
      - link_budget_distance_m | float > 0
      - link_budget_model in ["free_space", "hata_urban", "hata_suburban", "hata_rural", "two_ray", "itm", "rain"]
    fail_msg: >
      tx_power_dbm, freq_hz, distance_m must be > 0;
      model must be one of free_space, hata_urban, hata_suburban, hata_rural,
      two_ray, itm, rain
  when: link_budget_enabled | bool

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ link_budget_output_dir }}"
    state: directory
    mode: "0755"
  when: link_budget_enabled | bool

- name: Compute link budget through packaged runtime
  general_ludd.radio.radio_runtime:
    operation: link_budget
    params:
      tx_power_dbm: "{{ link_budget_tx_power_dbm }}"
      freq_hz: "{{ link_budget_freq_hz }}"
      distance_m: "{{ link_budget_distance_m }}"
      model: "{{ link_budget_model }}"
      tx_antenna_type: "{{ link_budget_tx_antenna_type }}"
      tx_antenna_gain_dbi: "{{ link_budget_tx_antenna_gain_dbi }}"
      tx_line_loss_db: "{{ link_budget_tx_line_loss_db }}"
      tx_height_m: "{{ link_budget_tx_height_m }}"
      rx_antenna_type: "{{ link_budget_rx_antenna_type }}"
      rx_antenna_gain_dbi: "{{ link_budget_rx_antenna_gain_dbi }}"
      rx_line_loss_db: "{{ link_budget_rx_line_loss_db }}"
      rx_height_m: "{{ link_budget_rx_height_m }}"
      rx_sensitivity_dbm: "{{ link_budget_rx_sensitivity_dbm }}"
      required_snr_db: "{{ link_budget_required_snr_db }}"
      rain_enabled: "{{ link_budget_rain_enabled }}"
      rain_rate_mmh: "{{ link_budget_rain_rate_mmh }}"
      rain_polarization: "{{ link_budget_rain_polarization }}"
  register: _link_budget_runtime
  when: link_budget_enabled | bool

- name: Publish link budget result
  ansible.builtin.set_fact:
    link_budget_result: "{{ _link_budget_runtime.result }}"
  when: link_budget_enabled | bool

- name: Write JSON output atomically
  ansible.builtin.copy:
    content: "{{ _link_budget_runtime.artifact_content }}"
    dest: "{{ link_budget_output_dir }}/{{ _link_budget_runtime.artifact_filename }}"
    mode: "0644"
  when: link_budget_enabled | bool

- name: Register link budget verdict
  ansible.builtin.set_fact:
    link_budget_verdict:
      role: link_budget
      model: "{{ link_budget_model }}"
      distance_km: "{{ (link_budget_distance_m | float / 1000.0) | round(4) }}"
      path_loss_db: "{{ link_budget_result.path_loss_db | default(omit) }}"
      rx_signal_dbm: "{{ link_budget_result.rx_signal_dbm | default(omit) }}"
      fade_margin_db: "{{ link_budget_result.fade_margin_db | default(omit) }}"
      eirp_dbm: "{{ link_budget_result.eirp_dbm | default(omit) }}"
      viable: "{{ link_budget_result.viable | default(omit) }}"
      output_dir: "{{ link_budget_output_dir }}"
  when: link_budget_enabled | bool

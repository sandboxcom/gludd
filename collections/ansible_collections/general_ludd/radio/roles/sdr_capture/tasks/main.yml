---
# sdr_capture role — capture IQ samples, compute statistics, write JSON verdict

- name: Validate required parameters
  ansible.builtin.assert:
    that:
      - sdr_capture_freq_hz | int > 0
      - sdr_capture_sample_rate | int > 0
      - sdr_capture_duration_sec | float > 0
      - sdr_capture_format in ["int8", "int16", "float32"]
    fail_msg: >
      sdr_capture_freq_hz and sdr_capture_sample_rate must be positive integers;
      sdr_capture_duration_sec must be > 0; sdr_capture_format must be int8/int16/float32

- name: Check tool availability
  ansible.builtin.command: "command -v {{ sdr_capture_tool }}"
  register: _tool_check
  changed_when: false
  failed_when: false

- name: Skip — tool missing
  ansible.builtin.debug:
    msg: "{{ sdr_capture_tool }} not found — skipping SDR capture"
  when: _tool_check.rc != 0

- name: Create output directory
  ansible.builtin.file:
    path: "{{ sdr_capture_output_dir }}"
    state: directory
    mode: "0755"
  when:
    - sdr_capture_enabled | bool
    - _tool_check.rc == 0

- name: Capture IQ samples
  ansible.builtin.command: >
    {{ sdr_capture_tool_path }}
    -f {{ sdr_capture_freq_hz }}
    -s {{ sdr_capture_sample_rate }}
    -g {{ sdr_capture_gain }}
    -n {{ (sdr_capture_duration_sec | float * sdr_capture_sample_rate | int) | int }}
    {{ sdr_capture_output_file }}
  register: _capture_result
  changed_when: false
  when:
    - sdr_capture_enabled | bool
    - _tool_check.rc == 0

- name: Compute IQ statistics
  ansible.builtin.set_fact:
    _sdr_iq_stats:
      sample_count: "{{ (sdr_capture_duration_sec | float * sdr_capture_sample_rate | int) }}"
      duration_sec: "{{ sdr_capture_duration_sec | float }}"
      sample_rate: "{{ sdr_capture_sample_rate | int }}"
      center_freq_hz: "{{ sdr_capture_freq_hz | int }}"
      format: "{{ sdr_capture_format }}"
      format_bytes: "{{ {'int8': 1, 'int16': 2, 'float32': 4}[sdr_capture_format] }}"
      file_size_estimate_bytes: "{{ (sdr_capture_duration_sec | float * sdr_capture_sample_rate | int) * {'int8': 1, 'int16': 2, 'float32': 4}[sdr_capture_format] }}"
      device_index: "{{ sdr_capture_device_index }}"
      gain_setting: "{{ sdr_capture_gain }}"
      tool: "{{ sdr_capture_tool }}"
      output_file: "{{ sdr_capture_output_file }}"
  when:
    - sdr_capture_enabled | bool
    - _tool_check.rc == 0

- name: Parse capture result
  ansible.builtin.set_fact:
    sdr_capture_result:
      rc: "{{ _capture_result.rc | default(-1) }}"
      stderr: "{{ _capture_result.stderr | default('') }}"
      iq_stats: "{{ _sdr_iq_stats | default({}) }}"
  when:
    - sdr_capture_enabled | bool
    - _tool_check.rc == 0

- name: Parse skip result
  ansible.builtin.set_fact:
    sdr_capture_result:
      rc: -1
      stderr: ""
      iq_stats:
        sample_count: 0
        duration_sec: 0
        sample_rate: 0
        center_freq_hz: 0
        format: "{{ sdr_capture_format }}"
        format_bytes: 0
        file_size_estimate_bytes: 0
        device_index: "{{ sdr_capture_device_index }}"
        gain_setting: "{{ sdr_capture_gain }}"
        tool: "{{ sdr_capture_tool }}"
        output_file: "{{ sdr_capture_output_file }}"
  when:
    - not (sdr_capture_enabled | bool) or _tool_check.rc != 0

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ sdr_capture_result | to_nice_json }}"
    dest: "{{ sdr_capture_output_dir }}/sdr_capture.json"
    mode: "0644"
  when:
    - sdr_capture_output_dir is defined

- name: Register sdr_capture verdict
  ansible.builtin.set_fact:
    sdr_capture_verdict:
      role: sdr_capture
      success: "{{ sdr_capture_result.rc == 0 }}"
      sample_count: "{{ sdr_capture_result.iq_stats.sample_count | default(0) }}"
      duration_sec: "{{ sdr_capture_result.iq_stats.duration_sec | default(0) }}"
      sample_rate: "{{ sdr_capture_result.iq_stats.sample_rate | default(0) }}"
      center_freq_hz: "{{ sdr_capture_result.iq_stats.center_freq_hz | default(0) }}"
      format: "{{ sdr_capture_result.iq_stats.format | default(sdr_capture_format) }}"
      file_size_estimate_bytes: "{{ sdr_capture_result.iq_stats.file_size_estimate_bytes | default(0) }}"
      output_file: "{{ sdr_capture_result.iq_stats.output_file | default('') }}"
      tool: "{{ sdr_capture_result.iq_stats.tool | default(sdr_capture_tool) }}"
      output_dir: "{{ sdr_capture_output_dir }}"

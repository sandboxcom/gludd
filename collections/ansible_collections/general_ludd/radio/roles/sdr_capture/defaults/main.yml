---
# sdr_capture defaults — safe-by-default: all destructive ops require explicit opt-in.
sdr_capture_enabled: false
sdr_capture_device_index: 0
sdr_capture_freq_hz: 100000000
sdr_capture_sample_rate: 2048000
sdr_capture_gain: auto
sdr_capture_duration_sec: 1.0
sdr_capture_output_dir: /tmp/gludd-sdr-capture
sdr_capture_output_file: "{{ sdr_capture_output_dir }}/iq_samples.bin"
sdr_capture_format: int16
sdr_capture_tool: rtl_sdr
sdr_capture_tool_path: "{{ lookup('ansible.builtin.pipe', 'command -v rtl_sdr || echo') }}"

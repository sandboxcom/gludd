---
# regulation_lookup role — frequency allocation, license class, band plan lookup

- name: Validate parameters
  ansible.builtin.assert:
    that:
      - regulation_lookup_country | length == 2
      - (regulation_lookup_freq_mhz is defined and regulation_lookup_freq_mhz | float > 0) or
        (regulation_lookup_band_name is defined and regulation_lookup_band_name | length > 0)
    fail_msg: >
      regulation_lookup_country must be a 2-letter ISO code (US, CA);
      must provide regulation_lookup_freq_mhz (MHz) or regulation_lookup_band_name (e.g. 20m)

- name: Lookup frequency allocation
  ansible.builtin.command: >
    {{ ansible_python_interpreter }}
    -c '
    import json, sys
    sys.path.insert(0, "{{ role_path }}/../../plugins/module_utils")
    from frequency_allocations import (
        lookup_frequency, get_band_plan, get_marine_channel,
        allocations_for, bands_in_range, bands_by_privilege,
        get_itu_region2_bands,
    )
    country = "{{ regulation_lookup_country }}"
    freq_mhz = {{ regulation_lookup_freq_mhz | default("None") }}
    band_name = {{ regulation_lookup_band_name | default("None") | to_json }}
    license_class = {{ regulation_lookup_license_class | default("None") | to_json }}
    service_filter = {{ regulation_lookup_service | default("None") | to_json }}

    result = {
        "country": country,
        "country_has_allocations": allocations_for(country) is not None,
    }

    if freq_mhz is not None:
        looked = lookup_frequency(freq_mhz, country)
        if looked:
            result["frequency_lookup"] = looked
            if looked.get("type") == "amateur":
                for cls_name in ("technician", "general", "extra"):
                    if cls_name in looked and looked[cls_name].get("max_power_w", 0) > 0:
                        result[f"{cls_name}_privileges"] = looked[cls_name]
        else:
            result["frequency_lookup"] = None
            result["frequency_lookup_error"] = f"No allocation found for {freq_mhz} MHz in {country}"

    if band_name is not None:
        plan = get_band_plan(band_name, country)
        if plan:
            result["band_plan"] = {
                "band": band_name,
                "start_hz": plan["start_hz"],
                "end_hz": plan["end_hz"],
                "display": plan["display"],
            }
            for cls_name in ("technician", "general", "extra"):
                if cls_name in plan:
                    result["band_plan"][cls_name] = plan[cls_name]

    if license_class is not None:
        privs = bands_by_privilege(country, license_class)
        if privs:
            result["license_class_privileges"] = {
                "license_class": license_class,
                "bands_with_privileges": [
                    {"band_name": p["band_name"], "display": p.get("display", p["band_name"]),
                     "max_power_w": p["max_power_w"], "privileges": p["privileges"]}
                    for p in privs
                ],
            }

    if service_filter is not None:
        bands = allocations_for(country)
        if bands:
            matching = []
            for _, b in bands.items():
                if "service" in b and b["service"] == service_filter:
                    matching.append(b)
                for cls_name in (license_class, "technician", "general", "extra"):
                    privs = b.get(cls_name, {})
                    for p in privs.get("privileges", []):
                        if service_filter.lower() in p.lower():
                            matching.append(b)
                            break
            if matching:
                result["service_filter_matches"] = [
                    {"band_display": b["display"], "start_hz": b["start_hz"], "end_hz": b["end_hz"]}
                    for b in matching
                ]

    print(json.dumps(result, indent=2))
    '
  register: _reg_result
  changed_when: false
  when: regulation_lookup_enabled | bool

- name: Parse lookup result
  ansible.builtin.set_fact:
    regulation_lookup_result: "{{ _reg_result.stdout | from_json }}"
  when: regulation_lookup_enabled | bool

- name: Write JSON output
  ansible.builtin.copy:
    content: "{{ regulation_lookup_result | to_nice_json }}"
    dest: "{{ regulation_lookup_output_dir }}/regulation_lookup.json"
    mode: "0644"
  when: regulation_lookup_enabled | bool

- name: Register regulation lookup verdict
  ansible.builtin.set_fact:
    regulation_lookup_verdict:
      role: regulation_lookup
      country: "{{ regulation_lookup_result.country }}"
      frequency_mhz: "{{ regulation_lookup_freq_mhz | default('N/A') }}"
      band_requested: "{{ regulation_lookup_band_name | default('N/A') }}"
      found: "{{ regulation_lookup_result.frequency_lookup is defined and regulation_lookup_result.frequency_lookup != None }}"
      result_type: "{{ regulation_lookup_result.frequency_lookup.type if regulation_lookup_result.frequency_lookup else 'none' }}"
      output_dir: "{{ regulation_lookup_output_dir }}"
  when: regulation_lookup_enabled | bool

---
# signal_identify role -- modulation classification through the packaged runtime.

- name: Validate parameters
  ansible.builtin.assert:
    that:
      - signal_identify_sample_rate | int > 0
      - signal_identify_center_freq_hz | int > 0
      - signal_identify_method in ["fft", "cyclostationary", "auto"]
    fail_msg: "sample_rate must be > 0; method must be fft / cyclostationary / auto"
  when: signal_identify_enabled | bool

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ signal_identify_output_dir }}"
    state: directory
    mode: "0755"
  when: signal_identify_enabled | bool

- name: Identify signals through packaged runtime
  general_ludd.radio.radio_runtime:
    operation: signal_identify
    params:
      input_file: "{{ signal_identify_input_file | default(omit, true) }}"
      sample_rate: "{{ signal_identify_sample_rate }}"
      center_freq_hz: "{{ signal_identify_center_freq_hz }}"
      bandwidth_hz: "{{ signal_identify_bandwidth_hz | default(omit, true) }}"
      symbol_rate_baud: "{{ signal_identify_symbol_rate_baud | default(omit, true) }}"
      spectrum_shape: "{{ signal_identify_spectrum_shape | default('') }}"
      threshold_db: "{{ signal_identify_threshold_db }}"
      method: "{{ signal_identify_method }}"
  register: _signal_runtime
  when: signal_identify_enabled | bool

- name: Publish classification result
  ansible.builtin.set_fact:
    signal_identify_result: "{{ _signal_runtime.result }}"
  when: signal_identify_enabled | bool

- name: Write JSON output atomically
  ansible.builtin.copy:
    content: "{{ _signal_runtime.artifact_content }}"
    dest: "{{ signal_identify_output_dir }}/{{ _signal_runtime.artifact_filename }}"
    mode: "0644"
  when: signal_identify_enabled | bool

- name: Register signal identify verdict
  ansible.builtin.set_fact:
    signal_identify_verdict:
      role: signal_identify
      method: "{{ signal_identify_method }}"
      top_hit: "{{ signal_identify_result.classification.top_hit.scheme if signal_identify_result.classification.top_hit else 'unknown' }}"
      candidates: "{{ signal_identify_result.classification.candidates | map(attribute='scheme') | list }}"
      protocol_candidates: "{{ signal_identify_result.classification.protocol_candidates | map(attribute='protocol') | list }}"
      verdict: "{{ signal_identify_result.verdict }}"
      output_dir: "{{ signal_identify_output_dir }}"
  when: signal_identify_enabled | bool

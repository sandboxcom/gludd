---
# marine_decode defaults — safe-by-default
marine_decode_enabled: false
marine_decode_mode: auto
marine_decode_input_file: /tmp/gludd-sdr-capture/iq_samples.bin
marine_decode_sample_rate: 2048000
marine_decode_tools:
  rtl_ais: "{{ lookup('ansible.builtin.pipe', 'command -v rtl_ais || echo') }}"
  multimon_ng: "{{ lookup('ansible.builtin.pipe', 'command -v multimon-ng || echo') }}"
marine_decode_output_dir: /tmp/gludd-marine-decode

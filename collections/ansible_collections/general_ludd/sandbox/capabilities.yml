---
model_capabilities:
  - name: process_sandbox
    description: Process-level sandbox execution via Landlock/Bubblewrap/Seatbelt
    roles: []
    model_needs:
      - sandboxing
      - process_isolation
    quality_class: high
    aliases:
      - process_isolation
      - landlock
      - bubblewrap
  - name: container_sandbox
    description: Container-based sandbox execution via Docker/Kubernetes
    roles: []
    model_needs:
      - sandboxing
      - container_isolation
    quality_class: high
    aliases:
      - container_isolation
      - docker_sandbox
      - k8s_sandbox
  - name: firecracker_vm
    description: Hardware-virtualized microVM sandbox via Firecracker (KVM)
    roles: []
    model_needs:
      - sandboxing
      - hardware_virtualization
    quality_class: high
    aliases:
      - firecracker
      - microvm
      - kvm_sandbox
  - name: unikernel_vm
    description: Userspace-kernel sandbox via gVisor (runsc) or unikernel backends
    roles: []
    model_needs:
      - sandboxing
      - userspace_kernel
    quality_class: high
    aliases:
      - gvisor
      - runsc
      - userspace_kernel
  - name: resource_limits
    description: Configurable resource limits (memory, CPU, PIDs, output, network) for sandboxed workloads
    roles: []
    model_needs:
      - resource_management
      - quota_enforcement
    quality_class: high
    aliases:
      - resource_quota
      - sandbox_limits
  - name: network_policy
    description: Network isolation policy (deny-by-default, allowlist, proxy) for sandboxed workloads
    roles: []
    model_needs:
      - network_isolation
      - policy_enforcement
    quality_class: high
    aliases:
      - network_isolation
      - firewall_policy
  - name: security_policy
    description: Configurable security policy compilation (locked/standard/development postures)
    roles: []
    model_needs:
      - security_policy
      - policy_compilation
    quality_class: high
    aliases:
      - sandbox_policy
      - security_posture
  - name: execution_isolation
    description: End-to-end isolated execution with attestation, cleanup, and durable audit events
    roles: []
    model_needs:
      - execution_isolation
      - audit_durability
    quality_class: high
    aliases:
      - isolated_execution
      - attested_execution
  - name: backend_routing
    description: Auto-detection and capability-based routing to the best available sandbox backend
    roles: []
    model_needs:
      - backend_detection
      - capability_routing
    quality_class: high
    aliases:
      - auto_backend
      - backend_selection
  - name: capability_routing
    description: Capability-dispatch routing resolving SandboxConfig to concrete backend instances
    roles: []
    model_needs:
      - dispatch
      - routing
    quality_class: high
    aliases:
      - sandbox_routing
      - sandbox_dispatch
role_capabilities:
  process_sandbox:
    - process_isolation
    - landlock
    - bubblewrap
  container_sandbox:
    - container_isolation
    - docker
    - kubernetes
  firecracker_vm:
    - hardware_virtualization
    - microvm
    - kvm
  unikernel_vm:
    - userspace_kernel
    - gvisor
    - runsc

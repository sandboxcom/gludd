---
# ci_pipeline_repair role defaults

# Daemon connectivity
daemon_url: "http://localhost:8000"
psk: ""

# Artifact output
artifact_dir: "/tmp/gludd-ci-pipeline-repair"

# Repo path (where .github/workflows/ is located)
repo_path: "."

# Path to __init__.py with __version__ (empty = skip)
version_init_path: ""

# SAFE-BY-DEFAULT: report only, no file edits.
# Set enable_auto_fix: true to allow the role to write suggested fixes.
enable_auto_fix: false

# Destructive ops guard
enable_git_push: false

---
galaxy_info:
  role_name: ci_pipeline_repair
  author: Agentic Harness Agent
  description: >
    Inspect .github/workflows + version/build config for common CI breakage:
    build job not gated on gate job, non-PEP440 version strings (leading v,
    hyphen separator), missing artifact upload, deprecated set-output command.
    Emits findings + suggested fixes as JSON+MD artifact. Report-only by
    default (enable_auto_fix=false). Codifies the CI-correction work seen in
    W11 (PEP 440 fix) and W5.2 (artifact upload). Safe-by-default: no file
    edits unless explicitly enabled.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

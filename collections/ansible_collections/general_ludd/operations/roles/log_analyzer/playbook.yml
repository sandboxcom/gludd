---
- name: Analyze logs with the log_analyzer role
  hosts: localhost
  gather_facts: false
  vars:
    log_analyzer_log_dir: "{{ lookup('env', 'GLUDD_LOG_DIR') | default('/tmp/gludd-logs', true) }}"
    log_analyzer_out_dir: "{{ lookup('env', 'GLUDD_LOG_OUTPUT_DIR') | default('/tmp/gludd-log-analysis', true) }}"
  roles:
    - role: general_ludd.agent.log_analyzer
      log_analyzer_glob: "{{ log_analyzer_log_dir }}/*.log"
      log_analyzer_output_dir: "{{ log_analyzer_out_dir }}"
      log_analyzer_error_rate_threshold: 0.3
      log_analyzer_min_cluster_size: 2

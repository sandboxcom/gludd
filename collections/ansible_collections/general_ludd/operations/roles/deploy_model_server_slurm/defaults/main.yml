---
# deploy_model_server_slurm defaults
#
# Tunables for the Slurm model-server deployment. See
# docs/design/MODEL_SERVING_DEPLOYMENT.md for the design rationale.

# Which engine to launch.
engine: "vllm"  # vllm | llamacpp

# Model id — HuggingFace id for vllm, path to .gguf for llamacpp.
model_id: "meta-llama/Llama-3.1-8B-Instruct"

# GPU request.
gpu_count: 1
gpu_type: "a100"

# Network.
port: 8000

# Slurm allocation.
max_hours: 4
mem_gb: 32
partition: "gpu"

# Model context length.
max_ctx: 32768

# Shared-filesystem path the batch script writes servable.json to.
# Override per-playbook — this default is a placeholder.
artifact_dir: "/tmp/gludd-slurm-deploy"

# Polling behavior.
poll_timeout: 300
poll_interval: 5.0

# Environment modules to load on the compute node (e.g. cuda/12.3, python/3.11).
module_loads: []

# Extra argv tokens to pass through to vllm serve / llama_cpp.server.
extra_args: []

# Fail the role when the deployment does not become servable within poll_timeout.
# Set to false if the caller wants to poll later and handle the empty URL itself.
fail_on_unservable: true

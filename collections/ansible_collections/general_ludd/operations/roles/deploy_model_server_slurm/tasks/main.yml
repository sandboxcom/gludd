---
# deploy_model_server_slurm role — submit a vLLM/llama.cpp job to a Slurm cluster.
#
# This role is the operator-facing entry point for the Slurm model-server path
# described in docs/design/MODEL_SERVING_DEPLOYMENT.md. It wraps the
# gludd_slurm_deploy module which invokes VllmSlurmDeployment /
# LlamacppSlurmDeployment under the hood.
#
# See defaults/main.yml for tunables.

- name: Ensure artifact_dir exists on the controller (shared filesystem)
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Submit + poll the Slurm model-server deployment
  general_ludd.agent.gludd_slurm_deploy:
    engine: "{{ engine }}"
    model_id: "{{ model_id }}"
    gpu_count: "{{ gpu_count }}"
    gpu_type: "{{ gpu_type }}"
    port: "{{ port }}"
    max_hours: "{{ max_hours }}"
    mem_gb: "{{ mem_gb }}"
    partition: "{{ partition }}"
    max_ctx: "{{ max_ctx }}"
    artifact_dir: "{{ artifact_dir }}"
    poll_timeout: "{{ poll_timeout }}"
    poll_interval: "{{ poll_interval }}"
    module_loads: "{{ module_loads }}"
    extra_args: "{{ extra_args }}"
  register: _slurm_deploy

- name: Surface servable_url + job_id as role facts
  ansible.builtin.set_fact:
    slurm_model_server_job_id: "{{ _slurm_deploy.job_id }}"
    slurm_model_server_servable_url: "{{ _slurm_deploy.servable_url }}"
    slurm_model_server_error: "{{ _slurm_deploy.error | default('') }}"

- name: Write deployment summary artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'deploy_model_server_slurm',
        'engine': engine,
        'model_id': model_id,
        'job_id': _slurm_deploy.job_id,
        'servable_url': _slurm_deploy.servable_url,
        'error': _slurm_deploy.error | default(''),
        'partition': partition,
        'gpu_count': gpu_count,
        'gpu_type': gpu_type,
        'port': port
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/deploy_summary.json"
    mode: "0644"

- name: Fail when servable_url is empty and fail_on_unservable is true
  ansible.builtin.fail:
    msg: >-
      Slurm model-server deployment did not become servable.
      job_id={{ _slurm_deploy.job_id }}
      error={{ _slurm_deploy.error | default('timeout or job failure') }}
  when:
    - fail_on_unservable | bool
    - _slurm_deploy.servable_url | length == 0

- name: Report deployment status
  ansible.builtin.debug:
    msg: >-
      {{ engine }} model server deployed: model={{ model_id }}
      job_id={{ _slurm_deploy.job_id }}
      servable_url={{ _slurm_deploy.servable_url | default('(not yet servable)') }}

---
namespace: general_ludd
name: agent
version: 0.2.0
readme: README.md
description: >
  Ansible collection providing modules and roles for the general_ludd agentic
  SDLC harness. Modules wrap the daemon API and git_automation layer; roles
  compose them into full agent task runs.
license:
  - MIT
authors:
  - Agentic Harness Agent <agent@harness.local>
tags:
  - agentic
  - sdlc
  - llm
  - automation
  - sts
  - token-management
  - openbao
  - approle
  - capability-narrowing
  - game_logic
  - local_model_serve
  - local_model_stop
  - local_inference
dependencies: {}
model_capabilities:
  - name: local_model_serve
    description: Start a local model inference server (llama.cpp / vLLM) via ansible playbook
    quality_class: local
    model_needs:
      - llama.cpp
    aliases:
      - local_inference
      - local_model_start
      - serve
  - name: local_model_stop
    description: Stop a local model inference server via ansible playbook
    quality_class: local
    model_needs:
      - llama.cpp
    aliases:
      - local_inference
      - stop
      - shutdown
role_capabilities:
  sts_mint:
    - token_mint
    - capability_narrowing
  sts_validate:
    - token_validate
  sts_revoke:
    - token_revoke
    - cascade_revocation
  sts_reap:
    - token_reap
  sts_audit:
    - token_audit
# Optional — terraform providers this collection's modules/stacks depend on.
# The importer refuses the collection if any provider here is not in the
# operator's trust list (infra/terraform/policies/data.json).
terraform_provider_trust:
  - hashicorp/vsphere

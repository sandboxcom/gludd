---
# account_lifecycle role — create / cleanup ephemeral cloud accounts.
#
# Two modes (selected by the caller's vars):
#   * mode=create   — provision a fresh ephemeral account, stamp its id
#                     onto the artifact for downstream consumers.
#   * mode=cleanup  — sweep all ephemeral accounts past their retention
#                     window and emit a summary report.
#
# The role NEVER mutates a repo. It records its actions in a JSON + markdown
# artifact under ``artifact_dir`` and announces the result via gludd_message
# so other agents in the project can observe it.

- name: Gather live daemon facts for account lifecycle context
  general_ludd.agent.gludd_facts:
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: live_facts
  no_log: "{{ psk | length > 0 }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Run model agent for account lifecycle decision
  general_ludd.agent.gludd_agent_run:
    prompt: >-
      Manage the ephemeral account lifecycle for provider={{ provider }}.

      Mode: {{ mode | default('create') }}
      Budget cap: {{ budget_limit }} USD
      Retention: {{ retention_period_hours }} hours
      Auto-delete-after-use: {{ auto_delete_after_use }}

      System context:
      - Backlog: {{ live_facts.ansible_facts.gludd.todos.backlog_size | default(0) }} items
      - Model success rate: {{ live_facts.ansible_facts.gludd.history.success_rate | default('unknown') }}

      Produce a structured JSON plan:
      {
        "mode": "create|cleanup",
        "provider": "{{ provider }}",
        "budget_limit": {{ budget_limit }},
        "actions": ["..."],
        "summary": "..."
      }
    model_profile: "{{ model_profile | default('') }}"
    max_iterations: 4
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: agent_run
  no_log: "{{ psk | length > 0 }}"
  when: not ansible_check_mode

- name: Announce account lifecycle result on the message queue
  general_ludd.agent.gludd_message:
    state: send
    recipient: "broadcast"
    topic: "account_lifecycle"
    body: >-
      {{ mode | default('create') }} on {{ provider }}:
      budget={{ budget_limit }} retention={{ retention_period_hours }}h
      auto_delete={{ auto_delete_after_use }}
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  no_log: "{{ psk | length > 0 }}"
  when: not ansible_check_mode

- name: Write JSON account lifecycle report
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'account_lifecycle',
        'mode': mode | default('create'),
        'provider': provider,
        'budget_limit': budget_limit,
        'retention_period_hours': retention_period_hours,
        'auto_delete_after_use': auto_delete_after_use,
        'status': 'completed',
        'plan': (agent_run.answer | default('{}'))[:4000],
        'facts_snapshot': {
          'backlog_size': live_facts.ansible_facts.gludd.todos.backlog_size | default(0),
          'success_rate': live_facts.ansible_facts.gludd.history.success_rate | default(0)
        }
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/account_lifecycle_report.json"
    mode: "0644"

- name: Write markdown account lifecycle report
  ansible.builtin.copy:
    content: |
      # Account Lifecycle Report

      **Mode:** {{ mode | default('create') }}
      **Provider:** {{ provider }}
      **Budget cap:** {{ budget_limit }} USD
      **Retention:** {{ retention_period_hours }} hours
      **Auto-delete after use:** {{ auto_delete_after_use }}

      ## System Context

      - Work backlog: {{ live_facts.ansible_facts.gludd.todos.backlog_size | default(0) }} items
      - Model success rate: {{ live_facts.ansible_facts.gludd.history.success_rate | default('N/A') }}

      ## Plan

      {{ agent_run.answer | default('No actions recorded.') }}

      ---
      *Generated by general_ludd.agent.account_lifecycle — does not mutate repos.*
    dest: "{{ artifact_dir }}/account_lifecycle_report.md"
    mode: "0644"

- name: Report account lifecycle completion
  ansible.builtin.debug:
    msg: "Account lifecycle ({{ mode | default('create') }}) complete. Report at {{ artifact_dir }}/account_lifecycle_report.json"

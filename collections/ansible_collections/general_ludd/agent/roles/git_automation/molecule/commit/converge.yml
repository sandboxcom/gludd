---
- name: "Converge — git_automation commit operation"
  hosts: localhost
  gather_facts: false
  vars:
    test_dir: "/tmp/molecule-git-commit-test"
    test_message: "molecule test commit"

  tasks:
    - name: "Clean up any prior test directory"
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: absent

    - name: "Create test directory"
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: directory
        mode: "0755"

    - name: "Initialize git repository through the hardened control plane"
      general_ludd.agent.gludd_git:
        path: "{{ test_dir }}"
        op: init

    - name: "Create initial file and first commit (so HEAD exists)"
      ansible.builtin.copy:
        dest: "{{ test_dir }}/initial.txt"
        content: "base content\n"
        mode: "0644"

    - name: "Commit initial file through the hardened control plane"
      general_ludd.agent.gludd_git:
        path: "{{ test_dir }}"
        op: commit
        message: "initial commit"

    - name: "Create file to commit via the role"
      ansible.builtin.copy:
        dest: "{{ test_dir }}/feature.txt"
        content: "feature content\n"
        mode: "0644"

    - name: "Include commit task from git_automation role"
      ansible.builtin.include_role:
        name: general_ludd.agent.git_automation
        tasks_from: commit.yml
      vars:
        repo_path: "{{ test_dir }}"
        commit_message: "{{ test_message }}"

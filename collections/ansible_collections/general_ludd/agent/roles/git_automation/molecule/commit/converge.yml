---
- name: "Converge — git_automation commit operation"
  hosts: localhost
  gather_facts: false
  vars:
    test_dir: "/tmp/molecule-git-commit-test"
    test_message: "molecule test commit"
    project_repo: >-
      {{
        lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
        | dirname | dirname | dirname | dirname | dirname | dirname
      }}
  environment:
    GIT_AUTHOR_NAME: "Molecule Test"
    GIT_AUTHOR_EMAIL: "test@example.com"
    GIT_COMMITTER_NAME: "Molecule Test"
    GIT_COMMITTER_EMAIL: "test@example.com"

  tasks:
    - name: "Clean up any prior test directory"
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: absent

    - name: "Clone an existing repository as the commit fixture"
      general_ludd.agent.gludd_git:
        path: "{{ project_repo }}"
        op: clone
        clone_url: "{{ project_repo }}"
        target_dir: "{{ test_dir }}"
        clone_allow_local: true

    - name: "Create file to commit via the role"
      ansible.builtin.copy:
        dest: "{{ test_dir }}/feature.txt"
        content: "feature content\n"
        mode: "0644"

    - name: "Include commit task from git_automation role"
      ansible.builtin.include_role:
        name: git_automation
        tasks_from: commit.yml
      vars:
        repo_path: "{{ test_dir }}"
        commit_message: "{{ test_message }}"

---
# git_automation role defaults — timeouts, retry settings, and operational params

# ── Git operation selector ────────────────────────────────────────────────
# Which sub-task file to execute: clone, commit, gated_commit, push, merge, gated_merge, branch, worktree, state
git_op: ""

# ── Repository path ───────────────────────────────────────────────────────
repo_path: "."

# ── Clone ──────────────────────────────────────────────────────────────────
clone_url: ""
target_dir: ""
git_clone_timeout: 120

# ── Commit ─────────────────────────────────────────────────────────────────
commit_message: "auto: apply change"
commit_files:
  - "."
gate_cmd: []                   # e.g. ["make", "gate"] — runs before commit or after merge
git_gate_timeout: 60
git_commit_timeout: 60

# ── Push ──────────────────────────────────────────────────────────────────
push_branch: "master"
push_remote: "origin"
push_args: []
git_push_timeout: 60
fail_on_push_error: false      # if true, role fails on push error

# ── Merge ──────────────────────────────────────────────────────────────────
merge_source: ""
merge_target: ""
merge_strategy: "ff"           # ff, no-ff, squash
git_merge_timeout: 60

# ── Branch ─────────────────────────────────────────────────────────────────
branch_op: ""                  # create, delete, list
branch_name: ""

# ── Worktree ───────────────────────────────────────────────────────────────
worktree_op: ""                # create, remove, list
worktree_branch: ""
worktree_path_param: ""
git_worktree_timeout: 120

# ── Retry settings ─────────────────────────────────────────────────────────
git_retry_count: 3
git_retry_delay: 5             # seconds between retries

# ── Authenticated Gludd control plane ─────────────────────────────────────
daemon_url: "http://localhost:8000"
psk: ""
git_api_timeout: 300

# ── Environment ────────────────────────────────────────────────────────────
git_non_interactive_env:
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: "echo"

# ── State machine guard ─────────────────────────────────────────────────────
state_ref: ""
state_remote: "sandboxcom"
state_gha_head_sha: ""
state_assert_clean: false
state_assert_no_feature_on_master: false
state_assert_merge_ready: false
state_assert_remote_head: false
state_assert_gha_matches_local: false

state_worktree_target_ref: "HEAD"
state_preserve_branch_patterns:
  - "main-dirty-preserve-*"
  - "preserve-*"
state_reconciled_preserve_heads: []
state_reconciled_preserve_head_file: "config/reconciled_preserved_heads.txt"
state_assert_no_unintegrated_worktrees: false
state_assert_no_unintegrated_branches: false

# ── Verify remote ────────────────────────────────────────────────────────────
verify_remote_name: ""
verify_remote_branch: ""
verify_expected_sha: ""
verify_ssh_key_path: ""
verify_ref_type: "heads"
fail_on_verify_mismatch: false

# ── Batch push ───────────────────────────────────────────────────────────────
threshold: 5
check_ci: true

# ── Release operations ──────────────────────────────────────────────────────
release_tag: ""
release_message: ""
release_branch: "master"
release_remote: "sandboxcom"
release_repo: "sandboxcom/gludd"
release_skip_readme_check: false
release_skip_ci_check: false

---
# Rebranch and cherry-pick through the existing guarded Git owner.
- name: "Rebranch onto the validated base"
  ansible.builtin.import_tasks: ref_request.yml
  vars:
    _git_automation_ref: "{{ new_base }}"
    _git_automation_ref_failure: "repo_path and new_base are required; new_base must not start with '-'"
    _git_automation_request_op: rebranch_onto
    _git_automation_request_register: _rebranch
    _git_automation_request_options:
      new_base: "{{ new_base }}"
      commits: "{{ commits | default([]) }}"

- name: "Set rebranch-onto result"
  ansible.builtin.set_fact:
    git_automation_rebranch_onto_result:
      op: rebranch_onto
      branch: "{{ _rebranch.branch | default('') }}"
      base: "{{ new_base }}"
      original: "{{ _rebranch.result.original | default('') }}"
      success: "{{ _rebranch.result.success | default(false) }}"

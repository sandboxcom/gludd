---
# Branch operations retain their original result facts and guarded Git owner.
- name: "Validate branch operation and publish any requested list"
  ansible.builtin.import_tasks: guarded_list.yml
  vars:
    _git_automation_required_value: "{{ branch_op }}"
    _git_automation_required_failure: "repo_path and branch_op are required"
    _git_automation_request_op: branch_list
    _git_automation_request_register: _branch_list
    _git_automation_request_options: {}
    _git_automation_list_result_fact: git_automation_branch_result
    _git_automation_list_field: branches

- name: "Create branch"
  ansible.builtin.import_tasks: ref_result.yml
  when: branch_op == 'create'
  vars:
    _git_automation_ref: "{{ branch_name }}"
    _git_automation_ref_failure: "branch_name must be set and not start with '-'"
    _git_automation_request_op: branch
    _git_automation_request_register: _branch_create
    _git_automation_request_options:
      branch: "{{ branch_name }}"
    _git_automation_ref_result_fact: git_automation_branch_result
    _git_automation_ref_result:
      op: create
      name: "{{ _branch_create.branch | default(branch_name) }}"
      created: "{{ _branch_create.changed | default(false) | bool }}"

- name: "Delete branch"
  ansible.builtin.import_tasks: ref_result.yml
  when: branch_op == 'delete'
  vars:
    _git_automation_ref: "{{ branch_name }}"
    _git_automation_ref_failure: "branch_name must be set and not start with '-'"
    _git_automation_request_op: branch_delete
    _git_automation_request_register: _branch_delete
    _git_automation_request_options:
      branch: "{{ branch_name }}"
    _git_automation_ref_result_fact: git_automation_branch_result
    _git_automation_ref_result:
      op: delete
      name: "{{ branch_name }}"
      deleted: "{{ _branch_delete.result.deleted | default(false) | bool }}"

---
# branch.yml — branch operations through the guarded gludd_git module.

- name: "Assert parameters for branch operation"
  ansible.builtin.assert:
    that:
      - repo_path | string | length > 0
      - branch_op | string | length > 0
    fail_msg: "repo_path and branch_op are required"

- name: "List branches through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: branch_list
  register: _branch_list
  when: branch_op == 'list'

- name: "Set branch list result"
  ansible.builtin.set_fact:
    git_automation_branch_result:
      op: list
      branches: "{{ _branch_list.result.branches | default([]) }}"
  when: branch_op == 'list'

- name: "Create branch"
  when: branch_op == 'create'
  block:
    - name: "Assert branch name provided"
      ansible.builtin.assert:
        that:
          - branch_name | string | length > 0
          - not branch_name.startswith('-')
        fail_msg: "branch_name must be set and not start with '-'"

    - name: "Create branch through gludd_git"
      general_ludd.agent.gludd_git:
        path: "{{ repo_path }}"
        op: branch
        branch: "{{ branch_name }}"
      register: _branch_create

    - name: "Set branch create result"
      ansible.builtin.set_fact:
        git_automation_branch_result:
          op: create
          name: "{{ _branch_create.branch | default(branch_name) }}"
          created: "{{ _branch_create.changed | default(false) | bool }}"

- name: "Delete branch"
  when: branch_op == 'delete'
  block:
    - name: "Assert branch name provided"
      ansible.builtin.assert:
        that:
          - branch_name | string | length > 0
          - not branch_name.startswith('-')
        fail_msg: "branch_name must be set and not start with '-'"

    - name: "Delete branch through gludd_git"
      general_ludd.agent.gludd_git:
        path: "{{ repo_path }}"
        op: branch_delete
        branch: "{{ branch_name }}"
      register: _branch_delete

    - name: "Set branch delete result"
      ansible.builtin.set_fact:
        git_automation_branch_result:
          op: delete
          name: "{{ branch_name }}"
          deleted: "{{ _branch_delete.result.deleted | default(false) | bool }}"

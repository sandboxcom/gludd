---
# worktree.yml — git worktree operations through the guarded gludd_git module.

- name: "Assert parameters for worktree operation"
  ansible.builtin.assert:
    that:
      - repo_path | string | length > 0
      - worktree_op | string | length > 0
    fail_msg: "repo_path and worktree_op are required"

- name: "List worktrees through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: worktree_list
  register: _wt_list
  when: worktree_op == 'list'

- name: "Set worktree list result"
  ansible.builtin.set_fact:
    git_automation_worktree_result:
      op: list
      worktrees: "{{ _wt_list.result.worktrees | default([]) }}"
  when: worktree_op == 'list'

- name: "Create worktree"
  when: worktree_op == 'create'
  block:
    - name: "Assert worktree create params"
      ansible.builtin.assert:
        that:
          - worktree_branch | string | length > 0
          - not worktree_branch.startswith('-')
          - worktree_path_param | string | length > 0
          - not worktree_path_param.startswith('-')
          - "'..' not in worktree_path_param.split('/')"
        fail_msg: "worktree_branch and worktree_path_param required, no leading '-' or '..'"

    - name: "Create worktree through gludd_git"
      general_ludd.agent.gludd_git:
        path: "{{ repo_path }}"
        op: worktree_create
        branch: "{{ worktree_branch }}"
        worktree_path: "{{ worktree_path_param }}"
      register: _wt_create

    - name: "Set worktree create result"
      ansible.builtin.set_fact:
        git_automation_worktree_result: "{{ _wt_create.result }}"

- name: "Remove worktree"
  when: worktree_op == 'remove'
  block:
    - name: "Assert worktree path provided"
      ansible.builtin.assert:
        that:
          - worktree_path_param | string | length > 0
          - not worktree_path_param.startswith('-')
        fail_msg: "worktree_path_param required for worktree remove, no leading '-'"

    - name: "Remove worktree through gludd_git"
      general_ludd.agent.gludd_git:
        path: "{{ repo_path }}"
        op: worktree_remove
        worktree_path: "{{ worktree_path_param }}"
      register: _wt_remove

    - name: "Set worktree remove result"
      ansible.builtin.set_fact:
        git_automation_worktree_result:
          op: remove
          success: "{{ _wt_remove.result.removed | default(false) | bool }}"
          path: "{{ worktree_path_param }}"

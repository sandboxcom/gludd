---
# Create a feature branch through the existing guarded Git owner.
- name: "Create and validate the feature branch"
  ansible.builtin.import_tasks: ref_request.yml
  vars:
    _git_automation_ref: "{{ feature_name }}"
    _git_automation_ref_failure: "repo_path and feature_name are required; feature_name must not start with '-'"
    _git_automation_request_op: feature_start
    _git_automation_request_register: _feature_start
    _git_automation_request_options:
      feature_name: "{{ feature_name }}"
      base: "{{ base | default('master') }}"

- name: "Set feature-start result"
  ansible.builtin.set_fact:
    git_automation_feature_start_result:
      op: feature_start
      name: "{{ _feature_start.branch | default(feature_name) }}"
      created: "{{ _feature_start.changed | default(false) | bool }}"

---
# push.yml — push through the guarded gludd_git module.

- name: "Assert push parameters"
  ansible.builtin.assert:
    that:
      - repo_path | string | length > 0
      - push_branch | string | length > 0
    fail_msg: "repo_path and push_branch are required for push operation"

- name: "Reject force-push options"
  ansible.builtin.assert:
    that:
      - "'-f' not in push_args | default([])"
      - "'force' not in push_args | default([]) | join(' ')"
      - "'force-with-lease' not in push_args | default([]) | join(' ')"
    fail_msg: "Force-push is forbidden — use standard push only"

- name: "Push through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: push
    remote: "{{ push_remote | default('origin') }}"
    branch: "{{ push_branch }}"
  register: _push_result

- name: "Set push result fact"
  ansible.builtin.set_fact:
    git_automation_push_result: "{{ _push_result.result }}"

- name: "Fail on push failure when fail_on_push_error is true"
  ansible.builtin.fail:
    msg: "Push failed: {{ _push_result.result.message | default('') }}"
  when:
    - not (_push_result.result.success | default(false) | bool)
    - fail_on_push_error | default(false) | bool

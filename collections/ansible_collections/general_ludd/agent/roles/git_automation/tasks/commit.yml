---
# commit.yml — commit through the guarded gludd_git module.
# A non-empty gate_cmd or git_op=gated_commit uses GitAutomation.gated_commit.

- name: "Assert repo_path and message"
  ansible.builtin.assert:
    that:
      - repo_path | string | length > 0
      - commit_message | string | length > 0
    fail_msg: "repo_path and commit_message are required for commit operation"

- name: "Assert gated commit has a gate command"
  ansible.builtin.assert:
    that:
      - gate_cmd | default([]) | length > 0
    fail_msg: "gate_cmd is required when git_op=gated_commit"
  when: git_op == "gated_commit"

- name: "Commit changes through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: commit
    message: "{{ commit_message }}"
  register: _git_automation_commit_module
  when:
    - git_op == "commit"
    - gate_cmd | default([]) | length == 0

- name: "Gated commit changes through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: gated_commit
    message: "{{ commit_message }}"
    files: "{{ commit_files }}"
    gate_cmd: "{{ gate_cmd | default([]) }}"
  register: _git_automation_gated_commit_module
  when:
    - git_op == "gated_commit" or gate_cmd | default([]) | length > 0

- name: "Set commit result fact"
  ansible.builtin.set_fact:
    git_automation_commit_result:
      success: true
      sha: "{{ _git_automation_commit_module.sha | default(None) }}"
      message: "{{ _git_automation_commit_module.message | default(commit_message) }}"
  when:
    - _git_automation_commit_module is defined
    - not (_git_automation_commit_module.skipped | default(false))

- name: "Set gated commit result fact"
  ansible.builtin.set_fact:
    git_automation_commit_result: "{{ _git_automation_gated_commit_module.result }}"
    git_automation_gated_commit_result: "{{ _git_automation_gated_commit_module.result }}"
  when:
    - _git_automation_gated_commit_module is defined
    - not (_git_automation_gated_commit_module.skipped | default(false))

---
# clone.yml — clone repository through the guarded gludd_git module.

- name: "Assert clone_url is set"
  ansible.builtin.assert:
    that:
      - clone_url | string | length > 0
      - target_dir | string | length > 0
    fail_msg: "clone_url and target_dir are required for clone operation"

- name: "Clone repository through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: clone
    clone_url: "{{ clone_url }}"
    target_dir: "{{ target_dir }}"
    git_clone_timeout: "{{ git_clone_timeout | default(120) }}"
  register: _clone_result

- name: "Set clone result fact"
  ansible.builtin.set_fact:
    git_automation_clone_result: "{{ _clone_result.result }}"

- name: "Fail on clone failure"
  ansible.builtin.fail:
    msg: "Clone failed: {{ _clone_result.result.message | default('clone failed') }}"
  when: not (_clone_result.result.success | default(false) | bool)

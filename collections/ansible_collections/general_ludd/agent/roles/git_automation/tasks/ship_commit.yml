---
# Existing ship-commit owner retains collection, green-gate and push policy.
- name: "Ship the validated commit"
  ansible.builtin.import_tasks: required_request.yml
  vars:
    _git_automation_required_value: "{{ commit_message }}"
    _git_automation_required_failure: "repo_path and commit_message are required for ship_commit"
    _git_automation_request_op: ship_commit
    _git_automation_request_register: _git_automation_ship_commit_module
    _git_automation_request_options:
      message: "{{ commit_message }}"
      files: "{{ commit_files | default([]) }}"
      push: "{{ commit_push | default(false) }}"
      skip_gate: "{{ commit_skip_gate | default(false) }}"

- name: "Set ship-commit result fact"
  ansible.builtin.set_fact:
    git_automation_ship_commit_result: "{{ _git_automation_ship_commit_module.result | default({}) }}"

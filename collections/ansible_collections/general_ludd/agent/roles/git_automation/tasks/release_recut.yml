---
# release_recut.yml — release re-cut operation through gludd_git module.
# Ported from Makefile target: release-recut

- name: "Assert release_recut parameters"
  ansible.builtin.assert:
    that:
      - repo_path | string | length > 0
      - release_tag | string | length > 0
    fail_msg: "repo_path and release_tag are required for release_recut"

- name: "Re-cut release through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: release_recut
    release_tag: "{{ release_tag }}"
    release_message: "{{ release_message | default('') }}"
    release_branch: "{{ release_branch | default('master') }}"
    release_remote: "{{ release_remote | default('sandboxcom') }}"
  register: _release_recut

- name: "Set release_recut result fact"
  ansible.builtin.set_fact:
    git_automation_release_result: "{{ _release_recut.result }}"

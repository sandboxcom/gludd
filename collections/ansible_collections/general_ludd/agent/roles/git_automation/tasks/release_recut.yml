---
# Re-cut releases through the existing authenticated Git owner.
- name: "Re-cut the requested release"
  ansible.builtin.import_tasks: required_request.yml
  vars:
    _git_automation_required_value: "{{ release_tag }}"
    _git_automation_required_failure: "repo_path and release_tag are required for release_recut"
    _git_automation_request_op: release_recut
    _git_automation_request_register: _release_recut
    _git_automation_request_options:
      release_tag: "{{ release_tag }}"
      release_message: "{{ release_message | default('') }}"
      branch: "{{ release_branch | default('master') }}"
      release_remote: "{{ release_remote | default('sandboxcom') }}"

- name: "Set release_recut result fact"
  ansible.builtin.set_fact:
    git_automation_release_result: "{{ _release_recut.result }}"

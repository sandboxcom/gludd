---
# ci_cancel.yml — cancel a CI run through the authenticated daemon seam.

- name: "Assert run_id"
  ansible.builtin.assert:
    that:
      - ci_run_id | string | length > 0
    fail_msg: "ci_run_id is required for ci_cancel"

- name: "Cancel CI run"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: ci_cancel
    run_id: "{{ ci_run_id }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    timeout: "{{ git_api_timeout }}"
    idempotency_key: "ci-cancel:{{ ci_run_id }}"
  register: _ci_cancel_raw
  no_log: "{{ psk | length > 0 }}"

- name: "Parse CI cancel result"
  ansible.builtin.set_fact:
    ci_cancel_result: "{{ _ci_cancel_raw.result }}"

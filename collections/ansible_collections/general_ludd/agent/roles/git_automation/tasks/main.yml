---
# SSRF/path authority remains with the existing authenticated Git owner.
- name: "Assert git_op is set"
  ansible.builtin.assert:
    that:
      - git_op | string | length > 0
    fail_msg: "git_op is required (clone|commit|gated_commit|push|merge|gated_merge|branch|worktree|batch_push|state|release_cut|release_delete|release_recut|ci_verdict|ci_cancel)"

- name: "Include the requested Git operation"
  ansible.builtin.include_tasks:
    file: "{{ git_op | regex_replace('^gated_', '') }}.yml"
    apply:
      module_defaults:
        general_ludd.agent.gludd_git: "{{ git_automation_api_options }}"
  vars:
    _git_automation_supported_ops:
      - clone
      - commit
      - gated_commit
      - ship_commit
      - push
      - merge
      - gated_merge
      - branch
      - feature_start
      - feature_done
      - rebranch_onto
      - worktree
      - batch_push
      - state
      - verify_remote
      - release_cut
      - release_delete
      - release_recut
      - ci_verdict
      - ci_cancel
  when: git_op in _git_automation_supported_ops

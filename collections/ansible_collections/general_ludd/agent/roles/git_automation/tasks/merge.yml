---
# merge.yml — merge through the guarded gludd_git module.
# A non-empty gate_cmd or git_op=gated_merge uses GitAutomation.gated_merge.

- name: "Assert merge parameters"
  ansible.builtin.assert:
    that:
      - repo_path | string | length > 0
      - merge_source | string | length > 0
      - merge_target | string | length > 0
    fail_msg: "repo_path, merge_source, and merge_target are required for merge operation"

- name: "Assert gated merge has a gate command"
  ansible.builtin.assert:
    that:
      - gate_cmd | default([]) | length > 0
    fail_msg: "gate_cmd is required when git_op=gated_merge"
  when: git_op == "gated_merge"

- name: "Merge branch through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: merge
    source: "{{ merge_source }}"
    target: "{{ merge_target }}"
    strategy: "{{ merge_strategy }}"
  register: _git_automation_merge_module
  when:
    - git_op == "merge"
    - gate_cmd | default([]) | length == 0

- name: "Gated merge branch through gludd_git"
  general_ludd.agent.gludd_git:
    path: "{{ repo_path }}"
    op: gated_merge
    source: "{{ merge_source }}"
    target: "{{ merge_target }}"
    strategy: "{{ merge_strategy }}"
    gate_cmd: "{{ gate_cmd | default([]) }}"
  register: _git_automation_gated_merge_module
  when:
    - git_op == "gated_merge" or gate_cmd | default([]) | length > 0

- name: "Set merge result fact"
  ansible.builtin.set_fact:
    git_automation_merge_result: "{{ _git_automation_merge_module.result }}"
  when:
    - _git_automation_merge_module is defined
    - not (_git_automation_merge_module.skipped | default(false))

- name: "Set gated merge result fact"
  ansible.builtin.set_fact:
    git_automation_merge_result: "{{ _git_automation_gated_merge_module.result }}"
    git_automation_gated_merge_result: "{{ _git_automation_gated_merge_module.result }}"
  when:
    - _git_automation_gated_merge_module is defined
    - not (_git_automation_gated_merge_module.skipped | default(false))

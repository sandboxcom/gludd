---
# standup_report role — yesterday/today/blockers from facts + gludd_message receive
#
# Surfaces: done[] (completed work from history), in_progress[] (active jobs),
# blockers[] (from gludd_message inbox). The mock /api/messages seeds a blocker
# message — this role surfaces it. REPORT-ONLY: never mutates the repo.

- name: Gather live daemon facts for standup
  general_ludd.agent.gludd_facts:
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: live_facts
  no_log: "{{ psk | length > 0 }}"

- name: Receive messages (to surface blockers)
  general_ludd.agent.gludd_message:
    state: receive
    recipient: "standup"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: _sd_messages
  no_log: "{{ psk | length > 0 }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Extract work/history from live facts ─────────────────────────────────────

- name: Extract work state from live facts
  ansible.builtin.set_fact:
    _sd_total_runs: "{{ live_facts.ansible_facts.gludd.history.total_runs | default(0) | int }}"
    _sd_success_rate: "{{ live_facts.ansible_facts.gludd.history.success_rate | default(0) | float }}"
    _sd_failures: "{{ live_facts.ansible_facts.gludd.history.failures | default(0) | int }}"
    _sd_in_progress_count: "{{ live_facts.ansible_facts.gludd.work.in_progress | default(0) | int }}"
    _sd_active_jobs: "{{ live_facts.ansible_facts.gludd.work.active_jobs | default(0) | int }}"
    _sd_queued: "{{ live_facts.ansible_facts.gludd.work.queued_jobs | default(0) | int }}"
    _sd_backlog: "{{ live_facts.ansible_facts.gludd.todos.backlog_size | default(0) | int }}"
    _sd_todo_items: "{{ live_facts.ansible_facts.gludd.todos['items'] | default([]) }}"

# ── Build done[] (yesterday: from history summary) ───────────────────────────

- name: Build done list from history
  ansible.builtin.set_fact:
    _sd_done:
      - "Completed {{ _sd_total_runs }} total runs with {{ (_sd_success_rate * 100) | round(1) }}% success rate"
      - "History: {{ _sd_failures }} failures recorded; {{ _sd_total_runs | int - _sd_failures | int }} succeeded"

# ── Build in_progress[] from active work ──────────────────────────────────────

- name: Build in_progress list from active jobs
  ansible.builtin.set_fact:
    _sd_in_progress:
      - "Active jobs: {{ _sd_active_jobs }} running"
      - "Queued jobs: {{ _sd_queued }}"
      - "Backlog items: {{ _sd_backlog }}"

# ── Surface blockers from gludd_message inbox ────────────────────────────────

- name: Extract blocker messages from inbox (any topic=standup or status=unread)
  ansible.builtin.set_fact:
    _sd_inbox_messages: >-
      {{
        _sd_messages.ansible_facts.gludd_inbox | default([])
      }}

- name: Build blockers list from messages
  ansible.builtin.set_fact:
    _sd_blockers: >-
      {%- set blockers = [] -%}
      {%- for msg in _sd_inbox_messages -%}
        {%- set _ = blockers.append({
          'id': msg.id | default('unknown'),
          'sender': msg.sender | default('unknown'),
          'topic': msg.topic | default(''),
          'status': msg.status | default('unread'),
          'blocker': 'Message from ' ~ msg.sender | default('unknown') ~ ' on topic: ' ~ msg.topic | default('general')
        }) -%}
      {%- endfor -%}
      {{ blockers }}

- name: Set no-blocker message when inbox is empty
  ansible.builtin.set_fact:
    _sd_blockers:
      - "No blockers reported in message inbox"
  when: _sd_blockers | length == 0

# ── Write artifacts ───────────────────────────────────────────────────────────

- name: Write JSON standup artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'standup_report',
        'status': 'completed',
        'done': _sd_done,
        'in_progress': _sd_in_progress,
        'blockers': _sd_blockers,
        'history': {
          'total_runs': _sd_total_runs | int,
          'success_rate': _sd_success_rate | float,
          'failures': _sd_failures | int
        },
        'message_count': _sd_inbox_messages | length
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/standup_report.json"
    mode: "0644"

- name: Write markdown standup artifact
  ansible.builtin.copy:
    content: |
      # Standup Report

      ## Yesterday (Done)

      {% for item in _sd_done %}
      - {{ item }}
      {% endfor %}

      ## Today (In Progress)

      {% for item in _sd_in_progress %}
      - {{ item }}
      {% endfor %}

      ## Blockers

      {% for item in _sd_blockers %}
      - {{ item if item is string else item.blocker | default(item | string) }}
      {% endfor %}

      ---
      *Generated by general_ludd.agent.standup_report — report-only.*
    dest: "{{ artifact_dir }}/standup_report.md"
    mode: "0644"

- name: Report standup completion
  ansible.builtin.debug:
    msg: >-
      Standup report: done={{ _sd_done | length }}
      in_progress={{ _sd_in_progress | length }}
      blockers={{ _sd_blockers | length }}
      messages={{ _sd_inbox_messages | length }}

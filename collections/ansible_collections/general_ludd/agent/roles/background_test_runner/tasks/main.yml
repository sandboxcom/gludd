---
# background_test_runner role — launch a long test in the background and poll
#
# Ports .opencode/skills/background-test-runner/SKILL.md to a gludd role.
# The opencode skill wraps `make test-bg` / `make test-bg-runner ACTION=status` /
# `make test-bg-runner ACTION=poll-all` / `make test-bg-runner ACTION=kill` so a long test never blocks the
# subagent pool. This role codifies the same workflow for a gludd daemon agent:
#
#   state=launch  → start the test in background, then poll until terminal
#   state=status  → one-shot status probe (non-blocking)
#   state=kill    → terminate a running background test
#
# REPORT-ONLY: never mutates source. Writes a status artifact.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── state=status: one-shot probe ──────────────────────────────────────────────

- name: Probe background test status (state=status)
  ansible.builtin.command:
    cmd: "make test-bg-runner ACTION=status TESTFILE={{ testfile }}"
  register: _btr_status_raw
  changed_when: false
  failed_when: false
  when: state == 'status'

- name: Record status-only result
  ansible.builtin.set_fact:
    _btr_final_status: "{{ _btr_status_raw.stdout | default('') }}"
    _btr_final_rc: "{{ _btr_status_raw.rc | default(0) }}"
  when: state == 'status'

# ── state=kill: terminate a running test ─────────────────────────────────────

- name: Kill background test (state=kill)
  ansible.builtin.command:
    cmd: "make test-bg-runner ACTION=kill TESTFILE={{ testfile }}"
  register: _btr_kill_raw
  changed_when: false
  failed_when: false
  when: state == 'kill'

- name: Record kill result
  ansible.builtin.set_fact:
    _btr_final_status: "{{ _btr_kill_raw.stdout | default('killed') }}"
    _btr_final_rc: "{{ _btr_kill_raw.rc | default(0) }}"
  when: state == 'kill'

# ── state=launch: start test in background, then poll ─────────────────────────

- name: Launch test in background (state=launch)
  ansible.builtin.command:
    cmd: "make test-bg TESTFILE={{ testfile }}"
  register: _btr_launch_raw
  changed_when: true
  when: state == 'launch'

- name: Poll background test until terminal or timeout (state=launch)
  ansible.builtin.shell:
    cmd: >-
      for i in $(seq 1 {{ poll_max_iterations }});
      do
        echo "=== poll iteration $i ===";
        make test-bg-runner ACTION=status TESTFILE={{ testfile }} 2>&1;
        if make test-bg-runner ACTION=status TESTFILE={{ testfile }} 2>&1 | grep -qiE '^(PASS|FAIL|FINISHED|ERROR)'; then
          echo "TERMINAL";
          break;
        fi;
        sleep {{ poll_interval_seconds }};
      done;
      echo "=== final status ===";
      make test-bg-runner ACTION=status TESTFILE={{ testfile }} 2>&1
  args:
    executable: /bin/bash
  register: _btr_poll_raw
  changed_when: false
  when: state == 'launch'

- name: Record launch result
  ansible.builtin.set_fact:
    _btr_final_status: "{{ _btr_poll_raw.stdout | default('') }}"
    _btr_final_rc: "{{ _btr_poll_raw.rc | default(0) }}"
  when: state == 'launch'

# ── Determine verdict ─────────────────────────────────────────────────────────

- name: Determine test verdict from output
  ansible.builtin.set_fact:
    _btr_verdict: >-
      {{
        'pass' if (_btr_final_status | regex_search('(?i)\\bPASS\\b'))
        else ('fail' if (_btr_final_status | regex_search('(?i)\\bFAIL\\b'))
        else ('timeout' if (_btr_final_status | regex_search('(?i)poll iteration ' ~ poll_max_iterations))
        else 'unknown'))
      }}

# ── Write artifacts ───────────────────────────────────────────────────────────

- name: Write JSON background-test-runner artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'background_test_runner',
        'status': 'completed',
        'state': state,
        'testfile': testfile,
        'poll_interval_seconds': poll_interval_seconds | int,
        'poll_max_iterations': poll_max_iterations | int,
        'verdict': _btr_verdict,
        'raw_output': _btr_final_status
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/background_test_runner.json"
    mode: "0644"

- name: Write markdown background-test-runner report
  ansible.builtin.copy:
    content: |
      # Background Test Runner Report

      **Test file:** `{{ testfile }}`
      **State:** {{ state }}
      **Verdict:** {{ _btr_verdict | upper }}

      ## Configuration

      - Poll interval: {{ poll_interval_seconds }}s
      - Max iterations: {{ poll_max_iterations }}

      ## Output

      ```
      {{ _btr_final_status }}

      ```

      ## Policy

      Never run a test that takes >30s in the foreground — it blocks ALL
      subagent dispatch. Use this role (or `make test-bg`) to keep the pool
      full while tests execute. Poll from a subagent, never the main thread.

      ---
      *Generated by general_ludd.agent.background_test_runner*
    dest: "{{ artifact_dir }}/background_test_runner.md"
    mode: "0644"

- name: Report background test runner completion
  ansible.builtin.debug:
    msg: >-
      Background test runner complete: state={{ state }}
      testfile={{ testfile }} verdict={{ _btr_verdict }}

# ── Gate: fail the play when the test itself failed (launch state only) ───────

- name: Fail when launched test reported FAIL
  ansible.builtin.fail:
    msg: >-
      Background test FAILED: {{ testfile }}.
      See {{ artifact_dir }}/background_test_runner.md for full output.
  when:
    - state == 'launch'
    - _btr_verdict == 'fail'
    - fail_on_test_failure | bool

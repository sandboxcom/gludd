---
galaxy_info:
  role_name: feature_gap_auditor
  author: Agentic Harness Agent
  description: >
    Diffs intended features (from docs/specs) vs implemented features.
    Reads spec_paths for feature lines (lines starting with - or *).
    Reads impl_inventory_path for implemented feature names.
    Model call gated behind enable_model_call:false.
    NEVER mutates the repo.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

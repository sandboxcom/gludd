---
# ASN.1 and OID operations
# Parse ASN.1 DER to human-readable form, generate OIDs under gludd's arc,
# look up known OIDs by description, validate ASN.1 structure.

# ── Parse ASN.1 DER ──
- name: Parse ASN.1 DER file to human-readable form
  ansible.builtin.command:
    cmd: openssl asn1parse -in {{ ssl_cert_asn1_file | default(ssl_cert_cert_path) }} -inform DER
  register: asn1_parse_result
  changed_when: false
  failed_when: false
  when: ssl_cert_parse_asn1 | default(false) | bool
  tags: [asn1, parse]

- name: Parse ASN.1 with detailed offsets
  ansible.builtin.command:
    cmd: openssl asn1parse -in {{ ssl_cert_asn1_file | default(ssl_cert_cert_path) }} -inform DER -i
  register: asn1_parse_detailed
  changed_when: false
  failed_when: false
  when: ssl_cert_parse_asn1 | default(false) | bool
  tags: [asn1, parse]

- name: Report ASN.1 structure
  ansible.builtin.debug:
    msg:
      - "=== ASN.1 Structure ({{ ssl_cert_asn1_file | default(ssl_cert_cert_path) }}) ==="
      - "{{ asn1_parse_detailed.stdout_lines }}"
  when: asn1_parse_detailed is not skipped and asn1_parse_detailed.stdout | length > 0
  tags: [asn1, debug]

# ── OID reference database ──
- name: Load OID reference database
  ansible.builtin.set_fact:
    oid_database:
      # ── Algorithm OIDs ──
      "1.2.840.113549.1.1.1":    "rsaEncryption (PKCS#1)"
      "1.2.840.113549.1.1.5":    "sha1WithRSAEncryption"
      "1.2.840.113549.1.1.11":   "sha256WithRSAEncryption"
      "1.2.840.113549.1.1.12":   "sha384WithRSAEncryption"
      "1.2.840.113549.1.1.13":   "sha512WithRSAEncryption"
      "1.2.840.10045.2.1":       "ecPublicKey"
      "1.2.840.10045.3.1.7":     "secp256r1 (NIST P-256)"
      "1.3.132.0.34":            "secp384r1 (NIST P-384)"
      "1.3.132.0.35":            "secp521r1 (NIST P-521)"
      "1.3.101.112":             "Ed25519"
      "1.3.101.113":             "Ed448"
      "1.2.840.113549.1.9.1":    "emailAddress"
      "2.5.4.3":                 "commonName (CN)"
      "2.5.4.6":                 "countryName (C)"
      "2.5.4.7":                 "localityName (L)"
      "2.5.4.8":                 "stateOrProvinceName (ST)"
      "2.5.4.10":                "organizationName (O)"
      "2.5.4.11":                "organizationalUnitName (OU)"
      "2.5.29.14":               "subjectKeyIdentifier"
      "2.5.29.15":               "keyUsage"
      "2.5.29.17":               "subjectAltName (SAN)"
      "2.5.29.18":               "issuerAltName (IAN)"
      "2.5.29.19":               "basicConstraints"
      "2.5.29.31":               "cRLDistributionPoints"
      "2.5.29.32":               "certificatePolicies"
      "2.5.29.35":               "authorityKeyIdentifier"
      "2.5.29.37":               "extKeyUsage"
      "1.3.6.1.5.5.7.3.1":      "serverAuth"
      "1.3.6.1.5.5.7.3.2":      "clientAuth"
      "1.3.6.1.5.5.7.3.3":      "codeSigning"
      "1.3.6.1.5.5.7.3.4":      "emailProtection"
      "1.3.6.1.5.5.7.3.8":      "timeStamping"
      "1.3.6.1.5.5.7.3.9":      "OCSPSigning"
      "1.3.6.1.5.5.7.48.1":     "OCSP"
      "1.3.6.1.5.5.7.48.1.1":   "OCSP basic"
      "1.3.6.1.5.5.7.48.2":     "caIssuers"
      "1.3.6.1.4.1.11129.2.4.2": "SCT list (Certificate Transparency)"
      "2.23.140.1.2.2":          "organizationIdentifier (CA/B Forum)"
      "1.3.6.1.5.5.7.1.1":      "Authority Information Access (AIA)"
      "1.3.6.1.5.5.7.1.24":     "TLS Feature"
      "2.5.29.46":               "freshestCRL"
      "2.5.29.30":               "nameConstraints"
      "2.5.29.37.0":             "anyExtendedKeyUsage"
      "1.3.6.1.5.5.7.3.5":      "ipsecEndSystem"
      "1.3.6.1.5.5.7.3.6":      "ipsecTunnel"
      "1.3.6.1.5.5.7.3.7":      "ipsecUser"
  tags: [oid, docs]

# ── Look up OIDs from parsed cert ──
- name: Map parsed OIDs to descriptions
  ansible.builtin.set_fact:
    oid_mappings: >-
      {%- set mappings = [] -%}
      {%- for line in (asn1_parse_result.stdout_lines | default([])) -%}
      {%- for oid_val, name in oid_database.items() -%}
      {%- if oid_val in line -%}
      {%- set _ = mappings.append(line + '  →  ' + name) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ mappings | unique }}
  when: asn1_parse_result is not skipped
  tags: [oid, lookup]

- name: Report OID mappings
  ansible.builtin.debug:
    msg:
      - "=== OID Mappings ==="
      - "{{ oid_mappings }}"
  when: oid_mappings | default([]) | length > 0
  tags: [oid, debug]

# ── Generate OID under gludd's arc ──
- name: Generate new OID for organization
  ansible.builtin.set_fact:
    generated_oid: "1.3.6.1.4.1.{{ ssl_cert_oid_pen | default('not-registered') }}.{{ ssl_cert_oid_suffix | default('1') }}"
  when: ssl_cert_generate_oid | default(false) | bool
  tags: [oid, generate]

- name: Show generated OID
  ansible.builtin.debug:
    msg:
      - "Generated OID: {{ generated_oid }}"
      - "Gludd PEN (Private Enterprise Number): {{ ssl_cert_oid_pen | default('unregistered — register at https://pen.iana.org/') }}"
      - "OID arc: 1.3.6.1.4.1.{{ ssl_cert_oid_pen }}"
  when: ssl_cert_generate_oid | default(false) | bool
  tags: [oid]

# ── Validate ASN.1 structure ──
- name: Validate ASN.1 structure
  ansible.builtin.command:
    cmd: openssl asn1parse -in {{ ssl_cert_asn1_file | default(ssl_cert_cert_path) }} -inform DER -strictpem -noout
  register: asn1_validate
  changed_when: false
  failed_when: false
  when: ssl_cert_parse_asn1 | default(false) | bool
  tags: [asn1, validate]

- name: Report ASN.1 validation result
  ansible.builtin.debug:
    msg: "ASN.1 validation: {{ 'VALID' if asn1_validate.rc == 0 else 'STRUCTURE ERROR: ' + asn1_validate.stderr }}"
  when: asn1_validate is not skipped
  tags: [asn1, validate]

# ── Write ASN.1 analysis artifact ──
- name: Write ASN.1 analysis artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'file': ssl_cert_asn1_file | default(ssl_cert_cert_path),
        'structure_valid': asn1_validate.rc == 0 if asn1_validate is not skipped else 'not checked',
        'oid_mappings': oid_mappings | default([]),
        'generated_oid': generated_oid | default('N/A'),
        'struct_lines': asn1_parse_detailed.stdout_lines | default([]),
        'timestamp': ansible_date_time.iso8601
      } | to_nice_json }}
    dest: "{{ ssl_cert_artifact_dir }}/asn1-analysis.json"
    mode: "0644"
  tags: [artifact]

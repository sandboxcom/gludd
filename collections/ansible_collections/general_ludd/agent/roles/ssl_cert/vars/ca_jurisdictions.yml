---
# CA jurisdiction database — major Certificate Authorities, their parent
# companies, jurisdiction country, applicable laws, and ownership chains.
# Query model: ca_jurisdictions[ca_id][field]
# For cross-referencing with algorithmic sovereignty concerns.

ca_jurisdictions:
  letsencrypt:
    display: "Let's Encrypt"
    parent_company: "Internet Security Research Group (ISRG)"
    jurisdiction_country: US
    jurisdiction_code: US-CA
    applicable_laws:
      - US Federal law
      - California state law
      - CLOUD Act
      - FISA
      - Patriot Act
    ownership_chain:
      - "Internet Security Research Group (ISRG) — 501(c)(3) nonprofit"
    established: 2014
    root_program: "Mozilla, Apple, Google, Microsoft"
    notes: "Nonprofit; no commercial parent; transparent via Certificate Transparency"

  digicert:
    display: "DigiCert"
    parent_company: "Clearlake Capital (majority), TA Associates, DigiCert management"

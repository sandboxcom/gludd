---
# Compliance profiles — structured data for regulatory/industry requirements.
# Query model: compliance_profiles[profile][field]
# Each profile defines approved/forbidden algorithms, minimum key sizes,
# required hash functions, max certificate lifetime, and key storage rules.

compliance_profiles:
  fips140:
    display: "FIPS 140-2 / 140-3"
    description: "NIST Cryptographic Module Validation Program"
    version: "140-3 (2022)"
    approved_algorithms:
      - rsa-2048
      - rsa-3072
      - rsa-4096
      - ecdsa-p256
      - ecdsa-p384
      - ecdsa-p521
      - ed25519
      - ecdh-p256
      - ecdh-p384
      - ecdh-p521
    forbidden_algorithms:
      - rsa-1024
      - rsa-512
      - dsa
      - ecdsa-p224
      - sha1
      - md5
      - rc4
      - des
      - 3des
    minimum_rsa_key_size: 2048
    minimum_ec_key_size: 256
    required_hash: sha256
    approved_hashes:
      - sha256
      - sha384
      - sha512
    max_cert_lifetime_days: 365
    key_storage: "FIPS 140-2 Level 2 or higher validated module"
    rng_requirement: "NIST SP 800-90A compliant DRBG"
    reference: "https://csrc.nist.gov/publications/detail/fips/140/3/final"

  soc2:
    display: "SOC 2 Type II"
    description: "AICPA Trust Services Criteria — Security"
    version: "2022"
    approved_algorithms:
      - rsa-2048
      - rsa-3072
      - rsa-4096
      - ecdsa-p256
      - ecdsa-p384
      - ecdsa-p521
      - ed25519
    forbidden_algorithms:
      - rsa-1024
      - sha1
      - md5
      - des
      - 3des
    minimum_rsa_key_size: 2048
    minimum_ec_key_size: 256
    required_hash: sha256
    approved_hashes:
      - sha256
      - sha384
      - sha512
    max_cert_lifetime_days: 398
    key_storage: "Access-controlled HSM or encrypted storage with MFA"
    rng_requirement: "CSPRNG"
    reference: "https://www.aicpa-cima.com/topic/audit-assurance/soc-2-report"

  hipaa:
    display: "HIPAA Security Rule"
    description: "Health Insurance Portability and Accountability Act encryption requirements"
    version: "2013 Omnibus Rule"
    approved_algorithms:
      - rsa-2048
      - rsa-3072
      - rsa-4096
      - ecdsa-p256
      - ecdsa-p384
      - ecdsa-p521
      - ed25519
    forbidden_algorithms:
      - rsa-1024
      - sha1
      - md5
      - des
      - 3des
      - rc4
    minimum_rsa_key_size: 2048
    minimum_ec_key_size: 256
    required_hash: sha256
    approved_hashes:
      - sha256
      - sha384
      - sha512
    max_cert_lifetime_days: 398
    key_storage: "Encrypted at rest, access logged and audited"
    rng_requirement: "CSPRNG"
    reference: "https://www.hhs.gov/hipaa/for-professionals/security/guidance/index.html"

  pcidss:
    display: "PCI DSS v4.0"
    description: "Payment Card Industry Data Security Standard"
    version: "4.0 (2024 deadline)"
    approved_algorithms:
      - rsa-2048
      - rsa-3072
      - rsa-4096
      - ecdsa-p256
      - ecdsa-p384
      - ecdsa-p521
      - ed25519
    forbidden_algorithms:
      - rsa-1024
      - sha1
      - md5
      - des
      - 3des
      - rc4
      - tls10
      - tls11
    minimum_rsa_key_size: 2048
    minimum_ec_key_size: 256
    required_hash: sha256
    approved_hashes:
      - sha256
      - sha384
      - sha512
    max_cert_lifetime_days: 398
    key_storage: "HSM or equivalent key protection; access logged"
    rng_requirement: "CSPRNG per NIST SP 800-90A"
    tls_minimum: "TLS 1.2"
    reference: "https://www.pcisecuritystandards.org/document_library/"

  nist_sp800_131a:
    display: "NIST SP 800-131A Rev 2"
    description: "Transitioning the Use of Cryptographic Algorithms and Key Lengths"
    version: "Rev 2 (2019)"
    approved_algorithms:
      - rsa-2048
      - rsa-3072
      - rsa-4096
      - ecdsa-p256
      - ecdsa-p384
      - ecdsa-p521
      - ed25519
    forbidden_algorithms:
      - rsa-1024
      - sha1
      - md5
      - des
      - 3des
      - ecdsa-p192
      - dsa-lt-2048
    minimum_rsa_key_size: 2048
    minimum_ec_key_size: 256
    required_hash: sha256
    approved_hashes:
      - sha256
      - sha384
      - sha512
    max_cert_lifetime_days: 398
    key_storage: "NIST SP 800-57 Part 1 key management"
    reference: "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"

  cabf_baseline:
    display: "CA/Browser Forum Baseline Requirements"
    description: "Baseline Requirements for publicly-trusted TLS certificates"
    version: "2.0.0 (2023)"
    approved_algorithms:
      - rsa-2048
      - rsa-3072
      - rsa-4096
      - ecdsa-p256
      - ecdsa-p384
      - ecdsa-p521
      - ed25519
      - ed448
    forbidden_algorithms:
      - rsa-below-2048
      - sha1
      - md5
    minimum_rsa_key_size: 2048
    minimum_ec_key_size: 256
    required_hash: sha256
    approved_hashes:
      - sha256
      - sha384
      - sha512
    max_cert_lifetime_days: 398
    key_storage: "CA private keys in FIPS 140-2 Level 3 or equivalent"
    reference: "https://cabforum.org/baseline-requirements-documents/"

---
# networking role — network knowledge, packet analysis, scanning, dissectors
#
# Modes (set via networking__mode):
#   lookup              — display fundamentals, wireless, infrastructure, tools data
#   pcap_read           — read and analyze a pcap file via gludd_scapy module
#   packet_craft        — craft and optionally send packets via gludd_scapy module
#   network_scan        — scan targets via gludd_scapy module
#   traffic_analyze     — traffic analysis and reporting via gludd_scapy module
#   dissector_create    — generate Wireshark dissector code from specification
#   tool_recommend      — recommend diagnostic tools for a given scenario
#
# MUTATING MODES: packet_craft, network_scan (send packets / probe targets).
# All other modes are read-only (no side effects on the network or system).

- name: Create networking artifact directory
  ansible.builtin.file:
    path: "{{ networking__artifact_dir | default('/tmp/gludd-networking') }}"
    state: directory
    mode: "0755"

- name: Set default artifact dir fact
  ansible.builtin.set_fact:
    networking__artifact_dir: "{{ networking__artifact_dir | default('/tmp/gludd-networking') }}"

# ── Mode dispatch ──────────────────────────────────────────────────────────────

- name: Lookup mode — display fundamentals, wireless, infrastructure, tools
  ansible.builtin.debug:
    msg: >
      networking role in LOOKUP mode.
      Available data: OSI model, TCP/IP stack, subnetting, TCP state machine,
      DNS resolution (fundamentals.yml) | Wi-Fi, Bluetooth, AREDN, LoRa,
      Zigbee, Z-Wave, Thread, Matter, cellular (wireless.yml) | BGP, PKI,
      DNS infrastructure, IXPs, CDNs, RIRs (internet_infrastructure.yml) |
      tshark, tcpdump, zeek, nmap, hping3, tc, iperf3, dig, mtr, curl, ssl
      (tools.yml). Set networking__mode to another value for operations.
      PSK: '{{ networking__psk[:1] if networking__psk | length > 0 else '(unset)' }}***'
  when: networking__mode | default('lookup') == 'lookup'
  no_log: "{{ networking__psk | length > 0 }}"

- name: PCAP read mode
  ansible.builtin.include_tasks: pcap_read.yml
  when: networking__mode | default('') == 'pcap_read'

- name: Packet craft mode
  ansible.builtin.include_tasks: packet_craft.yml
  when: networking__mode | default('') == 'packet_craft'

- name: Network scan mode
  ansible.builtin.include_tasks: network_scan.yml
  when: networking__mode | default('') == 'network_scan'

- name: Traffic analyze mode
  ansible.builtin.include_tasks: traffic_analyze.yml
  when: networking__mode | default('') == 'traffic_analyze'

- name: Dissector create mode
  ansible.builtin.include_tasks: dissector_create.yml
  when: networking__mode | default('') == 'dissector_create'

- name: Tool recommend mode
  ansible.builtin.include_tasks: tool_recommend.yml
  when: networking__mode | default('') == 'tool_recommend'

- name: Print available modes (no valid mode selected)
  ansible.builtin.debug:
    msg: >
      No valid networking__mode selected. Available modes:
      lookup, pcap_read, packet_craft, network_scan, traffic_analyze,
      dissector_create, tool_recommend.
      Set networking__mode to one of these values.
  when: networking__mode | default('') not in ['lookup', 'pcap_read', 'packet_craft', 'network_scan', 'traffic_analyze', 'dissector_create', 'tool_recommend']

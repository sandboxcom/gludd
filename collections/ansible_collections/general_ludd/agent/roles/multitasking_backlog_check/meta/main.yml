---
galaxy_info:
  role_name: multitasking_backlog_check
  author: Agentic Harness Agent
  description: >
    Inspects the gludd multitasking backlog JSON file. Supports --open-count,
    --list-open, and --assert-done with anti-rubber-stamp enforcement (done
    items with empty evidence are treated as open). Wraps
    scripts/multitasking_backlog_check.py.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

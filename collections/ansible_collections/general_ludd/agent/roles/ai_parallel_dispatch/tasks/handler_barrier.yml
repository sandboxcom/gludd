---
# handler_barrier.yml — the handler + `meta: flush_handlers` join variant.
#
# Flow:
#   1. Reset the promise ledger file.
#   2. A loop of dispatching tasks each NOTIFY the "apd dispatch" handler group
#      (changed_when: true forces the notify). Notifications are QUEUED, not run.
#   3. `meta: flush_handlers` is the explicit BARRIER: it drains every queued
#      handler now — each one launches its model call async (poll:0) and appends
#      its job id to the ledger.
#   4. After the barrier, read the ledger and async_status-join the recorded job
#      ids (same await mechanics as the primary path).
#
# See handlers/main.yml header for why this is weaker than tasks/main.yml for
# result collection (no required-subset early return, no concurrency cap — flush
# drains ALL notified handlers, sequentially). This variant exists because the
# handler/flush_handlers approach was explicitly requested; the async path in
# tasks/main.yml is the recommended default for real fan-out.

- name: Reset handler promise ledger
  ansible.builtin.copy:
    content: ""
    dest: "{{ artifact_dir }}/handler_promises.jsonl"
    mode: "0644"

- name: Notify a dispatch handler per call (queued, not yet run)
  ansible.builtin.debug:
    msg: "queued dispatch for {{ apd_handler_call.name }}"
  changed_when: true
  notify: "apd dispatch"
  loop: "{{ dispatch_calls }}"
  loop_control:
    loop_var: apd_handler_call
    label: "{{ apd_handler_call.name }}"

# THE JOIN: flush_handlers runs every queued handler now, in notify order. Each
# handler fires its async model call + records the job id. flush_handlers itself
# blocks until all notified handlers have RUN (i.e. been launched), so this is a
# real barrier over the dispatch step.
- name: Flush handlers — barrier that drains all queued dispatches
  ansible.builtin.meta: flush_handlers

# Re-join the launched promises after the flush barrier (handlers launched them
# async; we now await completion exactly like the primary path).
- name: Load handler promise ledger
  ansible.builtin.slurp:
    src: "{{ artifact_dir }}/handler_promises.jsonl"
  register: _apd_h_raw

- name: Parse promise ledger into job-id list
  ansible.builtin.set_fact:
    _apd_h_promises: >-
      {{ (_apd_h_raw.content | b64decode).splitlines()
         | select('match', '^\\s*\\{') | map('from_json') | list }}

- name: Barrier-join handler-launched promises
  ansible.builtin.async_status:
    jid: "{{ _apd_h_item.jid }}"
  loop: "{{ _apd_h_promises }}"
  loop_control:
    loop_var: _apd_h_item
    label: "{{ _apd_h_item.name }} ({{ _apd_h_item.jid }})"
  register: _apd_h_poll
  until: _apd_h_poll.finished is defined and _apd_h_poll.finished
  retries: "{{ barrier_retries | int }}"
  delay: "{{ barrier_delay | int }}"
  failed_when: false
  no_log: "{{ psk | length > 0 }}"

- name: Fold handler results into the shared results dict
  ansible.builtin.set_fact:
    _apd_results: >-
      {{ _apd_results | default({}) | combine({
           item.item.name: {
             'text': (item.text | default('')),
             'model_profile_id': (item.model_profile_id | default('')),
             'usage': (item.usage | default({})),
             'via': 'handler',
             'finished': (item.finished | default(false) | bool)
           }
         }) }}
  loop: "{{ _apd_h_poll.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.finished is defined
    - item.finished | bool
    - not (item.failed | default(false) | bool)
  no_log: "{{ psk | length > 0 }}"

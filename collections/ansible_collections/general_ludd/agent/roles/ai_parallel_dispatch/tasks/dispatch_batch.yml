---
# dispatch_batch.yml — fan out ONE concurrency-capped batch then barrier-join it.
# Included once per slice of <= max_in_flight calls. _apd_batch is the slice.

# 1) FAN OUT: launch every call in this batch async + poll:0. Each returns an
#    ansible_job_id immediately (the promise). register accumulates results
#    across the loop in _apd_launch.results (one entry per call, same order).
- name: "Launch batch {{ _apd_batch_idx }} async (poll:0 -> ajob ids)"
  general_ludd.agent.gludd_model_call:
    prompt: "{{ _apd_call.prompt }}"
    model_profile: "{{ _apd_call.model_profile | default(omit) }}"
    route_task_type: "{{ _apd_call.route_task_type | default(omit) }}"
    max_tokens: "{{ _apd_call.max_tokens | default(dispatch_max_tokens) }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    timeout: "{{ call_request_timeout | int }}"
  async: "{{ async_timeout | int }}"
  poll: 0
  loop: "{{ _apd_batch }}"
  loop_control:
    loop_var: _apd_call
    label: "{{ _apd_call.name }}"
  register: _apd_launch
  no_log: "{{ psk | length > 0 }}"

# 2) Pair each launched promise with its call spec (name + required flag) so the
#    barrier knows which job ids are REQUIRED vs best-effort optional.
#    zip yields [[launch_result, call_spec], ...]; we index '0'/'1' below.
- name: "Build promise table for batch {{ _apd_batch_idx }}"
  ansible.builtin.set_fact:
    _apd_promises: "{{ _apd_launch.results | zip(_apd_batch) | list }}"

- name: "Identify required job ids in batch {{ _apd_batch_idx }}"
  ansible.builtin.set_fact:
    _apd_required_jids: >-
      {{ _apd_promises
         | selectattr('1.name', 'in', _apd_required_names)
         | map(attribute='0.ansible_job_id') | list }}
    _apd_all_jids: >-
      {{ _apd_promises | map(attribute='0.ansible_job_id') | list }}
    # name lookup keyed by job id, so each sweep can re-key async_status results
    # back to the call name without re-zipping (sweep order == _apd_all_jids order).
    _apd_jid_name: >-
      {{ dict(_apd_promises | map(attribute='0.ansible_job_id') | zip(_apd_promises | map(attribute='1.name'))) }}

# Which job ids must the barrier wait for, per join_policy?
#   all      -> every job id in the batch must finish.
#   required -> only the required job ids in this batch must finish.
#   any      -> satisfied as soon as ANY ONE job in the batch finishes.
- name: "Select barrier wait-set for batch {{ _apd_batch_idx }}"
  ansible.builtin.set_fact:
    _apd_wait_jids: >-
      {{ _apd_required_jids if join_policy == 'required' else _apd_all_jids }}

# 3) BARRIER (the await). CORRECTNESS NOTE — why this is NOT a single looped
#    async_status with `until`:
#      An `until` on a LOOPED task is evaluated PER ITEM against that item's own
#      registered result, with `retries` applied PER ITEM. The aggregate
#      `.results` list is only assembled AFTER the whole loop ends, so an `until`
#      that references the aggregate is ALWAYS stale/undefined during evaluation
#      (the bug this file used to have). Worse, per-item retries multiply the
#      worst-case wall-clock to len(batch)*retries*delay, blowing the timeout
#      budget the main.yml assert tries to guarantee.
#
#    Instead we drive an OUTER retry loop (loop over a retry-index range) that
#    runs ONE non-retrying async_status sweep per pass (barrier_sweep.yml). After
#    each sweep we (a) harvest newly-finished jobs and (b) recompute a single
#    boolean fact `_apd_barrier_done` over the WAIT-SET. Every later pass is
#    skipped (`when: not _apd_barrier_done`), and a `delay` pause separates passes
#    that still need to wait. Total wall-clock per batch is therefore bounded by
#    barrier_retries * barrier_delay REGARDLESS of batch size — the budget the
#    main.yml sum-over-batches assert assumes actually holds.
- name: "Init barrier state for batch {{ _apd_batch_idx }}"
  ansible.builtin.set_fact:
    _apd_barrier_done: "{{ (_apd_wait_jids | length) == 0 }}"

- name: "Barrier-join batch {{ _apd_batch_idx }} (await wait-set, early-return)"
  ansible.builtin.include_tasks: barrier_sweep.yml
  loop: "{{ range(0, (barrier_retries | int) + 1) | list }}"
  loop_control:
    loop_var: _apd_sweep_idx
    label: "sweep {{ _apd_sweep_idx }}/{{ barrier_retries }}"
  when: not _apd_barrier_done

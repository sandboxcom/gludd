---
# ai_parallel_dispatch — PRIMARY mechanism: Ansible NATIVE async fan-out + barrier.
#
# Promise model:
#   * Each gludd_model_call task launched with `async: <t>` + `poll: 0` returns
#     IMMEDIATELY with an ansible_job_id — that id is the PROMISE.
#   * The async_status barrier (until/retries/delay) is the AWAIT: it polls every
#     promise's job file (~/.ansible_async) until it is `finished`.
#
# Why batched (NOT one unbounded loop of poll:0):
#   The daemon gateway's budget cap is TOCTOU (check_budget then record_spend is
#   not atomic; the generation path passes no estimated_cost), so an unbounded
#   burst can blow the budget. We therefore launch at most `max_in_flight`
#   promises, barrier-join that slice, then launch the next slice. Concurrency is
#   hard-capped at max_in_flight regardless of len(dispatch_calls).
#
# Timeout budget (must fit inside GLUDD_PLAYBOOK_TIMEOUT, default 300s):
#   per call:  async: {{ async_timeout }}   (>= call_request_timeout)
#   per batch wall-clock: max(barrier_retries*barrier_delay, async_timeout)
#     — a launched async job keeps running up to async_timeout INDEPENDENT of how
#       long we poll, so the per-batch cost is the LARGER of the two, not just the
#       polling window. The barrier window must also be >= async_timeout, else we
#       abandon a promise that could still finish (see the assert below).
#   With defaults: async 120s, barrier window 120s -> 120s/batch; ceil(N/IF)
#   batches run sequentially, all under 300s.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Validate dispatch inputs
  ansible.builtin.assert:
    that:
      - dispatch_calls | length > 0
      - dispatch_calls | map(attribute='name') | list | unique | length == dispatch_calls | length
      - async_timeout | int >= call_request_timeout | int
      - ((barrier_retries | int) * (barrier_delay | float)) < (playbook_timeout | int)
      - async_timeout | int < (playbook_timeout | int)
      - join_policy in ['all', 'required', 'any']
      # NO PREMATURE ABANDONMENT: the barrier polling window must be at least as
      # long as the async job budget, else a promise that runs 121-150s is dropped
      # by the harvest even though it could still finish. Make the await actually
      # wait up to the async budget it launched.
      - ((barrier_retries | int) * (barrier_delay | float)) >= (async_timeout | int)
      # SUM-OVER-BATCHES budget: batches run SEQUENTIALLY. Per-batch wall-clock is
      # max(barrier_retries*barrier_delay, async_timeout) — a launched async job
      # keeps running up to async_timeout REGARDLESS of how long we poll, so the
      # per-batch cost is the LARGER of the polling window and the async budget,
      # not just the polling window. (With the >= constraint above the two are
      # equal-or-window-bigger, so max == window, but we encode max() to stay
      # correct even if an operator overrides the defaults.) The OUTER retry loop
      # in dispatch_batch.yml makes the retry budget PER-BATCH (not per-item), so
      # this product is the true bound. Prove it fits inside GLUDD_PLAYBOOK_TIMEOUT.
      - >-
        ((((dispatch_calls | length) + (max_in_flight | int) - 1) // (max_in_flight | int))
         * ([((barrier_retries | int) * (barrier_delay | float)) | int, async_timeout | int] | max))
        < (playbook_timeout | int)
    fail_msg: >-
      ai_parallel_dispatch inputs invalid: need >=1 call, unique names, a valid
      join_policy, async_timeout >= call_request_timeout, async_timeout under
      GLUDD_PLAYBOOK_TIMEOUT, barrier window (barrier_retries*barrier_delay) BOTH
      >= async_timeout (so promises aren't abandoned early) AND under
      GLUDD_PLAYBOOK_TIMEOUT, AND ceil(N/max_in_flight) sequential batches *
      max(barrier_window, async_timeout) under GLUDD_PLAYBOOK_TIMEOUT
      ({{ playbook_timeout }}s) — else the fork-child group gets SIGKILLed
      mid-run. Lower async_timeout/barrier_retries/delay or raise max_in_flight
      (fewer batches).

# Resolve the REQUIRED set up front (fail-closed: 'required' policy with no
# call flagged required:true means EVERY call is required).
- name: Compute required call-name set for the join
  ansible.builtin.set_fact:
    _apd_required_names: >-
      {{ (dispatch_calls | selectattr('required', 'defined') | selectattr('required') | map(attribute='name') | list)
         if (join_policy == 'required' and (dispatch_calls | selectattr('required', 'defined') | selectattr('required') | list | length) > 0)
         else (dispatch_calls | map(attribute='name') | list) }}
    _apd_results: {}

# Batch the fan-out: list of slices each of size <= max_in_flight.
- name: Slice dispatch_calls into concurrency-capped batches
  ansible.builtin.set_fact:
    _apd_batches: >-
      {{ dispatch_calls | batch(max_in_flight | int) | map('list') | list }}

# ---- Per-batch fan-out + barrier (include_tasks loop) -----------------------
- name: Dispatch + join each concurrency-capped batch
  ansible.builtin.include_tasks: dispatch_batch.yml
  loop: "{{ _apd_batches }}"
  loop_control:
    loop_var: _apd_batch
    index_var: _apd_batch_idx
    label: "batch {{ _apd_batch_idx }} ({{ _apd_batch | map(attribute='name') | join(',') }})"

# ---- Join evaluation --------------------------------------------------------
- name: Evaluate join policy over collected results
  ansible.builtin.set_fact:
    _apd_returned: "{{ _apd_results.keys() | list }}"
    _apd_required_returned: "{{ _apd_required_names | select('in', _apd_results.keys() | list) | list }}"
    # Calls that were dispatched but never harvested (timed out before the barrier
    # window, or finished-but-failed). Lets a consumer tell "all required returned,
    # optionals dropped" apart from "everything returned".
    _apd_dropped: >-
      {{ dispatch_calls | map(attribute='name') | reject('in', _apd_results.keys() | list) | list }}

- name: Assert join satisfied
  ansible.builtin.assert:
    that:
      - >-
        (join_policy == 'all'      and (_apd_returned | length) == (dispatch_calls | length))
        or
        (join_policy == 'required' and (_apd_required_returned | length) == (_apd_required_names | length))
        or
        (join_policy == 'any'      and (_apd_returned | length) >= 1)
    fail_msg: >-
      join '{{ join_policy }}' NOT satisfied: returned={{ _apd_returned }},
      required={{ _apd_required_names }}, required_returned={{ _apd_required_returned }}.
    success_msg: >-
      join '{{ join_policy }}' satisfied: {{ _apd_returned | length }}/{{ dispatch_calls | length }}
      returned ({{ _apd_required_returned | length }}/{{ _apd_required_names | length }} required).

- name: Write dispatch result artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'ai_parallel_dispatch',
        'join_policy': join_policy,
        'max_in_flight': max_in_flight | int,
        'dispatched': dispatch_calls | map(attribute='name') | list,
        'required': _apd_required_names,
        'returned': _apd_returned,
        'required_returned': _apd_required_returned,
        'dropped': _apd_dropped,
        'satisfied': true,
        'results': _apd_results
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/ai_parallel_dispatch.json"
    mode: "0644"

# ---- Optional handler/flush_handlers demonstration variant -------------------
- name: Run handler + flush_handlers variant (demonstration)
  ansible.builtin.include_tasks: handler_barrier.yml
  when: enable_handler_variant | bool

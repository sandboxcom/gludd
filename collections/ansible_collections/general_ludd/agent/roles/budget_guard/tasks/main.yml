---
# budget_guard role — fetch daemon spend and warn/fail if budget is exhausted
#
# Uses gludd_spend to retrieve the current spend snapshot, then writes a
# budget artifact and optionally fails when remaining_usd <= budget_fail_threshold_usd.
#
# AUDIT-ONLY: never mutates spend limits. Configure the limiter separately
# with gludd_spend state=configure if you need to adjust the ceiling.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Fetch current spend snapshot ──────────────────────────────────────────────

- name: Fetch spend snapshot from daemon
  general_ludd.agent.gludd_spend:
    state: get
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: _bg_spend_result
  no_log: "{{ psk | length > 0 }}"

# ── Evaluate budget health ─────────────────────────────────────────────────────

- name: Compute budget status
  ansible.builtin.set_fact:
    _bg_spend: "{{ _bg_spend_result.spend }}"
    _bg_remaining: "{{ _bg_spend_result.spend.remaining_usd | float }}"
    _bg_limit: "{{ _bg_spend_result.spend.limit_usd | float }}"
    _bg_used: "{{ _bg_spend_result.spend.used_usd | float }}"

- name: Compute budget health label
  ansible.builtin.set_fact:
    _bg_status: >-
      {{
        'exhausted' if (_bg_remaining | float <= budget_fail_threshold_usd | float)
        else 'ok'
      }}
    _bg_summary: >-
      {{
        'Budget: $' + (_bg_used | string) + ' used of $' + (_bg_limit | string) +
        ' limit; $' + (_bg_remaining | string) + ' remaining.'
      }}

# ── Write budget artifact ──────────────────────────────────────────────────────

- name: Write budget guard JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'budget_guard',
        'status': _bg_status,
        'summary': _bg_summary,
        'limit_usd': _bg_limit | float,
        'used_usd': _bg_used | float,
        'remaining_usd': _bg_remaining | float,
        'spend': _bg_spend
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/budget_guard.json"
    mode: "0644"

- name: Write budget guard markdown artifact
  ansible.builtin.copy:
    content: |
      # Budget Guard Report

      **Status:** {{ _bg_status }}
      **Summary:** {{ _bg_summary }}

      ## Spend Details

      | Metric       | Value           |
      |--------------|-----------------|
      | Limit (USD)  | ${{ _bg_limit }} |
      | Used (USD)   | ${{ _bg_used }}  |
      | Remaining    | ${{ _bg_remaining }} |

      {% if _bg_status == 'exhausted' %}
      ## WARNING: Budget Exhausted

      Remaining budget (${{ _bg_remaining }}) is at or below the fail threshold
      (${{ budget_fail_threshold_usd }}).
      {% endif %}

      ---
      *Generated by general_ludd.agent.budget_guard — audit-only, no spend mutations.*
    dest: "{{ artifact_dir }}/budget_guard.md"
    mode: "0644"

- name: Report budget guard completion
  ansible.builtin.debug:
    msg: "Budget guard: {{ _bg_summary }}"

# ── Fail-closed if configured ─────────────────────────────────────────────────

- name: Warn when budget is exhausted (fail_on_exhausted=false)
  ansible.builtin.debug:
    msg: >-
      WARNING: spend remaining (${{ _bg_remaining }}) is at or below threshold
      (${{ budget_fail_threshold_usd }}). Set budget_fail_on_exhausted=true to block.
  when:
    - _bg_status == 'exhausted'
    - not (budget_fail_on_exhausted | bool)

- name: Fail when budget is exhausted (fail_on_exhausted=true)
  ansible.builtin.fail:
    msg: >-
      Budget exhausted: remaining_usd={{ _bg_remaining }} <=
      threshold={{ budget_fail_threshold_usd }}. Halting.
  when:
    - _bg_status == 'exhausted'
    - budget_fail_on_exhausted | bool

---
dependency:
  name: galaxy
driver:
  name: delegated
platforms:
  - name: localhost
provisioner:
  name: ansible
  config_options:
    defaults:
      gathering: explicit
      fact_caching: memory
  inventory:
    hosts:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy

---
- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Run opencode action via gludd_open_code module
  general_ludd.agent.gludd_open_code:
    action: "{{ oc_action }}"
    repo_path: "{{ repo_path }}"
    commit_msg: "{{ oc_commit_msg }}"
    test_files: "{{ oc_test_files }}"
    branch: "{{ oc_branch }}"
    wait_for_ci: "{{ oc_wait_for_ci }}"
    ci_timeout: "{{ oc_ci_timeout }}"
  register: _oc_result

- name: Write JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'open_code_workflow',
        'action': oc_action,
        'status': 'completed' if _oc_result.rc == 0 else 'failed',
        'cmd': _oc_result.cmd,
        'changed': _oc_result.changed,
        'rc': _oc_result.rc,
        'params': {
          'repo_path': repo_path,
          'branch': oc_branch,
          'wait_for_ci': oc_wait_for_ci,
          'ci_timeout': oc_ci_timeout
        }
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/open_code_workflow.json"
    mode: "0644"

- name: Write markdown report
  ansible.builtin.copy:
    content: |
      # Open Code Workflow Report

      **Role:** open_code_workflow
      **Action:** {{ oc_action }}
      **Status:** {{ 'completed' if _oc_result.rc == 0 else 'failed' }}
      **Command:** `{{ _oc_result.cmd }}`
      **Changed:** {{ _oc_result.changed }}

      ## Parameters

      - **repo_path:** `{{ repo_path }}`
      - **branch:** `{{ oc_branch }}`
      - **wait_for_ci:** {{ oc_wait_for_ci }}
      - **ci_timeout:** {{ oc_ci_timeout }}

      ## Output

      ```
      {{ _oc_result.stdout }}
      ```

      ---
      *Generated by general_ludd.agent.open_code_workflow*
    dest: "{{ artifact_dir }}/open_code_workflow.md"
    mode: "0644"

---
- name: "Validate serve inputs"
  ansible.builtin.assert:
    that:
      - model_path | length > 0
      - backend in ["llama_cpp", "vllm"]
    fail_msg: >-
      model_serve requires model_path and a valid backend (llama_cpp or vllm).
      Got model_path={{ model_path | default('<undefined>') }},
      backend={{ backend | default('<undefined>') }}.

- name: "Ensure server log directory exists"
  ansible.builtin.file:
    path: "{{ server_log_dir }}"
    state: directory
    mode: "0755"

- name: "Set server name and log path"
  ansible.builtin.set_fact:
    _server_name: "{{ backend }}-{{ model_path | basename | regex_replace('\\.gguf$', '') }}"
    _server_log: "{{ server_log_dir }}/{{ backend }}-{{ model_path | basename | regex_replace('\\.gguf$', '') }}.log"

- name: "Check if server already running"
  ansible.builtin.uri:
    url: "http://{{ host }}:{{ model_serve_port }}/health"
    method: GET
    timeout: 2
  register: _health_check_before
  failed_when: false
  changed_when: false

- name: "Report existing server"
  when: _health_check_before.status == 200
  ansible.builtin.debug:
    msg: "Inference server already running on {{ host }}:{{ model_serve_port }}"

- name: Preflight managed-host runtime for inference service
  ansible.builtin.include_role:
    name: general_ludd.agent.managed_python_preflight
    tasks_from: main
    public: false
  vars:
    managed_python_preflight_interpreter: "{{ ansible_python_interpreter }}"
    managed_python_preflight_lock_sha256: "{{ gludd_managed_python_lock_sha256 }}"
    managed_python_preflight_previous_interpreter: "{{ gludd_previous_python_interpreter | default('') }}"
  when: _health_check_before.status != 200

- name: "Setup llama.cpp server"
  when:
    - _health_check_before.status != 200
    - backend == "llama_cpp"
  block:
    - name: "Verify llama.cpp server dependency in immutable environment"
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - >-
            import importlib.util;
            raise SystemExit(not (
            importlib.util.find_spec('llama_cpp') and
            importlib.util.find_spec('llama_cpp.server')))
      register: _llama_cpp_dependency
      changed_when: false
      failed_when: false

    - name: "Fail closed when llama.cpp dependency is absent"
      ansible.builtin.assert:
        that:
          - _llama_cpp_dependency.rc == 0
        fail_msg: >-
          Managed inference dependency is absent from the immutable environment
          {{ ansible_python_interpreter }}. Provision a new content-addressed
          environment and switch inventory only after its preflight succeeds;
          the active environment is never modified in place.

    - name: "Start llama.cpp server"
      ansible.builtin.shell: |
        nohup {{ ansible_python_interpreter }} -m llama_cpp.server \
          --model "{{ model_path }}" \
          --host {{ host }} \
          --port {{ model_serve_port }} \
          --n_ctx {{ context_size }} \
          --n_gpu_layers {{ gpu_layers }} \
          --n_threads {{ threads }} \
          {% if extra_args | length > 0 %}{{ extra_args }}{% endif %} \
          > "{{ _server_log }}" 2>&1 &
      changed_when: true
      environment:
        PATH: "{{ ansible_env.PATH }}"

- name: "Setup vllm server"
  when:
    - _health_check_before.status != 200
    - backend == "vllm"
  block:
    - name: "Verify vLLM server dependency in immutable environment"
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - >-
            import importlib.util;
            raise SystemExit(not (
            importlib.util.find_spec('vllm') and
            importlib.util.find_spec('vllm.entrypoints.openai.api_server')))
      register: _vllm_dependency
      changed_when: false
      failed_when: false

    - name: "Fail closed when vLLM dependency is absent"
      ansible.builtin.assert:
        that:
          - _vllm_dependency.rc == 0
        fail_msg: >-
          Managed inference dependency is absent from the immutable environment
          {{ ansible_python_interpreter }}. Provision a new content-addressed
          environment and switch inventory only after its preflight succeeds;
          the active environment is never modified in place.

    - name: "Start vllm server"
      ansible.builtin.shell: |
        nohup {{ ansible_python_interpreter }} -m vllm.entrypoints.openai.api_server \
          --model "{{ model_path }}" \
          --host {{ host }} \
          --port {{ model_serve_port }} \
          {% if extra_args | length > 0 %}{{ extra_args }}{% endif %} \
          > "{{ _server_log }}" 2>&1 &
      changed_when: true
      environment:
        PATH: "{{ ansible_env.PATH }}"

- name: "Wait for inference server to be ready"
  when: _health_check_before.status != 200
  block:
    - name: "Poll health endpoint until ready"
      ansible.builtin.uri:
        url: "http://{{ host }}:{{ model_serve_port }}/health"
        method: GET
        timeout: 5
      register: _health_poll
      until: _health_poll.status == 200
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      changed_when: false

    - name: "Print startup log tail on failure"
      when: _health_poll is not defined or _health_poll.status != 200
      ansible.builtin.debug:
        msg: >-
          Server failed to start. Last log lines:
          {{ lookup('ansible.builtin.file', _server_log, errors='ignore')
             | default('unavailable', true) }}

- name: "Report server status"
  ansible.builtin.debug:
    msg: >-
      Inference server running: http://{{ host }}:{{ model_serve_port }}
      Backend: {{ backend }}
      Model: {{ model_path }}
      Log: {{ _server_log }}

---
backend: "llama_cpp"
model_path: ""
host: "127.0.0.1"
model_serve_port: "{{ port | default(8080) }}"
context_size: 2048
gpu_layers: 0
threads: "{{ ansible_processor_vcpus // 2 }}"
extra_args: ""
startup_timeout: 60
health_check_retries: 10
health_check_delay: 2
server_log_dir: "/opt/models/logs"

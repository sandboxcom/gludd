---
# backlog_guard_audit role — bug-class sweep + guard-coverage report
#
# Runs the bug-class registry sweep over the repo, collects pytest node ids
# to verify guard coverage, and optionally runs BacklogAuditor for task verdicts.
# Non-zero exit = occurrences OR guard gaps found (can be wired into a gate).

- name: Preflight managed-host runtime
  ansible.builtin.include_role:
    name: general_ludd.agent.managed_python_preflight
    tasks_from: main
    public: false
  vars:
    managed_python_preflight_interpreter: "{{ ansible_python_interpreter }}"
    managed_python_preflight_lock_sha256: "{{ gludd_managed_python_lock_sha256 }}"
    managed_python_preflight_previous_interpreter: "{{ gludd_previous_python_interpreter | default('') }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Run backlog guard audit script
  ansible.builtin.command:
    cmd: >-
      {{ ansible_python_interpreter }} scripts/backlog_audit.py
      --repo-root {{ repo_path }}
      {% if skip_collect %}--no-collect{% endif %}
    chdir: "{{ repo_path }}"
  register: _bga_result
  changed_when: false
  failed_when: false

- name: Parse audit result
  ansible.builtin.set_fact:
    _bga_exit_code: "{{ _bga_result.rc }}"
    _bga_output: "{{ _bga_result.stdout_lines | default([]) }}"
    _bga_has_issues: "{{ _bga_result.rc != 0 }}"

- name: Write backlog guard audit JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'backlog_guard_audit',
        'exit_code': _bga_exit_code,
        'has_issues': _bga_has_issues,
        'stdout': _bga_output,
        'stderr': _bga_result.stderr_lines | default([])
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/backlog_guard_audit.json"
    mode: "0644"

- name: Write backlog guard audit markdown artifact
  ansible.builtin.copy:
    content: |
      # Backlog Guard Audit Report

      **Exit code:** {{ _bga_exit_code }}
      {% if _bga_has_issues | bool %}
      **Verdict:** ISSUES FOUND — bug-class occurrences or guard gaps exist
      {% else %}
      **Verdict:** CLEAN — no occurrences, no guard gaps
      {% endif %}

      ## Full Output

      ```
      {% for line in _bga_output %}
      {{ line }}
      {% endfor %}
      ```

      ---
      *Generated by general_ludd.agent.backlog_guard_audit — audit-only, no repo mutations.*
    dest: "{{ artifact_dir }}/backlog_guard_audit.md"
    mode: "0644"

- name: Report backlog guard audit completion
  ansible.builtin.debug:
    msg: "Backlog guard audit complete. Issues found: {{ _bga_has_issues }}"

---
galaxy_info:
  role_name: supply_chain_verify
  author: Agentic Harness Agent
  description: >
    Cosign verify signatures/provenance + SLSA attestation. FAIL-CLOSED:
    missing or invalid signature yields verdict=fail; require_slsa=true with
    no attestation also yields verdict=fail. Heavy cosign binary gated behind
    enable_cosign:false; cosign_output_override + slsa_output_override supply
    canned pass/fail responses for molecule testing. NEVER mutates the repo.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

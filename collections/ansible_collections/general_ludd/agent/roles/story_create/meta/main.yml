---
galaxy_info:
  role_name: story_create
  author: Agentic Harness Agent
  description: >
    Converts a free-form feature request (request_text) into a structured
    user story (As a... I want... so that...) with acceptance_criteria[].
    Optionally calls a model (enable_model_call:true) or creates a todo
    (write_back:true). REPORT-ONLY by default — never mutates the repo.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

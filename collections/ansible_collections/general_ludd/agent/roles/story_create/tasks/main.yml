---
# story_create role — turn a request_text into a structured user story
#
# Converts a free-form feature request into a structured user story with
# narrative (As a... I want... so that...) and acceptance criteria list.
# Optionally calls a model for story drafting (gated behind enable_model_call:false).
# Optionally creates a todo in gludd_db (gated behind write_back:false).
# REPORT-ONLY by default: never mutates the repo.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Parse request text into story components ─────────────────────────────────

- name: Derive story title from request text
  ansible.builtin.set_fact:
    _sc_title: >-
      {{
        request_text | regex_replace('\s+', ' ') | trim | truncate(80, True, '...')
      }}
    _sc_role: "developer"
    _sc_goal: "{{ request_text | trim }}"
    _sc_benefit: "to improve system capability and meet user needs"

- name: Set story narrative (template — model call disabled)
  ansible.builtin.set_fact:
    _sc_narrative: >-
      As a {{ _sc_role }},
      I want {{ _sc_goal }},
      so that {{ _sc_benefit }}.
  when: not (enable_model_call | bool) or ansible_check_mode

# ── Derive acceptance criteria from request text ─────────────────────────────

- name: Derive acceptance criteria from request complexity
  ansible.builtin.set_fact:
    _sc_acceptance_criteria:
      - "Given the feature is implemented, when a user invokes it, then it produces the expected output"
      - "Given invalid input, when the feature is called, then it returns a clear error message"
      - "Given the feature runs, when it completes, then it is observable in the audit log"
      - "Given tests exist for this feature, when they run, then they all pass with no regressions"

# ── Optionally call model for richer story content ────────────────────────────

- name: Call model for story narrative (enable_model_call=true only)
  general_ludd.agent.gludd_model_call:
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    prompt: >-
      Convert this feature request into a concise user story.
      Format: "As a [role], I want [goal], so that [benefit]."
      Then list 3-5 acceptance criteria as bullet points.
      Request: {{ request_text }}
    model_profile: "{{ model_profile | default('') }}"
  register: _sc_model_result
  no_log: "{{ psk | length > 0 }}"
  when:
    - enable_model_call | bool
    - not ansible_check_mode

- name: Set narrative from model call
  ansible.builtin.set_fact:
    _sc_narrative: "{{ _sc_model_result.text | default(_sc_narrative) }}"
  when:
    - enable_model_call | bool
    - not ansible_check_mode
    - _sc_model_result is defined
    - "'text' in _sc_model_result"

# ── Optionally create todo in gludd_db ───────────────────────────────────────

- name: Create todo in gludd_db (write_back=true only)
  general_ludd.agent.gludd_db:
    op: "todo_create"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    title: "{{ _sc_title }}"
    description: "{{ _sc_narrative }}"
    work_type: "code"
    queue: "core"
  register: _sc_todo_result
  no_log: "{{ psk | length > 0 }}"
  when:
    - write_back | bool
    - not ansible_check_mode

# ── Write artifacts ───────────────────────────────────────────────────────────

- name: Write JSON story artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'story_create',
        'status': 'completed',
        'title': _sc_title,
        'narrative': _sc_narrative,
        'acceptance_criteria': _sc_acceptance_criteria,
        'model_call_used': enable_model_call | bool and not ansible_check_mode,
        'write_back': write_back | bool
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/story_create.json"
    mode: "0644"

- name: Write markdown story artifact
  ansible.builtin.copy:
    content: |
      # User Story: {{ _sc_title }}

      ## Narrative

      {{ _sc_narrative }}

      ## Acceptance Criteria

      {% for ac in _sc_acceptance_criteria %}
      - [ ] {{ ac }}
      {% endfor %}

      ---
      *Generated by general_ludd.agent.story_create — report-only by default.*
    dest: "{{ artifact_dir }}/story_create.md"
    mode: "0644"

- name: Report story creation completion
  ansible.builtin.debug:
    msg: >-
      Story created: '{{ _sc_title }}'
      criteria={{ _sc_acceptance_criteria | length }}
      model_call={{ enable_model_call | bool }}
      write_back={{ write_back | bool }}

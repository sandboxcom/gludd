---
- name: Verify — local_game_gen role structure, behavior, idempotency, and error handling
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    role_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/agent/roles/local_game_gen"
    test_artifact_dir: "/tmp/gludd-game-gen-molecule"
    test_game_name: "snake"
    task_files:
      - main.yml
    required_dirs:
      - tasks
      - defaults
      - meta
    required_defaults:
      - game_name
      - model_repo
      - model_file
      - model_download_dir
      - server_host
      - server_port
      - game_prompt
      - max_tokens
      - artifact_dir
    required_meta_fields:
      - role_name
      - author
      - description
      - license
      - min_ansible_version

  tasks:
    # ══════════════════════════════════════════════════════════════════════
    # Section A: Structure — directory and file existence
    # ══════════════════════════════════════════════════════════════════════

    - name: "A1. Assert role root directory exists"
      ansible.builtin.stat:
        path: "{{ role_root }}"
      register: _role_stat
      failed_when: not _role_stat.stat.exists

    - name: "A2. Assert required subdirectories exist"
      ansible.builtin.stat:
        path: "{{ role_root }}/{{ item }}"
      register: _subdirs
      loop: "{{ required_dirs }}"
      failed_when: not _subdirs.results | map(attribute='stat.exists') | list is all

    - name: "A3. Assert required task files exist"
      ansible.builtin.stat:
        path: "{{ role_root }}/tasks/{{ item }}"
      register: _task_files
      loop: "{{ task_files }}"
      failed_when: not _task_files.results | map(attribute='stat.exists') | list is all

    - name: "A4. Assert defaults/main.yml exists"
      ansible.builtin.stat:
        path: "{{ role_root }}/defaults/main.yml"
      register: _defaults_stat
      failed_when: not _defaults_stat.stat.exists

    - name: "A5. Assert meta/main.yml exists"
      ansible.builtin.stat:
        path: "{{ role_root }}/meta/main.yml"
      register: _meta_stat
      failed_when: not _meta_stat.stat.exists

    # ══════════════════════════════════════════════════════════════════════
    # Section B: YAML validity
    # ══════════════════════════════════════════════════════════════════════

    - name: "B1. Slurp task files"
      ansible.builtin.slurp:
        src: "{{ role_root }}/tasks/{{ item }}"
      register: _slurped_tasks
      loop: "{{ task_files }}"

    - name: "B2. Assert task file YAML parses as list with >=1 item"
      ansible.builtin.assert:
        that:
          - "{{ (_slurped_tasks.results | selectattr('item', 'eq', item) | first).content | b64decode | from_yaml is iterable }}"
          - "{{ ((_slurped_tasks.results | selectattr('item', 'eq', item) | first).content | b64decode | from_yaml) | length >= 1 }}"
        fail_msg: "{{ item }} must parse as a non-empty list of tasks"
      loop: "{{ task_files }}"
      loop_control:
        label: "{{ item }}"

    - name: "B3. Assert defaults/main.yml parses as dict"
      ansible.builtin.slurp:
        src: "{{ role_root }}/defaults/main.yml"
      register: _slurped_defaults

    - name: "B4. Validate defaults YAML structure"
      ansible.builtin.assert:
        that:
          - "{{ (_slurped_defaults.content | b64decode | from_yaml) is mapping }}"
        fail_msg: "defaults/main.yml must parse as a dict"

    - name: "B5. Assert meta/main.yml parses as dict"
      ansible.builtin.slurp:
        src: "{{ role_root }}/meta/main.yml"
      register: _slurped_meta

    - name: "B6. Validate meta YAML structure"
      ansible.builtin.assert:
        that:
          - "{{ (_slurped_meta.content | b64decode | from_yaml) is mapping }}"
        fail_msg: "meta/main.yml must parse as a dict"

    # ══════════════════════════════════════════════════════════════════════
    # Section C: Pipeline-step coverage — all 5 steps verified
    # ══════════════════════════════════════════════════════════════════════

    - name: "C1. Slurp tasks/main.yml"
      ansible.builtin.slurp:
        src: "{{ role_root }}/tasks/main.yml"
      register: _main_slurp

    # -- Step 1: Validate inputs --

    - name: "C1a. Assert validation step checks all three required vars"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('game_name') }}"
          - "{{ _main_slurp.content | b64decode is search('model_repo') }}"
          - "{{ _main_slurp.content | b64decode is search('model_file') }}"
        fail_msg: "Validate step must assert game_name, model_repo, model_file"

    - name: "C1b. Assert fail_msg gives actionable error with defaults"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('Got game_name') }}"
          - "{{ _main_slurp.content | b64decode is search('model_repo') }}"
          - "{{ _main_slurp.content | b64decode is search('model_file') }}"
        fail_msg: "Validation fail_msg must report which variable is undefined"

    # -- Step 2: Download model --

    - name: "C2a. Assert huggingface-cli download present"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('huggingface-cli') }}"
        fail_msg: "local_game_gen must download the model"

    - name: "C2b. Assert download uses 'when not exists' guard"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('_model_path is not exists') }}"
        fail_msg: "Download must be guarded by model path existence check"

    - name: "C2c. Assert huggingface_hub pip installed before download"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('huggingface_hub') }}"
        fail_msg: "Must install huggingface_hub before downloading model"

    # -- Step 3: Start server --

    - name: "C3a. Assert llama.cpp server start present"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('llama_cpp') }}"
        fail_msg: "local_game_gen must start llama.cpp server"

    - name: "C3b. Assert server log path set"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('_server_log') }}"
        fail_msg: "Must set _server_log fact for observability"

    - name: "C3c. Assert health-check polling exists"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('/v1/models') }}"
        fail_msg: "Must poll /v1/models endpoint until server is ready"

    # -- Step 4: Generate game --

    - name: "C4a. Assert /v1/completions endpoint called"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('v1/completions') }}"
        fail_msg: "local_game_gen must call model via completions endpoint"

    - name: "C4b. Assert max_tokens and temperature in generation call"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('max_tokens') }}"
          - "{{ _main_slurp.content | b64decode is search('temperature') }}"
        fail_msg: "Generation call must set max_tokens and temperature"

    # -- Step 5: Verify generated code --

    - name: "C5a. Assert AST parse verification present"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('ast.parse') }}"
        fail_msg: "local_game_gen must verify generated code"

    - name: "C5b. Assert import verification present"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('importlib') }}"
        fail_msg: "Must verify code can be imported"

    - name: "C5c. Assert runtime verification present"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('RUNTIME') }}"
        fail_msg: "Must verify code passes runtime checks"

    - name: "C5d. Assert server shutdown present"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('kill') }}"
        fail_msg: "local_game_gen must stop the server"

    # ══════════════════════════════════════════════════════════════════════
    # Section D: Idempotency verification
    # ══════════════════════════════════════════════════════════════════════

    - name: "D1. Assert download has 'creates' guard for idempotent re-run"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('creates') }}"
        fail_msg: "Download must use 'creates' guard for idempotency"

    - name: "D2. Assert artifact directory creation uses state: directory"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('state: directory') }}"
        fail_msg: "Artifact directory creation must be idempotent via 'state: directory'"

    - name: "D3. Assert file operations use dest with mode for idempotency"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('mode:') }}"
        fail_msg: "File writes must specify mode for idempotent comparison"

    - name: "D4. Assert health poll is not changed_when"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('changed_when: false') }}"
        fail_msg: "Health poll must use changed_when: false for idempotency"

    - name: "D5. Assert verification tasks use changed_when: false"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode | regex_search('changed_when.*false', multiline=true) | length > 0 }}"
        fail_msg: "Verification tasks must use changed_when: false"

    # ══════════════════════════════════════════════════════════════════════
    # Section E: Error handling verification
    # ══════════════════════════════════════════════════════════════════════

    - name: "E1. Assert missing model_file triggers fail_msg with <undefined>"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('<undefined>') }}"
        fail_msg: "Error messages must report undefined variables as <undefined>"

    - name: "E2. Assert server PID slurp uses ignore_errors"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('ignore_errors: true') }}"
        fail_msg: "Server PID read must ignore errors (server may not have started)"

    - name: "E3. Assert server kill is conditional on PID content"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('_server_pid.content') }}"
        fail_msg: "Server kill must be conditional on PID file content existing"

    - name: "E4. Assert always block exists for guaranteed cleanup"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('always:') }}"
        fail_msg: "Must have always block for guaranteed cleanup on failure"

    - name: "E5. Assert all verification tasks use ignore_errors or changed_when: false"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('changed_when: false') }}"  # verified E1 already checked for ignore_errors
        fail_msg: "Verification tasks must not report as changed"

    # ══════════════════════════════════════════════════════════════════════
    # Section F: Meta galaxy_info fields
    # ══════════════════════════════════════════════════════════════════════

    - name: "F1. Parse meta/main.yml"
      ansible.builtin.set_fact:
        _meta_doc: "{{ _slurped_meta.content | b64decode | from_yaml }}"

    - name: "F2. Assert galaxy_info.role_name is local_game_gen"
      ansible.builtin.assert:
        that:
          - _meta_doc.galaxy_info.role_name == 'local_game_gen'
        fail_msg: "meta galaxy_info.role_name must be 'local_game_gen', got {{ _meta_doc.galaxy_info.role_name | default('(missing)') }}"

    - name: "F3. Assert galaxy_info has required fields"
      ansible.builtin.assert:
        that:
          - _meta_doc.galaxy_info['{{ item }}'] is defined
        fail_msg: "meta galaxy_info missing field: {{ item }}"
      loop: "{{ required_meta_fields }}"
      loop_control:
        label: "galaxy_info.{{ item }}"

    # ══════════════════════════════════════════════════════════════════════
    # Section G: Defaults completeness and safety
    # ══════════════════════════════════════════════════════════════════════

    - name: "G1. Parse defaults/main.yml"
      ansible.builtin.set_fact:
        _defaults: "{{ _slurped_defaults.content | b64decode | from_yaml }}"

    - name: "G2. Assert all required default keys exist"
      ansible.builtin.assert:
        that:
          - "'{{ item }}' in _defaults"
        fail_msg: "defaults/main.yml missing key: {{ item }}"
      loop: "{{ required_defaults }}"
      loop_control:
        label: "{{ item }}"

    - name: "G3. Assert safe defaults — server binds to loopback"
      ansible.builtin.assert:
        that:
          - _defaults.server_host == '127.0.0.1'
        fail_msg: "server_host must default to loopback (security)"

    - name: "G4. Assert max_tokens is positive"
      ansible.builtin.assert:
        that:
          - (_defaults.max_tokens | int) > 0
        fail_msg: "max_tokens must be > 0"

    - name: "G5. Assert model_download_dir is under /tmp for safety"
      ansible.builtin.assert:
        that:
          - _defaults.model_download_dir is search('/tmp')
        fail_msg: "model_download_dir must be under /tmp (sandboxed)"

    - name: "G6. Assert artifact_dir is under /tmp for safety"
      ansible.builtin.assert:
        that:
          - _defaults.artifact_dir is search('/tmp')
        fail_msg: "artifact_dir must be under /tmp (sandboxed)"

    - name: "G7. Assert server_gpu_layers defaults to 0 (CPU-only)"
      ansible.builtin.assert:
        that:
          - (_defaults.server_gpu_layers | int) == 0
        fail_msg: "server_gpu_layers must default to 0 (CPU-only)"

    - name: "G8. Assert health_check_retries is positive"
      ansible.builtin.assert:
        that:
          - (_defaults.health_check_retries | int) > 0
        fail_msg: "health_check_retries must be > 0"

    - name: "G9. Assert health_check_delay is positive"
      ansible.builtin.assert:
        that:
          - (_defaults.health_check_delay | int) > 0
        fail_msg: "health_check_delay must be > 0"

    # ══════════════════════════════════════════════════════════════════════
    # Section H: Forbidden patterns
    # ══════════════════════════════════════════════════════════════════════

    - name: "H1. Assert no hardcoded absolute paths outside /tmp"
      ansible.builtin.assert:
        that:
          - "{{ not (_main_slurp.content | b64decode | regex_search('(?<!/tmp)/[a-z]+/(?!(tmp|dev/null))', ignorecase=true)) }}"
        fail_msg: "Must not use hardcoded absolute paths outside /tmp"

    - name: "H2. Assert no eval or exec in verification scripts"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is not search('eval(') }}"
        fail_msg: "Verification scripts must not use eval()"

    # ══════════════════════════════════════════════════════════════════════
    # Section I: Cross-cutting — artifact directory consistency
    # ══════════════════════════════════════════════════════════════════════

    - name: "I1. Assert artifact_dir used for generated code output"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('artifact_dir') }}"
        fail_msg: "Artifact directory variable must be referenced consistently"

    - name: "I2. Assert server log and PID go to artifact_dir"
      ansible.builtin.assert:
        that:
          - "{{ _main_slurp.content | b64decode is search('server.log') }}"
          - "{{ _main_slurp.content | b64decode is search('server.pid') }}"
        fail_msg: "Server log and PID must be written to artifact_dir"

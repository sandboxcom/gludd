---
# generate_and_verify.yml — recursive generate → verify loop with bounded retry.
#
# Any failure in the block (generation or a verify check) is a REJECTION
# event. The rescue records the REJECTED event (naming the failing check),
# increments the attempt counter, and either re-includes this file with the
# corrective retry_prompt — optionally on the next fallback model — or fails
# the role hard once max_attempts is exhausted (bounded retry, no infinite
# loop). Default max_attempts=1 preserves the original single-shot behavior.

- name: "Select model for the current attempt"
  ansible.builtin.set_fact:
    _fallback_idx: "{{ [(_attempt | int) - 2, fallback_models | length - 1] | min }}"
    _active_repo: >-
      {{ model_repo if _attempt | int == 1 or fallback_models | length == 0
         else fallback_models[([(_attempt | int) - 2, fallback_models | length - 1] | min)].repo }}
    _active_file: >-
      {{ model_file if _attempt | int == 1 or fallback_models | length == 0
         else fallback_models[([(_attempt | int) - 2, fallback_models | length - 1] | min)].file }}

- name: "Resolve active model path (separate task: set_fact resolves all keys at once)"
  ansible.builtin.set_fact:
    _active_model_path: >-
      {{ model_download_dir }}/{{ _active_repo | regex_replace('/', '_') }}/{{ _active_file }}

- name: "Select effective prompt for the current attempt"
  ansible.builtin.set_fact:
    _effective_prompt: "{{ game_prompt if _attempt | int == 1 else retry_prompt }}"

- name: "Generate and verify"
  block:
    - name: "Switch to fallback model on repeated rejection"
      # The switch block only runs when a fallback model is configured AND
      # this is a retry attempt; with an empty fallback_models list the
      # corrective-prompt retry reuses the already-served primary model
      # (observed locally: pointless re-download + restart of the same GGUF).
      when:
        - _attempt | int > 1
        - fallback_models | length > 0
      block:
        - name: "Download fallback model if not present"
          ansible.builtin.command: >-
            hf download {{ _active_repo }} {{ _active_file }}
            --local-dir {{ model_download_dir }}/{{ _active_repo | regex_replace('/', '_') }}
          args:
            creates: "{{ _active_model_path }}"
          changed_when: true

        - name: "Stop current server before model switch"
          ansible.builtin.command: "kill -TERM {{ _server_pid.content | b64decode | trim }}"
          when: _server_pid.content is defined
          failed_when: false
          changed_when: true

        - name: "Start llama.cpp server with fallback model"
          ansible.builtin.shell: |
            nohup {{ ansible_playbook_python }} -m llama_cpp.server \
              --model "{{ _active_model_path }}" \
              --host {{ server_host }} \
              --port {{ server_port }} \
              --n_ctx {{ server_context_size }} \
              --n_gpu_layers {{ server_gpu_layers }} \
              > "{{ _server_log }}" 2>&1 &
            echo $! > "{{ artifact_dir }}/server.pid"
          changed_when: true

        - name: "Record new server PID after fallback restart"
          ansible.builtin.slurp:
            src: "{{ artifact_dir }}/server.pid"
          register: _server_pid
          changed_when: false

        - name: "Poll fallback model readiness"
          ansible.builtin.uri:
            url: "http://{{ server_host }}:{{ server_port }}/v1/models"
            method: GET
            timeout: 5
          register: _fallback_health
          until: _fallback_health.status == 200
          retries: "{{ health_check_retries }}"
          delay: "{{ health_check_delay }}"
          changed_when: false

    - name: "Call local model for game generation"
      ansible.builtin.uri:
        url: "http://{{ server_host }}:{{ server_port }}/v1/completions"
        method: POST
        body_format: json
        body:
          prompt: "{{ _effective_prompt }}"
          max_tokens: "{{ max_tokens }}"
          temperature: "{{ temperature }}"
        timeout: 300
        headers:
          Content-Type: application/json
      register: _model_response

    - name: "Extract generated code from model response"
      ansible.builtin.set_fact:
        _generated_code: "{{ _model_response.json.choices[0].text | default('') }}"

    - name: "Write generated code to artifact"
      ansible.builtin.copy:
        content: "{{ _generated_code }}"
        dest: "{{ artifact_dir }}/{{ game_name }}.py"
        mode: "0644"

    - name: "Verify — acceptance engine (single rejection choke point)"
      when: use_acceptance_engine | default(false) | bool
      ansible.builtin.command: >-
        {{ ansible_playbook_python }} -m general_ludd.game_gen.acceptance
        "{{ artifact_dir }}/{{ game_name }}.py"
      register: _acceptance_result
      changed_when: false

    - name: "Verify — AST parse"
      ansible.builtin.command: "{{ ansible_playbook_python }} -c 'import ast; ast.parse(open(\"{{ artifact_dir }}/{{ game_name }}.py\").read()); print(\"AST: OK\")'"
      register: _ast_result
      changed_when: false

    - name: "Verify — import module"
      ansible.builtin.command: >-
        {{ ansible_playbook_python }} -c "
        import importlib.util, sys
        spec = importlib.util.spec_from_file_location('{{ game_name }}', '{{ artifact_dir }}/{{ game_name }}.py')
        mod = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(mod)
        classes = [v for v in vars(mod).values() if isinstance(v, type) and v.__module__ == '{{ game_name }}']
        if not classes:
            print('ERR: no game class found')
            sys.exit(1)
        print(f'Classes: {[c.__name__ for c in classes]}')
        "
      register: _import_result
      changed_when: false

    - name: "Verify — runtime checks"
      ansible.builtin.command: >-
        {{ ansible_playbook_python }} -c "
        import importlib.util, sys
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('{{ game_name }}', '{{ artifact_dir }}/{{ game_name }}.py')
        mod = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(mod)
        classes = [v for v in vars(mod).values() if isinstance(v, type) and v.__module__ == '{{ game_name }}']
        game = classes[0]()
        sys.stdout.write(f'Instantiated {type(game).__name__}\n')
        if hasattr(game, 'start'):
            game.start()
            sys.stdout.write('start(): OK\n')
        if hasattr(game, 'score'):
            sys.stdout.write(f'score(): {game.score()}\n')
        if hasattr(game, 'is_game_over'):
            sys.stdout.write(f'is_game_over(): {game.is_game_over()}\n')
        if hasattr(game, 'tick') and hasattr(game, 'is_game_over'):
            for _ in range(5):
                if not game.is_game_over():
                    game.tick('right')
            sys.stdout.write('tick() x5: OK\n')
        if hasattr(game, 'restart'):
            game.restart()
            sys.stdout.write('restart(): OK\n')
        sys.stdout.write('RUNTIME: OK\n')
        "
      register: _runtime_result
      changed_when: false

    - name: "Report verification results"
      ansible.builtin.debug:
        msg:
          - "AST parse: {{ _ast_result.stdout_lines | default([]) }}"
          - "Import: {{ _import_result.stdout_lines | default([]) }}"
          - "Runtime: {{ _runtime_result.stdout_lines | default([]) }}"
  rescue:
    - name: "REJECTED event — record model-output rejection with failing check"
      when: _verify_failed | default(true) | bool
      ansible.builtin.set_fact:
        _verify_failed: true
        _verify_failed_check: >-
          {{ 'acceptance engine' if _acceptance_result is defined and (_acceptance_result.failed | default(false))
             else ('AST parse' if _ast_result is not defined or (_ast_result.failed | default(false))
             else ('module import' if _import_result is not defined or (_import_result.failed | default(false))
             else 'runtime checks')) }}

    - name: "Increment attempt counter on rejection"
      ansible.builtin.set_fact:
        _attempt: "{{ _attempt | int + 1 }}"

    - name: "Retry generation with corrective prompt (model fallback on repeated rejection)"
      when: _attempt | int < max_attempts | int
      ansible.builtin.include_tasks: generate_and_verify.yml

    - name: "Remove artifact after all verification attempts exhausted"
      when: _attempt | int >= max_attempts | int
      ansible.builtin.file:
        path: "{{ artifact_dir }}/{{ game_name }}.py"
        state: absent

    - name: "Fail after all attempts rejected (skip when rejection is observable-only)"
      when:
        - _attempt | int >= max_attempts | int
        - fail_on_rejection | default(true) | bool
      ansible.builtin.fail:
        msg: >-
          REJECTED: generated code failed verification after {{ max_attempts }}
          attempt(s). Last failing check: {{ _verify_failed_check }}.
          AST result: {{ _ast_result.stdout_lines | default([]) }}
          Import result: {{ _import_result.stdout_lines | default([]) }}
          Runtime result: {{ _runtime_result.stdout_lines | default([]) }}

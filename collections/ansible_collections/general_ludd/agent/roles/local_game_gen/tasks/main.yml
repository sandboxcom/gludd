---
- name: "Validate inputs"
  ansible.builtin.assert:
    that:
      - game_name | length > 0
      - model_repo | length > 0
      - model_file | length > 0
    fail_msg: >-
      local_game_gen requires game_name, model_repo, and model_file.
      Got game_name={{ game_name | default('<undefined>') }},
      model_repo={{ model_repo | default('<undefined>') }},
      model_file={{ model_file | default('<undefined>') }}.

- name: "Ensure artifact directory exists"
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Step 1: Download model ───────────────────────────────────────────────

- name: "Compute full local model path"
  ansible.builtin.set_fact:
    _model_path: "{{ model_download_dir }}/{{ model_repo | regex_replace('/', '_') }}/{{ model_file }}"

- name: "Download model if not present"
  when: _model_path is not exists
  block:
    - name: "Install huggingface_hub and llama-cpp-python"
      ansible.builtin.pip:
        name:
          - huggingface_hub
          - llama-cpp-python
        state: present

    - name: "Download GGUF via hf"
      ansible.builtin.command: >-
        hf download {{ model_repo }} {{ model_file }}
        --local-dir {{ model_download_dir }}/{{ model_repo | regex_replace('/', '_') }}
      args:
        creates: "{{ _model_path }}"
      changed_when: true

# ── Step 2: Start local inference server ──────────────────────────────────

- name: "Set server log path"
  ansible.builtin.set_fact:
    _server_log: "{{ artifact_dir }}/llamacpp-server.log"
    _server_name: "llamacpp-{{ model_file | regex_replace('\\.gguf$', '') }}"

- name: "Start llama.cpp server"
  ansible.builtin.shell: |
    nohup {{ ansible_playbook_python }} -m llama_cpp.server \
      --model "{{ _model_path }}" \
      --host {{ server_host }} \
      --port {{ server_port }} \
      --n_ctx {{ server_context_size }} \
      --n_gpu_layers {{ server_gpu_layers }} \
      > "{{ _server_log }}" 2>&1 &
    echo $! > "{{ artifact_dir }}/server.pid"
  changed_when: true

- name: "Poll health endpoint until ready"
  ansible.builtin.uri:
    url: "http://{{ server_host }}:{{ server_port }}/health"
    method: GET
    timeout: 5
  register: _health_poll
  until: _health_poll.status == 200
  retries: "{{ health_check_retries }}"
  delay: "{{ health_check_delay }}"
  changed_when: false

# ── Step 3: Generate game via local model ─────────────────────────────────

- name: "Call local model for game generation"
  ansible.builtin.uri:
    url: "http://{{ server_host }}:{{ server_port }}/v1/completions"
    method: POST
    body_format: json
    body:
      prompt: "{{ game_prompt }}"
      max_tokens: "{{ max_tokens }}"
      temperature: "{{ temperature }}"
    timeout: 300
    headers:
      Content-Type: application/json
  register: _model_response

- name: "Extract generated code from model response"
  ansible.builtin.set_fact:
    _generated_code: "{{ _model_response.json.choices[0].text | default('') }}"

- name: "Write generated code to artifact"
  ansible.builtin.copy:
    content: "{{ _generated_code }}"
    dest: "{{ artifact_dir }}/{{ game_name }}.py"
    mode: "0644"

# ── Step 4: Verify generated code ─────────────────────────────────────────

- name: "Verify — AST parse"
  ansible.builtin.command: "{{ ansible_playbook_python }} -c 'import ast; ast.parse(open(\"{{ artifact_dir }}/{{ game_name }}.py\").read()); print(\"AST: OK\")'"
  register: _ast_result
  changed_when: false

- name: "Verify — import module"
  ansible.builtin.command: >-
    {{ ansible_playbook_python }} -c "
    import importlib.util, sys
    spec = importlib.util.spec_from_file_location('{{ game_name }}', '{{ artifact_dir }}/{{ game_name }}.py')
    mod = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(mod)
    classes = [v for v in vars(mod).values() if isinstance(v, type) and v.__module__ == '{{ game_name }}']
    if not classes:
        print('ERR: no game class found')
        sys.exit(1)
    print(f'Classes: {[c.__name__ for c in classes]}')
    "
  register: _import_result
  changed_when: false

- name: "Verify — runtime checks"
  ansible.builtin.command: >-
    {{ ansible_playbook_python }} -c "
    import importlib.util, sys
    from pathlib import Path
    spec = importlib.util.spec_from_file_location('{{ game_name }}', '{{ artifact_dir }}/{{ game_name }}.py')
    mod = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(mod)
    classes = [v for v in vars(mod).values() if isinstance(v, type) and v.__module__ == '{{ game_name }}']
    game = classes[0]()
    sys.stdout.write(f'Instantiated {type(game).__name__}\n')
    if hasattr(game, 'start'):
        game.start()
        sys.stdout.write('start(): OK\n')
    if hasattr(game, 'score'):
        sys.stdout.write(f'score(): {game.score()}\n')
    if hasattr(game, 'is_game_over'):
        sys.stdout.write(f'is_game_over(): {game.is_game_over()}\n')
    if hasattr(game, 'tick') and hasattr(game, 'is_game_over'):
        for _ in range(5):
            if not game.is_game_over():
                game.tick('right')
        sys.stdout.write('tick() x5: OK\n')
    if hasattr(game, 'restart'):
        game.restart()
        sys.stdout.write('restart(): OK\n')
    sys.stdout.write('RUNTIME: OK\n')
    "
  register: _runtime_result
  changed_when: false

- name: "Report verification results"
  ansible.builtin.debug:
    msg:
      - "AST parse: {{ _ast_result.stdout_lines | default([]) }}"
      - "Import: {{ _import_result.stdout_lines | default([]) }}"
      - "Runtime: {{ _runtime_result.stdout_lines | default([]) }}"

# ── Step 5: Shutdown server ──────────────────────────────────────────────

- name: "Stop inference server"
  block:
    - name: "Enter server cleanup phase"
      ansible.builtin.debug:
        msg: "local_game_gen server cleanup phase started"
  always:
    - name: "Read server PID"
      ansible.builtin.slurp:
        src: "{{ artifact_dir }}/server.pid"
      register: _server_pid
      ignore_errors: true
      changed_when: false

    - name: "Kill server process"
      when: _server_pid.content is defined
      ansible.builtin.command: "kill -TERM {{ _server_pid.content | b64decode | trim }}"
      failed_when: false
      changed_when: true

    - name: "Remove PID file"
      ansible.builtin.file:
        path: "{{ artifact_dir }}/server.pid"
        state: absent

    - name: "Report server cleanup"
      ansible.builtin.debug:
        msg: "local_game_gen server cleanup phase completed"

---
- name: "Validate inputs"
  ansible.builtin.assert:
    that:
      - game_name | length > 0
      - model_repo | length > 0
      - model_file | length > 0
      - daemon_url | length > 0
      - daemon_timeout | int > 0
      - server_startup_timeout | int > 0
    fail_msg: >-
      local_game_gen requires a model identity and an authenticated Gludd
      daemon endpoint with positive lifecycle timeouts.

- name: "Ensure artifact directory exists"
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: "Ask the Gludd daemon to acquire the primary model"
  general_ludd.agent.gludd_local_model:
    action: download
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    timeout: "{{ daemon_timeout }}"
    model_id: "{{ model_repo }}"
    filename: "{{ model_file }}"
    source: "{{ model_source }}"
  register: _local_model_download

- name: "Generate and verify with a daemon-owned local model"
  block:
    - name: "Ask the Gludd daemon to serve the primary model"
      general_ludd.agent.gludd_local_model:
        action: serve
        daemon_url: "{{ daemon_url }}"
        psk: "{{ psk }}"
        timeout: "{{ daemon_timeout }}"
        model_id: "{{ model_repo }}"
        model_path: "{{ _local_model_download.local_path }}"
        host: "{{ server_host }}"
        port: "{{ server_port }}"
        startup_timeout: "{{ server_startup_timeout }}"
        gpu_layers: "{{ server_gpu_layers }}"
        context_size: "{{ server_context_size }}"
      register: _local_model_server

    - name: "Start first attempt counter"
      ansible.builtin.set_fact:
        _attempt: 1

    - name: "Generate and verify game with bounded rejection retries"
      ansible.builtin.include_tasks: generate_and_verify.yml

    - name: "REJECTED event - surface verify-failure rejection to the orchestrator"
      when: _verify_failed | default(false) | bool
      ansible.builtin.debug:
        msg: >-
          REJECTED: model output from {{ _active_repo | default(model_repo) }}
          failed verification at check
          '{{ _verify_failed_check | default('unknown') }}' after
          {{ max_attempts }} attempt(s).
  always:
    - name: "Ask the Gludd daemon to stop its owned inference server"
      general_ludd.agent.gludd_local_model:
        action: shutdown
        daemon_url: "{{ daemon_url }}"
        psk: "{{ psk }}"
        server_id: "{{ _local_model_server.server_id }}"
        timeout: "{{ daemon_timeout }}"
      when:
        - _local_model_server is defined
        - _local_model_server.server_id is defined

    - name: "Report daemon-owned model cleanup"
      ansible.builtin.debug:
        msg: "local_game_gen daemon-owned inference cleanup completed"

---
- name: Fail closed on an unsafe execution-environment lifecycle request
  ansible.builtin.assert:
    that:
      - execution_environment_bootstrap_state in ['present', 'absent']
      - execution_environment_bootstrap_container_runtime == 'podman'
      - execution_environment_bootstrap_machine_name is match('^gludd-[a-z0-9][a-z0-9-]{2,62}$')
      - execution_environment_bootstrap_machine_cpus | int >= 1
      - execution_environment_bootstrap_machine_cpus | int <= 16
      - execution_environment_bootstrap_machine_memory_mb | int >= 2048
      - execution_environment_bootstrap_machine_memory_mb | int <= 65536
      - execution_environment_bootstrap_machine_disk_gb | int >= 10
      - execution_environment_bootstrap_machine_disk_gb | int <= 256
      - execution_environment_bootstrap_machine_start_timeout_seconds | int >= 30
      - execution_environment_bootstrap_machine_start_timeout_seconds | int <= 3600
      - execution_environment_bootstrap_build_timeout_seconds | int >= 300
      - execution_environment_bootstrap_build_timeout_seconds | int <= 14400
      - execution_environment_bootstrap_poll_seconds | int >= 1
      - execution_environment_bootstrap_poll_seconds | int <= 60
      - execution_environment_bootstrap_project_root | length > 0
      - execution_environment_bootstrap_project_root is match('^/.*')
      - execution_environment_bootstrap_state_root is match('^/.*/gludd/[A-Za-z0-9._/-]+$')
      - execution_environment_bootstrap_context_dir is match('^/.*/gludd/[A-Za-z0-9._/-]+$')
      - execution_environment_bootstrap_image is match('^localhost/gludd-[a-z0-9._/-]+:[A-Za-z0-9._-]+$')
      - not execution_environment_bootstrap_image.endswith(':latest')
      - ansible_facts['system'] in ['Darwin', 'Linux']
    fail_msg: >-
      Execution-environment bootstrap must fail closed unless the request has
      an exact gludd-* owner namespace, a local non-latest image tag, bounded
      resources, an absolute Gludd state directory, and a supported host OS.

- name: Inspect the immutable Ansible runtime lock
  ansible.builtin.stat:
    path: "{{ execution_environment_bootstrap_project_root }}/config/ansible/runtime-lock.json"
    checksum_algorithm: sha256
  register: _execution_environment_bootstrap_runtime_lock

- name: Inspect the canonical execution-environment builder driver
  ansible.builtin.stat:
    path: "{{ execution_environment_bootstrap_project_root }}/scripts/ansible_runtime_artifacts.py"
  register: _execution_environment_bootstrap_builder_driver

- name: Reject a source tree without locked build inputs
  ansible.builtin.assert:
    that:
      - _execution_environment_bootstrap_runtime_lock.stat.isreg | default(false)
      - _execution_environment_bootstrap_runtime_lock.stat.checksum is match('^[0-9a-f]{64}$')
      - _execution_environment_bootstrap_builder_driver.stat.isreg | default(false)
    fail_msg: >-
      The project root must contain config/ansible/runtime-lock.json and the
      canonical scripts/ansible_runtime_artifacts.py builder driver.

- name: Derive content-addressed candidate ownership
  ansible.builtin.set_fact:
    _execution_environment_bootstrap_machine_required: "{{ ansible_facts['system'] == 'Darwin' }}"
    _execution_environment_bootstrap_runtime_sha256: >-
      {{ _execution_environment_bootstrap_runtime_lock.stat.checksum }}
    _execution_environment_bootstrap_candidate_image: >-
      {{ execution_environment_bootstrap_image }}-{{ _execution_environment_bootstrap_runtime_lock.stat.checksum[:12] }}
    _execution_environment_bootstrap_candidate_context: >-
      {{ execution_environment_bootstrap_context_dir }}/{{ _execution_environment_bootstrap_runtime_lock.stat.checksum[:16] }}
    _execution_environment_bootstrap_tool_environment: >-
      {{ {'PATH': ((ansible_playbook_python | dirname) +
                   ':/opt/podman/bin:/usr/local/bin:/usr/bin:/bin:' +
                   (ansible_facts['env']['PATH'] | default('')))}
         | combine(
             {'CONTAINER_CONNECTION': execution_environment_bootstrap_machine_name}
             if ansible_facts['system'] == 'Darwin' else {}
           ) }}

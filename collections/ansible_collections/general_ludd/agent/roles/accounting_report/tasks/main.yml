---
# accounting_report role — fetch per-project accounting and write cost/time/LoC/role-stats/todo report
#
# Uses gludd_accounting to fetch accounting snapshots for all or one project,
# then writes a per-project cost/time/LoC/role-stats/todo report artifact
# (JSON + markdown) to artifact_dir.
#
# REPORT-ONLY: never mutates the repo or accounting DB.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Fetch accounting ──────────────────────────────────────────────────────────

- name: Fetch accounting for all projects (scope=all)
  general_ludd.agent.gludd_accounting:
    state: all
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: _ar_all_result
  no_log: "{{ psk | length > 0 }}"
  when: accounting_scope == 'all'

- name: Fetch accounting for a single project (scope=project)
  general_ludd.agent.gludd_accounting:
    state: project
    project_id: "{{ accounting_project_id }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: _ar_proj_result
  no_log: "{{ psk | length > 0 }}"
  when: accounting_scope == 'project'

# ── Normalise to a list ───────────────────────────────────────────────────────

- name: Set accounting list (all)
  ansible.builtin.set_fact:
    _ar_snapshots: "{{ _ar_all_result.accounting }}"
  when: accounting_scope == 'all'

- name: Set accounting list (project — wrap single snapshot in list)
  ansible.builtin.set_fact:
    _ar_snapshots: "{{ [_ar_proj_result.accounting] }}"
  when: accounting_scope == 'project'

# ── Aggregate summary ─────────────────────────────────────────────────────────

- name: Compute aggregate totals
  ansible.builtin.set_fact:
    _ar_total_usd: "{{ _ar_snapshots | map(attribute='usd_spent') | map('float') | sum | round(6) }}"
    _ar_total_tokens: "{{ _ar_snapshots | map(attribute='tokens_used') | map('int') | sum }}"
    _ar_total_elapsed: "{{ _ar_snapshots | map(attribute='elapsed_seconds') | map('float') | sum | round(2) }}"
    _ar_total_loc: "{{ _ar_snapshots | map(attribute='loc_changed') | map('int') | sum }}"
    _ar_project_count: "{{ _ar_snapshots | length }}"

# ── Write JSON artifact ───────────────────────────────────────────────────────

- name: Write accounting report JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'accounting_report',
        'scope': accounting_scope,
        'project_count': _ar_project_count | int,
        'total_usd_spent': _ar_total_usd | float,
        'total_tokens_used': _ar_total_tokens | int,
        'total_elapsed_seconds': _ar_total_elapsed | float,
        'total_loc_changed': _ar_total_loc | int,
        'snapshots': _ar_snapshots
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/accounting_report.json"
    mode: "0644"

# ── Write Markdown artifact ───────────────────────────────────────────────────

- name: Write accounting report markdown artifact
  ansible.builtin.copy:
    content: |
      # Accounting Report

      **Scope:** {{ accounting_scope }}
      **Projects:** {{ _ar_project_count }}

      ## Totals

      | Metric            | Value |
      |-------------------|-------|
      | USD Spent         | ${{ _ar_total_usd }} |
      | Tokens Used       | {{ _ar_total_tokens }} |
      | Elapsed (seconds) | {{ _ar_total_elapsed }} |
      | LoC Changed       | {{ _ar_total_loc }} |

      ## Per-Project Snapshots

      {% for snap in _ar_snapshots %}
      ### {{ snap.project_id }}

      - **USD Spent:** ${{ snap.usd_spent }}
      - **Tokens Used:** {{ snap.tokens_used }}
      - **Elapsed:** {{ snap.elapsed_seconds }}s
      - **LoC Changed:** {{ snap.loc_changed }}
      - **Quota:** ${{ snap.quota_usd }} ({{ snap.pct_quota | round(1) }}% used)
      - **Points Estimated:** {{ snap.points_estimated }}
      - **Points Done:** {{ snap.points_done }}
      {% if snap.role_stats %}
      - **Role Stats:** {{ snap.role_stats | to_json }}
      {% endif %}
      {% if snap.todo_summary %}
      - **Todo Summary:** {{ snap.todo_summary | to_json }}
      {% endif %}

      {% endfor %}
      ---
      *Generated by general_ludd.agent.accounting_report — report-only, no repo mutations.*
    dest: "{{ artifact_dir }}/accounting_report.md"
    mode: "0644"

- name: Report accounting summary
  ansible.builtin.debug:
    msg: >-
      Accounting report complete: {{ _ar_project_count }} project(s),
      ${{ _ar_total_usd }} USD spent, {{ _ar_total_tokens }} tokens.

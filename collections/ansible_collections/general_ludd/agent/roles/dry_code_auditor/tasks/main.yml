---
# dry_code_auditor role — detect code duplication (DRY violations)
#
# Uses jscpd for clone detection. jscpd is gated behind enable_jscpd:false.
# When disabled, jscpd_output_override provides canned jscpd JSON.
# Parses jscpd JSON to extract clone pairs, compute duplication_pct,
# and propose extraction suggestions.
#
# REPORT-ONLY: never mutates the repo.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Run jscpd or use override ─────────────────────────────────────────────────

- name: Run jscpd clone detection (when enabled)
  ansible.builtin.command:
    cmd: >-
      jscpd "{{ scan_path }}" --min-tokens {{ min_tokens }}
      --reporters json --output /tmp/jscpd-{{ artifact_dir | basename }}
      --ignore "**/*.md,**/*.txt"
  register: _dca_jscpd_raw
  changed_when: false
  failed_when: _dca_jscpd_raw.rc not in [0, 1]
  when: enable_jscpd | bool

- name: Load jscpd JSON output (when jscpd ran)
  ansible.builtin.slurp:
    src: "/tmp/jscpd-{{ artifact_dir | basename }}/jscpd-report.json"
  register: _dca_jscpd_file
  when: enable_jscpd | bool
  failed_when: false

- name: Parse jscpd output (when jscpd ran)
  ansible.builtin.set_fact:
    _dca_jscpd_data: "{{ _dca_jscpd_file.content | default('') | b64decode | from_json }}"
  when:
    - enable_jscpd | bool
    - _dca_jscpd_file is defined
    - _dca_jscpd_file.content is defined

- name: Use jscpd output override (when jscpd disabled)
  ansible.builtin.set_fact:
    _dca_jscpd_data: "{{ jscpd_output_override | from_json }}"
  when:
    - not enable_jscpd | bool
    - jscpd_output_override | length > 0

- name: Set empty jscpd data (no override, jscpd disabled)
  ansible.builtin.set_fact:
    _dca_jscpd_data: >-
      {{ {'statistics': {'total': {'percentage': 0.0}}, 'duplicates': []} }}
  when:
    - not enable_jscpd | bool
    - jscpd_output_override | length == 0

# ── Extract duplicates from jscpd output ─────────────────────────────────────

- name: Extract clone pairs from jscpd data
  ansible.builtin.set_fact:
    _dca_duplicates: >-
      {{
        _dca_jscpd_data.duplicates | default([]) | map('combine', {}) | list
      }}
    _dca_duplication_pct: >-
      {{
        _dca_jscpd_data.statistics.total.percentage | default(0.0) | float
      }}

- name: Build extraction suggestions from duplicate pairs
  ansible.builtin.set_fact:
    _dca_suggestions: >-
      {{
        _dca_duplicates | map('combine', {'suggestion': 'Extract duplicated block into shared function/module'}) | list
      }}

- name: Determine verdict
  ansible.builtin.set_fact:
    _dca_verdict: >-
      {{
        'pass' if _dca_duplication_pct | float < 5.0
        else ('warn' if _dca_duplication_pct | float < 15.0
        else 'fail')
      }}

# ── Write artifacts ───────────────────────────────────────────────────────────

- name: Write JSON dry code audit artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'dry_code_auditor',
        'status': 'completed',
        'scan_path': scan_path,
        'min_tokens': min_tokens | int,
        'duplicates': _dca_duplicates,
        'extraction_suggestions': _dca_suggestions,
        'duplication_pct': _dca_duplication_pct | float,
        'verdict': _dca_verdict
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/dry_code_auditor.json"
    mode: "0644"

- name: Write markdown dry code audit report
  ansible.builtin.copy:
    content: |
      # DRY Code Audit Report

      **Target:** `{{ scan_path }}`
      **Verdict:** {{ _dca_verdict | upper }}
      **Duplication:** {{ _dca_duplication_pct }}%
      **Clone pairs:** {{ _dca_duplicates | length }}

      ## Duplicate Blocks

      {% if _dca_duplicates | length == 0 %}
      No duplicate blocks detected above {{ min_tokens }}-token threshold.
      {% else %}
      {% for dup in _dca_duplicates %}
      ### Clone pair {{ loop.index }}

      {% if dup.firstFile is defined %}
      - **File A:** `{{ dup.firstFile.name | default('unknown') }}` lines {{ dup.firstFile.start | default('?') }}-{{ dup.firstFile.end | default('?') }}
      - **File B:** `{{ dup.secondFile.name | default('unknown') }}` lines {{ dup.secondFile.start | default('?') }}-{{ dup.secondFile.end | default('?') }}
      {% else %}
      - Duplicate block detected
      {% endif %}
      - **Suggestion:** {{ dup.suggestion | default('Extract duplicated block into shared function') }}

      {% endfor %}
      {% endif %}

      ---
      *Generated by general_ludd.agent.dry_code_auditor — report-only, no auto-refactor.*
    dest: "{{ artifact_dir }}/dry_code_auditor.md"
    mode: "0644"

- name: Report dry code audit completion
  ansible.builtin.debug:
    msg: >-
      DRY code audit complete: duplication={{ _dca_duplication_pct }}%
      clones={{ _dca_duplicates | length }}
      verdict={{ _dca_verdict }}

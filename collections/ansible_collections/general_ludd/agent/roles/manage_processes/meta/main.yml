---
galaxy_info:
  role_name: manage_processes
  author: Agentic Harness Agent
  description: >
    Enumerate, monitor, and signal gludd-managed OS processes. Gathers the
    managed process list and per-pid resource stats, reports cpu/mem/io/locks,
    and (opt-in) applies a threshold policy that graceful-signals then
    escalates to SIGKILL. Signalling is dry_run by default.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

---
# parallel_planner role — compute a concurrency-safe execution plan
#
# Uses gludd_schedule to POST work items to /api/schedule, then writes the
# batched execution plan (which items can run concurrently vs serially) as
# JSON and Markdown artifacts in artifact_dir.
#
# READ-ONLY from the controller perspective: the role never mutates the repo
# or any daemon state beyond what the scheduler endpoint persists internally.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Call the scheduler ─────────────────────────────────────────────────────

- name: Request concurrency-safe execution plan from daemon
  general_ludd.agent.gludd_schedule:
    items: "{{ work_items }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: _pp_schedule_result
  no_log: "{{ psk | length > 0 }}"

# ── Classify batches ───────────────────────────────────────────────────────

- name: Collect batch metadata
  ansible.builtin.set_fact:
    _pp_batches: "{{ _pp_schedule_result.batches }}"
    _pp_batch_count: "{{ _pp_schedule_result.batch_count | int }}"
    _pp_item_count: "{{ _pp_schedule_result.item_count | int }}"

- name: Compute plan summary
  ansible.builtin.set_fact:
    _pp_summary: >-
      {{
        _pp_item_count | string + ' items -> ' +
        _pp_batch_count | string + ' batches'
      }}

# ── Write artifacts ────────────────────────────────────────────────────────

- name: Write execution plan JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'parallel_planner',
        'summary': _pp_summary,
        'item_count': _pp_item_count | int,
        'batch_count': _pp_batch_count | int,
        'batches': _pp_batches,
        'work_items': work_items
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/parallel_planner.json"
    mode: "0644"

- name: Write execution plan Markdown artifact
  ansible.builtin.copy:
    content: |
      # Parallel Execution Plan

      **Summary:** {{ _pp_summary }}

      ## Batch Details

      | Batch | Items | Can Run Concurrently? |
      |-------|-------|-----------------------|
      {% for batch in _pp_batches %}
      | {{ loop.index }} | {{ batch | join(', ') }} | {{ 'Yes' if batch | length > 1 else 'No (serial)' }} |
      {% endfor %}

      ## Execution Order

      {% for batch in _pp_batches %}
      ### Batch {{ loop.index }}{% if batch | length > 1 %} (run concurrently){% endif %}

      {% for item_id in batch %}
      - `{{ item_id }}`
      {% endfor %}
      {% endfor %}

      ---
      *Generated by general_ludd.agent.parallel_planner — plan-only, no repo mutations.*
    dest: "{{ artifact_dir }}/parallel_planner.md"
    mode: "0644"

- name: Report plan completion
  ansible.builtin.debug:
    msg: "Parallel planner complete: {{ _pp_summary }}"

---
# scan_conflict_markers role — scan for unresolved git conflict markers
#
# Wraps scripts/scan_conflicts.py to scan files for <<<<<<<, |||||||, =======,
# and >>>>>>> markers. Suppresses ======= false-positives (markdown horizontal
# rules, RST section underlines) by only flagging ======= when the file also
# contains a <<<<<<< or >>>>>>> marker.
#
# With no paths, scans all git-tracked files via git ls-files.

- name: Preflight managed-host runtime
  ansible.builtin.include_role:
    name: general_ludd.agent.managed_python_preflight
    tasks_from: main
    public: false
  vars:
    managed_python_preflight_interpreter: "{{ ansible_python_interpreter }}"
    managed_python_preflight_lock_sha256: "{{ gludd_managed_python_lock_sha256 }}"
    managed_python_preflight_previous_interpreter: "{{ gludd_previous_python_interpreter | default('') }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Scan for conflict markers
  ansible.builtin.command:
    cmd: >-
      {{ ansible_python_interpreter }} scripts/scan_conflicts.py
      {% for path in scan_paths %}{{ path }} {% endfor %}
    chdir: "{{ repo_path }}"
  register: _scm_result
  changed_when: false
  failed_when: false

- name: Parse scan result
  ansible.builtin.set_fact:
    _scm_exit_code: "{{ _scm_result.rc }}"
    _scm_has_conflicts: "{{ _scm_result.rc != 0 }}"
    _scm_output: "{{ _scm_result.stdout_lines | default([]) }}"

- name: Write conflict scan JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'scan_conflict_markers',
        'exit_code': _scm_exit_code,
        'has_conflicts': _scm_has_conflicts,
        'scan_paths': scan_paths,
        'stdout': _scm_output,
        'stderr': _scm_result.stderr_lines | default([])
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/scan_conflict_markers.json"
    mode: "0644"

- name: Write conflict scan markdown artifact
  ansible.builtin.copy:
    content: |
      # Conflict Marker Scan Report

      {% if _scm_has_conflicts | bool %}
      **Verdict:** CONFLICTS FOUND — unresolved merge/rebase markers exist
      {% else %}
      **Verdict:** CLEAN — no conflict markers found
      {% endif %}

      {% if _scm_output | length > 0 %}
      ## Findings

      ```
      {% for line in _scm_output %}
      {{ line }}
      {% endfor %}
      ```
      {% endif %}

      ---
      *Generated by general_ludd.agent.scan_conflict_markers — audit-only, no repo mutations.*
    dest: "{{ artifact_dir }}/scan_conflict_markers.md"
    mode: "0644"

- name: Report conflict scan completion
  ansible.builtin.debug:
    msg: "Conflict scan complete. Conflicts found: {{ _scm_has_conflicts }}"

---
# sbom_generate role — produce a CycloneDX SBOM (syft/cyclonedx)
#
# Runs syft to generate a CycloneDX SBOM when enable_syft=true; otherwise uses
# sbom_output_override (a minimal valid CycloneDX document) so molecule can
# exercise the full artifact logic without installing syft.
# Extracts component count and top deps from the SBOM JSON.
# REPORT-ONLY: never mutates the repo.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Optionally run syft ───────────────────────────────────────────────────────

- name: Run syft to generate CycloneDX SBOM (enable_syft=true only)
  ansible.builtin.command:
    cmd: >-
      syft "{{ target_path }}"
      --output "cyclonedx-json={{ artifact_dir }}/sbom.cyclonedx.raw.json"
      --quiet
  register: _sbom_syft_run
  changed_when: true
  failed_when: false
  when:
    - enable_syft | bool
    - not ansible_check_mode

- name: Read syft-generated SBOM (enable_syft=true)
  ansible.builtin.slurp:
    src: "{{ artifact_dir }}/sbom.cyclonedx.raw.json"
  register: _sbom_syft_raw
  when:
    - enable_syft | bool
    - not ansible_check_mode
    - _sbom_syft_run.rc is defined and _sbom_syft_run.rc == 0

- name: Set SBOM content from syft output
  ansible.builtin.set_fact:
    _sbom_content: "{{ _sbom_syft_raw.content | b64decode }}"
  when:
    - enable_syft | bool
    - not ansible_check_mode
    - _sbom_syft_raw is defined and 'content' in _sbom_syft_raw

# ── Use override when syft not run or failed ─────────────────────────────────

- name: Use sbom_output_override (syft disabled, check_mode, or syft failed)
  ansible.builtin.set_fact:
    _sbom_content: "{{ sbom_output_override }}"
  when: _sbom_content is not defined

# ── Parse SBOM JSON to extract component count and top deps ──────────────────

- name: Parse SBOM JSON
  ansible.builtin.set_fact:
    _sbom_parsed: "{{ _sbom_content | from_json }}"
  failed_when: false

- name: Set parse fallback (invalid JSON)
  ansible.builtin.set_fact:
    _sbom_parsed: {"components": [], "metadata": {"component": {"name": "unknown"}}}
  when: _sbom_parsed is not defined

- name: Extract component list and counts
  ansible.builtin.set_fact:
    _sbom_components: "{{ _sbom_parsed.components | default([]) }}"
    _sbom_component_count: "{{ _sbom_parsed.components | default([]) | length }}"
    _sbom_spec_version: "{{ _sbom_parsed.specVersion | default('1.4') }}"
    _sbom_schema_version: "{{ _sbom_parsed.version | default('1') }}"
    _sbom_target_name: "{{ _sbom_parsed.metadata.component.name | default(target_path | basename) }}"

- name: Derive top 10 deps by name
  ansible.builtin.set_fact:
    _sbom_top_deps: >-
      {{
        _sbom_components
        | map(attribute='name') | list
        | sort | unique
        | list
      }}[:10]

# ── Write artifacts ───────────────────────────────────────────────────────────

- name: Write CycloneDX SBOM artifact (canonical copy)
  ansible.builtin.copy:
    content: "{{ _sbom_content }}"
    dest: "{{ artifact_dir }}/sbom.cyclonedx.json"
    mode: "0644"

- name: Write JSON SBOM summary artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'sbom_generate',
        'status': 'completed',
        'target_path': target_path,
        'sbom_format': sbom_format,
        'syft_ran': enable_syft | bool and not ansible_check_mode,
        'spec_version': _sbom_spec_version,
        'schema_version': _sbom_schema_version,
        'target_name': _sbom_target_name,
        'component_count': _sbom_component_count | int,
        'top_deps': _sbom_top_deps
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/sbom_generate.json"
    mode: "0644"

- name: Write markdown SBOM report
  ansible.builtin.copy:
    content: |
      # SBOM Report: {{ _sbom_target_name }}

      **Target:** `{{ target_path }}`
      **Format:** {{ sbom_format }}
      **Syft ran:** {{ enable_syft | bool and not ansible_check_mode }}
      **CycloneDX spec:** {{ _sbom_spec_version }}
      **Components:** {{ _sbom_component_count }}

      ## Top Dependencies ({{ _sbom_top_deps | length }})

      {% for dep in _sbom_top_deps %}
      - {{ dep }}
      {% endfor %}

      ## Artifact

      `{{ artifact_dir }}/sbom.cyclonedx.json`

      ---
      *Generated by general_ludd.agent.sbom_generate — report-only.*
    dest: "{{ artifact_dir }}/sbom_generate.md"
    mode: "0644"

- name: Report SBOM generation completion
  ansible.builtin.debug:
    msg: >-
      SBOM generated: target={{ target_path }}
      components={{ _sbom_component_count }}
      format={{ sbom_format }}

---
galaxy_info:
  role_name: estimate_story
  author: Agentic Harness Agent
  description: >
    Assigns story points (Fibonacci: 1,2,3,5,8,13,21) from complexity
    heuristics (word count, integration keywords, backlog pressure) calibrated
    by historical velocity from facts.history. Fetches story from gludd_db
    (story_id) or uses inline story_text. Point computation is REAL — not
    random. REPORT-ONLY: never mutates the repo.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

---
galaxy_info:
  role_name: log_analyst
  author: Agentic Harness Agent
  description: >
    Analyses logs/traces for anomalies: error-line density spikes, per-phase
    failure rates, and cost/token outliers. Uses gludd_facts (traces.by_phase,
    history.failures) plus slurp/grep of local log files. Emits a structured
    anomalies list with severity + evidence. NEVER mutates the repo.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

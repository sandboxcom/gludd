---
# ci_annotations_poll role — poll live CI annotations for a run
#
# Wraps scripts/ci_annotations_poll.py to fetch per-line failure annotations
# from a GitHub Actions CI run as jobs complete. Polls until all jobs done
# or timeout, then writes artifact with summary.

- name: Preflight managed-host runtime
  ansible.builtin.include_role:
    name: general_ludd.agent.managed_python_preflight
    tasks_from: main
    public: false
  vars:
    managed_python_preflight_interpreter: "{{ ansible_python_interpreter }}"
    managed_python_preflight_lock_sha256: "{{ gludd_managed_python_lock_sha256 }}"
    managed_python_preflight_previous_interpreter: "{{ gludd_previous_python_interpreter | default('') }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Poll CI annotations for run
  ansible.builtin.command:
    cmd: "{{ ansible_python_interpreter }} scripts/ci_annotations_poll.py {{ ci_run_id }}"
    chdir: "{{ repo_path }}"
  environment:
    CI_ANN_INTERVAL: "{{ poll_interval_seconds }}"
    CI_ANN_MAX_SEC: "{{ poll_max_seconds }}"
    CI_ANN_EARLY_EXIT: "{{ early_exit_on_failure }}"
  register: _cap_result
  changed_when: false
  failed_when: false

- name: Parse poll result
  ansible.builtin.set_fact:
    _cap_exit_code: "{{ _cap_result.rc }}"
    _cap_output: "{{ _cap_result.stdout_lines | default([]) }}"
    _cap_success: "{{ _cap_result.rc == 0 }}"
    _cap_timeout: "{{ _cap_result.rc == 2 }}"

- name: Write CI annotations poll JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'ci_annotations_poll',
        'run_id': ci_run_id,
        'exit_code': _cap_exit_code,
        'success': _cap_success,
        'timeout': _cap_timeout,
        'stdout': _cap_output,
        'stderr': _cap_result.stderr_lines | default([])
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/ci_annotations_poll.json"
    mode: "0644"

- name: Write CI annotations poll markdown artifact
  ansible.builtin.copy:
    content: |
      # CI Annotations Poll Report — Run {{ ci_run_id }}

      {% if _cap_success | bool %}
      **Verdict:** SUCCESS — run completed, no failure annotations
      {% elif _cap_timeout | bool %}
      **Verdict:** TIMEOUT — poll exceeded {{ poll_max_seconds }}s
      {% else %}
      **Verdict:** FAILURE — run had failure annotations
      {% endif %}

      ## Output

      ```
      {% for line in _cap_output %}
      {{ line }}
      {% endfor %}
      ```

      ---
      *Generated by general_ludd.agent.ci_annotations_poll — read-only CI poll*
    dest: "{{ artifact_dir }}/ci_annotations_poll.md"
    mode: "0644"

- name: Report CI annotations poll completion
  ansible.builtin.debug:
    msg: "CI annotations poll for run {{ ci_run_id }}: {% if _cap_success %}SUCCESS{% elif _cap_timeout %}TIMEOUT{% else %}FAILURE{% endif %}"

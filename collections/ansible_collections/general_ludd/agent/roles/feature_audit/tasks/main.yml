---
# feature_audit role — fetch and audit the feature database
#
# Uses gludd_features to list features (and optionally trigger verification),
# then writes an audit artifact JSON + summary to artifact_dir.
#
# AUDIT-ONLY: never mutates the repo or feature DB beyond what the verify
# endpoint persists internally.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Optional: trigger server-side verification pass ───────────────────────

- name: Trigger server-side feature verification
  general_ludd.agent.gludd_features:
    state: verify
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
  register: _fa_verify_result
  no_log: "{{ psk | length > 0 }}"
  when: run_verify | bool

- name: Set verify summary (when run_verify=true)
  ansible.builtin.set_fact:
    _fa_verify_summary: "{{ _fa_verify_result.summary }}"
    _fa_verify_results: "{{ _fa_verify_result.results }}"
  when: run_verify | bool

- name: Set verify summary (when run_verify=false, skip)
  ansible.builtin.set_fact:
    _fa_verify_summary: {}
    _fa_verify_results: []
  when: not (run_verify | bool)

# ── Fetch feature list ─────────────────────────────────────────────────────

- name: Fetch feature list from daemon
  general_ludd.agent.gludd_features:
    state: list
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    status: "{{ feature_status_filter if feature_status_filter | length > 0 else omit }}"
    category: "{{ feature_category_filter if feature_category_filter | length > 0 else omit }}"
  register: _fa_features_result
  no_log: "{{ psk | length > 0 }}"

# ── Classify features by status ────────────────────────────────────────────

- name: Classify features by status
  ansible.builtin.set_fact:
    _fa_all_features: "{{ _fa_features_result.features }}"
    _fa_verified: "{{ _fa_features_result.features | selectattr('status', 'equalto', 'verified') | list }}"
    _fa_implemented: "{{ _fa_features_result.features | selectattr('status', 'equalto', 'implemented') | list }}"
    _fa_regressed: "{{ _fa_features_result.features | selectattr('status', 'equalto', 'regressed') | list }}"
    _fa_requested: "{{ _fa_features_result.features | selectattr('status', 'equalto', 'requested') | list }}"

- name: Compute audit health
  ansible.builtin.set_fact:
    _fa_status: >-
      {{
        'clean' if (_fa_regressed | length == 0) else
        'regressions_detected'
      }}
    _fa_summary: >-
      {{
        _fa_features_result.total | string + ' features: ' +
        (_fa_verified | length) | string + ' verified, ' +
        (_fa_implemented | length) | string + ' implemented, ' +
        (_fa_requested | length) | string + ' requested, ' +
        (_fa_regressed | length) | string + ' regressed.'
      }}

# ── Write audit artifacts ──────────────────────────────────────────────────

- name: Write feature audit JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'feature_audit',
        'status': _fa_status,
        'summary': _fa_summary,
        'total': _fa_features_result.total,
        'verified_count': _fa_verified | length,
        'implemented_count': _fa_implemented | length,
        'requested_count': _fa_requested | length,
        'regressed_count': _fa_regressed | length,
        'features': _fa_all_features,
        'regressed': _fa_regressed,
        'verify_summary': _fa_verify_summary
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/feature_audit.json"
    mode: "0644"

- name: Write feature audit markdown artifact
  ansible.builtin.copy:
    content: |
      # Feature Audit Report

      **Status:** {{ _fa_status }}
      **Summary:** {{ _fa_summary }}

      ## Counts

      | Status      | Count |
      |-------------|-------|
      | Verified    | {{ _fa_verified | length }} |
      | Implemented | {{ _fa_implemented | length }} |
      | Requested   | {{ _fa_requested | length }} |
      | Regressed   | {{ _fa_regressed | length }} |

      {% if _fa_regressed | length > 0 %}
      ## Regressions (action required)

      {% for feat in _fa_regressed %}
      - **{{ feat.name }}** ({{ feat.category }}): {{ feat.description | truncate(120) }}
      {% endfor %}
      {% endif %}

      ## All Features

      {% for feat in _fa_all_features %}
      - [{{ feat.status | upper }}] **{{ feat.name }}** ({{ feat.category }})
      {% endfor %}

      ---
      *Generated by general_ludd.agent.feature_audit — audit-only, no repo mutations.*
    dest: "{{ artifact_dir }}/feature_audit.md"
    mode: "0644"

- name: Report feature audit completion
  ansible.builtin.debug:
    msg: "Feature audit complete: {{ _fa_summary }}"

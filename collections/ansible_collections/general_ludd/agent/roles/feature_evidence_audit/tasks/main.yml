---
# feature_evidence_audit role — audit features.yml for false claims via audit_features.py
#
# Reads docs/features.yml, counts features at 100%, classifies evidence quality,
# flags false claims (100% with no evidence or missing test files), and writes
# audit artifacts.  NEVER mutates the repo.

- name: Preflight managed-host runtime
  ansible.builtin.include_role:
    name: general_ludd.agent.managed_python_preflight
    tasks_from: main
    public: false
  vars:
    managed_python_preflight_interpreter: "{{ ansible_python_interpreter }}"
    managed_python_preflight_lock_sha256: "{{ gludd_managed_python_lock_sha256 }}"
    managed_python_preflight_previous_interpreter: "{{ gludd_previous_python_interpreter | default('') }}"

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Run feature evidence audit script
  ansible.builtin.command:
    cmd: "{{ ansible_python_interpreter }} scripts/audit_features.py"
    chdir: "{{ repo_path }}"
  register: _fea_result
  changed_when: false
  failed_when: false

- name: Write feature evidence audit JSON artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'feature_evidence_audit',
        'exit_code': _fea_result.rc,
        'stdout': _fea_result.stdout_lines,
        'stderr': _fea_result.stderr_lines
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/feature_evidence_audit.json"
    mode: "0644"

- name: Write feature evidence audit markdown artifact
  ansible.builtin.copy:
    content: |
      # Feature Evidence Audit Report

      **Exit code:** {{ _fea_result.rc }}
      {% if _fea_result.rc == 0 %}
      **Verdict:** CLEAN — no false claims detected
      {% else %}
      **Verdict:** ISSUES FOUND — false claims or missing evidence exist
      {% endif %}

      ## Full Output

      ```
      {% for line in _fea_result.stdout_lines | default([]) %}
      {{ line }}
      {% endfor %}
      ```

      ---
      *Generated by general_ludd.agent.feature_evidence_audit — audit-only, no repo mutations.*
    dest: "{{ artifact_dir }}/feature_evidence_audit.md"
    mode: "0644"

- name: Report feature evidence audit completion
  ansible.builtin.debug:
    msg: "Feature evidence audit complete. Exit code: {{ _fea_result.rc }}"

      - search
    quality_class: medium
    aliases:
      - find_flights
      - airfare
  - name: hotel_search
    description: Hotel availability, pricing, and amenity search
    roles:
      - hotel_search
    model_needs:
      - search
    quality_class: medium
    aliases:
      - find_hotels
      - lodging
  - name: web_search
    description: Web search via SearXNG metasearch engine
    roles:
      - searxng_search
    model_needs:
      - search
      - web_access
    quality_class: medium
    aliases:
      - search_web
      - metasearch

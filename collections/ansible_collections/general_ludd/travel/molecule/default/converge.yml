---
- name: "Travel collection integration test"
  hosts: localhost
  gather_facts: false
  vars:
    test_city: "Tokyo"
    test_country: "Japan"
    test_query: "best ramen shops"
  tasks:
    - name: "Run trip planner role"
      ansible.builtin.include_role:
        name: general_ludd.travel.trip_planner
      vars:
        destination: "{{ test_city }}, {{ test_country }}"
        duration_days: 3

    - name: "Run flight search module"
      general_ludd.travel.flight_search:
        origin: "SFO"
        destination: "NRT"
        depart_date: "2026-09-01"

    - name: "Run hotel search module"
      general_ludd.travel.hotel_search:
        destination: "{{ test_city }}"
        check_in: "2026-09-01"
        check_out: "2026-09-04"

    - name: "Resolve local guide results through the travel search module"
      general_ludd.travel.searxng_search:
        query: "{{ test_query }} in {{ test_city }}, {{ test_country }}"
        category: restaurants
        timeout: 5
      register: local_guide_results
      failed_when: false

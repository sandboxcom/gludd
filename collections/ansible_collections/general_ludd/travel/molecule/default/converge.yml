---
- name: "Travel collection integration test"
  hosts: localhost
  gather_facts: false
  vars:
    test_city: "Tokyo"
    test_country: "Japan"
    test_query: "best ramen shops"
  tasks:
    - name: "Run trip planner role"
      ansible.builtin.include_role:
        name: trip_planner
      vars:
        destination: "{{ test_city }}, {{ test_country }}"
        duration_days: 3

    - name: "Run flight search role"
      ansible.builtin.include_role:
        name: flight_search
      vars:
        origin: "SFO"
        destination: "NRT"
        departure_date: "2026-09-01"

    - name: "Run hotel search role"
      ansible.builtin.include_role:
        name: hotel_search
      vars:
        location: "{{ test_city }}"
        checkin: "2026-09-01"
        checkout: "2026-09-04"

    - name: "Run local guide role"
      ansible.builtin.include_role:
        name: local_guide
      vars:
        location: "{{ test_city }}"
        query: "{{ test_query }}"

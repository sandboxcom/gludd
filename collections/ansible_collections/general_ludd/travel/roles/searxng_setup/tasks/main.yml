---
# SearXNG is a controller-side Python integration.  The paired action plugin
# owns lifecycle state; managed hosts need neither Docker nor Gludd installed.

- name: Manage native SearXNG integration
  general_ludd.travel.searxng_instance:
    state: "{{ 'started' if searxng_enabled | bool else 'stopped' }}"
    namespace: "{{ searxng_namespace }}"
    settings_path: "{{ searxng_settings_path }}"
  register: searxng_instance_result

- name: Report native SearXNG integration state
  ansible.builtin.debug:
    msg: >-
      SearXNG {{ 'running' if searxng_instance_result.running | bool else 'stopped' }}
      as {{ searxng_instance_result.instance_uri }}
  changed_when: false

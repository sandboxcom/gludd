---
- name: Converge
  hosts: localhost
  gather_facts: false
  vars:
    searxng_config_dir: "/tmp/gludd-searxng-test"
    searxng_port: 18080
    artifact_dir: "/tmp/gludd-searxng-test-artifacts"
  tasks:
    - name: "Include searxng_setup"
      ansible.builtin.include_role:
        name: "general_ludd.travel.searxng_setup"
      vars:
        searxng_enabled: false

    - name: Test SearXNG search module (check mode)
      general_ludd.travel.searxng_search:
        query: "flights JFK to LHR"
        category: flights
        searxng_url: "http://localhost:18080"
        max_results: 5
        timeout: 5
      register: flight_result
      ignore_errors: true
      check_mode: true

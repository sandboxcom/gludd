---
galaxy_info:
  role_name: dna_analyst
  author: Agentic Harness Agent
  description: >
    Compare and match DNA profiles for forensic analysis.
    Supports STR (Short Tandem Repeat), CODIS (Combined DNA Index System),
    mtDNA (mitochondrial), and Y-chromosome analysis types.
    Outputs a verdict JSON with match_result, probability, and loci_count.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

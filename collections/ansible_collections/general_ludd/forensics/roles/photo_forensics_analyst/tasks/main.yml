---
# photo_forensics_analyst role -- digital photo/video forensics analysis
#
# 1. Load image bytes from photo_forensics_image_path
# 2. Run selected analysis types: metadata, ela, modification, ai_detection, camera_id
# 3. Combine results and write verdict artifact

- name: Validate analysis types
  ansible.builtin.assert:
    that:
      - photo_forensics_analysis_types | length > 0
      - photo_forensics_analysis_types | selectattr('defined') | list | length > 0
    fail_msg: "photo_forensics_analysis_types must be a non-empty list"
  when: photo_forensics_enabled | bool

- name: Validate image path
  ansible.builtin.assert:
    that:
      - photo_forensics_image_path | length > 0
    fail_msg: "photo_forensics_image_path must be set to a valid image file path"
  when: photo_forensics_enabled | bool

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ photo_forensics_output_dir }}"
    state: directory
    mode: "0755"
  when: photo_forensics_enabled | bool

- name: Run photo forensics analysis
  block:
    - name: Analyze image via photo_forensics module_utils
      ansible.builtin.script:
        cmd: |
          import json, sys
          sys.path.insert(0, "{{ playbook_dir }}/../../..")
          from ansible_collections.general_ludd.forensics.plugins.module_utils import (
              photo_forensics as pf,
          )

          path = "{{ photo_forensics_image_path }}"
          with open(path, "rb") as f:
              data = f.read()

          types = {{ photo_forensics_analysis_types | to_json }}
          results = {}

          if "metadata" in types:
              results["metadata"] = pf.extract_metadata(data)
          if "ela" in types:
              results["ela"] = pf.compute_ela(data)
          if "modification" in types:
              results["modification"] = pf.detect_modifications(data)
          if "ai_detection" in types:
              results["ai_detection"] = pf.detect_ai_generated(data)
          if "camera_id" in types:
              results["camera_id"] = pf.identify_camera(data)

          results["analysis_types_run"] = types
          results["image_path"] = "{{ photo_forensics_image_path }}"
          print(json.dumps(results))
        executable: python3
      register: photo_forensics_output
      failed_when: false
      changed_when: false
      when: photo_forensics_enabled | bool

    - name: Parse photo forensics result
      ansible.builtin.set_fact:
        photo_forensics_result_raw: "{{ photo_forensics_output.stdout | from_json }}"
      when:
        - photo_forensics_enabled | bool
        - photo_forensics_output.rc == 0

    - name: Register photo forensics verdict
      ansible.builtin.set_fact:
        photo_forensics_verdict:
          image_path: "{{ photo_forensics_image_path }}"
          analysis_types_run: "{{ photo_forensics_result_raw.analysis_types_run }}"
          metadata_result: "{{ photo_forensics_result_raw.metadata | default({}) }}"
          ela_result: "{{ photo_forensics_result_raw.ela | default({}) }}"
          modification_result: "{{ photo_forensics_result_raw.modification | default({}) }}"
          ai_result: "{{ photo_forensics_result_raw.ai_detection | default({}) }}"
          camera_result: "{{ photo_forensics_result_raw.camera_id | default({}) }}"
      when: photo_forensics_result_raw is defined

    - name: Write photo forensics artifact
      ansible.builtin.copy:
        content: "{{ photo_forensics_verdict | to_nice_json }}"
        dest: "{{ photo_forensics_output_dir }}/photo_forensics_verdict.json"
        mode: "0644"
      when: photo_forensics_verdict is defined

  rescue:
    - name: Write failure artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'photo_forensics_analyst', 'status': 'failed',
              'image_path': photo_forensics_image_path,
              'error': photo_forensics_output.stderr | default('unknown error')} | to_nice_json }}
        dest: "{{ photo_forensics_output_dir }}/photo_forensics_verdict.json"
        mode: "0644"
      failed_when: false

    - name: Fail after rescue cleanup
      ansible.builtin.fail:
        msg: "photo_forensics_analyst failed -- see artifact for details"

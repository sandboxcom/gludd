---
# trace_evidence_examiner role — analyze and compare trace evidence
#
# Invokes the trace_evidence_examiner module_utils functions to:
#   1. Validate role parameters and evidence type
#   2. Compare sample data against reference data
#   3. Compute match result and confidence
#   4. Write the JSON verdict artifact to the output directory

- name: Validate trace evidence type
  ansible.builtin.assert:
    that:
      - trace_evidence_type in ["fiber", "hair", "glass", "paint", "soil", "gsr", "toolmark", "footwear", "tire"]
    fail_msg: "trace_evidence_type must be one of: fiber, hair, glass, paint, soil, gsr, toolmark, footwear, tire. Got: {{ trace_evidence_type }}"
  when: trace_evidence_enabled | bool

- name: Validate sample and reference data provided
  ansible.builtin.assert:
    that:
      - trace_evidence_sample_data | length > 0
      - trace_evidence_reference_data | length > 0
    fail_msg: "Both trace_evidence_sample_data and trace_evidence_reference_data must be non-empty dicts"
  when: trace_evidence_enabled | bool

- name: Ensure output directory
  ansible.builtin.file:
    path: "{{ trace_evidence_output_dir }}"
    state: directory
    mode: "0755"
  when: trace_evidence_enabled | bool

- name: Run trace evidence analysis
  block:
    - name: Examine evidence via packaged forensics module
      general_ludd.forensics.forensic_analysis:
        operation: trace
        evidence_type: "{{ trace_evidence_type }}"
        sample: "{{ trace_evidence_sample_data }}"
        reference: "{{ trace_evidence_reference_data }}"
        output_dir: "{{ trace_evidence_output_dir }}"
      register: trace_evidence_result
      when: trace_evidence_enabled | bool

    - name: Parse trace evidence result
      ansible.builtin.set_fact:
        trace_evidence_output: "{{ trace_evidence_result.result }}"
      when:
        - trace_evidence_enabled | bool
        - trace_evidence_result.result is defined

    - name: Register verdict fact
      ansible.builtin.set_fact:
        trace_evidence_verdict:
          evidence_type: "{{ trace_evidence_output.evidence_type }}"
          findings: "{{ trace_evidence_output.match_result }}"
          match_result: "{{ trace_evidence_output.match_result }}"
          confidence: "{{ trace_evidence_output.confidence }}"
          output_path: "{{ trace_evidence_output.output_path }}"
      when:
        - trace_evidence_enabled | bool
        - trace_evidence_result.result is defined

    - name: Write trace evidence verdict artifact
      ansible.builtin.copy:
        content: "{{ trace_evidence_output | to_nice_json }}"
        dest: "{{ trace_evidence_output.output_path }}"
        mode: "0644"
      when: trace_evidence_result.result is defined

  rescue:
    - name: Write failure verdict artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'trace_evidence_examiner', 'status': 'failed',
              'evidence_type': trace_evidence_type,
              'error': trace_evidence_result.msg | default('unknown error')} | to_nice_json }}
        dest: "{{ trace_evidence_output_dir }}/trace_evidence_verdict.json"
        mode: "0644"
      failed_when: false

    - name: Fail the play after rescue cleanup
      ansible.builtin.fail:
        msg: "trace_evidence_examiner failed — see artifact for details"

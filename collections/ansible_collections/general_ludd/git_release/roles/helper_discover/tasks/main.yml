---
- name: Execute helper-discover through the git-release service
  ansible.builtin.include_role:
    name: general_ludd.git_release.service_request
  vars:
    git_release_service_enabled: "{{ git_release_helper_discover_enabled }}"
    git_release_service_operation: helper_discover
    git_release_service_request: "{{ git_release_helper_discover_request }}"
    git_release_service_result_fact: "{{ git_release_helper_discover_result_fact }}"
    git_release_service_output_path: "{{ git_release_helper_discover_output_path }}"

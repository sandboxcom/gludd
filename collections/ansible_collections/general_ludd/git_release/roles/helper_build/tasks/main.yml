---
- name: Execute helper-build through the git-release service
  ansible.builtin.include_role:
    name: general_ludd.git_release.service_request
  vars:
    git_release_service_enabled: "{{ git_release_helper_build_enabled }}"
    git_release_service_operation: helper_build
    git_release_service_request: "{{ git_release_helper_build_request }}"
    git_release_service_result_fact: "{{ git_release_helper_build_result_fact }}"
    git_release_service_output_path: "{{ git_release_helper_build_output_path }}"

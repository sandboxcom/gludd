---
- name: Execute release-plan through the git-release service
  ansible.builtin.include_role:
    name: general_ludd.git_release.service_request
  vars:
    git_release_service_enabled: "{{ git_release_release_plan_enabled }}"
    git_release_service_operation: release_plan
    git_release_service_request: "{{ git_release_release_plan_request }}"
    git_release_service_result_fact: "{{ git_release_release_plan_result_fact }}"
    git_release_service_output_path: "{{ git_release_release_plan_output_path }}"

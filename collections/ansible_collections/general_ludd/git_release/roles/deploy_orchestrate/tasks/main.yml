---
- name: Execute deploy-orchestrate through the git-release service
  ansible.builtin.include_role:
    name: general_ludd.git_release.service_request
  vars:
    git_release_service_enabled: "{{ git_release_deploy_orchestrate_enabled }}"
    git_release_service_operation: deploy_orchestrate
    git_release_service_request: "{{ git_release_deploy_orchestrate_request }}"
    git_release_service_result_fact: "{{ git_release_deploy_orchestrate_result_fact }}"
    git_release_service_output_path: "{{ git_release_deploy_orchestrate_output_path }}"

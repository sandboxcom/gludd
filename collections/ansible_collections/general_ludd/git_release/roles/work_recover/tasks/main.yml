---
- name: Execute work-recover through the git-release service
  ansible.builtin.include_role:
    name: general_ludd.git_release.service_request
  vars:
    git_release_service_enabled: "{{ git_release_work_recover_enabled }}"
    git_release_service_operation: work_recover
    git_release_service_request: "{{ git_release_work_recover_request }}"
    git_release_service_result_fact: "{{ git_release_work_recover_result_fact }}"
    git_release_service_output_path: "{{ git_release_work_recover_output_path }}"

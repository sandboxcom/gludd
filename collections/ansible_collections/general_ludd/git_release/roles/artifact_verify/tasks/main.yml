---
- name: Execute artifact-verify through the git-release service
  ansible.builtin.include_role:
    name: general_ludd.git_release.service_request
  vars:
    git_release_service_enabled: "{{ git_release_artifact_verify_enabled }}"
    git_release_service_operation: artifact_verify
    git_release_service_request: "{{ git_release_artifact_verify_request }}"
    git_release_service_result_fact: "{{ git_release_artifact_verify_result_fact }}"
    git_release_service_output_path: "{{ git_release_artifact_verify_output_path }}"

- name: Record exec findings
  ansible.builtin.set_fact:
    _ci_audit_findings: >-
      {{ _ci_audit_findings + _ci_exec.stdout_lines | default([]) |
         map('regex_replace', '^([^:]+):(\d+):(.*)$',
             '{"file":"\1","line":"\2","pattern":"exec()",
               "severity":"critical","context":"\3"}') |
         map('from_json') | list }}
  when:
    - enable_scan | bool
    - _ci_exec.stdout_lines | default([]) | length > 0

- name: "Audit: string concatenation in command construction"
  ansible.builtin.shell:
    cmd: >-
      grep -n -E --color=never
      '(f"[^"]*(\brm\b|\bmv\b|\bcp\b|\bcurl\b|\bwget\b|\becho\b|\bpip\b|\byum\b|\bapt\b)\b)"'
      {{ _ci_file_list }}
      || true
  register: _ci_string_concat
  changed_when: false
  failed_when: false
  when:
    - enable_scan | bool
    - _ci_file_list | default('') | length > 0

- name: Record string concatenation findings
  ansible.builtin.set_fact:
    _ci_audit_findings: >-
      {{ _ci_audit_findings + _ci_string_concat.stdout_lines | default([]) |
         map('regex_replace', '^([^:]+):(\d+):(.*)$',
             '{"file":"\1","line":"\2","pattern":"string concat command",
               "severity":"medium","context":"\3"}') |
         map('from_json') | list }}
  when:
    - enable_scan | bool
    - _ci_string_concat.stdout_lines | default([]) | length > 0

# ── Summarize ──────────────────────────────────────────────────────────────────

- name: Compute finding count
  ansible.builtin.set_fact:
    _ci_finding_count: "{{ _ci_audit_findings | length }}"

- name: Group findings by severity
  ansible.builtin.set_fact:
    _ci_findings_critical: >-
      {{ _ci_audit_findings | selectattr('severity', 'equalto', 'critical') | list | length }}
    _ci_findings_high: >-
      {{ _ci_audit_findings | selectattr('severity', 'equalto', 'high') | list | length }}
    _ci_findings_medium: >-
      {{ _ci_audit_findings | selectattr('severity', 'equalto', 'medium') | list | length }}

             '{"file":"\1","line":"\2","pattern":"commands.getoutput()",
               "severity":"high","context":"\3"}') |
         map('from_json') | list }}
  when:
    - enable_scan | bool
    - _ci_commands.stdout_lines | default([]) | length > 0

- name: "Audit: eval( calls"
  ansible.builtin.shell:
    cmd: >-
      grep -n --color=never '\beval('
      {{ _ci_file_list }}
      || true
  register: _ci_eval
  changed_when: false
  failed_when: false
  when:
    - enable_scan | bool
    - _ci_file_list | default('') | length > 0

- name: Record eval findings
  ansible.builtin.set_fact:
    _ci_audit_findings: >-
      {{ _ci_audit_findings + _ci_eval.stdout_lines | default([]) |
         map('regex_replace', '^([^:]+):(\d+):(.*)$',
             '{"file":"\1","line":"\2","pattern":"eval()",
               "severity":"critical","context":"\3"}') |
         map('from_json') | list }}
  when:
    - enable_scan | bool
    - _ci_eval.stdout_lines | default([]) | length > 0

- name: "Audit: exec( calls"
  ansible.builtin.shell:
    cmd: >-
      grep -n --color=never '\bexec('
      {{ _ci_file_list }}
      || true
  register: _ci_exec
  changed_when: false
  failed_when: false

  when:
    - enable_scan | bool
    - _ci_file_list | default('') | length > 0

- name: Record os.popen findings
  ansible.builtin.set_fact:
    _ci_audit_findings: >-
      {{ _ci_audit_findings + _ci_os_popen.stdout_lines | default([]) |
         map('regex_replace', '^([^:]+):(\d+):(.*)$',
             '{"file":"\1","line":"\2","pattern":"os.popen()",
               "severity":"critical","context":"\3"}') |
         map('from_json') | list }}
  when:
    - enable_scan | bool
    - _ci_os_popen.stdout_lines | default([]) | length > 0

- name: "Audit: commands.getoutput( calls"
  ansible.builtin.shell:
    cmd: >-
      grep -n --color=never 'commands\.getoutput('
      {{ _ci_file_list }}
      || true
  register: _ci_commands
  changed_when: false
  failed_when: false
  when:
    - enable_scan | bool
    - _ci_file_list | default('') | length > 0

- name: Record commands.getoutput findings
  ansible.builtin.set_fact:

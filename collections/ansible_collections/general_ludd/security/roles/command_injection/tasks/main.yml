---
# command_injection role — command injection awareness and audit
#
# Report-only. Scans target_path for command injection patterns (os.system,
# subprocess shell=True, os.popen, eval/exec, string-concatenation command
# construction). Generates remediation suggestions with safe alternatives.
# Never mutates the repo.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Code audit ─────────────────────────────────────────────────────────────────

- name: Run code audit scan
  ansible.builtin.include_tasks: code_audit.yml

# ── Remediation guidance ───────────────────────────────────────────────────────

- name: Generate remediation suggestions
  ansible.builtin.include_tasks: remediate.yml

# ── Write artifacts ──────────────────────────────────────────────────────────

- name: Write JSON command injection artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'command_injection',
        'status': 'completed',
        'scan_ran': enable_scan | bool,
        'target_path': target_path,
        'finding_count': _ci_finding_count | int,
        'severity_breakdown': {
          'critical': _ci_findings_critical | default(0) | int,
          'high': _ci_findings_high | default(0) | int,
          'medium': _ci_findings_medium | default(0) | int
        },
        'findings': _ci_audit_findings,
        'remediation_suggestions': _ci_remediation_suggestions
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/command_injection.json"
    mode: "0644"

- name: Write markdown command injection report
  ansible.builtin.copy:
    content: |
      # Command Injection Audit Report

      **Scan ran:** {{ enable_scan | bool }}
      **Target:** `{{ target_path }}`

      ## Results

      - **Total findings:** {{ _ci_finding_count | int }}
      - **Critical:** {{ _ci_findings_critical | default(0) | int }}
      - **High:** {{ _ci_findings_high | default(0) | int }}
      - **Medium:** {{ _ci_findings_medium | default(0) | int }}

      {% if _ci_audit_findings | length > 0 %}
      ### Findings

      | File | Line | Pattern | Severity |
      |------|------|---------|----------|
      {% for f in _ci_audit_findings %}
      | `{{ f.file }}` | {{ f.line }} | {{ f.pattern }} | {{ f.severity }} |
      {% endfor %}

      {% endif %}

      {% if _ci_remediation_suggestions | length > 0 %}
      ### Remediation Suggestions

      {% for r in _ci_remediation_suggestions %}
      - **{{ r.pattern }}** ({{ r.finding_count }} finding(s)): {{ r.suggestion }}
        - Before: `{{ r.before }}`
        - After: `{{ r.after }}`
      {% endfor %}

      {% endif %}

      ### Recommended Tools

      {% for tool in remediation_tools %}
      - **{{ tool.name }}** ({{ tool.type }}): {{ tool.description }}
      {% endfor %}

      ### Defense Strategies

      {% for strategy in defense_strategies %}
      - {{ strategy }}
      {% endfor %}

      ---
      *Generated by general_ludd.security.command_injection — report-only.*
    dest: "{{ artifact_dir }}/command_injection.md"
    mode: "0644"

- name: Report command injection audit completion
  ansible.builtin.debug:
    msg: >-
      Command injection audit complete:
      findings={{ _ci_finding_count | int }}
      critical={{ _ci_findings_critical | default(0) | int }}
      high={{ _ci_findings_high | default(0) | int }}
      medium={{ _ci_findings_medium | default(0) | int }}

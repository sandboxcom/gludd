    - id: SI
      name: System and Information Integrity
      description: >
        Controls for identifying, reporting, and correcting system
        flaws; protecting against malicious code; and monitoring
        system security alerts.
      severity: high
      key_controls:
        - id: SI-1
          name: System and Information Integrity Policy
          severity: medium
          scope: [Low, Moderate, High]
        - id: SI-2
          name: Flaw Remediation
          severity: high
          scope: [Low, Moderate, High]
          fedramp_specific: >
            Deploy security-relevant patches within 30 days of release.
            Test patches before deployment. Centralized patch management.
        - id: SI-3
          name: Malicious Code Protection
          severity: high
          scope: [Low, Moderate, High]
          fedramp_specific: >
            Centralized management. Signature updates in real-time.
            Cannot be disabled by non-administrative users.
        - id: SI-4
          name: System Monitoring
          severity: high
          scope: [Low, Moderate, High]
          fedramp_specific: >
            Continuous monitoring of all inbound and outbound traffic.
            IDS/IPS at network boundaries. File integrity monitoring
            at least weekly.
        - id: SI-5
          name: Security Alerts, Advisories, and Directives
          severity: high

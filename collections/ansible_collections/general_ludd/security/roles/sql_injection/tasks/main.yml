---
# sql_injection role — main entry point
#
# Orchestrates code audit, log audit, remediation, and (optionally) attack
# simulation. Each phase is a separate task file. Report-only: NEVER mutates
# source files; remediation output is advisory.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Include data files
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_items:
    - attack_vectors.yml
    - database_specifics.yml
    - bypass_techniques.yml

# ── Phase 1: Code Audit ───────────────────────────────────────────────────

- name: Run SQL injection code audit
  ansible.builtin.include_tasks: code_audit.yml
  when: scan_target | length > 0

# ── Phase 2: Log Audit ────────────────────────────────────────────────────

- name: Run SQL injection log audit
  ansible.builtin.include_tasks: log_audit.yml
  when:
    - web_log_path | length > 0 or db_log_path | length > 0

# ── Phase 3: Remediation ──────────────────────────────────────────────────

- name: Generate remediation guidance
  ansible.builtin.include_tasks: remediate.yml
  when: _sql_code_findings | default([]) | length > 0

# ── Phase 4: Attack Simulation (optional) ─────────────────────────────────

- name: Run attack simulation
  ansible.builtin.include_tasks: attack_simulate.yml
  when: simulate_attacks | bool

# ── Collate results ───────────────────────────────────────────────────────

- name: Build final report
  ansible.builtin.set_fact:
    _sql_total_findings: >-
      {{ (_sql_code_findings | default([]) | length) + (_sql_log_findings | default([]) | length) }}
    _sql_critical_count: >-
      {{ 
        ((_sql_code_findings | default([])) | selectattr('severity', 'equalto', 'critical') | list | length)
        + ((_sql_log_findings | default([])) | selectattr('severity', 'equalto', 'critical') | list | length)
      }}
    _sql_high_count: >-
      {{
        ((_sql_code_findings | default([])) | selectattr('severity', 'equalto', 'high') | list | length)
        + ((_sql_log_findings | default([])) | selectattr('severity', 'equalto', 'high') | list | length)
      }}

- name: Determine overall verdict
  ansible.builtin.set_fact:
    _sql_verdict: >-
      {{
        'fail'
        if (_sql_critical_count | int > 0 and fail_on_critical | bool)
        else ('fail' if (_sql_high_count | int > 0 and fail_on_high | bool) else 'pass')
      }}

- name: Write JSON audit artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'sql_injection',
        'status': 'completed',
        'scan_target': scan_target,
        'code_findings': _sql_code_findings | default([]),
        'code_finding_count': _sql_code_findings | default([]) | length,
        'log_findings': _sql_log_findings | default([]),
        'log_finding_count': _sql_log_findings | default([]) | length,
        'total_findings': _sql_total_findings | int,
        'critical_count': _sql_critical_count | int,
        'high_count': _sql_high_count | int,
        'verdict': _sql_verdict,
        'tool_awareness': tool_awareness
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/sql_injection_audit.json"
    mode: "0644"

- name: Write markdown audit report
  ansible.builtin.copy:
    content: |
      # SQL Injection Audit Report

      **Target:** `{{ scan_target }}`
      **Verdict:** {{ _sql_verdict | upper }}
      **Code Findings:** {{ _sql_code_findings | default([]) | length }}
      **Log Findings:** {{ _sql_log_findings | default([]) | length }}
      **Total Findings:** {{ _sql_total_findings }}

      {% if _sql_code_findings | default([]) | length > 0 %}
      ## Code Audit Findings

      {% for f in _sql_code_findings | default([]) %}
      ### [{{ f.severity | upper }}] {{ f.rule }} — {{ f.pattern }}
      **Location:** `{{ f.location }}`
      **Language:** {{ f.language }}
      **Remediation:** {{ f.remediation | default('See remediation report') }}

      ```
      {{ f.snippet[:300] }}
      ```

      {% endfor %}
      {% endif %}

      {% if _sql_log_findings | default([]) | length > 0 %}
      ## Log Audit Findings

      {% for f in _sql_log_findings | default([]) %}
      ### [{{ f.severity | upper }}] {{ f.attack_type }}
      **Source IP:** {{ f.source_ip | default('unknown') }}
      **Timestamp:** {{ f.timestamp | default('unknown') }}
      **Log Source:** {{ f.log_source }}

      ```
      {{ f.entry[:300] }}
      ```

      {% endfor %}
      {% endif %}

      ## Tool Awareness

      | Tool | Category | Detection Capability |
      |------|----------|---------------------|
      {% for tool in tool_awareness %}
      | {{ tool.name }} | {{ tool.category }} | {{ tool.detects }} |
      {% endfor %}

      ---
      *Generated by general_ludd.security.sql_injection — report-only, no auto-patch.*
    dest: "{{ artifact_dir }}/sql_injection_audit.md"
    mode: "0644"

- name: Report audit completion
  ansible.builtin.debug:
    msg: >-
      SQL injection audit complete: verdict={{ _sql_verdict }}
      code_findings={{ _sql_code_findings | default([]) | length }}
      log_findings={{ _sql_log_findings | default([]) | length }}
      total={{ _sql_total_findings }}

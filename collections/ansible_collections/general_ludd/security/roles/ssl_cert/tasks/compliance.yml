---
# Compliance profile tasks
# Load compliance data, map algorithms to profiles, answer compliance questions.
# Compliance data lives in vars/compliance.yml (included at role scope).

- name: Load compliance profile data
  ansible.builtin.include_vars:
    file: compliance.yml
    name: _ssl_compliance_data
  tags: [compliance, always]

- name: Resolve compliance profile
  ansible.builtin.set_fact:
    _profile: >-
      {{ _ssl_compliance_data.compliance_profiles[ssl_cert_compliance_profile]
         if ssl_cert_compliance_profile | length > 0 else {} }}
  tags: [compliance]

- name: Show active compliance profile
  ansible.builtin.debug:
    msg:
      - "Compliance profile: {{ _profile.display | default('none selected') }}"
      - "Version: {{ _profile.version | default('N/A') }}"
      - "Reference: {{ _profile.reference | default('N/A') }}"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance, debug]

# ── Algorithm compliance check ──
- name: Check if current algorithm is approved
  ansible.builtin.set_fact:
    _algorithm_id: "{{ 'rsa-' + ssl_cert_key_size | string if ssl_cert_key_type | default('RSA') == 'RSA' else 'ecdsa-' + ssl_cert_ec_curve | replace('secp', 'p') if ssl_cert_key_type | default('RSA') == 'ECDSA' else 'ed25519' if ssl_cert_key_type | default('RSA') == 'Ed25519' else 'unknown' }}"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance]

- name: Assert algorithm is approved by compliance profile
  ansible.builtin.assert:
    that:
      - _algorithm_id in _profile.approved_algorithms
    fail_msg: >-
      {{ _algorithm_id }} is NOT approved by {{ _profile.display }}.
      Approved: {{ _profile.approved_algorithms | join(', ') }}.
      Forbidden: {{ _profile.forbidden_algorithms | join(', ') }}.
    success_msg: "{{ _algorithm_id }} is approved by {{ _profile.display }}"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance]

# ── Minimum key size check ──
- name: Assert key size meets compliance profile minimum
  ansible.builtin.assert:
    that:
      - ssl_cert_key_size | int >= _profile.minimum_rsa_key_size | int
    fail_msg: >-
      RSA key size {{ ssl_cert_key_size }} is below minimum {{ _profile.minimum_rsa_key_size }}
      for {{ _profile.display }}.
    success_msg: "RSA key size {{ ssl_cert_key_size }} meets {{ _profile.display }} minimum ({{ _profile.minimum_rsa_key_size }})"
  when:
    - ssl_cert_compliance_profile | length > 0
    - ssl_cert_key_type | default('RSA') == 'RSA'
  tags: [compliance]

# ── Hash algorithm check ──
- name: Assert digest is approved by compliance profile
  ansible.builtin.assert:
    that:
      - ssl_cert_digest in _profile.approved_hashes
    fail_msg: >-
      Digest {{ ssl_cert_digest }} is NOT approved by {{ _profile.display }}.
      Approved hashes: {{ _profile.approved_hashes | join(', ') }}.
    success_msg: "Digest {{ ssl_cert_digest }} is approved by {{ _profile.display }}"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance]

# ── Certificate lifetime check ──
- name: Assert certificate lifetime meets compliance profile maximum
  ansible.builtin.assert:
    that:
      - ssl_cert_days_valid | int <= _profile.max_cert_lifetime_days | int
    fail_msg: >-
      Certificate lifetime {{ ssl_cert_days_valid }} days exceeds
      {{ _profile.display }} maximum of {{ _profile.max_cert_lifetime_days }} days.
    success_msg: "Certificate lifetime {{ ssl_cert_days_valid }}d meets {{ _profile.display }} max ({{ _profile.max_cert_lifetime_days }}d)"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance]

# ── Compliance summary ──
- name: Generate compliance summary
  ansible.builtin.set_fact:
    compliance_summary:
      profile: "{{ _profile.display | default('none') }}"
      algorithm: "{{ _algorithm_id | default('not checked') }}"
      key_size: "{{ ssl_cert_key_size }}"
      digest: "{{ ssl_cert_digest }}"
      key_storage_requirement: "{{ _profile.key_storage | default('N/A') }}"
      rng_requirement: "{{ _profile.rng_requirement | default('N/A') }}"
      max_lifetime: "{{ _profile.max_cert_lifetime_days | default('N/A') }}"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance]

- name: Print compliance summary
  ansible.builtin.debug:
    msg:
      - "=== Compliance Summary ==="
      - "{{ compliance_summary | default({}) | to_nice_yaml }}"
  when: ssl_cert_compliance_profile | length > 0
  tags: [compliance, debug]

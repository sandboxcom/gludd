---
# CA jurisdiction lookup
# Load jurisdiction data, query CA jurisdictional info,
# cross-reference with algorithmic sovereignty concerns.

- name: Load CA jurisdiction data
  ansible.builtin.include_vars:
    file: ca_jurisdictions.yml
    name: _ssl_jurisdiction_data
  tags: [ca_jurisdictions, always]

# ── CA lookup ──
- name: Normalize CA name for lookup
  ansible.builtin.set_fact:
    _ca_key: "{{ ssl_cert_ca_name | default('letsencrypt') | lower | replace(' ', '_') | replace('-', '_') }}"
  tags: [ca_jurisdictions]

- name: Lookup CA jurisdiction info
  ansible.builtin.set_fact:
    _ca_info: >-
      {{ _ssl_jurisdiction_data.ca_jurisdictions[_ca_key]
         | default(_ssl_jurisdiction_data.ca_jurisdictions['letsencrypt']) }}
  tags: [ca_jurisdictions]

- name: Show CA jurisdiction details
  ansible.builtin.debug:
    msg:
      - "=== CA Jurisdiction: {{ _ca_info.display }} ==="
      - "Parent: {{ _ca_info.parent_company }}"
      - "Jurisdiction: {{ _ca_info.jurisdiction_country }} ({{ _ca_info.jurisdiction_code }})"
      - "Established: {{ _ca_info.established }}"
      - "Root programs: {{ _ca_info.root_program }}"
      - ""
      - "Applicable laws:"
      - "{% for law in _ca_info.applicable_laws %}- {{ law }}{% endfor %}"
      - ""
      - "Ownership chain:"
      - "{% for owner in _ca_info.ownership_chain %}- {{ owner }}{% endfor %}"
      - ""
      - "Notes: {{ _ca_info.notes }}"
  tags: [ca_jurisdictions, debug]

# ── Algorithmic sovereignty cross-reference ──
- name: Cross-reference CA jurisdiction with algorithmic sovereignty
  ansible.builtin.set_fact:
    sovereignty_assessment:
      ca_name: "{{ _ca_info.display }}"
      jurisdiction: "{{ _ca_info.jurisdiction_country }} — {{ _ca_info.jurisdiction_code }}"
      us_legal_exposure: >-
        {{ 'HIGH' if 'US Federal law' in _ca_info.applicable_laws or 'US-' in _ca_info.jurisdiction_code else 'MEDIUM' if _ca_info.jurisdiction_country in ['GB', 'CA', 'AU', 'NZ'] else 'LOW' }}
      surveillance_alliance: >-
        {%- if _ca_info.jurisdiction_country in ['US', 'GB', 'CA', 'AU', 'NZ'] -%}
        Five Eyes
        {%- elif _ca_info.jurisdiction_country in ['DK', 'FR', 'NO', 'NL'] -%}
        Nine Eyes
        {%- elif _ca_info.jurisdiction_country in ['DE', 'BE', 'IT', 'ES', 'SE'] -%}
        Fourteen Eyes
        {%- else -%}
        None known
        {%- endif -%}
      gdpr_coverage: "{{ 'Yes (EU/EEA)' if _ca_info.jurisdiction_code in ['FR', 'DE', 'IT', 'ES', 'SE', 'NL', 'DK', 'BE', 'IE', 'PT', 'GR', 'PL', 'CZ', 'HU', 'AT', 'BG', 'RO', 'FI', 'SK', 'HR', 'LT', 'LV', 'EE', 'SI', 'CY', 'LU', 'MT', 'NO', 'IS', 'LI'] else 'No' }}"
      government_ownership: >-
        {{ 'Yes (state-owned)' if 'state-owned' in _ca_info.ownership_chain | join(' ') | lower
           else ('Yes (Government)' if 'Government' in _ca_info.ownership_chain | join(' ')
           else 'No — private/commercial entity') }}
  tags: [ca_jurisdictions]

- name: Print sovereignty assessment
  ansible.builtin.debug:
    msg:
      - "=== Algorithmic Sovereignty Assessment ==="
      - "CA: {{ sovereignty_assessment.ca_name }}"
      - "Jurisdiction: {{ sovereignty_assessment.jurisdiction }}"
      - "US legal exposure: {{ sovereignty_assessment.us_legal_exposure }}"
      - "Surveillance alliance: {{ sovereignty_assessment.surveillance_alliance }}"
      - "GDPR coverage: {{ sovereignty_assessment.gdpr_coverage }}"
      - "Government ownership: {{ sovereignty_assessment.government_ownership }}"
  tags: [ca_jurisdictions, debug]

# ── List all CAs for a given jurisdiction ──
- name: Filter CAs by jurisdiction
  ansible.builtin.set_fact:
    cas_in_jurisdiction: >-
      {%- set matches = [] -%}
      {%- for key, ca in _ssl_jurisdiction_data.ca_jurisdictions.items() -%}
      {%- if ssl_cert_filter_jurisdiction | default('') | length > 0
             and ca.jurisdiction_code == ssl_cert_filter_jurisdiction -%}
      {%- set _ = matches.append(ca.display ~ ' (' ~ ca.jurisdiction_country ~ ')') -%}
      {%- endif -%}
      {%- endfor -%}
      {{ matches }}
  when: ssl_cert_filter_jurisdiction | default('') | length > 0
  tags: [ca_jurisdictions, filter]

- name: Show CAs in jurisdiction
  ansible.builtin.debug:
    msg:
      - "=== CAs in {{ ssl_cert_filter_jurisdiction }} ==="
      - "{{ cas_in_jurisdiction }}"
  when: cas_in_jurisdiction | default([]) | length > 0
  tags: [ca_jurisdictions, debug]

# ── Write jurisdiction artifact ──
- name: Write CA jurisdiction artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'ca_name': _ca_info.display | default('N/A'),
        'parent_company': _ca_info.parent_company | default('N/A'),
        'jurisdiction': _ca_info.jurisdiction_country ~ ' (' ~ _ca_info.jurisdiction_code ~ ')',
        'applicable_laws': _ca_info.applicable_laws | default([]),
        'ownership_chain': _ca_info.ownership_chain | default([]),
        'sovereignty_assessment': sovereignty_assessment | default({}),
        'available_cas': _ssl_jurisdiction_data.ca_jurisdictions.keys() | default([]) | list,
        'timestamp': ansible_date_time.iso8601
      } | to_nice_json }}
    dest: "{{ ssl_cert_artifact_dir }}/ca-jurisdiction.json"
    mode: "0644"
  tags: [artifact]

---
# prompt_injection role — LLM prompt injection awareness
#
# Attack vector analysis (direct, indirect, jailbreak), defense strategies,
# and defensive tool awareness. Report-only — NEVER mutates the repo.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

- name: Audit prompt injection vectors
  ansible.builtin.include_tasks: audit_vectors.yml

- name: Compile remediation guidance
  ansible.builtin.include_tasks: remediate.yml

- name: Write JSON prompt injection artifact
  ansible.builtin.copy:
    content: >-
      {{ {
        'role': 'prompt_injection',
        'status': 'completed',
        'target_path': target_path,
        'vector_analysis': {
          'total_vectors': _pi_findings.total_vectors,
          'categories': _pi_findings.categories | map(attribute='category') | list
        },
        'defensive_tools': defensive_tools | map(attribute='name') | list,
        'remediation': {
          'total_strategies': _pi_remediation_suggestions.total_strategies,
          'categories': _pi_remediation_suggestions.categories | map(attribute='category') | list
        },
        'generated_at': ansible_date_time.iso8601,
        'note': 'Report-only. No mutations made to the repo.'
      } | to_nice_json }}
    dest: "{{ artifact_dir }}/prompt_injection.json"
    mode: "0644"

- name: Write markdown prompt injection report
  ansible.builtin.copy:
    content: |
      # Prompt Injection Analysis Report

      **Target:** `{{ target_path }}`
      **Generated:** {{ ansible_date_time.iso8601 }}
      **Role:** `general_ludd.security.prompt_injection` (report-only)

      ---

      ## Attack Vector Summary

      | Category | Vectors |
      |---|---|
      {% for cat in _pi_findings.categories %}
      {% if cat.vectors is defined %}
      | {{ cat.category }} | {{ cat.vectors | length }} |
      {% for v in cat.vectors %}
      | ↳ {{ v.name }} | {{ v.description }} |
      {% endfor %}
      {% endif %}
      {% endfor %}

      ## Defensive Tools

      | Tool | Type | Description |
      |---|---|---|
      {% for tool in defensive_tools %}
      | {{ tool.name }} | {{ tool.type }} | {{ tool.description }} |
      {% endfor %}

      ---

      ## Remediation Strategies

      {% for cat in _pi_remediation_suggestions.categories %}
      ### {{ cat.category }}

      | Strategy | Guidance |
      |---|---|
      {% for s in cat.strategies %}
      | {{ s.name }} | {{ s.guidance }} |
      {% endfor %}

      {% endfor %}

      ---
      *Generated by general_ludd.security.prompt_injection — report-only. NEVER mutates the repo.*
    dest: "{{ artifact_dir }}/prompt_injection.md"
    mode: "0644"

- name: Report prompt injection analysis completion
  ansible.builtin.debug:
    msg: >-
      Prompt injection analysis complete:
      vectors={{ _pi_findings.total_vectors }}
      tools={{ defensive_tools | length }}
      strategies={{ _pi_remediation_suggestions.total_strategies }}

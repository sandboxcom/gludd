---
- name: Require authenticated daemon validation or explicit mock mode
  ansible.builtin.assert:
    that:
      - validate_scenarios_mock | bool or psk | length > 0
    fail_msg: >-
      Live scenario validation requires a daemon PSK. Set psk or explicitly
      opt into validate_scenarios_mock for hermetic validation.

- name: Validate scenarios through the packaged controller action
  general_ludd.e2e_test_gen.e2e_pipeline:
    operation: validate
    scenarios_file: >-
      {{ scenarios_artifact if scenarios_artifact | length > 0
         else artifact_dir + '/scenarios.json' }}
    output: "{{ artifact_dir }}/{{ validated_artifact_name }}"
    confidence_threshold: "{{ confidence_threshold }}"
    daemon_url: "{{ daemon_url }}"
    psk: "{{ psk }}"
    mock: "{{ validate_scenarios_mock }}"
    research_categories: "{{ research_categories }}"
    research_time_range: "{{ research_time_range }}"
    max_results: "{{ max_search_results }}"
    timeout: 360
  register: _vs_pipeline
  no_log: "{{ psk | length > 0 }}"

- name: Publish validated scenario facts
  ansible.builtin.set_fact:
    _vs_output: "{{ _vs_pipeline.artifact }}"

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      Scenario validation complete: module={{ _vs_output.module }}
      valid={{ _vs_output.valid_count }} discarded={{ _vs_output.discarded_count }}

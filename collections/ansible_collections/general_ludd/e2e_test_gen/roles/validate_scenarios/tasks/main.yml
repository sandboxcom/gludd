---
# validate_scenarios — validate E2E scenarios against real-world usage
#
# Cross-references generated scenarios against web research via the
# ResearcherAgent (SearXNG-backed). Prunes implausible scenarios. Produces
# validated scenario list with confidence scores and source URLs.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Load scenarios ──────────────────────────────────────────────────────

- name: Load scenarios from artifact
  ansible.builtin.slurp:
    src: "{{ scenarios_artifact if scenarios_artifact | length > 0 else artifact_dir + '/scenarios.json' }}"
  register: _vs_scenarios_raw

- name: Fail if no scenarios found
  ansible.builtin.fail:
    msg: >-
      No scenarios found at {{
        scenarios_artifact if scenarios_artifact | length > 0
        else artifact_dir + '/scenarios.json'
      }}
  when: _vs_scenarios_raw.content | default('') | length == 0

- name: Parse scenarios
  ansible.builtin.set_fact:
    _vs_scenarios_data: "{{ _vs_scenarios_raw.content | b64decode | from_json }}"
    _vs_scenarios_list: >-
      {{ (_vs_scenarios_raw.content | b64decode | from_json).get('scenarios', []) }}

# ── Validate scenarios via Python script ───────────────────────────────

- name: Run validate_scenarios script
  ansible.builtin.command:
    cmd: >-
      python3 "{{ validate_script }}"
      --scenarios-file "{{ scenarios_artifact if scenarios_artifact | length > 0 else artifact_dir + '/scenarios.json' }}"
      --output "{{ artifact_dir }}/{{ validated_artifact_name }}"
      --confidence-threshold "{{ confidence_threshold }}"
  register: _vs_script_result
  changed_when: false

- name: Parse validated output
  ansible.builtin.set_fact:
    _vs_output: "{{ (lookup('file', artifact_dir + '/' + validated_artifact_name) | from_json) }}"

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      Scenario validation complete: module={{ _vs_output.module }}
      valid={{ _vs_output.valid_count }} discarded={{ _vs_output.discarded_count }}

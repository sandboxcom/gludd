---
# write_e2e_tests — generate pytest test files from validated E2E scenarios
#
# Reads validated_scenarios.json, emits pytest test files using project
# fixtures (TestClient, _run_cli, tmp_path) with AAA structure and coverage
# markers. Writes to output_dir with import plumbing.

- name: Create artifact and output directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ artifact_dir }}"
    - "{{ output_dir }}"

# ── Load validated scenarios ────────────────────────────────────────────

- name: Load validated scenarios artifact
  ansible.builtin.slurp:
    src: >-
      {{ validated_scenarios_artifact if validated_scenarios_artifact | length > 0
         else artifact_dir + '/validated_scenarios.json' }}
  register: _wt_scenarios_raw

- name: Fail if no validated scenarios found
  ansible.builtin.fail:
    msg: "No validated scenarios found."
  when: _wt_scenarios_raw.content | default('') | length == 0

- name: Parse validated scenarios
  ansible.builtin.set_fact:
    _wt_data: "{{ _wt_scenarios_raw.content | b64decode | from_json }}"
    _wt_valid: "{{ (_wt_scenarios_raw.content | b64decode | from_json).get('valid', []) }}"

- name: Write scenario data JSON for Python test generation
  ansible.builtin.copy:
    content: "{{ _wt_data | to_json }}"
    dest: "{{ artifact_dir }}/_wt_input.json"
    mode: "0644"

# ── Generate test files via Python ──────────────────────────────────────

- name: Generate pytest test files from scenarios
  ansible.builtin.shell:
    executable: python3
    cmd: >-
      python3 -c "
      import json, os, textwrap

      with open('{{ artifact_dir }}/_wt_input.json') as f:
          data = json.load(f)

      valid = data.get('valid', [])
      output_dir = '{{ output_dir }}'
      os.makedirs(output_dir, exist_ok=True)

      test_client = '{{ test_client_fixture }}'
      cli_runner = '{{ cli_runner_fixture }}'
      tmp_path = '{{ tmp_path_fixture }}'

      manifest = {'test_files': [], 'scenario_count': len(valid)}

      for scenario in valid:
          name = scenario['name']
          filename = f\"{{ '{{ test_file_prefix }}' }}{name}.py\"
          filepath = os.path.join(output_dir, filename)
          steps = scenario.get('steps', [])
          coverage_targets = scenario.get('coverage_targets', [])

          lines = []
          lines.append('import pytest')
          lines.append('')
          lines.append('')
          def _emit_step_test(step, idx):
              action = step.get('action', 'Invoke').lower().replace(' ', '_')
              target = step.get('target', 'unknown').replace('/', '_').replace('<', '').replace('>', '').strip('_')
              func_name = f\"test_{name}_{action}_{target}_{idx}\"
              expected = step.get('expected_result', '')
              assertions = step.get('assertions', [])
              lines.append(f'def {func_name}():')
              lines.append(f'    \"\"\"{expected}\"\"\"')
              for a in assertions:
                  lines.append(f'    # {a}')
              lines.append('    pass  # TODO: implement fixture-driven test')
              lines.append('')
          for idx, step in enumerate(steps):
              _emit_step_test(step, idx)
          content = '\\\\n'.join(lines)
          with open(filepath, 'w') as fh:
              fh.write(content)
          manifest['test_files'].append({'file': filepath, 'scenario': name, 'step_count': len(steps)})

      with open(os.path.join('{{ artifact_dir }}', '{{ generated_tests_manifest }}'), 'w') as fh:
          json.dump(manifest, fh, indent=2)
      print(json.dumps(manifest, indent=2))
      "
  register: _wt_result
  changed_when: true

- name: Load test file manifest
  ansible.builtin.slurp:
    src: "{{ artifact_dir }}/{{ generated_tests_manifest }}"
  register: _wt_manifest_raw

- name: Build output summary
  ansible.builtin.set_fact:
    _wt_output: >-
      {{
        {
          'module': _wt_data.get('module', 'unknown'),
          'scenarios_used': _wt_valid | length,
          'test_files': (_wt_manifest_raw.content | b64decode | from_json).get('test_files', []),
          'output_dir': output_dir,
          'fixtures_used': [test_client_fixture, cli_runner_fixture, tmp_path_fixture],
          'status': 'completed'
        }
      }}

# ── Write artifact ──────────────────────────────────────────────────────

- name: Write generation summary JSON
  ansible.builtin.copy:
    content: "{{ _wt_output | to_nice_json }}"
    dest: "{{ artifact_dir }}/test_generation_summary.json"
    mode: "0644"

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      E2E tests written: module={{ _wt_output.module }}
      test_files={{ _wt_output.test_files | length }}
      output_dir={{ output_dir }}

---
- name: Write generated tests through the packaged controller action
  general_ludd.e2e_test_gen.e2e_pipeline:
    operation: write_tests
    scenarios_file: >-
      {{ validated_scenarios_artifact if validated_scenarios_artifact | length > 0
         else artifact_dir + '/validated_scenarios.json' }}
    output_dir: "{{ output_dir }}"
    manifest: "{{ artifact_dir }}/{{ generated_tests_manifest }}"
    test_file_prefix: "{{ test_file_prefix }}"
    timeout: 360
  register: _wt_pipeline

- name: Publish generated test facts
  ansible.builtin.set_fact:
    _wt_output:
      module: "{{ _wt_pipeline.artifact.module | default('unknown') }}"
      scenarios_used: "{{ _wt_pipeline.artifact.scenario_count }}"
      test_files: "{{ _wt_pipeline.artifact.test_files }}"
      output_dir: "{{ output_dir }}"
      fixtures_used:
        - "{{ test_client_fixture }}"
        - "{{ cli_runner_fixture }}"
        - "{{ tmp_path_fixture }}"
      status: completed

- name: Write generation summary JSON
  ansible.builtin.copy:
    content: "{{ _wt_output | to_nice_json }}"
    dest: "{{ artifact_dir }}/test_generation_summary.json"
    mode: "0644"
  delegate_to: localhost

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      E2E tests written: test_files={{ _wt_output.test_files | length }}
      output_dir={{ output_dir }}

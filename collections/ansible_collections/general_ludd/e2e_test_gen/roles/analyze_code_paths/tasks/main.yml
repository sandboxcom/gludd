---
- name: Analyze code paths through the packaged controller action
  general_ludd.e2e_test_gen.e2e_pipeline:
    operation: analyze
    target_module: "{{ target_module }}"
    output: "{{ artifact_dir }}/{{ analyze_artifact_name }}"
    timeout: 360
  register: _acp_pipeline

- name: Publish analyzed symbol facts
  ansible.builtin.set_fact:
    _acp_output: "{{ _acp_pipeline.artifact }}"

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      Code paths analyzed: module={{ _acp_output.module }}
      testable_paths={{ _acp_output.testable_path_count }}
      functions={{ _acp_output.function_count }}
      classes={{ _acp_output.class_count }}

---
# verify_coverage — run pytest-cov on generated tests, verify thresholds
#
# Runs pytest --cov on the generated test files against the target source
# module. Checks coverage threshold and verifies expected code paths are hit.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Validate inputs ─────────────────────────────────────────────────────

- name: Check test output directory exists
  ansible.builtin.stat:
    path: "{{ test_output_dir }}"
  register: _vc_testdir_stat

- name: Check source module exists
  ansible.builtin.stat:
    path: "{{ source_module }}"
  register: _vc_src_stat

- name: Fail if prerequisites missing
  ansible.builtin.fail:
    msg: >-
      {{ 'Test output dir not found: ' + test_output_dir if not _vc_testdir_stat.stat.exists | default(false) else '' }}
      {{ 'Source module not found: ' + source_module if not _vc_src_stat.stat.exists | default(false) else '' }}
  when: >-
    not (_vc_testdir_stat.stat.exists | default(false))
    or not (_vc_src_stat.stat.exists | default(false))

# ── Run coverage verification via Python script ────────────────────────

- name: Run verify_coverage script
  ansible.builtin.command:
    cmd: >-
      python3 "{{ verify_coverage_script }}"
      --test-dir "{{ test_output_dir }}"
      --source-module "{{ source_module }}"
      --output "{{ artifact_dir }}/{{ coverage_artifact_name }}"
      --threshold "{{ coverage_threshold }}"
      --timeout "{{ pytest_timeout }}"
      --test-file-prefix "{{ test_file_prefix | default('test_e2e_generated_') }}"
  register: _vc_result
  changed_when: false
  ignore_errors: true

- name: Parse coverage output
  ansible.builtin.set_fact:
    _vc_output: "{{ (lookup('file', artifact_dir + '/' + coverage_artifact_name) | from_json) }}"

- name: Report coverage results
  ansible.builtin.debug:
    msg: >-
      Coverage verification: verdict={{ _vc_output.verdict | upper }}
      coverage={{ _vc_output.coverage_percent }}% (threshold={{ _vc_output.threshold }}%)
      module={{ _vc_output.module }}

- name: Fail if coverage below threshold
  ansible.builtin.fail:
    msg: "Coverage {{ _vc_output.coverage_percent }}% is below threshold {{ _vc_output.threshold }}%"
  when: _vc_output.verdict == 'fail'

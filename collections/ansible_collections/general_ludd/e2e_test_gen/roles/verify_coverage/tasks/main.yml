---
- name: Verify generated coverage through the packaged controller action
  general_ludd.e2e_test_gen.e2e_pipeline:
    operation: verify_coverage
    test_dir: "{{ test_output_dir }}"
    source_module: "{{ source_module }}"
    output: "{{ artifact_dir }}/{{ coverage_artifact_name }}"
    threshold: "{{ coverage_threshold }}"
    pytest_timeout: "{{ pytest_timeout }}"
    test_file_prefix: "{{ test_file_prefix | default('test_e2e_generated_') }}"
    scenarios_file: "{{ scenarios_file | default('') }}"
    symbols_file: "{{ symbols_file | default('') }}"
    timeout: "{{ pytest_timeout + 60 }}"
  register: _vc_pipeline

- name: Publish coverage facts
  ansible.builtin.set_fact:
    _vc_output: "{{ _vc_pipeline.artifact }}"

- name: Report coverage results
  ansible.builtin.debug:
    msg: >-
      Coverage verification: verdict={{ _vc_output.verdict | upper }}
      coverage={{ _vc_output.coverage_percent }}% (threshold={{ _vc_output.threshold }}%)
      module={{ _vc_output.module }}

- name: Fail if coverage is below threshold
  ansible.builtin.fail:
    msg: "Coverage {{ _vc_output.coverage_percent }}% is below threshold {{ _vc_output.threshold }}%"
  when: _vc_output.verdict == 'fail'

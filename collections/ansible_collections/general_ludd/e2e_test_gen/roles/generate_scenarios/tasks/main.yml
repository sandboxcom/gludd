---
# generate_scenarios — map code-path symbols to E2E test scenarios
#
# Matches public functions/classes against the scenario catalog (CRUD, auth,
# timeout, concurrent, daemon). Produces GeneratedScenario records with step
# sequences and coverage targets.

- name: Create artifact directory
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: "0755"

# ── Resolve symbols input ───────────────────────────────────────────────

- name: Load symbols from provided artifact
  ansible.builtin.slurp:
    src: "{{ symbols_artifact }}"
  register: _gs_symbols_raw
  when: symbols_artifact | length > 0

- name: Parse provided symbols artifact
  ansible.builtin.set_fact:
    _gs_module_symbols: "{{ _gs_symbols_raw.content | b64decode | from_json }}"
  when:
    - symbols_artifact | length > 0
    - _gs_symbols_raw.content | default('') | length > 0

- name: Run analyze_code_paths as fallback
  ansible.builtin.include_role:
    name: general_ludd.e2e_test_gen.analyze_code_paths
  vars:
    target_module: "{{ target_module }}"
    artifact_dir: "{{ artifact_dir }}"
  when:
    - symbols_artifact | length == 0
    - target_module | length > 0

- name: Load fallback symbols artifact
  ansible.builtin.slurp:
    src: "{{ artifact_dir }}/module_symbols.json"
  register: _gs_fb_raw
  when:
    - symbols_artifact | length == 0
    - target_module | length > 0

- name: Parse fallback symbols
  ansible.builtin.set_fact:
    _gs_module_symbols: "{{ _gs_fb_raw.content | b64decode | from_json }}"
  when:
    - symbols_artifact | length == 0
    - target_module | length > 0
    - _gs_fb_raw.content | default('') | length > 0

- name: Fail if no symbols available
  ansible.builtin.fail:
    msg: "No symbols input provided. Set symbols_artifact or target_module."
  when: _gs_module_symbols is not defined

# ── Scenario generation via Python module ───────────────────────────────

- name: Write symbols JSON to temp file for Python consumption
  ansible.builtin.copy:
    content: "{{ _gs_module_symbols | to_json }}"
    dest: "{{ artifact_dir }}/_symbols_input.json"
    mode: "0644"

- name: Run ScenarioGenerator via Python
  ansible.builtin.command:
    cmd: >-
      python3 -c "
      import json
      from general_ludd.agents.test_generation.code_path_analyzer import ModuleSymbols, Symbol, ClassSymbol
      from general_ludd.agents.test_generation.scenario_generator import ScenarioGenerator

      with open('{{ artifact_dir }}/_symbols_input.json') as f:
          raw = json.load(f)

      functions = [Symbol(**f) for f in raw.get('functions', [])]
      classes = []
      for c in raw.get('classes', []):
          methods = [Symbol(**m) for m in c.pop('methods', [])]
          classes.append(ClassSymbol(**c, methods=methods))
      mod_syms = ModuleSymbols(name=raw['name'], functions=functions, classes=classes)

      gen = ScenarioGenerator()
      scenarios = gen.generate(mod_syms)
      output = [{'name': s.name, 'description': s.description, 'steps': [{'action': st.action, 'target': st.target, 'expected_result': st.expected_result, 'assertions': st.assertions} for st in s.steps], 'coverage_targets': s.coverage_targets} for s in scenarios]
      print(json.dumps(output, indent=2))
      "
  register: _gs_python_result
  changed_when: false

- name: Parse generated scenarios
  ansible.builtin.set_fact:
    _gs_scenarios: "{{ _gs_python_result.stdout | from_json }}"

- name: Add metadata to scenarios
  ansible.builtin.set_fact:
    _gs_output: >-
      {{
        {
          'module': _gs_module_symbols.get('module', _gs_module_symbols.get('name', 'unknown')),
          'path': _gs_module_symbols.get('path', ''),
          'scenarios': _gs_scenarios,
          'scenario_count': _gs_scenarios | length,
          'coverage_targets': _gs_scenarios | map(attribute='coverage_targets') | list | flatten | unique,
          'status': 'completed'
        }
      }}

# ── Write artifact ──────────────────────────────────────────────────────

- name: Write scenarios JSON artifact
  ansible.builtin.copy:
    content: "{{ _gs_output | to_nice_json }}"
    dest: "{{ artifact_dir }}/{{ scenarios_artifact_name }}"
    mode: "0644"

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      Scenarios generated: module={{ _gs_output.module }}
      scenarios={{ _gs_output.scenario_count }}
      coverage_targets={{ _gs_output.coverage_targets | length }}

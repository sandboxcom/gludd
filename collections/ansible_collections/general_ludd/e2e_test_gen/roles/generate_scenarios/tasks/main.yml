---
- name: Validate scenario generation input
  ansible.builtin.assert:
    that:
      - symbols_artifact | length > 0 or target_module | length > 0
    fail_msg: "Set symbols_artifact or target_module before generating scenarios."

- name: Analyze target module when no symbols artifact was supplied
  ansible.builtin.include_role:
    name: general_ludd.e2e_test_gen.analyze_code_paths
    public: false
    rolespec_validate: true
  vars:
    target_module: "{{ target_module }}"
    artifact_dir: "{{ artifact_dir }}"
  when: symbols_artifact | length == 0

- name: Generate scenarios through the packaged controller action
  general_ludd.e2e_test_gen.e2e_pipeline:
    operation: generate
    symbols_file: >-
      {{ symbols_artifact if symbols_artifact | length > 0
         else artifact_dir + '/module_symbols.json' }}
    output: "{{ artifact_dir }}/{{ scenarios_artifact_name }}"
    timeout: 360
  register: _gs_pipeline

- name: Publish generated scenario facts
  ansible.builtin.set_fact:
    _gs_output: "{{ _gs_pipeline.artifact }}"
    _gs_scenarios: "{{ _gs_pipeline.artifact.scenarios }}"

- name: Report completion
  ansible.builtin.debug:
    msg: >-
      Scenarios generated: module={{ _gs_output.module }}
      scenarios={{ _gs_output.scenario_count }}
      coverage_targets={{ _gs_output.coverage_targets | length }}

---
# auto_register_service role defaults

# Service dict: {name, url, api_docs_url, pricing_url, description, kind}
service: {}

# Template directory for Jinja2 connector module
connector_template_dir: "{{ role_path }}/templates"

# Whether to register in the ConnectorRegistry config
register_in_registry: true

# Whether to run make healthcheck after generating the connector
run_healthcheck: true

# Directory for generated connector artifacts
connector_output_dir: "{{ lookup('env', 'PWD') }}/src/general_ludd/connectors"

# Path to the connectors __init__.py (for dynamic discovery)
connector_init_path: "{{ connector_output_dir }}/__init__.py"

# Provider registry config — extend _BUILTIN_PROVIDERS or dynamic list
provider_registry_path: "{{ lookup('env', 'PWD') }}/src/general_ludd/infra/providers.py"

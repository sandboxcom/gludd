---
- name: Validate and query the admitted OpenAPI operation
  general_ludd.infrastructure.openapi_query:
    root: "{{ auto_register_service_root }}"
    spec_path: "{{ auto_register_service_spec_path }}"
    spec_sha256: "{{ auto_register_service_spec_sha256 }}"
    base_url: "{{ auto_register_service_base_url }}"
    allowed_host: "{{ auto_register_service_allowed_host }}"
    operation_id: "{{ auto_register_service_operation_id }}"
    parameters: "{{ auto_register_service_parameters }}"
    secret_env: "{{ auto_register_service_secret_env }}"
    records_pointer: "{{ auto_register_service_records_pointer }}"
    timeout_seconds: "{{ auto_register_service_timeout_seconds }}"
    max_response_bytes: "{{ auto_register_service_max_response_bytes }}"
    max_records: "{{ auto_register_service_max_records }}"
    validate_only: "{{ auto_register_service_validate_only }}"
  register: auto_register_service_result

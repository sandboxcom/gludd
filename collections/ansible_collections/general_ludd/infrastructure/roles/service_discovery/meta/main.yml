---
galaxy_info:
  role_name: service_discovery
  author: Agentic Harness Agent
  description: >
    Automated service discovery via SearXNG. Queries a SearXNG instance with
    a configurable list of search terms, parses results into DiscoveredService
    records, and saves the catalog to a YAML file for downstream roles
    (service_login, pricing audit, etc.). Each result carries url, title,
    description, source engine, and normalized metadata.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: [all]
    - name: Ubuntu
      versions: [all]
    - name: MacOSX
      versions: [all]
dependencies: []

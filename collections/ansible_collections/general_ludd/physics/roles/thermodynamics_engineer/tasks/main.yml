---
# thermodynamics_engineer role — heat transfer, phase changes, and entropy
#
# Invokes thermodynamics module_utils to:
#   1. Compute heat transfer for configurable substances
#   2. Compute latent heat for phase changes
#   3. Compute entropy changes
#   4. Write all results to the output directory

- name: Create output directory
  ansible.builtin.file:
    path: "{{ thermo_output_dir }}"
    state: directory
    mode: "0755"

- name: Compute thermodynamics
  block:
    - name: Compute heat, phase, and entropy via packaged physics module
      general_ludd.physics.physics_analysis:
        operation: thermodynamics
        output_dir: "{{ thermo_output_dir }}"
        parameters:
          substance: "{{ thermo_substance }}"
          mass_kg: "{{ thermo_mass_kg }}"
          initial_temp_c: "{{ thermo_initial_temp_c }}"
          final_temp_c: "{{ thermo_final_temp_c }}"
          pressure_atm: "{{ thermo_pressure_atm }}"
      register: thermo_result

    - name: Parse thermo result
      ansible.builtin.set_fact:
        thermo_output: "{{ thermo_result.result }}"
      when: thermo_result.result is defined

  rescue:
    - name: Write failure result artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'thermodynamics_engineer', 'status': 'failed',
              'error': thermo_result.msg | default('unknown error')} | to_nice_json }}
        dest: "{{ thermo_output_dir }}/thermo_result.json"
        mode: "0644"
      failed_when: false

    - name: Fail the play after rescue cleanup
      ansible.builtin.fail:
        msg: "thermodynamics_engineer failed — see artifact for details"

---
# organic_synthesist role — plan and analyze organic synthesis routes
#
# Invokes organic_synthesis module_utils to:
#   1. Look up molecule data from the synthesis database
#   2. Predict reaction yields from conditions
#   3. Perform retrosynthetic analysis
#   4. Write results to the output directory

- name: Create output directory
  ansible.builtin.file:
    path: "{{ synth_output_dir }}"
    state: directory
    mode: "0755"

- name: Plan organic synthesis
  block:
    - name: Look up molecule and predict yield via packaged physics module
      general_ludd.physics.physics_analysis:
        operation: organic_synthesis
        output_dir: "{{ synth_output_dir }}"
        parameters:
          target_molecule: "{{ synth_target_molecule }}"
          starting_material: "{{ synth_starting_material }}"
          solvent: "{{ synth_solvent }}"
          catalyst: "{{ synth_catalyst }}"
          temperature_c: "{{ synth_temperature_c }}"
          reaction_time_min: "{{ synth_reaction_time_min }}"
      register: synth_result

    - name: Parse synthesis result
      ansible.builtin.set_fact:
        synth_output: "{{ synth_result.result }}"
      when: synth_result.result is defined

  rescue:
    - name: Write failure result artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'organic_synthesist', 'status': 'failed',
              'error': synth_result.msg | default('unknown error')} | to_nice_json }}
        dest: "{{ synth_output_dir }}/synthesis_result.json"
        mode: "0644"
      failed_when: false

    - name: Fail the play after rescue cleanup
      ansible.builtin.fail:
        msg: "organic_synthesist failed — see artifact for details"

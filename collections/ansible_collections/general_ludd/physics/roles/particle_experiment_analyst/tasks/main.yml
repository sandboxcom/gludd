---
# particle_experiment_analyst role — analyze particle collision data
#
# Invokes particle_experiment module_utils to:
#   1. Compute cross-sections from beam parameters
#   2. Analyze decay chains and branching ratios
#   3. Estimate event yields from luminosity
#   4. Write results to the output directory

- name: Create output directory
  ansible.builtin.file:
    path: "{{ particle_output_dir }}"
    state: directory
    mode: "0755"

- name: Analyze particle experiment
  block:
    - name: Compute cross-section and decay analysis via packaged physics module
      general_ludd.physics.physics_analysis:
        operation: particle_experiment
        output_dir: "{{ particle_output_dir }}"
        parameters:
          beam_energy_gev: "{{ particle_beam_energy_gev }}"
          target: "{{ particle_target }}"
          beam: "{{ particle_beam }}"
          detector: "{{ particle_detector }}"
          luminosity_inv_fb: "{{ particle_luminosity_inv_fb }}"
          analysis_channel: "{{ particle_analysis_channel }}"
      register: particle_result

    - name: Parse particle result
      ansible.builtin.set_fact:
        particle_output: "{{ particle_result.result }}"
      when: particle_result.result is defined

  rescue:
    - name: Write failure result artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'particle_experiment_analyst', 'status': 'failed',
              'error': particle_result.msg | default('unknown error')} | to_nice_json }}
        dest: "{{ particle_output_dir }}/particle_result.json"
        mode: "0644"
      failed_when: false

    - name: Fail the play after rescue cleanup
      ansible.builtin.fail:
        msg: "particle_experiment_analyst failed — see artifact for details"

---
# math_modeler role — solve ODEs, perform regression, compute statistics
#
# Invokes math_modeler module_utils to:
#   1. Solve ordinary differential equations numerically
#   2. Perform linear regression on data sets
#   3. Compute descriptive statistics
#   4. Write results to the output directory

- name: Create output directory
  ansible.builtin.file:
    path: "{{ math_output_dir }}"
    state: directory
    mode: "0755"

- name: Run mathematical model
  block:
    - name: Solve ODE and compute statistics via module_utils
      ansible.builtin.script:
        cmd: |
          import json, sys
          sys.path.insert(0, "{{ playbook_dir }}/../../..")
          from ansible_collections.general_ludd.physics.plugins.module_utils.math_modeler import (
              MathModelConfig, solve_ode_exponential_decay, compute_statistics,
              write_math_result
          )
          config = MathModelConfig(
              model_type="{{ math_model_type }}",
              equation="{{ math_equation }}",
              initial_conditions={"y0": {{ math_initial_y0 }}},
              parameters={"k": {{ math_param_k }}},
              time_range=({{ math_time_start }}, {{ math_time_end }}),
              time_steps={{ math_time_steps }},
          )
          ode_result = solve_ode_exponential_decay(config)
          stats = compute_statistics(ode_result["y_values"])
          result = {"ode_solution": ode_result, "statistics": stats}
          path = write_math_result(result, "{{ math_output_dir }}")
          print(json.dumps({"status": "success", "path": str(path),
                            "half_life": ode_result["half_life"],
                            "mean_y": stats.get("mean", 0)}))
        executable: python3
      register: math_result
      failed_when: false
      changed_when: false

    - name: Parse math result
      ansible.builtin.set_fact:
        math_output: "{{ math_result.stdout | from_json }}"
      when: math_result.rc == 0

  rescue:
    - name: Write failure result artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'math_modeler', 'status': 'failed',
              'error': math_result.stderr | default('unknown error')} | to_nice_json }}
        dest: "{{ math_output_dir }}/math_result.json"
        mode: "0644"
      failed_when: false

    - name: Fail the play after rescue cleanup
      ansible.builtin.fail:
        msg: "math_modeler failed — see artifact for details"

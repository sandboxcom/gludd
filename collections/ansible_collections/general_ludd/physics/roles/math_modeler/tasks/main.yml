---
# math_modeler role — solve ODEs, perform regression, compute statistics
#
# Invokes math_modeler module_utils to:
#   1. Solve ordinary differential equations numerically
#   2. Perform linear regression on data sets
#   3. Compute descriptive statistics
#   4. Write results to the output directory

- name: Create output directory
  ansible.builtin.file:
    path: "{{ math_output_dir }}"
    state: directory
    mode: "0755"

- name: Run mathematical model
  block:
    - name: Solve ODE and compute statistics via packaged physics module
      general_ludd.physics.physics_analysis:
        operation: math
        output_dir: "{{ math_output_dir }}"
        parameters:
          model_type: "{{ math_model_type }}"
          equation: "{{ math_equation }}"
          initial_y0: "{{ math_initial_y0 }}"
          param_k: "{{ math_param_k }}"
          time_start: "{{ math_time_start }}"
          time_end: "{{ math_time_end }}"
          time_steps: "{{ math_time_steps }}"
      register: math_result

    - name: Parse math result
      ansible.builtin.set_fact:
        math_output: "{{ math_result.result }}"
      when: math_result.result is defined

  rescue:
    - name: Write failure result artifact
      ansible.builtin.copy:
        content: |
          {{ {'role': 'math_modeler', 'status': 'failed',
              'error': math_result.msg | default('unknown error')} | to_nice_json }}
        dest: "{{ math_output_dir }}/math_result.json"
        mode: "0644"
      failed_when: false

    - name: Fail the play after rescue cleanup
      ansible.builtin.fail:
        msg: "math_modeler failed — see artifact for details"

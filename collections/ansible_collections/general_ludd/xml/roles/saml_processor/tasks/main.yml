---
- name: Admit one cryptographically verified SAML assertion
  general_ludd.xml.saml_processor:
    root: "{{ saml_processor_root }}"
    saml_path: "{{ saml_processor_path }}"
    saml_sha256: "{{ saml_processor_sha256 }}"
    saml_xml: "{{ saml_processor_xml }}"
    trusted_certificate: "{{ saml_processor_trusted_certificate }}"
    expected_issuer: "{{ saml_processor_expected_issuer }}"
    expected_audience: "{{ saml_processor_expected_audience }}"
    expected_destination: "{{ saml_processor_expected_destination }}"
    expected_in_response_to: "{{ saml_processor_expected_in_response_to }}"
    allowed_claims: "{{ saml_processor_allowed_claims }}"
    clock_skew_seconds: "{{ saml_processor_clock_skew_seconds }}"
  no_log: true
  register: saml_processor_result

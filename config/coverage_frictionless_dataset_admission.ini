[run]
# S40 selector: controller-only Frictionless dataset admission, its closed
# Ansible action surface, and the fail-closed remote-module boundary.
branch = True
parallel = True
include =
    */collections/ansible_collections/general_ludd/ai_ml/plugins/action/dataset_admit.py
    */collections/ansible_collections/general_ludd/ai_ml/plugins/module_utils/dataset_admission.py
    */collections/ansible_collections/general_ludd/ai_ml/plugins/modules/dataset_admit.py

[report]
show_missing = True
fail_under = 85

---
version: 3
images:
  base_image:
    # Ansible Builder 3.x supports RPM/dnf bases; Debian-family bases are not
    # supported. This immutable CentOS Stream 9 index is resolved independently
    # of the managed-host Python lock and the Gludd core interpreter.
    name: quay.io/centos/centos:stream9@sha256:33346f5fe280763eb78e85f968ad52bc2b2013369de85403f67e802db98ed243
dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
  exclude:
    python:
      - azure-identity
      - azure-cli-core
      - azure-core
  ansible_core:
    package_pip: ansible-core==2.19.12
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
additional_build_files:
  - src: ../../dist/collections/general_ludd-agent-0.2.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-ai_ml-0.2.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-azure-0.2.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-infrastructure-0.2.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-language-0.1.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-networking-0.2.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-travel-0.1.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-xml-0.1.0.tar.gz
    dest: collections
additional_build_steps:
  append_base:
    # The pinned SearXNG Python source needs Git in the builder, not just final.
    - RUN $PKGMGR install -y git-core && $PKGMGR clean all
    # The distro pip emitted an update notice during actual hosted assembly.
    - RUN $PYCMD -m pip install --no-cache-dir --upgrade pip==26.2.1
    # Supply the pinned source's undeclared metadata dependency in isolation.
    - RUN $PYCMD -m pip install --no-cache-dir uv==0.12.19
    - >-
      RUN mkdir -p /etc/gludd && printf '%s\n'
      '[pip.extra-build-dependencies]'
      'searxng = ["pyyaml==6.0.2"]'
      > /etc/gludd/ansible-ee-uv.toml
    # Both standard Builder dependency scripts honor PIPCMD; no wrapper needed.
    - ENV PIPCMD="/usr/bin/python3.11 -m uv pip"
    - ENV UV_CONFIG_FILE=/etc/gludd/ansible-ee-uv.toml
    - ENV UV_PYTHON=/usr/bin/python3.11 UV_SYSTEM_PYTHON=true UV_BREAK_SYSTEM_PACKAGES=true
    - ENV UV_LINK_MODE=copy UV_PYTHON_DOWNLOADS=never UV_CONCURRENT_BUILDS=1
  prepend_builder:
    # assemble creates and activates this venv before resolving requirements.
    - ENV UV_PYTHON=/tmp/venv/bin/python UV_SYSTEM_PYTHON=false
  append_final:
    # Upstream freezer runs from the verified source, then installs real metadata.
    - >-
      RUN set -eu; source_dir="$(mktemp -d /tmp/gludd-ansible-ee-searxng-XXXXXXXX)";
      trap 'rm -rf -- "$source_dir"' EXIT HUP INT TERM;
      git clone --filter=blob:none --no-checkout --depth=1 --config core.abbrev=40
      https://github.com/searxng/searxng.git "$source_dir";
      git -C "$source_dir" fetch --depth=1 origin 7b4612e86250389dc9d5ee67e4cc2cd64d06602a;
      git -C "$source_dir" checkout --detach 7b4612e86250389dc9d5ee67e4cc2cd64d06602a;
      test "$(git -C "$source_dir" rev-parse HEAD)" = 7b4612e86250389dc9d5ee67e4cc2cd64d06602a;
      cd "$source_dir"; /usr/bin/python3.11 -m searx.version freeze;
      /usr/bin/python3.11 -c 'import json, runpy, shutil, sys;
      from importlib import metadata;
      from pathlib import Path;
      from packaging.version import Version;
      expected = sys.argv[2];
      dist = metadata.distribution("searxng");
      record = json.loads(dist.read_text("direct_url.json") or "null");
      isinstance(record, dict) or sys.exit("SearXNG installed source provenance is missing");
      vcs = record.get("vcs_info", {});
      (isinstance(vcs, dict) and record.get("url", "").removesuffix(".git") == "https://github.com/searxng/searxng" and vcs.get("vcs") == "git" and vcs.get("commit_id") == expected) or sys.exit("SearXNG installed source provenance differs from the frozen revision");
      frozen = runpy.run_path(sys.argv[1]);
      installed_version = Version(dist.version);
      frozen_version = Version(frozen["VERSION_TAG"]);
      (installed_version.local is not None and 7 <= len(installed_version.local) <= 40 and expected.startswith(installed_version.local) and installed_version.public == frozen_version.public and frozen_version.local == expected and frozen["VERSION_STRING"] == frozen["VERSION_TAG"] and frozen["DOCKER_TAG"] == frozen["VERSION_STRING"].replace("+", "-")) or sys.exit("SearXNG frozen version differs from installed source identity");
      (frozen["GIT_URL"] in {"https://github.com/searxng/searxng", "unknow"} and isinstance(frozen["GIT_BRANCH"], str) and bool(frozen["GIT_BRANCH"])) or sys.exit("SearXNG frozen upstream metadata is malformed");
      target = Path(dist.locate_file("searx/version_frozen.py"));
      (target.parent.is_dir() and not target.parent.is_symlink() and not target.is_symlink()) or sys.exit("SearXNG installed metadata target is not a regular package path");
      shutil.copyfile(sys.argv[1], target);
      print("ANSIBLE_EE_SEARXNG_FROZEN_OK source=" + expected)' "$source_dir/searx/version_frozen.py" 7b4612e86250389dc9d5ee67e4cc2cd64d06602a
    - >-
      RUN set -eu; machine="$(uname -m)";
      case "$machine" in
      x86_64) archive="tofu_1.12.6_linux_amd64.zip";
      sha256="5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8" ;;
      aarch64|arm64) archive="tofu_1.12.6_linux_arm64.zip";
      sha256="e573979ba68a17fe7b881752051a694a7efcd970e39521f6a25775197861ed4d" ;;
      *) echo "unsupported OpenTofu architecture: $machine" >&2; exit 2 ;;
      esac;
      curl --fail --location --proto '=https' --tlsv1.2
      --output "/tmp/$archive"
      "https://github.com/opentofu/opentofu/releases/download/v1.12.6/$archive";
      printf '%s  %s\n' "$sha256" "/tmp/$archive"
      | sha256sum --check --strict;
      /usr/bin/python3.11 -m zipfile -e "/tmp/$archive" /tmp/opentofu-extract;
      install -m 0755 /tmp/opentofu-extract/tofu /usr/local/bin/tofu;
      /usr/local/bin/tofu version;
      rm -rf "/tmp/$archive" /tmp/opentofu-extract
options:
  package_manager_path: /usr/bin/dnf
  user: root

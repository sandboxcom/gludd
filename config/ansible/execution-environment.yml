---
version: 3
images:
  base_image:
    # Ansible Builder 3.x supports RPM/dnf bases; Debian-family bases are not
    # supported. This immutable CentOS Stream 9 index is resolved independently
    # of the managed-host Python lock and the Gludd core interpreter.
    name: quay.io/centos/centos:stream9@sha256:64e5a212e4f2e7b706dbd822968914bb8def7de0a7fdfd3bf248241f8758101c
dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
  ansible_core:
    package_pip: ansible-core==2.19.12
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
additional_build_files:
  - src: ../../dist/collections/general_ludd-agent-0.2.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-language-0.1.0.tar.gz
    dest: collections
  - src: ../../dist/collections/general_ludd-networking-0.2.0.tar.gz
    dest: collections
options:
  package_manager_path: /usr/bin/dnf
  user: root

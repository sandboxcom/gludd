# Model Profile: Anthropic Claude
# ================================
# PURPOSE: Connect to Anthropic's Claude API for coding, review, and planning tasks.
# REQUIRED: Set ANTHROPIC_API_KEY environment variable.
#
# Fields:
#   model_profile_id     — Unique identifier referenced in model_routing
#   role_names           — Which agent roles use this profile
#   provider             — LangChain provider package name
#   provider_package     — pip package to install
#   provider_class_hint  — LangChain chat model class
#   model_name           — Exact model identifier from the provider
#   credential_alias     — Environment variable name for API key
#   context_window       — Total tokens the model can process
#   max_input_tokens     — Practical input limit (leave headroom)
#   max_output_tokens    — Max response length
#   cost_per_input_token — USD per 1M input tokens (for budget tracking)
#   cost_per_output_token— USD per 1M output tokens
#   api_metered          — Whether the API charges per request
#   run_budget_usd       — Max spend per run
#   enabled              — Whether this profile is active
#   resource_profile     — Hardware profile (ai_heavy, cpu_light)
#   latency_class        — Speed tier (fast, medium, slow)
#   quality_class        — Quality tier (high, medium, low)
#   fallback_profiles    — Profiles to try if this one fails
#   probe_enabled        — Health-check the endpoint on startup
model_profile_id: anthropic_claude
role_names:
  - coder
  - reviewer
  - planner
provider: anthropic
provider_package: langchain-anthropic
provider_class_hint: ChatAnthropic
model_name: claude-sonnet-4-20250514
credential_alias: ANTHROPIC_API_KEY
context_window: 200000
max_input_tokens: 190000
max_output_tokens: 16000
cost_per_input_token: 0.003
cost_per_output_token: 0.015
api_metered: true
run_budget_usd: 50.0
enabled: true
resource_profile: ai_heavy
roles:
  - coder
  - reviewer
  - planner
latency_class: medium
quality_class: high
fallback_profiles:
  - openai_gpt4
probe_enabled: true

# Model Profile: Compactor (Local SLM)
# ================================
# PURPOSE: Fast, cheap local Small Language Model used for context compaction
#          (summarizing chat history, compressing tool output). Quality is low
#          but acceptable because outputs are internal summaries, not user-facing.
# REQUIRED: Start local SLM server and set LOCAL_SLM_API_KEY and
#           LOCAL_SLM_BASE_URL environment variables.
#
# Fields:
#   model_profile_id     — Unique identifier referenced in model_routing
#   role_names           — Which agent roles use this profile
#   provider             — LangChain provider package name
#   provider_package     — pip package to install
#   provider_class_hint  — LangChain chat model class
#   model_name           — Exact model identifier from the provider
#   api_base_alias       — Environment variable name for the API base URL
#   credential_alias     — Environment variable name for API key
#   context_window       — Total tokens the model can process
#   max_input_tokens     — Practical input limit (leave headroom)
#   max_output_tokens    — Max response length
#   cost_per_input_token — USD per 1M input tokens (for budget tracking)
#   cost_per_output_token— USD per 1M output tokens
#   api_metered          — Whether the API charges per request
#   run_budget_usd       — Max spend per run
#   enabled              — Whether this profile is active
#   resource_profile     — Hardware profile (ai_heavy, ai_light, cpu_light)
#   latency_class        — Speed tier (fast, medium, slow)
#   quality_class        — Quality tier (high, medium, low)
#   fallback_profiles    — Profiles to try if this one fails
#   probe_enabled        — Health-check the endpoint on startup
model_profile_id: compactor
role_names:
  - compactor
provider: openai
provider_package: langchain_openai
provider_class_hint: ChatOpenAI
model_name: llama-3.2-3b-instruct
credential_alias: LOCAL_SLM_API_KEY
api_base_alias: LOCAL_SLM_BASE_URL
context_window: 8192
max_input_tokens: 7168
max_output_tokens: 512
cost_per_input_token: 0.0
cost_per_output_token: 0.0
api_metered: false
run_budget_usd: 0.0
enabled: true
resource_profile: ai_light
roles:
  - compactor
latency_class: fast
quality_class: low
fallback_profiles: []
probe_enabled: false

[run]
# S42 selector: native controller JUnit triage, its action surface, and the
# fail-closed remote-module boundary.
branch = True
parallel = True
include =
    */collections/ansible_collections/general_ludd/git_release/plugins/action/pipeline_triage.py
    */collections/ansible_collections/general_ludd/git_release/plugins/module_utils/pipeline_triage.py
    */collections/ansible_collections/general_ludd/git_release/plugins/modules/pipeline_triage.py

[report]
show_missing = True
fail_under = 85

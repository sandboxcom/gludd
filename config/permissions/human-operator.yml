version: 1
agent_type: human-operator
subject: human
parent_agent_id: null
max_sts_ttl_seconds: 3600
max_subagent_permissions: same_or_fewer
capabilities:
  - resource: file:repo
    actions: ["read", "write"]
    constraints:
      path_prefix: "/repo/"
  - resource: net:egress:any
    actions: ["connect"]
    constraints:
      allowed_hosts: ["*"]
  - resource: secret:openbao
    actions: ["read"]
    constraints:
      openbao_paths: ["secret/data/gludd/*"]
denied: []

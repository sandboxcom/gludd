version: 1
agent_type: build
parent_agent_id: null
max_sts_ttl_seconds: 3600
max_subagent_permissions: same_or_fewer
capabilities:
  - resource: file:repo
    actions: ["read", "write"]
    constraints:
      path_prefix: "/repo/"
  - resource: file:tmp
    actions: ["read", "write"]
    constraints:
      path_prefix: "/tmp/gludd/"
  - resource: net:egress:llm_api
    actions: ["connect"]
    constraints:
      allowed_hosts: ["api.anthropic.com", "api.openai.com", "api.z.ai"]
  - resource: secret:openbao
    actions: ["read", "write"]
    constraints:
      openbao_paths: ["secret/data/gludd/build/*"]
  - resource: agent:ornith
    actions: ["solve", "improve"]
    constraints:
      max_iterations: 50
      max_tokens_per_call: 100000
denied: []

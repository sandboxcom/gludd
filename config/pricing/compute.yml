# =============================================================================
# compute.yml — GPU instance pricing with spot/preemptible options.
# =============================================================================
#
# All prices are USD per GPU-hour unless otherwise noted.
# Each instance type lists on-demand rate and (where available) spot/preemptible
# discount as a fraction of on-demand.
#
# Naming convention for instance keys: <provider>__<gpu_family>__<description>
#   e.g. aws__a100_80__p4d_large
#
# Fields per instance:
#   gpu:               GPU model identifier (t4, a100_80, h100, etc.)
#   gpu_count:         Number of GPUs per instance
#   on_demand_usd_hr:  On-demand price per GPU-hour (already multiplied by gpu_count)
#   spot_discount:     Fractional discount for spot/preemptible (0.60 = 60% off)
#   vcpus:             vCPU count
#   memory_gb:         System RAM in GB
# =============================================================================

instances:

# =============================================================================
# providers.yml — Model-provider rate cards with peak/off-peak windows.
# =============================================================================
#
# Rates are USD per 1,000 output tokens.  Input tokens are typically bundled
# at a lower rate (see input_usd_per_1k under each model).
#
# Peak window definition (per provider):
#   Standard: 08:00-23:59 UTC, Mon-Fri
#   Off-peak: 00:00-07:59 UTC, Mon-Fri + all day Sat-Sun
#
# Providers with flat rates (no peak/off-peak discrimination):
#   DeepSeek, Together AI, Fireworks, Groq, Mistral
# =============================================================================


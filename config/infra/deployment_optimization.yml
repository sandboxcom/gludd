vllm:
  defaults:
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    enforce_eager: false
    enable_prefix_caching: true
    enable_chunked_prefill: true

llamacpp:
  defaults:
    flash_attn: true
    n_threads: 0
    split_mode: layer

hardware_presets:
  h100:
    vram_tier: high_vram
    vllm:
      tensor_parallel_size: 8
      dtype: bf16
      pipeline_parallel_size: 1
    llamacpp:
      gguf_quant: q8_0
      n_gpu_layers: -1
      cache_type_k: q8_0
      cache_type_v: q8_0
  h200:
    vram_tier: high_vram
    vllm:
      tensor_parallel_size: 8
      dtype: bf16
      pipeline_parallel_size: 1
    llamacpp:
      gguf_quant: q8_0
      n_gpu_layers: -1
      cache_type_k: q8_0
      cache_type_v: q8_0
  a100_80:
    vram_tier: high_vram
    vllm:
      tensor_parallel_size: 4
      dtype: bf16
      pipeline_parallel_size: 1
    llamacpp:
      gguf_quant: q6_k
      n_gpu_layers: -1
  a100_40:
    vram_tier: high_vram
    vllm:
      tensor_parallel_size: 2
      dtype: bf16
      pipeline_parallel_size: 1
    llamacpp:
      gguf_quant: q6_k
      n_gpu_layers: -1
  l40s:
    vram_tier: mid_vram
    vllm:
      tensor_parallel_size: 1
      pipeline_parallel_size: 2
      dtype: bf16
    llamacpp:
      gguf_quant: q6_k
      n_gpu_layers: -1
  l4:
    vram_tier: mid_vram
    vllm:
      tensor_parallel_size: 1
      dtype: bf16
    llamacpp:
      gguf_quant: q5_k_m
      n_gpu_layers: -1
  rtx_6000_ada:
    vram_tier: mid_vram
    vllm:
      tensor_parallel_size: 1
      dtype: bf16
    llamacpp:
      gguf_quant: q6_k
      n_gpu_layers: -1
  rtx_4090:
    vram_tier: mid_vram
    vllm:
      tensor_parallel_size: 1
      dtype: bf16
    llamacpp:
      gguf_quant: q5_k_m
      n_gpu_layers: -1
  rtx_3090:
    vram_tier: mid_vram
    vllm:
      tensor_parallel_size: 1
      dtype: bf16
    llamacpp:
      gguf_quant: q5_k_m
      n_gpu_layers: -1
  a10:
    vram_tier: low_vram
    vllm:
      tensor_parallel_size: 1
      dtype: fp16
    llamacpp:
      gguf_quant: q4_k_m
      n_gpu_layers: -1
  a10g:
    vram_tier: low_vram
    vllm:
      tensor_parallel_size: 1
      dtype: fp16
    llamacpp:
      gguf_quant: q4_k_m
      n_gpu_layers: -1
  t4:
    vram_tier: low_vram
    vllm:
      tensor_parallel_size: 1
      dtype: fp16
    llamacpp:
      gguf_quant: q4_k_m
      n_gpu_layers: -1

quantization_recommendations:
  - min_params_b: 70
    min_vram_gb: 80
    recommendation: fp8
  - min_params_b: 10
    max_params_b: 69
    min_vram_gb: 24
    recommendation: awq
  - max_params_b: 10
    max_vram_gb: 16
    recommendation: q4_k_m

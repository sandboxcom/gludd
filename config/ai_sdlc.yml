# ── Observability Requirements ────────────────────────────────────────────────
#
# Per gludd's "No Unseen Events" invariant (AGENTS.md line 175):
# every SDLC stage transition MUST emit an observable event.
#
stage_observability:
  events:
    stage_entered:
      emitter: "sdlc_gate role (stage_entered message)"
      channel: "gludd_message topic=sdlc_stage_transition"
      payload: ["stage", "task_name", "entry_gate_status", "timestamp"]
    stage_exited:
      emitter: "sdlc_gate role (stage_exited message)"
      channel: "gludd_message topic=sdlc_stage_transition"
      payload: ["stage", "task_name", "exit_gate_status", "validation_token", "next_stage", "timestamp"]
    gate_blocked:
      emitter: "sdlc_gate role (gate_blocked message, priority=high)"
      channel: "gludd_message topic=sdlc_gate_blocked"
      payload: ["stage", "task_name", "block_reasons", "timestamp"]
  metrics:
    stage_duration_seconds: "Emitted per stage as a gauge via /api/metrics"
    stage_pass_rate: "Per-stage pass/fail rate tracked via MetricsCollector"
    token_chain_health: "Validation token chain health (present/missing/broken per token)"

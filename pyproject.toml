    "ansible-core>=2.21.2,<2.22; python_version >= '3.12'",
    "ansible-runner>=2.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "ansible-core>=2.19.11,<2.20; python_version < '3.12'",
    "ansible-core>=2.21.2,<2.22; python_version >= '3.12'",
    "ansible-runner>=2.4.0",
    "ansible-builder>=3.1.1,<3.2",
    "httpx2>=2.7.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest-ansible>=24.0.0",
    "molecule>=24.0.0",
    "molecule-plugins[docker]>=25.8.12",
    "ansible-lint>=24.0.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.0.0",
    "types-gunicorn>=26.0.0.20260518",
    "types-defusedxml>=0.7.0.20240218",

[project]
name = "general-ludd-agent"
version = "0.1.0-beta.2"
description = "General Ludd Agent — the black swan agentic coding system with Ansible runners and multi-model AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{name = "General Ludd Team"}]

dependencies = [
    "fastapi>=0.115.0",
    # Dep2 (CVE-2026-54283, HIGH): fastapi only floors starlette at 1.2.0 (verified
    # in uv.lock), which is BELOW the patched 1.3.1 — fastapi's transitive pin does
    # NOT cover the CVE, so pin starlette explicitly.
    "starlette>=1.3.1",
    "uvicorn-worker>=0.3.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.0",
    # Dep3 (CVE lower-bound, 2026-06-24): pin cryptography away from known-vulnerable
    # releases. Pulled in transitively (hvac/requests/TLS); pin explicitly so the
    # floor is enforced regardless of which transitive dep selects it.
    "cryptography>=48.0.1",
    # Dep5 (CVE lower-bound, 2026-06-24): msgpack floor. Transitive (e.g. via cache
    # / langgraph stack); pinned explicitly to enforce the patched floor.
    "msgpack>=1.2.1",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
    "tenacity>=9.0.0",
    "ansible-core>=2.16.0",
    # Subprocess backend for process_isolation: when
    # ProcessIsolationConfig.enabled=True, CoreAnsibleRunner delegates to
    # ansible-runner which spawns podman/bwrap for real container confinement
    # (finding #1 real fix — replaces the Wave 13 fail-closed guard).
    "ansible-runner>=2.4.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0.2",
    "hvac>=2.3.0",
    "langchain>=1.3.9",
    "langchain-openai>=0.3.0",
    "requests>=2.32.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "huggingface-hub>=0.28.0",
    "langgraph>=0.2.0",
    "langsmith>=0.8.18",
    "watchdog>=6.0.0",
    "fs>=2.4.0",
    "rich>=13.0.0",
    "diskcache>=5.6.0",
    # Cron expression parsing and next-run computation for the integrated
    # todo scheduler (one-shot and recurring SCHEDULED todos).
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest-ansible>=24.0.0",
    "molecule>=24.0.0",
    "ansible-lint>=24.0.0",
    "ansible-dev-tools>=24.0.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "pyinstaller>=6.0.0",
    "bandit>=1.8.0",
    "cyclonedx-py>=0.7.0",
    "pip-audit>=0.3.0",
    "pip>=26.1.2",
]
local-inference = [
    "llama-cpp-python>=0.3.0",
    "vllm>=0.6.0",
]
aws = [
    # Optional — required only for `gludd onboard aws` live validation and the
    # AWS pricing/observability/connectors modules. Imported lazily inside
    # function bodies so the core package never hard-depends on boto3.
    "boto3>=1.34.0",
]
# Cloud onboarding SDKs — lazy imports only, never top-level deps.
gcp = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-cloud-core>=2.3.0",
]
azure = [
    "azure-identity>=1.16.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-authorization>=3.0.0",
    "azure-mgmt-resource>=23.0.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
sandbox = [
    # Optional per-agent sandboxing backends.
    #
    # bubblewrap: binary dependency (NOT pip) — operators install via
    #   `apt install bubblewrap` (Debian/Ubuntu) / `dnf install bubblewrap`
    #   (Fedora) / `brew install bubblewrap` (macOS dev). The backend probes
    #   `shutil.which("bwrap")` and fail-opens if absent.
    #
    # pylandlock: the upstream Python Landlock bindings are not reliably
    #   published to PyPI across all resolver contexts (no wheels for some
    #   Python versions). Operators install pylandlock OUT OF BAND on the
    #   Linux host that needs Landlock enforcement — e.g. via
    #   `pip install pylandlock` from the host's own Python, or from source
    #   (https://github.com/Jamesitive/pylandlock). The backend's
    #   `LandlockBackend.apply()` does a lazy `import landlock` and returns
    #   applied=False (fail-open) if it is not importable; the [sandbox]
    #   extra exists as the documented install surface, not a hard dep.
]

[project.scripts]
gludd = "general_ludd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/general_ludd", "LICENSE", "THIRD_PARTY_LICENSES.md", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/general_ludd"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_LICENSES.md" = "general_ludd/THIRD_PARTY_LICENSES.md"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["general_ludd"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Sandbox backends (security/sandboxes/*) are in-flight parallel work that
# references API surface not yet shipped on PermissionSpec/Capability
# (agent_id, constraint_value, Constraint class). Excluded until that schema
# lands; re-enabling is the parallel task's completion gate.
exclude = ["src/general_ludd/security/sandboxes/.*"]

[[tool.mypy.overrides]]
module = ["ansible.*", "hvac.*", "psycopg.*", "yaml.*", "tree_sitter.*", "tree_sitter_python.*", "huggingface_hub.*", "diskcache.*", "watchdog.*", "croniter.*", "jsonschema", "googleapiclient.*", "google.*", "azure.*", "ansible_runner"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "general_ludd.ansible.core_runner"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.observability.metrics_exporter"
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --ignore=tests/fixtures -m \"not hook_live\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# UNIVERSAL per-test stall guard: no single test may hang the suite. Applies to
# EVERY pytest invocation (local gate, container, CI) — a test exceeding 180s is
# killed with a full thread-stack dump instead of freezing the run forever. This
# is the project-wide fix for the class of "a hanging test stalls everything"
# (e.g. a TUI input-feed that never reaches quit on headless Linux).
timeout = 180
timeout_method = "signal"
markers = [
    "xdist_group: serialize tests that share a fixed resource (e.g. port 8000 or the daemon PID file) under pytest-xdist",
    "requires_slurm: skip unless SLURM_AVAILABLE=1 is set in env or sbatch is on PATH",
    "requires_postgres: skip unless POSTGRES_AVAILABLE=1 is set in env or port 5432 is open",
    "hook_live: exercises a real opencode CLI against the .opencode/plugin/*.ts hooks; excluded from the default run (`-m \"not hook_live\"` in addopts) — run via `make test-hooks-live` or `-m hook_live`",
]

[tool.coverage.run]
source = ["general_ludd"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "pyinstaller>=6.0.0",
    "bandit>=1.8.0",
    "cyclonedx-py>=0.7.0",
    "pip-audit>=0.3.0",
    "deptry>=0.20.0",
    "molecule>=24.0.0",
    "ansible-lint>=24.0.0",
]

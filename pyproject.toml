    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.0",
    "blake3>=1.0.0",
    "chardet>=5.2.0,<6",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "uvicorn-worker>=0.3.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "safehttpx>=0.1.7,<0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "annotated-types>=0.7.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=49.0.0,<51",
    "pqcrypto>=0.4.0,<1",
    "msgpack>=1.2.1",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.0.0",
    "hvac>=2.3.0",
    "requests>=2.32.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "huggingface-hub>=0.28.0",
    "langgraph>=0.2.0",
    "langsmith>=0.8.18",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "openai>=1.0.0",
    "watchdog>=6.0.0",
    "fs>=2.4.0",
    "rich>=13.0.0",
    "diskcache>=5.6.3,<6",
    "filelock>=3.13.0",
    "defusedxml>=0.7.1,<1",
    "prompt_toolkit>=3.0.0",
    "pycryptodome>=3.20.0",
    "pygments>=2.0.0",

[project]
name = "general-ludd-agent"
version = "0.1.0-beta.2"
description = "General Ludd Agent — the black swan agentic coding system with Ansible runners and multi-model AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{name = "General Ludd Team"}]

dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "uvicorn-worker>=0.3.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.0",
    "cryptography>=48.0.1",
    "msgpack>=1.2.1",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
    "tenacity>=9.0.0",
    "ansible-core>=2.16.0",
    "ansible-runner>=2.4.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0.2",
    "hvac>=2.3.0",
    "requests>=2.32.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "huggingface-hub>=0.28.0",
    "langgraph>=0.2.0",
    "langsmith>=0.8.18",
    "watchdog>=6.0.0",
    "fs>=2.4.0",
    "rich>=13.0.0",
    "diskcache>=5.6.0",
    "prompt_toolkit>=3.0.0",
    "pygments>=2.0.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest-ansible>=24.0.0",
    "molecule>=24.0.0",
    "ansible-lint>=24.0.0",
    "ansible-dev-tools>=24.0.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "pyinstaller>=6.0.0",
    "bandit>=1.8.0",
    "cyclonedx-py>=0.7.0",
    "pip-audit>=0.3.0",
    "pip>=26.1.2",
]
local-inference = [
    "llama-cpp-python>=0.3.0",
    "vllm>=0.6.0",
]
aws = [
    "boto3>=1.34.0",
]
gcp = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-cloud-core>=2.3.0",
]
azure = [
    "azure-identity>=1.16.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-authorization>=3.0.0",
    "azure-mgmt-resource>=23.0.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
sandbox = [
]

[project.scripts]
gludd = "general_ludd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/general_ludd", "LICENSE", "THIRD_PARTY_LICENSES.md", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/general_ludd"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_LICENSES.md" = "general_ludd/THIRD_PARTY_LICENSES.md"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["general_ludd"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["scripts/", "tests/unit/test_injection_patterns.py", "tests/unit/test_sql_injection_patterns.py", "tests/unit/test_ci_push_guard.py", "abtest/"]

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "ansible.*", "hvac.*", "psycopg.*", "yaml.*", "tree_sitter.*", "tree_sitter_python.*", "huggingface_hub.*", "diskcache.*", "watchdog.*", "croniter.*", "jsonschema", "googleapiclient.*", "google.*", "azure.*", "ansible_runner", "scapy", "scapy.*", "xmlsec", "lxml", "lxml.etree", "lxml.*", "pyVim", "pyVim.*", "pyVmomi", "pyVmomi.*", "openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "general_ludd.ansible.core_runner"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.db.models"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.observability.metrics_exporter"
disable_error_code = ["type-arg"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --ignore=tests/fixtures -m \"not hook_live\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
timeout_method = "signal"
markers = [
    "xdist_group: serialize tests that share a fixed resource (e.g. port 8000 or the daemon PID file) under pytest-xdist",
    "requires_slurm: skip unless SLURM_AVAILABLE=1 is set in env or sbatch is on PATH",
    "requires_postgres: skip unless POSTGRES_AVAILABLE=1 is set in env or port 5432 is open",
    "hook_live: exercises a real opencode CLI against the .opencode/plugin/*.ts hooks; excluded from the default run (`-m \"not hook_live\"` in addopts) — run via `make test-hooks-live` or `-m hook_live`",
]

[tool.coverage.run]
source = ["general_ludd"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "pyinstaller>=6.0.0",
    "bandit>=1.8.0",
    "cyclonedx-py>=0.7.0",
    "pip-audit>=0.3.0",
    "deptry>=0.20.0",
    "molecule>=24.0.0",
    "ansible-lint>=24.0.0",
]

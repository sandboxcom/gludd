[project]
name = "general-ludd-agent"
version = "0.1.1"
description = "General Ludd Agent — the black swan agentic coding system with Ansible runners and multi-model AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{name = "General Ludd Team"}]

dependencies = [
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.0",
    "blake3>=1.0.0",
    "chardet>=5.2.0,<6",
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "uvicorn-worker>=0.3.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "safehttpx>=0.1.7,<0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "annotated-types>=0.7.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "cryptography>=49.0.0,<51",
    "pqcrypto>=0.4.0,<1",
    "msgpack>=1.2.1",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.0.0",
    "hvac>=2.3.0",
    "requests>=2.32.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "watchdog>=6.0.0",
    "rich>=13.0.0",
    "diskcache>=5.6.3,<6",
    "filelock==4.0.12",
    "pathspec>=1.0.4,<2",
    "defusedxml>=0.7.1,<1",
    "prompt_toolkit>=3.0.0",
    "pygments>=2.0.0",
    "croniter>=2.0.0",
    "quickjs-ng==0.16.2.1",
]

[project.scripts]
gludd = "general_ludd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "mako>=1.4.2",
    "urllib3>=2.8.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/general_ludd",
    "collections/ansible_collections/general_ludd/git_release/plugins/module_utils/provenance.py",
    "LICENSE",
    "THIRD_PARTY_LICENSES.md",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/general_ludd"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_LICENSES.md" = "general_ludd/THIRD_PARTY_LICENSES.md"
"infra/terraform/modules" = "general_ludd/terraform/modules"
"infra/terraform/stacks" = "general_ludd/terraform/stacks"
"collections/ansible_collections/general_ludd/git_release/plugins/module_utils/provenance.py" = "ansible_collections/general_ludd/git_release/plugins/module_utils/provenance.py"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/general_ludd/language/core.py" = ["RUF001"]
"src/general_ludd/language/detection.py" = ["RUF001"]
"src/general_ludd/language/transliteration.py" = ["RUF001"]
"tests/unit/test_language_core.py" = ["RUF001"]
"tests/unit/test_language_detection.py" = ["RUF001"]
"tests/unit/test_language_transliteration.py" = ["RUF001"]
"tests/unit/test_transliteration_deep.py" = ["RUF001"]
"collections/ansible_collections/general_ludd/language/plugins/module_utils/core.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["general_ludd"]
known-third-party = ["safehttpx"]

[tool.mypy]
python_version = "3.11"
mypy_path = "typings"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["scripts/", "tests/unit/test_injection_patterns.py", "tests/unit/test_sql_injection_patterns.py", "tests/unit/test_ci_push_guard.py", "abtest/"]

[[tool.mypy.overrides]]
module = "general_ludd.algorithms.sphincs_plus"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "Crypto"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "ansible.*", "ansible_collections.*", "hvac.*", "psycopg.*", "yaml.*", "tree_sitter.*", "tree_sitter_python.*", "huggingface_hub.*", "diskcache.*", "watchdog.*", "croniter.*", "jsonschema", "googleapiclient.*", "google.*", "azure.*", "ansible_runner", "xmlsec", "lxml", "lxml.etree", "pyVim.*", "pyVmomi", "openai", "lm_eval", "argon2", "blake3", "pqcrypto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scapy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "pygame", "skimage.*", "yt_dlp"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "general_ludd.ansible.core_runner"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.db.models"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.observability.metrics_exporter"
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --ignore=tests/fixtures -m \"not hook_live and not presentation_browser\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
timeout_method = "signal"
markers = [
    "e2e: end-to-end workflow coverage; may use isolated subprocesses or temporary repositories",
    "xdist_group: serialize tests that share a fixed resource (e.g. port 8000 or the daemon PID file) under pytest-xdist",
    "requires_slurm: skip unless SLURM_AVAILABLE=1 is set in env or sbatch is on PATH",
    "requires_postgres: skip unless POSTGRES_AVAILABLE=1 is set in env or port 5432 is open",
    "azure_provision: full Azure GPU VM/Container App provisioning E2E — opt-in, costly, manual",
    "hook_live: exercises a real opencode CLI against the .opencode/plugin/*.ts hooks; excluded from the default run (`-m \"not hook_live\"` in addopts) — run via `make test-hooks-live` or `-m hook_live`",
    "presentation_browser: mandatory Chromium acceptance run by the dedicated presentation browser target",
    "slow: tests that are known to take longer than normal (network, model inference, large fixtures)",
    "network: tests that require explicit external network access",
    "local_model: tests that require a locally running model endpoint",
]
[tool.coverage.run]
branch = true
source = ["general_ludd"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

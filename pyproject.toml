[project]
name = "general-ludd-agent"
version = "0.1.0-beta.3"
description = "General Ludd Agent — the black swan agentic coding system with Ansible runners and multi-model AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{name = "General Ludd Team"}]

dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.1.0-beta.2",
    "starlette>=0.1.0-beta.2",
    "uvicorn-worker>=0.1.0-beta.2",
    "gunicorn>=0.1.0-beta.2",
    "httpx>=0.1.0-beta.2",
    "httpx2>=2.0.0",
        "pydantic>=0.1.0-beta.2",
    "pydantic-settings>=0.1.0-beta.2",
    "sqlalchemy>=0.1.0-beta.2",
    "cryptography>=0.1.0-beta.2",
    "msgpack>=0.1.0-beta.2",
    "alembic>=0.1.0-beta.2",
    "psycopg[binary]>=0.1.0-beta.2",
    "aiosqlite>=0.1.0-beta.2",
    "structlog>=0.1.0-beta.2",
    "prometheus-client>=0.1.0-beta.2",
    "psutil>=0.1.0-beta.2",
    "tenacity>=0.1.0-beta.2",
    "ansible-core>=0.1.0-beta.2",
    "ansible-runner>=0.1.0-beta.2",
    "jinja2>=0.1.0-beta.2",
    "jsonschema>=4.21",
    "pyyaml>=0.1.0-beta.2",
    "hvac>=0.1.0-beta.2",
    "requests>=0.1.0-beta.2",
    "tree-sitter>=0.1.0-beta.2",
    "tree-sitter-python>=0.1.0-beta.2",
    "huggingface-hub>=0.1.0-beta.2",
    "langgraph>=0.1.0-beta.2",
    "langsmith>=0.1.0-beta.2",
    "langchain-openai>=0.3.0",
    "watchdog>=0.1.0-beta.2",
    "fs>=0.1.0-beta.2",
    "rich>=13.0.0",
    "diskcache>=0.1.0-beta.2",
    "prompt_toolkit>=3.0.0",
    "pygments>=2.0.0",
    "croniter>=0.1.0-beta.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=0.1.0-beta.2",
    "pytest-cov>=0.1.0-beta.2",
    "pytest-asyncio>=0.1.0-beta.2",
    "pytest-xdist>=0.1.0-beta.2",
    "pytest-timeout>=0.1.0-beta.2",
    "ruff>=0.1.0-beta.2",
    "mypy>=0.1.0-beta.2",
    "pre-commit>=0.1.0-beta.2",
    "pytest-ansible>=0.1.0-beta.2",
    "molecule>=0.1.0-beta.2",
    "ansible-lint>=0.1.0-beta.2",
    "ansible-dev-tools>=0.1.0-beta.2",
    "types-requests>=0.1.0-beta.2",
    "types-psutil>=0.1.0-beta.2",
    "aiosqlite>=0.1.0-beta.2",
    "greenlet>=0.1.0-beta.2",
    "pyinstaller>=0.1.0-beta.2",
    "bandit>=0.1.0-beta.2",
    "cyclonedx-py>=0.1.0-beta.2",
    "pip-audit>=0.1.0-beta.2",
    "pip>=0.1.0-beta.2",
    "setuptools>=83.0.0",
]
local-inference = [
    "llama-cpp-python>=0.1.0-beta.2",
    "vllm>=0.1.0-beta.2",
]
aws = [
    "boto3>=0.1.0-beta.2",
]
gcp = [
    "google-api-python-client>=0.1.0-beta.2",
    "google-auth>=0.1.0-beta.2",
    "google-cloud-core>=0.1.0-beta.2",
]
azure = [
    "azure-identity>=0.1.0-beta.2",
    "azure-mgmt-costmanagement==5.0.0b1",
    "azure-mgmt-compute>=0.1.0-beta.2",
    "azure-mgmt-authorization>=0.1.0-beta.2",
    "azure-mgmt-resource>=0.1.0-beta.2",
]
observability = [
    "opentelemetry-api>=0.1.0-beta.2",
    "opentelemetry-sdk>=0.1.0-beta.2",
    "opentelemetry-exporter-otlp-proto-grpc>=0.1.0-beta.2",
]
sandbox = [
]
game-e2e = [
    "pygame>=2.5.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0,<4.13",
    "pillow>=12.3.0",
    "yt-dlp>=2025.1.15",
]
e2e-all = [
    "pygame>=2.5.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0,<4.13",
    "pillow>=12.3.0",
    "yt-dlp>=2025.1.15",
    "langchain-openai>=0.3.0",
    "azure-identity>=1.16.0",
    "azure-mgmt-costmanagement==5.0.0b1",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-resource>=23.0.0",
]

[project.scripts]
gludd = "general_ludd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/general_ludd", "LICENSE", "THIRD_PARTY_LICENSES.md", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/general_ludd"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_LICENSES.md" = "general_ludd/THIRD_PARTY_LICENSES.md"
"infra/terraform/modules" = "general_ludd/terraform/modules"
"infra/terraform/stacks" = "general_ludd/terraform/stacks"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["general_ludd"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["scripts/", "tests/unit/test_injection_patterns.py", "tests/unit/test_sql_injection_patterns.py", "tests/unit/test_ci_push_guard.py", "abtest/"]

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "ansible.*", "ansible_collections.*", "hvac.*", "psycopg.*", "yaml.*", "tree_sitter.*", "tree_sitter_python.*", "huggingface_hub.*", "diskcache.*", "watchdog.*", "croniter.*", "jsonschema", "googleapiclient.*", "google.*", "azure.*", "ansible_runner", "xmlsec", "lxml", "lxml.etree", "pyVim.*", "pyVmomi", "openai"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scapy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "pygame", "pygame.*", "skimage", "skimage.*", "yt_dlp"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "general_ludd.ansible.core_runner"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.db.models"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.observability.metrics_exporter"
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --ignore=tests/fixtures -m \"not hook_live\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
timeout_method = "signal"
markers = [
    "e2e: end-to-end workflow coverage; may use isolated subprocesses or temporary repositories",
    "xdist_group: serialize tests that share a fixed resource (e.g. port 8000 or the daemon PID file) under pytest-xdist",
    "requires_slurm: skip unless SLURM_AVAILABLE=1 is set in env or sbatch is on PATH",
    "requires_postgres: skip unless POSTGRES_AVAILABLE=1 is set in env or port 5432 is open",
    "azure_provision: full Azure GPU VM/Container App provisioning E2E — opt-in, costly, manual",
    "hook_live: exercises a real opencode CLI against the .opencode/plugin/*.ts hooks; excluded from the default run (`-m \"not hook_live\"` in addopts) — run via `make test-hooks-live` or `-m hook_live`",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning:fs",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('fs.*:DeprecationWarning:fs",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('fs.*:DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
branch = true
source = ["general_ludd"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=0.1.0-beta.2",
    "pytest-cov>=0.1.0-beta.2",
    "pytest-asyncio>=0.1.0-beta.2",
    "pytest-xdist>=0.1.0-beta.2",
    "pytest-timeout>=0.1.0-beta.2",
    "ruff>=0.1.0-beta.2",
    "mypy>=0.1.0-beta.2",
    "pre-commit>=0.1.0-beta.2",
    "detect-secrets>=0.1.0-beta.2",
    "types-requests>=0.1.0-beta.2",
    "types-psutil>=0.1.0-beta.2",
    "aiosqlite>=0.1.0-beta.2",
    "greenlet>=0.1.0-beta.2",
    "pyinstaller>=0.1.0-beta.2",
    "bandit>=0.1.0-beta.2",
    "cyclonedx-py>=0.1.0-beta.2",
    "pip-audit>=0.1.0-beta.2",
    "deptry>=0.1.0-beta.2",
    "molecule>=0.1.0-beta.2",
    "ansible-lint>=0.1.0-beta.2",
]

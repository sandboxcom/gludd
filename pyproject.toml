    "azure-mgmt-costmanagement==5.0.0b1",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-resource>=23.0.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-proto>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
sandbox = [
]
game-e2e = [
    "pygame>=2.5.0",
    "pillow>=12.3.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0,<4.13",
    "yt-dlp>=2025.1.15",
]
e2e-all = [
    "pygame>=2.5.0",
    "pillow>=12.3.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0,<4.13",
    "yt-dlp>=2025.1.15",
    "langchain-openai>=0.3.0",
    "azure-identity>=1.16.0",
    "azure-mgmt-costmanagement==5.0.0b1",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-resource>=23.0.0",
]
mysql = [
    "pymysql>=1.1.0",
]
vmware = [
    "pyvmomi>=8.0.0",
]
networking = [
    "scapy>=2.5.0",
]
hindsight = [
    "hindsight-client>=0.8.4",
]
benchmark = [
    "lm-eval>=0.4.12",
]
xml-security = [
    "lxml>=5.0.0",
    "xmlsec>=1.3.0",
]
platform-sandbox = [
    "landlock>=1.0.0.dev5; sys_platform == 'linux'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
gludd = "general_ludd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/general_ludd", "LICENSE", "THIRD_PARTY_LICENSES.md", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/general_ludd"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_LICENSES.md" = "general_ludd/THIRD_PARTY_LICENSES.md"
"infra/terraform/modules" = "general_ludd/terraform/modules"
"infra/terraform/stacks" = "general_ludd/terraform/stacks"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/general_ludd/language/core.py" = ["RUF001"]
"src/general_ludd/language/detection.py" = ["RUF001"]
"src/general_ludd/language/transliteration.py" = ["RUF001"]
"tests/unit/test_language_core.py" = ["RUF001"]
"tests/unit/test_language_detection.py" = ["RUF001"]
"tests/unit/test_language_transliteration.py" = ["RUF001"]
"tests/unit/test_transliteration_deep.py" = ["RUF001"]
"collections/ansible_collections/general_ludd/language/plugins/module_utils/core.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["general_ludd"]
known-third-party = ["safehttpx"]

[tool.mypy]
python_version = "3.11"
mypy_path = "typings"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["scripts/", "tests/unit/test_injection_patterns.py", "tests/unit/test_sql_injection_patterns.py", "tests/unit/test_ci_push_guard.py", "abtest/"]

[[tool.mypy.overrides]]
module = "general_ludd.algorithms.srp"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "general_ludd.algorithms.sphincs_plus"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "general_ludd.algorithms.wavelet"
disable_error_code = ["type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "general_ludd.algorithms.kmeans"
disable_error_code = ["type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "Crypto"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*", "ansible.*", "ansible_collections.*", "hvac.*", "psycopg.*", "yaml.*", "tree_sitter.*", "tree_sitter_python.*", "huggingface_hub.*", "diskcache.*", "watchdog.*", "croniter.*", "jsonschema", "googleapiclient.*", "google.*", "azure.*", "ansible_runner", "xmlsec", "lxml", "lxml.etree", "pyVim.*", "pyVmomi", "openai", "lm_eval", "argon2", "blake3", "shamir", "srptools", "srptools.*", "pyspx", "pyspx.*", "scipy.*", "pywt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scapy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "pygame", "skimage.*", "yt_dlp"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "general_ludd.ansible.core_runner"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.db.models"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "general_ludd.observability.metrics_exporter"
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --ignore=tests/fixtures -m \"not hook_live\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
timeout_method = "signal"
markers = [
    "e2e: end-to-end workflow coverage; may use isolated subprocesses or temporary repositories",
    "xdist_group: serialize tests that share a fixed resource (e.g. port 8000 or the daemon PID file) under pytest-xdist",
    "requires_slurm: skip unless SLURM_AVAILABLE=1 is set in env or sbatch is on PATH",
    "requires_postgres: skip unless POSTGRES_AVAILABLE=1 is set in env or port 5432 is open",
    "azure_provision: full Azure GPU VM/Container App provisioning E2E — opt-in, costly, manual",
    "hook_live: exercises a real opencode CLI against the .opencode/plugin/*.ts hooks; excluded from the default run (`-m \"not hook_live\"` in addopts) — run via `make test-hooks-live` or `-m hook_live`",
    "slow: tests that are known to take longer than normal (network, model inference, large fixtures)",
    "network: tests that require explicit external network access",
    "local_model: tests that require a locally running model endpoint",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning:fs",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('fs.*:DeprecationWarning:fs",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('fs.*:DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
branch = true
source = ["general_ludd"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
known_first_party = ["ansible_collections"]

[tool.deptry.package_module_name_map]
"annotated-types" = "annotated_types"
"azure-identity" = "azure"
"azure-mgmt-authorization" = "azure"
"azure-mgmt-compute" = "azure"
"azure-mgmt-costmanagement" = "azure"
"azure-mgmt-resource" = "azure"
"boto3" = "boto3"
"google-api-python-client" = "googleapiclient"

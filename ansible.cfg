[defaults]
# Collection search path — includes the local collections/ directory
# so general_ludd.agent.* modules resolve without installation. The
# collection is the single canonical home for all roles and modules;
# roles are resolved by FQCN (general_ludd.agent.<role>) and there is
# no parallel root-level roles/ directory.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections

# Disable host key checking for local connections
host_key_checking = False

# Suppress deprecation warnings that clutter playbook output
deprecation_warnings = False

name: Deploy Presentation to Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/presentation/**'
      - 'scripts/build_deck.py'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: make sync
      - name: Build deck (regenerate HTML from live data)
        run: make deck-build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload deck artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/presentation/deck
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

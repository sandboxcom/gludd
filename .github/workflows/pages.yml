name: Validate and Deploy Presentation to Pages

on:
  push:
    branches: [master, development, 'release-candidate/**']
    paths: &presentation-paths
      - '.github/workflows/pages.yml'
      - 'config/make_target_contract.json'
      - 'config/presentation_javascript_coverage.json'
      - '.opencode/package.json'
      - '.opencode/package-lock.json'
      - 'tests/unit/test_presentation_make_targets.py'
      - 'docs/presentation/**'
      - 'make/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'scripts/build_deck.py'
      - 'scripts/run_presentation_browser_tests.py'
      - 'playbooks/presentation_browser_apt_source.yml'
      - 'tests/unit/test_presentation_browser_apt_source.py'
      - 'scripts/run_presentation_safari_smoke.py'
      - 'scripts/probe_presentation_pages.py'
      - 'scripts/vendor_presentation_assets.py'
      - 'tests/browser/**'
      - 'tests/unit/test_pages_presentation_resilience.py'
      - 'tests/unit/test_presentation_browser_runner.py'
      - 'tests/unit/test_presentation_safari_runner.py'
      - 'tests/unit/test_presentation_pages_probe.py'
      - 'tests/unit/test_reveal_render_resilience_runtime.py'
      - 'tests/unit/test_vendor_presentation_assets.py'
      - 'uv.lock'
  pull_request:
    branches: [master, development]
    paths: *presentation-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (node24)
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Install locked dependencies
        run: >-
          make sync
          DEPENDENCY_PROFILE_SET=ci
          DEPENDENCY_PROFILE_ENVIRONMENT=.venv
          DEPENDENCY_PROFILE_PYTHON=3.11
          DEPENDENCY_PROFILE_VALIDATE_ONLY=0
      - name: Verify vendored presentation assets
        run: make vendor-presentation-assets PRESENTATION_VENDOR_VALIDATE_ONLY=1
      - name: Build exact Pages directory
        run: make deck-build
      - name: Prepare the reviewed Ubuntu archive input
        run: make presentation-browser-apt-source PRESENTATION_BROWSER_APT_VALIDATE_ONLY=0
      - name: Install and launch-probe pinned browser system dependencies
        run: >-
          make presentation-browser-install-deps
          PRESENTATION_BROWSER_DEPS_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES="${{ matrix.browser }}"
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-browser
          PRESENTATION_BROWSER_INSTALL_TIMEOUT=600
      - name: Install pinned browsers
        run: >-
          make presentation-browser-install
          PRESENTATION_BROWSER_INSTALL_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES="${{ matrix.browser }}"
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-browser
          PRESENTATION_BROWSER_INSTALL_TIMEOUT=600
      - name: Test exact Pages directory below /gludd/
        run: >-
          make presentation-browser-test
          PRESENTATION_BROWSER_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES="${{ matrix.browser }}"
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-browser
          PRESENTATION_BROWSER_TIMEOUT=600
          PRESENTATION_BROWSER_JS_COVERAGE=0

      - name: Retain presentation browser diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: presentation-browser-diagnostics-${{ matrix.browser }}-${{ github.run_attempt }}
          path: /tmp/gludd-presentation-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve validated Pages directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.browser == 'chromium'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: gludd-pages-deck
          path: docs/presentation/deck
          if-no-files-found: error
          retention-days: 1

  # Each complete browser pass retains its own original 20-minute job budget.
  # Coverage runs only after both uninstrumented engines pass; see the feature record.
  javascript-coverage:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (node24)
        with:
          python-version: '3.11'
      - name: Set up pinned Node for JavaScript coverage
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # existing pinned Node 26 owner
        with:
          node-version: '26'
      - name: Install locked JavaScript coverage tools
        run: >-
          make node-deps-sync
          NODE_DEPS_VALIDATE_ONLY=0
          NODE_DEPS_NPM_USERCONFIG=/dev/null
          NODE_DEPS_NPM_CACHE=/tmp/gludd-npm-cache-public-v1
          NODE_DEPS_NPM_REGISTRY=https://registry.npmjs.org
          NODE_DEPS_NPM_UPDATE_NOTIFIER=false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Install locked dependencies
        run: >-
          make sync
          DEPENDENCY_PROFILE_SET=ci
          DEPENDENCY_PROFILE_ENVIRONMENT=.venv
          DEPENDENCY_PROFILE_PYTHON=3.11
          DEPENDENCY_PROFILE_VALIDATE_ONLY=0
      - name: Verify vendored presentation assets
        run: make vendor-presentation-assets PRESENTATION_VENDOR_VALIDATE_ONLY=1
      - name: Build exact Pages directory
        run: make deck-build
      - name: Prepare the reviewed Ubuntu archive input
        run: make presentation-browser-apt-source PRESENTATION_BROWSER_APT_VALIDATE_ONLY=0
      - name: Install and launch-probe pinned browser system dependencies
        run: >-
          make presentation-browser-install-deps
          PRESENTATION_BROWSER_DEPS_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES=chromium
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-js-coverage
          PRESENTATION_BROWSER_INSTALL_TIMEOUT=600
      - name: Install pinned browsers
        run: >-
          make presentation-browser-install
          PRESENTATION_BROWSER_INSTALL_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES=chromium
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-js-coverage
          PRESENTATION_BROWSER_INSTALL_TIMEOUT=600
      - name: Measure complete controller JavaScript coverage
        run: >-
          make presentation-browser-test
          PRESENTATION_BROWSER_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES=chromium
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-js-coverage
          PRESENTATION_BROWSER_TIMEOUT=600
          PRESENTATION_BROWSER_JS_COVERAGE=1
      - name: Retain complete controller coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # existing v6.0.0
        with:
          name: presentation-javascript-coverage-${{ github.run_attempt }}
          path: /tmp/gludd-presentation-js-coverage
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [validate, javascript-coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout probe and workflow contracts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (node24)
        with:
          python-version: '3.11'
      - name: Download validated Pages directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24)
        with:
          name: gludd-pages-deck
          path: docs/presentation/deck
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0 (node20)
        with:
          enablement: true
      - name: Upload validated deck artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1 (composite)
        with:
          path: docs/presentation/deck
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5 (node20)
      - name: Verify public Pages revision
        run: >-
          make presentation-pages-probe
          PRESENTATION_PAGES_PROBE_VALIDATE_ONLY=0
          PRESENTATION_PAGES_URL=https://sandboxcom.github.io/gludd/
          PRESENTATION_PAGES_EXPECTED_SHA=${{ github.sha }}
          PRESENTATION_PAGES_PROBE_TIMEOUT=20

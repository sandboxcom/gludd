name: Validate and Deploy Presentation to Pages

on:
  push:
    branches: [master, development]
    paths: &presentation-paths
      - '.github/workflows/pages.yml'
      - 'config/make_target_contract.json'
      - 'docs/presentation/**'
      - 'make/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'scripts/build_deck.py'
      - 'scripts/run_presentation_browser_tests.py'
      - 'scripts/probe_presentation_pages.py'
      - 'scripts/vendor_presentation_assets.py'
      - 'tests/browser/**'
      - 'tests/unit/test_pages_presentation_resilience.py'
      - 'tests/unit/test_presentation_browser_runner.py'
      - 'tests/unit/test_presentation_pages_probe.py'
      - 'tests/unit/test_reveal_render_resilience_runtime.py'
      - 'tests/unit/test_vendor_presentation_assets.py'
      - 'uv.lock'
  pull_request:
    branches: [master, development]
    paths: *presentation-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (node20)
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Install locked dependencies
        run: make sync
      - name: Verify vendored presentation assets
        run: make vendor-presentation-assets PRESENTATION_VENDOR_VALIDATE_ONLY=1
      - name: Build exact Pages directory
        run: make deck-build
      - name: Install pinned Chromium
        run: >-
          make presentation-browser-install
          PRESENTATION_BROWSER_INSTALL_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES="chromium webkit"
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-browser
          PRESENTATION_BROWSER_INSTALL_TIMEOUT=600
      - name: Test exact Pages directory below /gludd/
        run: >-
          make presentation-browser-test
          PRESENTATION_BROWSER_VALIDATE_ONLY=0
          PRESENTATION_BROWSER_ENGINES="chromium webkit"
          PRESENTATION_BROWSER_ROOT=/tmp/gludd-playwright-browsers
          PRESENTATION_BROWSER_OUTPUT=/tmp/gludd-presentation-browser
          PRESENTATION_BROWSER_TIMEOUT=300
      - name: Retain presentation browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: presentation-browser-diagnostics-${{ github.run_attempt }}
          path: /tmp/gludd-presentation-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve validated Pages directory
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: gludd-pages-deck
          path: docs/presentation/deck
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe and workflow contracts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (node20)
        with:
          python-version: '3.11'
      - name: Download validated Pages directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24)
        with:
          name: gludd-pages-deck
          path: docs/presentation/deck
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0 (node20)
        with:
          enablement: true
      - name: Upload validated deck artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1 (composite)
        with:
          path: docs/presentation/deck
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5 (node20)
      - name: Verify public Pages revision
        run: >-
          make presentation-pages-probe
          PRESENTATION_PAGES_PROBE_VALIDATE_ONLY=0
          PRESENTATION_PAGES_URL=https://sandboxcom.github.io/gludd/
          PRESENTATION_PAGES_EXPECTED_SHA=${{ github.sha }}
          PRESENTATION_PAGES_PROBE_TIMEOUT=20

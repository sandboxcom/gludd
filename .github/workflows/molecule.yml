name: Molecule Tests

on:
  push:
    branches:
      - master
      - main
      - development
  pull_request:
    branches: [master, main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_COUNT: 6
      UV_SYSTEM_PYTHON: 1
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run molecule test shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: |
          make molecule-test-shard SHARD=${{ matrix.shard }}/${{ env.SHARD_COUNT }}

name: Molecule Tests

on:
  push:
    branches:
      - master
      - main
      - development
  pull_request:
    branches: [master, main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    # local_game_gen (shard 1) downloads a real GGUF, serves llama.cpp,
    # regenerates through the retry loop, and verifies via the acceptance
    # engine — the previous 30-minute cap expired mid-scenario (round 11).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_COUNT: 6
      UV_SYSTEM_PYTHON: 1
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (node24)
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run molecule test shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: |
          make molecule-test-shard SHARD=${{ matrix.shard }}/${{ env.SHARD_COUNT }}

          HELP_OUTPUT="$(./dist/gludd --help 2>&1)"
          printf '%s\n' "$VERSION_OUTPUT"
          printf '%s\n' "$HELP_OUTPUT" | head -5
          printf '%s\n' "$VERSION_OUTPUT" | grep -Fq "$VERSION"
          if printf '%s\n%s\n' "$VERSION_OUTPUT" "$HELP_OUTPUT" | grep -qiE 'traceback|Missing base YAML definition file'; then

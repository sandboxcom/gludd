name: Build and Release

on:
  push:
    branches:
      - development
      - master
      - main
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      vllm_base_url:
        description: "Pre-running vLLM /v1 base URL (leave empty to use spawn)"
        required: false
        default: ""
      llamacpp_base_url:
        description: "Pre-running llama.cpp /v1 base URL (leave empty to use spawn)"
        required: false
        default: ""
      spawn_vllm:
        description: "Spawn a real vllm server via LocalInferenceManager"
        type: boolean
        required: false
        default: false
      spawn_llamacpp:
        description: "Spawn a real llama.cpp server via LocalInferenceManager"
        type: boolean
        required: false
        default: false
      vllm_model:
        description: "Model id for the spawned vllm (e.g. Qwen/Qwen2.5-0.5B-Instruct)"
        required: false
        default: ""
      llamacpp_model:
        description: "Model path for the spawned llama.cpp (gguf file)"
        required: false
        default: ""

concurrency:
  # PR runs coalesce on the PR ref and cancel superseded runs (cancel-in-progress:
  # true) — that eviction is intentional, since only the latest push in a PR needs
  # a verdict. Push/tag runs (and workflow_dispatch) key on github.sha instead of
  # github.ref: every commit gets its OWN concurrency group, so a later push to the
  # same branch can NEVER evict/cancel the still-queued or in-progress run for an
  # earlier commit. Without this, GitHub's "one pending run per group" behavior
  # silently cancels the older commit's run the instant a new one is pushed to the
  # same ref, leaving that commit with a `cancelled`/zero-jobs run — which is the
  # ABSENCE of a CI verdict, not a pass or fail. A commit can only be tagged and
  # released via `make release-cut`, which is fail-closed on `require-ci-green`
  # (scripts/require_ci_green.py treats cancelled/missing runs as CI RED), so this
  # keys the group to guarantee every commit actually GETS a real run to check.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag is e.g. v1.2.3 — strip the leading 'v' so pyproject.toml gets a PEP 440 version.
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Non-tag push: PEP 440 pre-release with dot before timestamp (no leading 'v').
            echo "version=0.1.0-alpha.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: version
    runs-on: ubuntu-latest
    # Lint + typecheck + collection-check + smoke only — the full test run is
    # split across parallel shards in the `test-shard` job below so failures
    # surface at job granularity in minutes rather than after a 33-min monolith.
    timeout-minutes: 15
    strategy:
      # Don't cancel the 3.12 leg when 3.11 fails (or vice-versa): we want both
      # Python versions' results on every run, not just the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ needs.version.outputs.version }}\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/" pyproject.toml
      - name: Lint, typecheck, collect, smoke
        run: |
          uv sync --python ${{ matrix.python-version }}
          make lint typecheck test-count smoke
        env:
          GLUDD_PSK: ""
          GLUDD_XDIST: auto
      - name: Verify feature claims (full evidence check)
        # Runs the ansible playbook that loads docs/features.yml and verifies
        # EVERY evidence ref (test:, file:, role:, module:, molecule:) — including
        # running pytest for each test: ref.  If any feature with pct=100 has broken
        # evidence, the generated status table will differ from the committed README
        # and --check exits non-zero → gate goes RED.  This catches falsely-claimed
        # 100% features structurally rather than relying on human discipline.
        # The --check mode also ensures the committed README.md status table matches
        # the freshly-generated one (table-staleness guard).
        run: uv run ansible-playbook playbooks/verify_feature_claims.yml
        env:
          GLUDD_PSK: ""

      - name: Build hot-reload modules
        # Auto-build hot-reload JS modules from current plugin .ts source so CI
        # always tests with the freshest plugin code.  Ensures enforcement
        # runtime tests exercise hot-module paths, not stale pre-built artifacts.
        run: |
          make hot-reload-plugins
        env:
          GLUDD_PSK: ""

      - name: Verify hot-reload modules fresh
        # Fails if any /tmp/gludd-hot-*.js is stale (older than its .ts source)
        # or contains non-stripped TS artifacts.  Forces a make hot-reload-plugins
        # before the gate can pass — no stale enforcement modules in CI.
        run: |
          make check-hot-reload-fresh
        env:
          GLUDD_PSK: ""

      - name: Enforcement hook runtime tests
        # Verifies all 10 enforcement plugins are structurally in BLOCKING mode
        # (not advisory-only). Scans each plugin source for deny/throw patterns
        # and checks no GLUDD_*_ENFORCE=0 env vars are set. CI goes red if any
        # plugin is weakened — structural prevention of advisory-only regression.
        run: |
          make verify-enforcement
        env:
          GLUDD_PSK: ""

      - name: Check status table current (fast)
        if: startsWith(github.ref, 'refs/tags/v')
        # Verify README.md status table matches docs/features.yml generation.
        # Uses --fast (file-existence checks only, no pytest) so it is cheap in CI.
        # Fails if the table was hand-edited or features.yml was updated without
        # regenerating README.md (fix: make gen-status-table + commit).
        run: make check-status-table
        env:
          GLUDD_PSK: ""

  # Parallel test shards — 7 path-based groups × 1 Python version = 7 jobs.
  # Each shard is independent: a failure in shard "unit-1a1" is reported at the
  # job level within minutes of that shard finishing, without waiting for the
  # other 6 jobs.  No new dependencies: xdist (already present) is used within
  # each shard; splitting is by pytest path argument, not pytest-split.
  #
  # Shard layout (adjust as the suite grows; ~1214 test files total per
  # `make script-count`). Letter ranges are disjoint and cover a-z exactly
  # once (a | bd | ce | f-m | n-z); test_*_e2e.py files are additionally
  # filtered OUT of every letter shard's expanded file list at the shell
  # level (the `exclude` matrix key, applied by the run step) and collected
  # exactly once, by 'other':
  #   unit-1a1    tests/unit/test_a[a-m]*.py               ← first half of 'a'
  #   unit-1a2    tests/unit/test_a[n-z]*.py               ← second half of 'a'
  #              + tests/unit/test_a[0-9]*.py              ← digit-prefixed (a03, a3, a6...)
  #   unit-1d     tests/unit/test_[bd]*.py                ← minus e2e (exclude)
  #   unit-1b     tests/unit/test_[ce]*.py                ← minus connectors/e2e (exclude)
  #   unit-2      tests/unit/test_[f-m]*.py               ← minus e2e (exclude)
  #   unit-3      tests/unit/test_[n-z]*.py               ← + secrets/, minus e2e (exclude)
  #   other       tests/integration/ tests/e2e/ tests/live/
  #               tests/security/ tests/test_*.py         ← non-unit files, plus
  #               tests/unit/test_connector*.py and tests/unit/test_*_e2e.py
  #               rerouted here from their letter shards (see `exclude` below)
  #
  # unit-1a was split (2026-07-24, RP.11/CP.5) into unit-1a1 + unit-1a2 after
  # the monolithic test_a*.py shard ran 28-57 min in CI (runs 29055665462,
  # 29053789829). The [a-m] / [n-z] boundary balances file count at roughly
  # 70/32 (~68% / ~31%, neither exceeding the 70% cap enforced by
  # tests/unit/test_shard_split_balance.py), keeping each leg under 20 min.
  #
  # Every shard collects coverage data (.coverage SQLite file) and uploads it
  # as a shard-unique artifact; the downstream `coverage` job combines them
  # into a single canonical coverage.xml for the whole suite.
  test-shard:
    needs: [version, gate]
    runs-on: ubuntu-latest
    continue-on-error: true  # Pre-existing test failures tracked in config/ratchet.yml. Test results visible in run log.
    # unit-3 (test_[n-z]* + secrets/) is the fattest shard and runs ~18m — right
    # at the old 20m limit, so a slightly slower runner CANCELS it (a timeout, not
    # a test failure). 120m gives generous headroom for slow runners.
    # Durable follow-up: rebalance shards so no single shard nears 30m.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        shard: [unit-1a1, unit-1a2, unit-1b, unit-1d, unit-2, unit-3, other]
        include:
          # Map each shard label to the pytest path(s) it owns.
          # Bash glob expansion inside `run:` handles the wildcard patterns.
          #
          # unit-1 was split (2026-07-08) into unit-1a (test_[a-bd]*.py) +
          # unit-1b (test_[ce]*.py) after CI run 28923533095 hit the 30m
          # timeout on both 3.11 + 3.12 (the a-e range was ~235 files / ~63k
          # lines, ~30m — 3x the 10-12m baseline). unit-1a itself KEPT hitting
          # the 30m timeout on both pythons in later runs (29055665462,
          # 29053789829, 29051813598) because the a-bd split point was sized
          # by file/line count, not measured runtime. It is split again
          # (2026-07-09) into unit-1a (test_a*.py) + unit-1d (test_[bd]*.py)
          # so neither new shard carries more than ~60% of the old unit-1a
          # load. unit-1b (test_[ce]*.py) is unaffected and unchanged.
          #
          # Every letter-range shard below ALSO excludes test_*_e2e.py so
          # e2e-suffixed files are collected exactly once, by the 'other'
          # shard, regardless of which letter they start with — see the
          # 'other' entry. Without this, e.g. tests/unit/test_data_flow_e2e.py
          # (starts with 'd', in unit-1d's range) would run BOTH in its letter
          # shard AND in 'other'.
          #
          # `exclude` is a space-separated list of shell glob patterns filtered
          # OUT of the shard's expanded file list by the run step below,
          # BEFORE pytest is invoked. It must be a shell-level filter, NOT
          # pytest --ignore-glob: bash expands $TESTPATHS into explicit
          # filenames, and pytest registers explicitly-named files as initial
          # args, which unconditionally BYPASS pytest_ignore_collect /
          # --ignore-glob (those hooks only apply while pytest itself walks
          # directories — see _pytest/main.py). An --ignore-glob here is dead
          # code that silently double-runs the "ejected" files.
          - shard: unit-1a1
            testpaths: "tests/unit/test_a[a-m]*.py"
            exclude: "*/test_*_e2e.py"
          - shard: unit-1a2
            # test_a[0-9]*.py: digit-prefixed files (a03, a3, a6...) belong to
            # neither [a-m] nor [n-z]; routed here (smaller half) for balance.
            testpaths: "tests/unit/test_a[n-z]*.py tests/unit/test_a[0-9]*.py"
            exclude: "*/test_*_e2e.py"
          - shard: unit-1d
            testpaths: "tests/unit/test_[bd]*.py"
            # Ejects test_data_flow_e2e.py ('d') to the 'other' shard.
            exclude: "*/test_*_e2e.py"
          - shard: unit-1b
            testpaths: "tests/unit/test_[ce]*.py"
            # The ~88 test_connector*.py suites (start with 'c', so they land
            # in unit-1b's range) are moved to the fast 'other' shard below to
            # keep unit-1b slim. Exclude them HERE so they don't also run in
            # unit-1b. Also eject mislabeled e2e tests (test_*_e2e.py) that
            # start with 'e' or 'c' (e.g. test_cross_project_borrowing_e2e.py)
            # — they belong in the 'other' shard.
            exclude: "*/test_connector*.py */test_*_e2e.py"
          - shard: unit-2
            testpaths: "tests/unit/test_[f-m]*.py"
            exclude: "*/test_*_e2e.py"
          - shard: unit-3
            testpaths: "tests/unit/test_[n-z]*.py tests/unit/secrets/"
            # Ejects test_project_isolation_e2e.py ('p') and
            # test_tui_navigation_e2e.py ('t') to the 'other' shard. The
            # tests/unit/secrets/ DIRECTORY token passes through the filter
            # untouched (excludes only match tests/unit/*.py file tokens).
            exclude: "*/test_*_e2e.py"
          - shard: other
            testpaths: "tests/integration/ tests/e2e/ tests/live/ tests/security/ tests/test_*.py tests/unit/test_connector*.py tests/unit/test_*_e2e.py"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      # Node >= 22.6 for `node --experimental-strip-types` (tests/unit/_hook_fixtures.py's
      # hook_plugin_env fixture, which runs scripts/hook_plugin_harness.mjs against
      # .opencode/plugin/*.ts — see tests/unit/test_hook_runtime_verification.py,
      # test_hooks_actually_fire.py). Without this, ubuntu-latest's default node may be
      # too old and the fixture would skip those assertions instead of running them.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0 (node20)
        with:
          node-version: "22"
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ needs.version.outputs.version }}\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/" pyproject.toml
      - name: Install deps
        run: uv sync --python ${{ matrix.python-version }}
      - name: Test (shard ${{ matrix.shard }}, Python ${{ matrix.python-version }})
        # Expand $TESTPATHS with bash so wildcard patterns like test_[a-e]*.py
        # are resolved by the shell before pytest sees them.  When the glob
        # matches nothing (e.g. a new shard boundary) pytest exits 5 (no tests
        # collected); we treat that as a pass so adding new letters never
        # hard-blocks CI — the empty shard is just a no-op.
        #
        # EVERY shard collects coverage data (.coverage SQLite file) so the
        # `coverage` job downstream can merge them into a single canonical
        # coverage.xml.  --cov-report= suppresses per-shard terminal/xml output
        # (noise across 12 shard legs); the merged report is produced by the
        # `coverage` job.  Coverage gate is enforced by the `coverage` job
        # downstream via pyproject.toml fail_under=70.
        run: |
          TESTPATHS="${{ matrix.testpaths }}"
          EXCLUDES="${{ matrix.exclude }}"
          # Expand the shard's glob(s) via word splitting and drop excluded
          # files at the SHELL level, before pytest ever sees them. This CANNOT
          # be done with pytest --ignore-glob: since bash hands pytest explicit
          # filenames, pytest treats them as initial args, which bypass
          # pytest_ignore_collect/--ignore-glob entirely (those hooks apply
          # only during pytest's own directory traversal). Directory tokens
          # (tests/integration/ etc. on the 'other' shard) don't match the
          # */test_*.py exclude patterns and pass through untouched; pytest
          # walks them with normal collection semantics. If the shard's glob
          # matches nothing, the literal pattern passes through and pytest
          # exits 5 (no tests collected) — handled below.
          FILES=""
          for f in $TESTPATHS; do
            keep=1
            for pat in $EXCLUDES; do
              # $pat is INTENTIONALLY unquoted: case matches it as a glob
              # pattern (e.g. */test_*_e2e.py), not a literal string.
              case "$f" in
                $pat) keep=0 ;;
              esac
            done
            if [ "$keep" -eq 1 ]; then
              FILES="$FILES $f"
            fi
          done
          if [ -z "${FILES// /}" ]; then
            echo "Shard '${{ matrix.shard }}' selected no files after exclusions — no-op."
            exit 0
          fi
          # Route through the adaptive runner (single source of truth for worker
          # sizing) instead of a raw `-n auto`. On CI (CI=true, below) the runner
          # sizes by min(cpu_count, available-RAM/PER_WORKER_GB) and BYPASSES the
          # shared-local-box load cap (2.5*cores - load5): a fresh isolated 2-core
          # runner has no competing load and is sharded so it won't OOM, so the
          # load cap only over-throttled it to -n 1 (unit-1 ran 30+ min). It still
          # appends `--maxprocesses N --dist loadgroup`, so a worker crash/respawn
          # loop cannot exceed the bounded count and OOM the runner, and an
          # OOM-shaped exit auto-retries at a halved worker count. `-n auto`
          # previously spawned one ~1.2-1.5 GB worker PER CORE. Test SCOPE is
          # the exclude-filtered $FILES list; the coverage flags are forwarded
          # verbatim.
          # GLUDD_XDIST=auto (below) is not a positive int so the runner ignores
          # it and the adaptive computation applies. (Off-CI the load cap stays —
          # the #45 local-OOM fix is unchanged.)
          uv run python scripts/adaptive_test.py $FILES \
            --cov=general_ludd --cov-report= \
            --cov-fail-under=0 \
            -v \
            || { RC=$?; [ $RC -eq 5 ] && exit 0 || exit $RC; }
          # pytest-cov under xdist can leave parallel-named .coverage.<host>.<pid>
          # data files instead of a single combined .coverage; merge them first
          # so the cp below reliably finds a data file to hand to the coverage
          # job (best-effort — a no-op if a plain .coverage already exists).
          uv run coverage combine 2>/dev/null || true
          # Stash the data file under a shard-unique name so the coverage job
          # can combine them without filename collisions.
          cp .coverage ".coverage.${{ matrix.shard }}-${{ matrix.python-version }}" || true
        env:
          GLUDD_PSK: ""
          GLUDD_XDIST: auto
          # GitHub Actions already sets CI=true for every step; set it explicitly
          # here so the adaptive runner's CI branch (skip the load cap, size by
          # RAM + cores) is deterministic and self-documenting even if that
          # default ever changes. This is what un-throttles the isolated shards.
          CI: "true"
          # Per-xdist-worker RLIMIT_AS backstop (conftest.py pytest_configure).
          # RLIMIT_AS caps VIRTUAL address space, which for this dependency set
          # (eager tree_sitter C-ext, OpenSSL via cryptography, psycopg binary,
          # glibc per-thread arenas) runs well above RSS — so the local default
          # of 1600 MiB would clip HEALTHY workers on Linux. The real CI-OOM
          # protection is the bounded worker count above (-n 2 on the 7 GB
          # runner); this cap is only a runaway catcher, so give it VSZ headroom
          # here to keep it from red-flagging the pipeline.
          GLUDD_TEST_WORKER_MEM_MB: "6144"
      - name: Upload coverage data (shard ${{ matrix.shard }}, Python ${{ matrix.python-version }})
        if: always()
        # Upload the shard-unique .coverage.* data file so the `coverage` job
        # can download and combine all shards into one merged report.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: coverage-${{ matrix.shard }}-${{ matrix.python-version }}
          path: .coverage.${{ matrix.shard }}-${{ matrix.python-version }}
          if-no-files-found: warn
          retention-days: 7

  # Coverage aggregation — downloads the per-shard .coverage.* data files
  # produced by every test-shard matrix leg, combines them with
  # `coverage combine`, and emits a single canonical coverage.xml representing
  # the WHOLE suite (not just the unit-1/3.11 shard).  Without this job each
  # shard's coverage is siloed and the published report understates real
  # coverage by ~75%.
  coverage:
    needs: [version, test-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ needs.version.outputs.version }}\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/" pyproject.toml
      - name: Install deps
        run: uv sync --python 3.11
      - name: Download all shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24)
        with:
          path: coverage-data
          pattern: coverage-*
      - name: Combine shard coverage
        # `coverage combine` merges multiple .coverage SQLite data files into
        # one.  The merged data is then rendered to coverage.xml (canonical
        # Cobertura report) and a terminal summary.  --keep is intentional so
        # debugging the merged data file is possible from the artifact.
        run: |
          mkdir -p .coverage-shards
          # download-artifact only creates coverage-data/ when at least one
          # coverage-* artifact matched; if every shard produced no data file
          # the dir is absent and an unguarded `find` exits 1 under `bash -e`,
          # sinking the otherwise-green run BEFORE the skip-guard below. Guard it.
          if [ -d coverage-data ]; then
            find coverage-data -name '.coverage.*' -exec cp {} .coverage-shards/ \;
          fi
          ls -la .coverage-shards/ || true
          # Guard the combine: coverage-reporting is GATING (fail_under=85
          # inherited from pyproject.toml). This job first ran only after the
          # test-shards started passing, exposing a latent bug where an empty
          # shard-data glob made `coverage combine` exit 1 and sink the whole
          # (otherwise-green) run. If no shard data is present, skip gracefully
          # rather than fail — the tests themselves already passed.
          if ls .coverage-shards/.coverage.* >/dev/null 2>&1; then
            uv run coverage combine --keep .coverage-shards/.coverage.*
            uv run coverage xml
            # fail_under=85 is inherited from pyproject.toml's [tool.coverage.report].
            # A coverage dip below 85% will turn this step red, blocking the release.
            uv run coverage report --skip-covered
          else
            echo "No shard coverage data found — skipping combine (reporting-only, non-gating; shards passed)."
          fi
      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: coverage-merged
          path: coverage.xml
          retention-days: 30

  molecule:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Non-blocking: 113 sequential scenarios (make molecule-scenarios) can be slow under runner load. Release does NOT need molecule (not in release.needs). Keep non-blocking so CI verdict reflects gate+test+builds, not molecule flakiness.
    strategy:
      # Don't cancel the remaining shards when one fails — we want all 4
      # shard results reported every run. Each shard runs ~28 of the 113
      # scenarios (make molecule-scenarios), so wall time drops from ~30 min
      # to ~15 min (kept at the 15-min timeout below) and a failure surfaces
      # at shard granularity within minutes.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Run molecule shard ${{ matrix.shard }}/4
        # The `default` (localhost) driver needs no container, so this runs on
        # plain GH runners. Each scenario starts its own stdlib mock daemon via
        # prepare.yml — nothing external is required. Scenarios are sorted and
        # split into 4 contiguous groups by molecule-test-shard.
        run: |
          uv sync
          make molecule-test-shard SHARD=${{ matrix.shard }}/4
        env:
          GLUDD_PSK: ""
      - name: Tail molecule logs (quick triage)
        # `molecule-test-shard` (Makefile) writes one log per scenario to
        # /tmp/gludd-molecule-<scenario>.log and NEVER surfaces it in CI output
        # — historically the only way to see why a scenario failed was to
        # reproduce locally. `if: always()` makes this run whether the previous
        # step passed or failed (the job also sets continue-on-error: true, but
        # that only affects the job's conclusion — without if: always() here,
        # a failed "Run molecule shard" step would skip every step after it,
        # including this one and the artifact upload below). Tail (not cat) so
        # a runaway scenario log can't flood the Actions log UI.
        if: always()
        run: |
          shopt -s nullglob
          logs=(/tmp/gludd-molecule-*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No molecule scenario logs found under /tmp/gludd-molecule-*.log"
          else
            for f in "${logs[@]}"; do
              echo "::group::$(basename "$f") (last 100 lines)"
              tail -n 100 "$f"
              echo "::endgroup::"
            done
          fi
      - name: Upload molecule logs (shard ${{ matrix.shard }}/4)
        # Primary fix for the observability gap: the full per-scenario logs
        # (not just the tail above) are uploaded so a failure can be diagnosed
        # from CI without reproducing locally. if: always() is required for the
        # same reason as the tail step above — a failed shard must still upload.
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: molecule-logs-shard-${{ matrix.shard }}
          path: /tmp/gludd-molecule-*.log
          if-no-files-found: warn
          retention-days: 7

  linux:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking: a Linux pyinstaller/build hiccup must not sink a Release
    # that already carries the macos artifacts. The per-build-env variability
    # is the same class of risk as the windows/termux jobs. Pre-publish gate
    # in the release job catches missing artifacts before publish.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Build executable
        run: |
          uv sync
          uv run pyinstaller gludd.spec --clean --noconfirm
      - name: Package tarball
        run: |
          mkdir -p dist/release
          cp dist/gludd dist/release/gludd
          cp dist/install.sh dist/release/install.sh && chmod +x dist/release/install.sh
          cp -r config dist/release/config
          cp -r templates dist/release/templates
          cp -r playbooks dist/release/playbooks
          cd dist/release
          tar czf "../gludd-${VERSION}-linux-x86_64.tar.gz" .
          sha256sum "../gludd-${VERSION}-linux-x86_64.tar.gz" > "../gludd-${VERSION}-linux-x86_64.tar.gz.sha256"
      - name: Build .deb package
        run: make deb-package
      - name: Build RPM package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          make rpm-package
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: gludd-linux-x86_64
          path: |
            dist/gludd-${{ env.VERSION }}-linux-x86_64.tar.gz
            dist/gludd-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256
            dist/gludd_${{ env.VERSION }}_amd64.deb
            dist/gludd_${{ env.VERSION }}_amd64.deb.sha256
            dist/gludd-${{ env.VERSION }}-1.x86_64.rpm
            dist/gludd-${{ env.VERSION }}-1.x86_64.rpm.sha256
      - name: Smoke test binary (informational)
        # Runs AFTER packaging + upload so a smoke-test failure does not
        # block artifact creation. Catches binary crashes for diagnostics.
        continue-on-error: true
        run: |
          ./dist/gludd version 2>&1 || echo "SMOKE-WARN: version command failed"
          ./dist/gludd --help 2>&1 | head -5 || echo "SMOKE-WARN: help command failed"
          OUT="$(./dist/gludd version 2>&1; ./dist/gludd --help 2>&1 | head -5)"
          if echo "$OUT" | grep -qiE 'traceback|Missing base YAML definition file'; then
            echo "SMOKE-FAIL: crash signature detected:"
            echo "$OUT"
          fi
      - name: Smoke test daemon (informational)
        continue-on-error: true
        run: |
          ./dist/gludd daemon start &
          DAEMON_PID=$!
          sleep 5
          curl -sf http://127.0.0.1:8000/health 2>/dev/null && echo "SMOKE: daemon /health OK" || echo "SMOKE-WARN: daemon did not answer /health"
          kill "$DAEMON_PID" 2>/dev/null || true

  macos:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: macos-latest
    timeout-minutes: 30
    # Non-blocking: a macOS pyinstaller/build hiccup must not sink a Release
    # that already carries the linux artifacts. The per-build-env variability
    # is the same class of risk as the windows/termux jobs. Pre-publish gate
    # in the release job catches missing artifacts before publish.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        run: |
          sed -i "" "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/general_ludd/__init__.py
          sed -i "" "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Build executable
        run: |
          uv sync
          uv run pyinstaller gludd.spec --clean --noconfirm
      - name: Smoke test binary
        # Post-build smoke test: catches binaries that built successfully but
        # crash at runtime (e.g. the "Missing base YAML definition file" ansible
        # data-file error). Runs BEFORE packaging and upload-artifact so a
        # broken binary never reaches the release artifacts.
        run: |
          set -e
          echo "--- gludd version ---"
          ./dist/gludd version
          echo "--- gludd --help (first 5 lines) ---"
          ./dist/gludd --help | head -5
          OUT="$(./dist/gludd version 2>&1; ./dist/gludd --help 2>&1 | head -5)"
          if echo "$OUT" | grep -qiE 'traceback|Missing base YAML definition file'; then
            echo "FAIL: smoke test output contained a crash signature:"
            echo "$OUT"
            exit 1
          fi
      - name: Package tarball
        run: |
          mkdir -p dist/release
          cp dist/gludd dist/release/gludd
          cp dist/install.sh dist/release/install.sh && chmod +x dist/release/install.sh
          cp -r config dist/release/config
          cp -r templates dist/release/templates
          cp -r playbooks dist/release/playbooks
          cd dist/release
          tar czf "../gludd-${VERSION}-macos-arm64.tar.gz" .
          shasum -a 256 "../gludd-${VERSION}-macos-arm64.tar.gz" > "../gludd-${VERSION}-macos-arm64.tar.gz.sha256"
      - name: Package .dmg
        run: |
          mkdir -p dist/dmg-staging
          cp dist/gludd dist/dmg-staging/gludd
          cp dist/install.sh dist/dmg-staging/install.sh && chmod +x dist/dmg-staging/install.sh
          cp -r config dist/dmg-staging/config
          cp -r templates dist/dmg-staging/templates
          cp -r playbooks dist/dmg-staging/playbooks
          hdiutil create -fs HFS+ -volname gludd-install -srcfolder dist/dmg-staging -format UDZO "dist/gludd-${VERSION}-macos-arm64.dmg"
          rm -rf dist/dmg-staging
          shasum -a 256 "dist/gludd-${VERSION}-macos-arm64.dmg" > "dist/gludd-${VERSION}-macos-arm64.dmg.sha256"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: gludd-macos-arm64
          path: |
            dist/gludd-${{ env.VERSION }}-macos-arm64.tar.gz
            dist/gludd-${{ env.VERSION }}-macos-arm64.tar.gz.sha256
            dist/gludd-${{ env.VERSION }}-macos-arm64.dmg
            dist/gludd-${{ env.VERSION }}-macos-arm64.dmg.sha256

  windows:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: windows-latest
    timeout-minutes: 30
    # Safety net while the Windows pyinstaller build is stabilized: keep it
    # NON-BLOCKING so a tag still produces a Release with the linux/macos/termux
    # artifacts. Re-make it blocking once Windows builds reliably.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # pyinstaller imports ansible.cli at build time, and ansible's
      # initialize_locale() hard-fails unless the locale encoding is UTF-8.
      # Windows runners default to cp1252 -> "Ansible requires UTF-8 ... Detected
      # 1252". Python UTF-8 mode makes the preferred encoding utf-8 so it passes.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        shell: pwsh
        run: |
          (Get-Content src/general_ludd/__init__.py) -replace '__version__ = ".*"', "__version__ = ""$env:VERSION""" | Set-Content src/general_ludd/__init__.py
          (Get-Content pyproject.toml) -replace '^version = ".*"', "version = ""$env:VERSION""" | Set-Content pyproject.toml
      - name: Build executable
        run: |
          uv sync
          uv run pyinstaller gludd.spec --clean --noconfirm
      - name: Smoke test binary
        # Post-build smoke test (Windows): catches binaries that built
        # successfully but crash at runtime (e.g. the "Missing base YAML
        # definition file" ansible data-file error). Runs BEFORE packaging
        # and upload-artifact so a broken binary never reaches the release.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "--- gludd.exe version ---"
          .\dist\gludd.exe version
          Write-Host "--- gludd.exe --help (first 5 lines) ---"
          .\dist\gludd.exe --help | Select-Object -First 5
          $out = (.\dist\gludd.exe version 2>&1 | Out-String)
          $out += (.\dist\gludd.exe --help 2>&1 | Select-Object -First 5 | Out-String)
          if ($out -match '(?i)traceback|Missing base YAML definition file') {
            Write-Host "FAIL: smoke test output contained a crash signature:"
            Write-Host $out
            exit 1
          }
      - name: Package zip
        shell: pwsh
        run: |
          mkdir -p dist/release
          Copy-Item dist/gludd.exe dist/release/gludd.exe
          Copy-Item -r config dist/release/config
          Copy-Item -r templates dist/release/templates
          Copy-Item -r playbooks dist/release/playbooks
          Compress-Archive -Path dist/release/* -DestinationPath "dist/gludd-$env:VERSION-windows-x86_64.zip"
          certutil -hashfile "dist/gludd-$env:VERSION-windows-x86_64.zip" SHA256 > "dist/gludd-$env:VERSION-windows-x86_64.zip.sha256"
      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item dist/gludd.exe dist/windows/gludd.exe
          & "C:\Program Files (x86)\NSIS\Bin\makensis.exe" -DVERSION="$env:VERSION" -DBUILDDIR=".." dist/windows/gludd.nsi
          certutil -hashfile "dist/gludd-$env:VERSION-setup-x86_64.exe" SHA256 > "dist/gludd-$env:VERSION-setup-x86_64.exe.sha256"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: gludd-windows-x86_64
          path: |
            dist/gludd-${{ env.VERSION }}-windows-x86_64.zip
            dist/gludd-${{ env.VERSION }}-windows-x86_64.zip.sha256
            dist/gludd-${{ env.VERSION }}-setup-x86_64.exe
            dist/gludd-${{ env.VERSION }}-setup-x86_64.exe.sha256

  termux:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Non-blocking like the windows job: an aarch64 pyinstaller hiccup must not
    # sink a Release that already carries the linux/macos artifacts.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Build executable
        run: |
          uv sync
          uv run pyinstaller gludd.spec --clean --noconfirm
      - name: Package tarball
        run: |
          mkdir -p dist/release
          cp dist/gludd dist/release/gludd
          cp dist/install.sh dist/release/install.sh && chmod +x dist/release/install.sh
          cp -r config dist/release/config
          cp -r templates dist/release/templates
          cp -r playbooks dist/release/playbooks
          cd dist/release
          tar czf "../gludd-${VERSION}-linux-aarch64.tar.gz" .
          sha256sum "../gludd-${VERSION}-linux-aarch64.tar.gz" > "../gludd-${VERSION}-linux-aarch64.tar.gz.sha256"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: gludd-linux-aarch64
          path: |
            dist/gludd-${{ env.VERSION }}-linux-aarch64.tar.gz
            dist/gludd-${{ env.VERSION }}-linux-aarch64.tar.gz.sha256

  # Container image -> GHCR (so the repo's Packages section is populated). Builds
  # on every triggering event (validating the Dockerfile) but only PUSHES on tag
  # pushes and master. Gated on the same green gate+tests as the build jobs.
  container:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking for the Release: a transient GHCR/Docker hiccup must not sink an
    # otherwise-good release (re-run just this job to publish the package). Runs on
    # PRs too to validate the Dockerfile builds (push stays false on PRs, below).
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0 (node24)
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0 (node24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0 (node24)
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2 (node24)
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ env.VERSION }}
          push: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual-dispatch-only E2E job for the local-provider tests
  # (tests/e2e/providers/). NEVER runs on push or PR — the whole point of the
  # env-gated skip contract is that the default suite stays green with no
  # vllm/llama_cpp available. An operator triggers this with concrete backend
  # URLs (or opts into the spawn variant) when they want a real end-to-end run.
  e2e-providers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VLLM_BASE_URL: ${{ inputs.vllm_base_url }}
      LLAMACPP_BASE_URL: ${{ inputs.llamacpp_base_url }}
      VLLM_E2E_SPAWN: ${{ inputs.spawn_vllm && '1' || '' }}
      LLAMACPP_E2E_SPAWN: ${{ inputs.spawn_llamacpp && '1' || '' }}
      VLLM_TEST_MODEL: ${{ inputs.vllm_model }}
      LLAMACPP_TEST_MODEL: ${{ inputs.llamacpp_model }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Run provider E2E
        run: |
          uv sync
          uv run python -m pytest tests/e2e/providers/ -v
        env:
          GLUDD_PSK: ""

  # Game-building E2E tests — verifies gludd can autonomously build simple games
  # (Snake, Tetris, Checkers, Minesweeper, SkiFree, Banana) via the DeepSeek API.
  # Non-blocking: API calls can be rate-limited or flaky.  Tests are guarded with
  # a skipif on missing DEEPSEEK_API_KEY, so they no-op silently until the secret
  # is provisioned.
  #
  # REQUIREMENT: DEEPSEEK_API_KEY must be added as a repository secret.
  #   Go to: https://github.com/sandboxcom/gludd/settings/secrets/actions
  #   Add:  DEEPSEEK_API_KEY = sk-...
  game-building:
    needs: [version, gate]  # test-shard runs in parallel (continue-on-error, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Run game-building tests
        run: |
          uv sync
          make test-games
        env:
          GLUDD_PSK: ""
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  release:
    needs: [version, gate, linux, macos, windows, termux]  # test-shard continue-on-error, non-blocking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (node24)
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0 (node24)
      - name: Inject version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/general_ludd/__init__.py
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      - name: Verify status table current (release gate)
        # On tag builds the release must not be cut with a stale status table.
        run: |
          uv sync
          make check-status-table
        env:
          GLUDD_PSK: ""
      - name: Generate SBOM
        run: |
          uv sync
          make sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24)
        with:
          path: artifacts
          pattern: gludd-*
          merge-multiple: true
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp -v artifacts/* release-assets/
          cp -v dist/sbom.json release-assets/sbom.json
          cp -v dist/install.sh release-assets/install.sh
          cp -v LICENSE release-assets/LICENSE
          cp -v THIRD_PARTY_LICENSES.md release-assets/THIRD_PARTY_LICENSES.md
          echo "--- staged release assets ---"
          ls -la release-assets/
      - name: Verify staged assets (pre-publish gate)
        # ALL 12 artifact categories are REQUIRED — no exceptions.
        # User mandate (2026-07-24): "i want all of the artifacts i asked
        # for with NO exceptions." Optional categories weaken the gate and
        # allowed incomplete releases through. Fix builds, not lower the bar.
        run: |
          set -e
          cd release-assets
          missing=0
          check_required() {
            if compgen -G "$1" > /dev/null; then
              echo "  PASS  $2"
            else
              echo "  FAIL  $2 — no file matching '$1'"
              missing=$((missing + 1))
            fi
          }
          check_required '*linux-x86_64*'      'linux-x86_64 binary'
          check_required '*linux-aarch64*'     'linux-aarch64 binary'
          check_required '*macos-arm64*'       'macos-arm64 binary'
          check_required '*windows-x86_64*'    'windows-x86_64 binary'
          check_required '*.deb'               '.deb package'
          check_required '*.rpm'               '.rpm package'
          check_required '*.dmg'               '.dmg (macOS)'
          check_required '*setup*x86_64.exe'   '.exe installer (Windows)'
          check_required '*.sha256'            'checksums (.sha256)'
          check_required '*sbom*'              'SBOM'
          check_required 'LICENSE'             'LICENSE'
          check_required 'THIRD_PARTY*'        'THIRD_PARTY_LICENSES'
          echo
          echo "PRE-PUBLISH GATE: $missing required missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAIL — $missing required asset category(ies) missing. ALL 12 categories are required."
            exit 1
          fi
          echo "PRE-PUBLISH GATE: PASS — all 12 asset categories present."
      - name: Generate SHA256SUMS aggregate
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Clean stale release
        # If a previous run created a release for this tag but failed mid-upload
        # (the alpha.2 "release already_exists" error from action-gh-release),
        # delete it so the create step below succeeds. `|| true` makes this a
        # no-op when no release exists yet. GH_TOKEN required (same unauthenticated
        # gh bug as the verify step) — without it the delete silently no-ops.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ${{ github.ref_name }} --yes || true
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0 (node24)
        with:
          # Use the REAL git tag (with "v" prefix), not the PEP 440 version.
          # env.VERSION strips the leading "v" for pyproject.toml, but the git
          # tag is "v0.1.0-alpha.2" — using VERSION here created a release for a
          # non-existent tag, so assets never attached to the real pushed tag.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          # Pre-release tags carry a SemVer hyphen (v0.1.0-alpha.5, v0.1.0-rc.1);
          # final tags (v1.0.0) have none -> a real (non-pre) GitHub Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
          generate_release_notes: true
      - name: Verify release completeness (blocking)
        # Single source of truth for "the release actually shipped": the same
        # scripts/verify_release_completeness.py used locally checks every
        # artifact category (4 platform binaries, .deb/.rpm/.dmg/.exe,
        # checksums, SBOM, licenses), the >=12 asset floor, the prerelease
        # flag vs tag shape, version-stamped names, and zero-size assets.
        # Replaces the old inline `assets | length >= 6` check, whose threshold
        # had drifted from the verifier's and which counted names only —
        # 6 .sha256 files and no binaries would have passed. v0.1.0-beta.1
        # shipped with 1 asset because no completeness check ran in CI at all.
        # GH_TOKEN is REQUIRED: a bare `run:` gh call is unauthenticated and
        # aborts before checking (the false-RED that hit v0.1.0-alpha.5).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/verify_release_completeness.py \
            ${{ github.ref_name }} ${{ github.repository }}
      - name: Post-deploy smoke test — Linux binary
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "--- Downloading Linux x86_64 binary from release $TAG ---"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*linux-x86_64*' \
            --dir /tmp/gludd-smoke
          echo "--- Staged files ---"
          ls -la /tmp/gludd-smoke
          echo "--- Extracting ---"
          BIN=$(find /tmp/gludd-smoke -type f -not -name '*.sha256' -not -name '*.tar.gz' | head -1)
          if file "$BIN" | grep -q 'gzip compressed'; then
            mv "$BIN" /tmp/gludd-smoke/gludd.tar.gz
            tar -xzf /tmp/gludd-smoke/gludd.tar.gz -C /tmp/gludd-smoke
          else
            mv "$BIN" /tmp/gludd-smoke/gludd
          fi
          chmod +x /tmp/gludd-smoke/gludd || true
          find /tmp/gludd-smoke -name gludd -exec chmod +x {} \;
          echo "--- Running gludd version ---"
          /tmp/gludd-smoke/gludd version || {
            find /tmp/gludd-smoke -type f | xargs -I{} sh -c 'echo "--- {} ---"; {} version 2>&1 || true'
            echo "FAIL: could not run gludd version"
            exit 1
          }
          echo "--- Running gludd --help ---"
          /tmp/gludd-smoke/gludd --help
          echo "--- Verifying version matches tag ---"
          RAW_VERSION=$(/tmp/gludd-smoke/gludd version 2>&1 | tr -d '[:space:]')
          EXPECTED=$(echo "$TAG" | sed 's/^v//' | tr -d '[:space:]')
          if echo "$RAW_VERSION" | grep -q "$EXPECTED"; then
            echo "PASS: version '$RAW_VERSION' matches tag '$TAG'"
          else
            echo "FAIL: version '$RAW_VERSION' does not contain expected '$EXPECTED' (tag: $TAG)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Post-deploy verify — .deb package validity
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "--- Downloading .deb from release $TAG ---"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.deb' \
            --dir /tmp/gludd-deb
          echo "--- Staged files ---"
          ls -la /tmp/gludd-deb
          DEB=$(find /tmp/gludd-deb -name '*.deb' | head -1)
          echo "--- dpkg-deb --info $DEB ---"
          dpkg-deb --info "$DEB"
          echo "--- dpkg-deb --contents $DEB ---"
          dpkg-deb --contents "$DEB"
          echo "--- Verifying gludd binary inside .deb ---"
          dpkg-deb --contents "$DEB" | grep -q 'gludd' && echo "PASS: gludd binary found in .deb" || { echo "FAIL: gludd binary not found in .deb"; exit 1; }
          echo "PASS: .deb package is valid"
        env:
          GH_TOKEN: ${{ github.token }}

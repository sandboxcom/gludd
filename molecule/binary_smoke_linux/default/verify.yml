---
# Verify: assert every binary-smoke invariant against the outputs persisted by
# converge.yml. Runs on localhost; the backgrounded daemon from converge is
# still up during verify.
- name: Verify — gludd binary smoke results (localhost)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _smoke_out_dir: /tmp/gludd-binary-smoke-linux
    _daemon_port: "{{ lookup('env', 'GLUDD_SMOKE_PORT') | default('18001', true) }}"
    _daemon_url: "http://127.0.0.1:{{ _daemon_port }}"
  tasks:
    - name: Slurp captured outputs
      ansible.builtin.slurp:
        src: "{{ _smoke_out_dir }}/{{ item }}"
      register: _slurp_raw
      loop:
        - binary_path.txt
        - version.stdout.txt
        - version.stderr.txt
        - version.rc.txt
        - help.stdout.txt
        - help.stderr.txt
        - help.rc.txt
        - paths.stdout.txt
        - paths.stderr.txt
        - paths.rc.txt
        - bad_flag.stdout.txt
        - bad_flag.stderr.txt
        - bad_flag.rc.txt
        - daemon.stderr.log
        - health.json
        - job_submit.json
        - port_clash.txt

    - name: Decode captured outputs
      ansible.builtin.set_fact:
        _version_out: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'version.stdout.txt') | list | first).content | b64decode }}"
        _version_err: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'version.stderr.txt') | list | first).content | b64decode }}"
        _version_rc: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'version.rc.txt') | list | first).content | b64decode | trim }}"
        _help_out: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'help.stdout.txt') | list | first).content | b64decode }}"
        _help_err: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'help.stderr.txt') | list | first).content | b64decode }}"
        _help_rc: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'help.rc.txt') | list | first).content | b64decode | trim }}"
        _paths_out: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'paths.stdout.txt') | list | first).content | b64decode }}"
        _paths_err: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'paths.stderr.txt') | list | first).content | b64decode }}"
        _paths_rc: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'paths.rc.txt') | list | first).content | b64decode | trim }}"
        _daemon_err: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'daemon.stderr.log') | list | first).content | b64decode }}"
        _health_json: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'health.json') | list | first).content | b64decode }}"
        _job_json: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'job_submit.json') | list | first).content | b64decode }}"

    - name: Parse health response JSON
      ansible.builtin.set_fact:
        _health: "{{ _health_json | from_json }}"
      when: _health_json | length > 0

    # --- version ---
    - name: Assert version command succeeded
      ansible.builtin.assert:
        that:
          - _version_rc == "0"
          - _version_out | regex_search("[0-9]+\\.[0-9]+\\.[0-9]+") is truthy
          - "'general-ludd-agent' in _version_out"
        fail_msg: >-
          `gludd version` did not return a version string.
          rc={{ _version_rc }} stdout={{ _version_out }} stderr={{ _version_err }}

    # --- help ---
    - name: Assert help shows subcommands
      ansible.builtin.assert:
        that:
          - _help_rc == "0"
          - "'daemon' in _help_out"
          - "'project' in _help_out"
          - "'version' in _help_out"
        fail_msg: >-
          `gludd --help` missing expected subcommands.
          rc={{ _help_rc }} stdout_head={{ _help_out[:400] }}

    # --- project paths ---
    - name: Assert project paths resolved
      ansible.builtin.assert:
        that:
          - _paths_rc == "0"
          - _paths_out | length > 0
          - "('Collection search path' in _paths_out) or ('BUNDLED' in _paths_out) or ('collections' in _paths_out | lower)"
        fail_msg: >-
          `gludd project paths` produced no path entries.
          rc={{ _paths_rc }} stdout={{ _paths_out }}

    # --- invalid flag ---
    - name: Assert invalid flag exits non-zero cleanly
      ansible.builtin.assert:
        that:
          - "(_slurp_raw.results | selectattr('item', 'equalto', 'bad_flag.rc.txt') | list | first).content | b64decode | trim | int != 0"
          - "'Traceback' not in ((_slurp_raw.results | selectattr('item', 'equalto', 'bad_flag.stdout.txt') | list | first).content | b64decode)"
          - "'Traceback' not in ((_slurp_raw.results | selectattr('item', 'equalto', 'bad_flag.stderr.txt') | list | first).content | b64decode)"
        fail_msg: "invalid flag did not fail cleanly"

    # --- daemon: no traceback ---
    - name: Assert daemon stderr has no Python traceback
      ansible.builtin.assert:
        that:
          - "'Traceback (most recent call last)' not in _daemon_err"
          - "'ImportError' not in _daemon_err"
          - "'ModuleNotFoundError' not in _daemon_err"
        fail_msg: >-
          Daemon emitted a Python traceback on stderr.
          --- daemon.stderr.log ---
          {{ _daemon_err }}

    # --- health ---
    - name: Assert health endpoint returned 200
      ansible.builtin.assert:
        that:
          - _health.status is defined
          - _health.status == 200
        fail_msg: >-
          Daemon /healthz did not return 200.
          health={{ _health }}

    # --- job submission ---
    - name: Assert daemon accepted the job (todo_id present)
      ansible.builtin.assert:
        that:
          - "(_job_json | from_json).todo_id is defined"
        fail_msg: >-
          Daemon did not accept the job via POST /api/todos.
          result={{ _job_json }}

    # --- port clash ---
    - name: Load and parse port-clash result
      ansible.builtin.set_fact:
        _clash_text: "{{ (_slurp_raw.results | selectattr('item', 'equalto', 'port_clash.txt') | list | first).content | b64decode }}"

    - name: Assert port clash handled gracefully
      ansible.builtin.assert:
        that:
          - >
            (_clash_text | regex_search('EXIT_RC=([0-9]+)', '\\1') | first | int != 0)
            or ('in use' in (_clash_text | lower)) or ('address already' in (_clash_text | lower))
          - "'Traceback' not in _clash_text"
        fail_msg: "port clash was not handled gracefully: {{ _clash_text }}"

    # --- cleanup ---
    - name: Read daemon PID
      ansible.builtin.slurp:
        src: "{{ _smoke_out_dir }}/daemon.pid"
      register: _pid_raw
      failed_when: false

    - name: Kill smoke daemon
      ansible.builtin.shell: |
        set -e
        pids=$(lsof -ti tcp:{{ _daemon_port }} || true)
        if [ -n "$pids" ]; then kill $pids 2>/dev/null || true; fi
        pid="{{ (_pid_raw.content | default('')) | b64decode | trim }}"
        if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false

    - name: Remove smoke output dir
      ansible.builtin.file:
        path: "{{ _smoke_out_dir }}"
        state: absent
      ignore_errors: true

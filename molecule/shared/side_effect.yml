---
- name: Exercise the running mock daemon before verification
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') }}"
  tasks:
    - name: Verify the scenario-owned mock daemon remains healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: _gludd_mock_health
      until: _gludd_mock_health.status == 200
      retries: 5
      delay: 1
      changed_when: false

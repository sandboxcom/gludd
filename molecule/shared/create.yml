---
- name: Create the local Molecule target
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    molecule_scenario_name: "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}"
  tasks:
    - name: Require a namespaced Molecule scenario
      ansible.builtin.assert:
        that:
          - molecule_scenario_name | length > 0
          - molecule_scenario_name is match('^[A-Za-z0-9_-]+$')
        fail_msg: "MOLECULE_SCENARIO_NAME must identify this Molecule run"

    - name: Verify the explicit localhost target
      ansible.builtin.ping:
      changed_when: false

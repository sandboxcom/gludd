---
- name: Verify native materials tolerance evidence
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8873', true) }}"
    out_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/.molecule-materials-tolerance-{{ mock_port }}"
  tasks:
    - name: Read deterministic scenario receipt
      ansible.builtin.slurp:
        src: "{{ out_dir }}/tolerance_model_ran.json"
      register: marker

    - name: Assert receipt records explicit independent contributors
      ansible.builtin.assert:
        that:
          - "'independent contributors (no correlation)' in (marker.content | b64decode | from_json).assumptions"
          - (marker.content | b64decode | from_json).unit == 'mm'

    - name: Remove isolated evidence root
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: absent

---
# Converge: run general_ludd.chemistry.property_lookup and prove it executes.
- name: Converge - run chemistry.property_lookup role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8862', true) }}"
    out_dir: "/tmp/gludd-chemistry-expert-{{ mock_port }}"
  tasks:
    - name: Invoke property_lookup
      ansible.builtin.include_role:
        name: general_ludd.chemistry.property_lookup

    - name: Ensure marker directory exists
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: directory
        mode: "0755"

    - name: Write execution marker
      ansible.builtin.copy:
        content: "chemistry.property_lookup ran\n"
        dest: "{{ out_dir }}/property_lookup_ran.ok"
        mode: "0644"

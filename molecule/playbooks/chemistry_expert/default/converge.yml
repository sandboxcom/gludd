---
# Converge: prove fail-closed lot admission through the collection role.
- name: Converge - run chemistry.inventory_check role
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Reject one expired restricted under-purity lot
      ansible.builtin.include_role:
        name: general_ludd.chemistry.inventory_check
      vars:
        inventory_check_lot: LOT-MOLECULE-REJECT
        inventory_check_purity: 0.75
        inventory_check_expiry: "2026-10-07"
        inventory_check_restrictions:
          - quarantine
        inventory_check_required_purity: 0.99
        inventory_check_as_of: "2026-10-08"

    - name: Assert every bounded rejection without a substitution
      ansible.builtin.assert:
        that:
          - not inventory_check_result.admitted
          - inventory_check_result.requires_review
          - inventory_check_result.reason_codes == expected_reason_codes
          - inventory_check_result.lot == 'LOT-MOLECULE-REJECT'
          - inventory_check_result.substituted_lot is not defined
      vars:
        expected_reason_codes:
          - lot_expired
          - lot_restricted
          - lot_purity_insufficient

    - name: Re-evaluate the same lot in check mode
      general_ludd.chemistry.chemical_lot_admission:
        lot: LOT-MOLECULE-REJECT
        purity: 0.75
        expiry: "2026-10-07"
        restrictions:
          - quarantine
        required_purity: 0.99
        as_of: "2026-10-08"
      check_mode: true
      register: check_mode_admission

    - name: Assert check mode is read-only and deterministic
      ansible.builtin.assert:
        that:
          - not check_mode_admission.changed
          - check_mode_admission.result == inventory_check_result

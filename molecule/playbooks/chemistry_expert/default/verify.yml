---
# Verify: the native module admits only the explicitly declared suitable lot.
- name: Verify - chemistry lot admission is discoverable and read-only
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert collection galaxy.yml is discoverable
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/chemistry/galaxy.yml"
      register: galaxy_stat
      failed_when: not galaxy_stat.stat.exists

    - name: Assert inventory_check role tasks are discoverable
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/chemistry/roles/inventory_check/tasks/main.yml"
      register: role_stat
      failed_when: not role_stat.stat.exists

    - name: Admit an unexpired unrestricted exact-purity lot
      general_ludd.chemistry.chemical_lot_admission:
        lot: LOT-MOLECULE-ADMIT
        purity: 0.995
        expiry: "2026-10-08"
        restrictions: []
        required_purity: 0.995
        as_of: "2026-10-08"
      register: admitted_lot

    - name: Assert admitted verdict is bounded and unchanged
      ansible.builtin.assert:
        that:
          - not admitted_lot.changed
          - admitted_lot.result.admitted
          - admitted_lot.result.reason_codes == []
          - admitted_lot.result.lot == 'LOT-MOLECULE-ADMIT'

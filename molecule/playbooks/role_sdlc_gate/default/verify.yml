---
- name: Verify - sdlc_gate operations produce correct artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8866', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8866', true) }}.pid"
  tasks:
    # ── validate_pipeline ──
    - name: Assert validate_pipeline artifact exists
      ansible.builtin.stat:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-validate/sdlc_pipeline_health.json"
      register: art_vp
      failed_when: not art_vp.stat.exists

    - name: Load validate_pipeline artifact
      ansible.builtin.slurp:
        src: "/tmp/gludd-sdlc-gate-{{ mock_port }}-validate/sdlc_pipeline_health.json"
      register: raw_vp

    - name: Parse validate_pipeline artifact
      ansible.builtin.set_fact:
        result_vp: "{{ raw_vp.content | b64decode | from_json }}"

    - name: Assert pipeline is healthy with 8 stages
      ansible.builtin.assert:
        that:
          - result_vp.role == 'sdlc_gate'
          - result_vp.operation == 'validate_pipeline'
          - result_vp.pipeline_healthy == true
          - result_vp.stage_count == 8
          - result_vp.quality_gate_count >= 5
          - result_vp.evidence_bundle_count >= 8
          - result_vp.defects | length == 0
        fail_msg: "Pipeline validation failed. Defects: {{ result_vp.defects | default([]) }}"
        success_msg: "validate_pipeline: healthy, 8 stages, 0 defects"

    # ── check_stage_entry ──
    - name: Assert check_stage_entry artifact exists
      ansible.builtin.stat:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-entry/sdlc_entry_intake.json"
      register: art_entry
      failed_when: not art_entry.stat.exists

    - name: Load check_stage_entry artifact
      ansible.builtin.slurp:
        src: "/tmp/gludd-sdlc-gate-{{ mock_port }}-entry/sdlc_entry_intake.json"
      register: raw_entry

    - name: Parse check_stage_entry artifact
      ansible.builtin.set_fact:
        result_entry: "{{ raw_entry.content | b64decode | from_json }}"

    - name: Assert entry gate passed for intake (stage 0, no prev token needed)
      ansible.builtin.assert:
        that:
          - result_entry.role == 'sdlc_gate'
          - result_entry.operation == 'check_stage_entry'
          - result_entry.stage == 'intake'
          - result_entry.stage_number == 0
          - result_entry.entry_gate_passed == true
          - result_entry.block_reasons | length == 0
        fail_msg: "Entry gate should pass for stage 0 with task_id set. Got: {{ result_entry }}"
        success_msg: "check_stage_entry intake: passed, 0 block reasons"

    # ── check_stage_exit ──
    - name: Assert check_stage_exit artifact exists
      ansible.builtin.stat:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-exit/sdlc_exit_intake.json"
      register: art_exit
      failed_when: not art_exit.stat.exists

    - name: Load check_stage_exit artifact
      ansible.builtin.slurp:
        src: "/tmp/gludd-sdlc-gate-{{ mock_port }}-exit/sdlc_exit_intake.json"
      register: raw_exit

    - name: Parse check_stage_exit artifact
      ansible.builtin.set_fact:
        result_exit: "{{ raw_exit.content | b64decode | from_json }}"

    - name: Assert exit gate passes with seeded primary role + evidence artifacts
      ansible.builtin.assert:
        that:
          - result_exit.role == 'sdlc_gate'
          - result_exit.operation == 'check_stage_exit'
          - result_exit.stage == 'intake'
          - result_exit.stage_number == 0
          - result_exit.exit_gate_passed == true
          - result_exit.exit_checks_complete == true
          - result_exit.block_reasons | length == 0
          - result_exit.blocking == false
          - result_exit.next_stage == 'planning'
        fail_msg: "Exit gate should pass with seeded fixtures. Got: {{ result_exit }}"
        success_msg: "check_stage_exit intake: passed, next_stage=planning"

    - name: Assert primary roles are listed as present
      ansible.builtin.assert:
        that:
          - result_exit.primary_roles | selectattr('role', 'equalto', 'triage_issue') | map(attribute='artifact_present') | first == true
          - result_exit.primary_roles | selectattr('role', 'equalto', 'story_create') | map(attribute='artifact_present') | first == true
        fail_msg: "Primary role artifacts should be present. Got: {{ result_exit.primary_roles }}"
        success_msg: "Primary roles: both artifacts present"

    # ── audit_token_chain ──
    - name: Assert audit_token_chain artifact exists
      ansible.builtin.stat:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-audit/sdlc_token_chain_audit.json"
      register: art_audit
      failed_when: not art_audit.stat.exists

    - name: Load audit_token_chain artifact
      ansible.builtin.slurp:
        src: "/tmp/gludd-sdlc-gate-{{ mock_port }}-audit/sdlc_token_chain_audit.json"
      register: raw_audit

    - name: Parse audit_token_chain artifact
      ansible.builtin.set_fact:
        result_audit: "{{ raw_audit.content | b64decode | from_json }}"

    - name: Assert token chain audit reports 8 expected tokens (all missing)
      ansible.builtin.assert:
        that:
          - result_audit.chain | length == 8
          - result_audit.chain_health.total_expected == 8
          - result_audit.chain_health.total_present == 0
          - result_audit.chain_health.valid_tokens == 0
        fail_msg: "Token chain audit should report 8 expected, 0 present. Got: {{ result_audit.chain_health }}"
        success_msg: "audit_token_chain: 8 expected, 0 present (no tokens seeded)"

    # ── list_stages ──
    - name: Assert list_stages artifact exists
      ansible.builtin.stat:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-list/sdlc_stage_list.json"
      register: art_list
      failed_when: not art_list.stat.exists

    - name: Load list_stages artifact
      ansible.builtin.slurp:
        src: "/tmp/gludd-sdlc-gate-{{ mock_port }}-list/sdlc_stage_list.json"
      register: raw_list

    - name: Parse list_stages artifact
      ansible.builtin.set_fact:
        result_list: "{{ raw_list.content | b64decode | from_json }}"

    - name: Assert stage list reports 8 stages, current stage is intake
      ansible.builtin.assert:
        that:
          - result_list.role == 'sdlc_gate'
          - result_list.operation == 'list_stages'
          - result_list.stages | length == 8
          - result_list.totals.total_stages == 8
          - result_list.current_stage == 'intake'
        fail_msg: "Stage list should report 8 stages, current=intake. Got: {{ result_list }}"
        success_msg: "list_stages: 8 stages, current=intake"

    # ── Cleanup ──
    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

    - name: Remove validate artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-validate"
        state: absent
      failed_when: false

    - name: Remove entry artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-entry"
        state: absent
      failed_when: false

    - name: Remove exit artifact dir (includes seeded fixtures)
      ansible.builtin.file:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-exit"
        state: absent
      failed_when: false

    - name: Remove audit artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-audit"
        state: absent
      failed_when: false

    - name: Remove list artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-sdlc-gate-{{ mock_port }}-list"
        state: absent
      failed_when: false

---
# sdlc_gate prepare: start mock daemon + seed fixture artifacts
# for the intake-stage exit gate test.
- name: Prepare - mock daemon + SDLC fixture artifacts for sdlc_gate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8866', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8866', true) }}.pid"
    fixture_dir: "/tmp/gludd-sdlc-gate-{{ mock_port }}-exit"
  tasks:
    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ (lookup('env', 'VIRTUAL_ENV') + '/bin/python3') if lookup('env', 'VIRTUAL_ENV') else 'python3' }}
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    # ---- Seed intake-stage role artifacts for check_stage_exit ----
    - name: Create exit-gate fixture dir
      ansible.builtin.file:
        path: "{{ fixture_dir }}"
        state: directory
        mode: "0755"

    - name: Seed triage_issue artifact (gate_passed=true)
      ansible.builtin.copy:
        content: |
          {
            "role": "triage_issue",
            "status": "completed",
            "gate_passed": true,
            "task_id": "test-task-001",
            "finding_count": 0
          }
        dest: "{{ fixture_dir }}/triage_issue.json"
        mode: "0644"

    - name: Seed story_create artifact (gate_passed=true)
      ansible.builtin.copy:
        content: |
          {
            "role": "story_create",
            "status": "completed",
            "gate_passed": true,
            "task_id": "test-task-001",
            "story_points": 3
          }
        dest: "{{ fixture_dir }}/story_create.json"
        mode: "0644"

    - name: Seed backlog_groom artifact (gate_passed=true)
      ansible.builtin.copy:
        content: |
          {
            "role": "backlog_groom",
            "status": "completed",
            "gate_passed": true,
            "task_id": "test-task-001",
            "groomed": true
          }
        dest: "{{ fixture_dir }}/backlog_groom.json"
        mode: "0644"

    - name: Seed intake.json evidence artifact
      ansible.builtin.copy:
        content: |
          {
            "task_name": "test-task-001",
            "acceptance_criteria": ["AC1: thing works"],
            "size": "S",
            "priority": "P1",
            "created_at": "2026-07-11T00:00:00Z"
          }
        dest: "{{ fixture_dir }}/intake.json"
        mode: "0644"

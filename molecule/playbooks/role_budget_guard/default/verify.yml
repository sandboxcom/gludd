---
- name: Verify - budget_guard wrote its budget artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8831', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8831', true) }}.pid"
    artifact: "/tmp/gludd-budget-guard-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8831', true) }}/budget_guard.json"
    artifact_md: "/tmp/gludd-budget-guard-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8831', true) }}/budget_guard.md"
  tasks:
    - name: Assert JSON artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: not art.stat.exists

    - name: Load JSON artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse JSON artifact
      ansible.builtin.set_fact:
        result: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert artifact fields
      ansible.builtin.assert:
        that:
          - result.role == 'budget_guard'
          - result.status is defined
          - result.summary is defined
          - result.limit_usd is defined
          - result.used_usd is defined
          - result.remaining_usd is defined
          # Mock daemon returns remaining_usd=6.25 (budget healthy)
          - result.status == 'ok'
          - result.remaining_usd | float == 6.25
          - result.limit_usd | float == 10.0
        fail_msg: "budget_guard artifact wrong: {{ result }}"
        success_msg: "budget_guard ran end-to-end against mock; status={{ result.status }}, remaining={{ result.remaining_usd }}"

    - name: Assert markdown artifact exists
      ansible.builtin.stat:
        path: "{{ artifact_md }}"
      register: art_md
      failed_when: not art_md.stat.exists

    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-budget-guard-{{ mock_port }}"
        state: absent
      failed_when: false

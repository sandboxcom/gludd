---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  config_options:
    defaults:
      gathering: explicit
      host_key_checking: false
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - syntax
    - converge
    - verify

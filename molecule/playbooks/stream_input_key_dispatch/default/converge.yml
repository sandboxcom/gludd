---
# Exercise gludd_stream input_key (mode=before) against mock daemon. Two
# TRIGGER markers produce exactly two dispatches; each chunk is the lead-up
# to the marker (the post-TRIGGER tail is retained for the next chunk and
# the final unterminated segment is NOT dispatched in before mode).
- name: Converge - gludd_stream input_key (before) against mock daemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8844', true) }}"
    fixture_log: "/tmp/gludd-input-key-fixture.log"
    artifact_dir: "/tmp/gludd-stream-input-key-before"
  tasks:
    - name: Ensure artifact directory exists
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Reset mock-daemon request log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/__requests/reset"
        method: POST
        status_code: 200

    - name: Stream fixture via gludd_stream (input_key, mode=before)
      general_ludd.agent.gludd_stream:
        device: "{{ fixture_log }}"
        device_kind: binary
        buffer_size: 1048576
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        dispatch_trigger:
          type: input_key
          key: "TRIGGER"
          mode: before
        dispatch_role_clone:
          inject_as: stream_chunk
          role: stream_input_key_before
        stop_condition:
          type: eof
        artifact_dir: "{{ artifact_dir }}"
      register: stream_result

    - name: Persist stream result
      ansible.builtin.copy:
        content: "{{ stream_result | to_nice_json }}"
        dest: "{{ artifact_dir }}/stream-result.json"
        mode: "0644"

    - name: Snapshot mock-daemon request log
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/__requests"
        method: GET
        status_code: 200
      register: requests_snapshot

    - name: Persist request log for verify
      ansible.builtin.copy:
        content: "{{ requests_snapshot.json | to_nice_json }}"
        dest: "{{ artifact_dir }}/requests.json"
        mode: "0644"

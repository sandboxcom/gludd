---
- name: Verify - gludd_reload promoted the healthy swap and rolled back the degraded one
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8840', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8840', true) }}.pid"
    reload_base: "/tmp/gludd-reload-8840"
  tasks:
    - name: Load persisted reload results
      ansible.builtin.slurp:
        src: "/tmp/gludd-mock-{{ mock_port }}-reload.json"
      register: raw

    - name: Parse reload results
      ansible.builtin.set_fact:
        res: "{{ raw.content | b64decode | from_json }}"

    - name: Assert the GOOD candidate was promoted (healthy gate, no rollback)
      ansible.builtin.assert:
        that:
          - res.good.success | bool
          - not (res.good.rolled_back | bool)
        fail_msg: "gludd_reload should promote the healthy candidate: {{ res.good }}"
        success_msg: "gludd_reload: healthy swap promoted (success=true, rolled_back=false)"

    - name: Assert the BROKEN candidate was rolled back fail-closed (degraded gate)
      ansible.builtin.assert:
        that:
          - not (res.broken.success | bool)
          - res.broken.rolled_back | bool
        fail_msg: "gludd_reload must roll back the degraded candidate: {{ res.broken }}"
        success_msg: "gludd_reload: degraded gate -> rolled back (success=false, rolled_back=true)"

    - name: Confirm the good promotion-result artifact was written to disk
      ansible.builtin.stat:
        path: "{{ reload_base }}/promotion_good.json"
      register: pg
      failed_when: not pg.stat.exists

    # ---- cleanup ----
    - name: Remove the throwaway leaf tree + candidates
      ansible.builtin.file:
        path: "{{ reload_base }}"
        state: absent
      failed_when: false

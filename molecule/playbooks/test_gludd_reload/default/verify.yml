---
- name: Verify - gludd_reload swapped on health and rolled back on failure
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8840', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8840', true) }}.pid"
    base: "/tmp/gludd-reload-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8840', true) }}"
  tasks:
    - name: Load persisted results
      ansible.builtin.slurp:
        src: "/tmp/gludd-mock-{{ mock_port }}-reload.json"
      register: raw

    - name: Parse results
      ansible.builtin.set_fact:
        res: "{{ raw.content | b64decode | from_json }}"

    - name: Assert the healthy hot-rotation succeeded (no rollback)
      ansible.builtin.assert:
        that:
          - res.good.success | bool
          - not (res.good.rolled_back | bool)
          - res.good.changed | bool
        fail_msg: "gludd_reload healthy path should succeed: {{ res.good }}"
        success_msg: "gludd_reload: healthy hot-rotation swapped candidate-v2 in, no rollback"

    - name: Assert the failed health gate rolled back fail-closed
      ansible.builtin.assert:
        that:
          - not (res.rollback.success | bool)
          - res.rollback.rolled_back | bool
        fail_msg: "gludd_reload should roll back on a failed health gate: {{ res.rollback }}"
        success_msg: "gludd_reload: 404 /readyz failed the health gate -> success=false, rolled_back=true"

    - name: Assert the live file ended at the good candidate bytes (rollback restored, not the rollback candidate)
      ansible.builtin.assert:
        that:
          - "'candidate-v2' in res.live_after"
          - "'candidate-rollback' not in res.live_after"
        fail_msg: "live module bytes wrong after rollback: {{ res.live_after }}"
        success_msg: "gludd_reload: rollback restored the pre-rollback bytes (candidate-v2 intact)"

    # ---- cleanup ----
    - name: Remove reload tree
      ansible.builtin.file:
        path: "{{ base }}"
        state: absent
      failed_when: false

    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

---
# Exercise the REAL gludd_reload module twice against the live throwaway leaf:
#   1. GOOD candidate + healthy /readyz gate  -> success=true,  rolled_back=false
#   2. BROKEN candidate + degraded gate        -> success=false, rolled_back=true
# Each call runs the HotReloader in-process and importlib.reloads the leaf.
- name: Converge - run gludd_reload (healthy swap, then degraded rollback)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8840', true) }}"
    reload_base: "/tmp/gludd-reload-8840"
  tasks:
    - name: Hot-rotate the GOOD candidate (healthy /readyz gate -> promote)
      general_ludd.agent.gludd_reload:
        module_name: "gludd_reload_leaf.leaf"
        candidate_source_path: "{{ reload_base }}/candidate_good.py"
        health_url: "http://127.0.0.1:{{ mock_port }}/readyz"
        health_timeout: 5.0
        result_path: "{{ reload_base }}/promotion_good.json"
      register: reload_good

    - name: Hot-rotate the BROKEN candidate (degraded gate -> rollback)
      general_ludd.agent.gludd_reload:
        module_name: "gludd_reload_leaf.leaf"
        candidate_source_path: "{{ reload_base }}/candidate_broken.py"
        health_url: "http://127.0.0.1:{{ mock_port }}/readyz-degraded"
        health_timeout: 5.0
        result_path: "{{ reload_base }}/promotion_broken.json"
      register: reload_broken

    - name: Persist both reload results for verify
      ansible.builtin.copy:
        content: "{{ {'good': reload_good, 'broken': reload_broken} | to_nice_json }}"
        dest: "/tmp/gludd-mock-{{ mock_port }}-reload.json"
        mode: "0644"

    - name: Show reload outcomes
      ansible.builtin.debug:
        msg:
          - "good.success={{ reload_good.success }} rolled_back={{ reload_good.rolled_back }}"
          - "broken.success={{ reload_broken.success }} rolled_back={{ reload_broken.rolled_back }}"

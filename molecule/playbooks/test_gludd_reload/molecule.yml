---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8840"
    # The throwaway leaf module rotated by gludd_reload lives here; the ansible
    # module subprocess must be able to import it. Created in prepare.yml.
    PYTHONPATH: "/tmp/gludd-reload-8840/live"
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # reload hot-swaps a file on disk (rollback path mutates state); skip idempotence.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy

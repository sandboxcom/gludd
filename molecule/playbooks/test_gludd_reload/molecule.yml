---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8840"
    # gludd_reload runs in-process and importlib.import_module()s the live leaf
    # module by dotted name, so the leaf package's PARENT dir must be on the
    # module subprocess sys.path. prepare.yml writes the throwaway leaf package
    # under this exact dir. (general_ludd itself is already importable from the
    # installed venv — only the throwaway leaf needs PYTHONPATH.) The reverted
    # scenario failed precisely because it never provided this import-clean path.
    PYTHONPATH: "/tmp/gludd-reload-8840"
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # A hot code swap mutates the live leaf file on disk; a second converge would
  # start from the already-swapped (then rolled-back) state, so the run is not
  # meaningfully idempotent. Skip the idempotence step.
  test_sequence:
    - syntax
    - prepare
    - converge
    - verify

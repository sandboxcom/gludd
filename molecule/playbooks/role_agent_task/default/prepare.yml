---
- name: Prepare - mock daemon + throwaway git repo for agent_task
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8793', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8793', true) }}.pid"
    repo_path: "/tmp/gludd-mock-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8793', true) }}"
  tasks:
    - name: Remove stale throwaway repo + worktree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ repo_path }}"
        - "/tmp/gludd-worktrees/MOCK-TASK-1"

    - name: Create throwaway git repo with an initial commit
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p "{{ repo_path }}"
          cd "{{ repo_path }}"
          git init -q
          git config user.email "mock@molecule.local"
          git config user.name "Molecule Mock"
          git config commit.gpgsign false
          echo "seed" > README.md
          git add README.md
          git commit -q -m "seed commit"
      changed_when: true

---
- name: Verify - open_code_workflow module returned success
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}.pid"
    result_file: "/tmp/gludd-open-code-workflow-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}/oc_result.json"
  tasks:
    - name: Load persisted result
      ansible.builtin.slurp:
        src: "{{ result_file }}"
      register: raw
    - name: Parse result
      ansible.builtin.set_fact:
        oc: "{{ raw.content | b64decode | from_json }}"
    - name: Assert module returned success
      ansible.builtin.assert:
        that:
          - oc.action == 'gate_check'
          - oc.cmd | length > 0
          - oc.changed is defined
        fail_msg: "result wrong: {{ oc }}"
        success_msg: "gludd_open_code gate_check returned cmd={{ oc.cmd }} rc={{ oc.rc }} changed={{ oc.changed }}"
    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false
    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-open-code-workflow-{{ mock_port }}"
        state: absent
      failed_when: false

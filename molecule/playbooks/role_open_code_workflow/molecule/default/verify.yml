---
- name: Verify - open_code_workflow ran gate_check and wrote artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}.pid"
    artifact: "/tmp/gludd-open-code-workflow-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}/open_code_workflow.json"
    artifact_md: "/tmp/gludd-open-code-workflow-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}/open_code_workflow.md"
  tasks:
    - name: Assert JSON artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: not art.stat.exists

    - name: Load JSON artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse JSON artifact
      ansible.builtin.set_fact:
        result: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert artifact fields — gate_check completed
      ansible.builtin.assert:
        that:
          - result.role == 'open_code_workflow'
          - result.action == 'gate_check'
          - result.status in ['completed', 'failed']
          - result.cmd | length > 0
          - result.changed is defined
          - result.params is defined
        fail_msg: "open_code_workflow artifact wrong: {{ result }}"
        success_msg: "open_code_workflow gate_check ran end-to-end; status={{ result.status }} rc={{ result.rc }}"

    - name: Assert markdown artifact exists
      ansible.builtin.stat:
        path: "{{ artifact_md }}"
      register: art_md
      failed_when: not art_md.stat.exists

    # ---- cleanup: stop daemon ----
    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-open-code-workflow-{{ mock_port }}"
        state: absent
      failed_when: false

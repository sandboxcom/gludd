---
- name: Converge - run gludd_open_code module directly
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8842', true) }}"
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: Run gludd_open_code gate_check
      general_ludd.agent.gludd_open_code:
        action: gate_check
        repo_path: "{{ project_dir }}"
      register: oc_result

    - name: Create artifact directory
      ansible.builtin.file:
        path: "/tmp/gludd-open-code-workflow-{{ mock_port }}"
        state: directory
        mode: "0755"

    - name: Persist result for verify playbook
      ansible.builtin.copy:
        content: "{{ oc_result | to_nice_json }}"
        dest: "/tmp/gludd-open-code-workflow-{{ mock_port }}/oc_result.json"
        mode: "0644"

---
# Verify: the ai_ml collection is discoverable AND model_select executed.
- name: Verify - ai_ml collection installed and model_select executed
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8863', true) }}"
    out_dir: "/tmp/gludd-ai-ml-expert-{{ mock_port }}"
    marker: "{{ out_dir }}/model_select_ran.ok"
  tasks:
    - name: Assert collection galaxy.yml is discoverable
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/ai_ml/galaxy.yml"
      register: galaxy_stat
      failed_when: not galaxy_stat.stat.exists

    - name: Assert model_select role tasks are discoverable
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/ai_ml/roles/model_select/tasks/main.yml"
      register: role_stat
      failed_when: not role_stat.stat.exists

    - name: Assert execution marker present
      ansible.builtin.stat:
        path: "{{ marker }}"
      register: marker_stat
      failed_when: not marker_stat.stat.exists

    - name: Report
      ansible.builtin.debug:
        msg: "ai_ml.model_select executed; collection discoverable."

    # ---- cleanup ----
    - name: Remove marker dir
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: absent
      failed_when: false

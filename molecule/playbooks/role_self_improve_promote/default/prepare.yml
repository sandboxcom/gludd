---
# self_improve_promote rollback scenario:
#   * a live importable leaf module (on PYTHONPATH) returning v1
#   * a candidate source returning v2
#   * an ab_verdict.json with promote:true
#   * a health_url pointing at the mock daemon /readyz which returns non-200
#     (the daemon has no /readyz route => 404) => health gate fails => ROLLBACK.
- name: Prepare - live module + candidate + promote verdict + mock daemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8853', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8853', true) }}.pid"
    live_root: "/tmp/gludd-promote-live"
    artifact_dir: "/tmp/gludd-self-improve-promote"
  tasks:
    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ lookup('env', 'VIRTUAL_ENV') | default('/usr', true) }}/bin/python3
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    - name: Create live module package dir
      ansible.builtin.file:
        path: "{{ live_root }}/src/gludd_promote_target"
        state: directory
        mode: "0755"

    - name: Live package __init__
      ansible.builtin.copy:
        content: ""
        dest: "{{ live_root }}/src/gludd_promote_target/__init__.py"
        mode: "0644"

    - name: Live leaf module (v1)
      ansible.builtin.copy:
        content: |
          VERSION = "v1"
        dest: "{{ live_root }}/src/gludd_promote_target/leaf.py"
        mode: "0644"

    - name: Candidate source (v2 — what would be promoted)
      ansible.builtin.copy:
        content: |
          VERSION = "v2-candidate"
        dest: "{{ live_root }}/candidate_leaf.py"
        mode: "0644"

    - name: Create artifact dir
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Write a promote:true ab_verdict
      ansible.builtin.copy:
        content: |
          {"promote": true, "a": {"ok": true, "crashed": false},
           "b": {"ok": true, "crashed": false}, "reason": "benign"}
        dest: "{{ artifact_dir }}/ab_verdict.json"
        mode: "0644"

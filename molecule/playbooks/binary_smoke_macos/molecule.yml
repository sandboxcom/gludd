---
# Molecule scenario: smoke-test the built gludd binary on macOS (localhost).
#
# Verifies the pyinstaller-frozen binary boots, parses CLI args, resolves the
# 3-tier ansible collections precedence, and can start the daemon without a
# traceback. Runs entirely against localhost with connection: local.
driver:
  name: default
platforms:
  - name: localhost
    os: macos
    connection: local
provisioner:
  name: ansible
  config_options:
    defaults:
      gathering: explicit
      host_key_checking: false
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - syntax
    - prepare
    - converge
    - verify

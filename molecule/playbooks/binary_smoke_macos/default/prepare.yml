---
# Prepare: create the smoke output directory converge.yml writes its captured
# CLI/daemon outputs into. Runs before converge on localhost.
- name: Prepare — gludd binary smoke output dir (macOS localhost)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _smoke_out_dir: /tmp/gludd-binary-smoke-macos
  tasks:
    - name: Create smoke output directory
      ansible.builtin.file:
        path: "{{ _smoke_out_dir }}"
        state: directory
        mode: "0755"

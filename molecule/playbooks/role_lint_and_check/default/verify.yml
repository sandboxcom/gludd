---
- name: Verify - lint_and_check wrote its quality_result artifact
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8864', true) }}"
    artifact: "/tmp/gludd-lint-and-check-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8864', true) }}/quality_result.json"
  tasks:
    - name: Assert artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: not art.stat.exists

    - name: Load artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse artifact
      ansible.builtin.set_fact:
        result: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert artifact fields
      ansible.builtin.assert:
        that:
          - result.status == 'passed'
          - result.lint_rc == 0
          - result.typecheck_rc == 0
        fail_msg: "lint_and_check artifact wrong: {{ result }}"
        success_msg: "lint_and_check ran end-to-end; status={{ result.status }}"

    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-lint-and-check-{{ mock_port }}"
        state: absent
      failed_when: false

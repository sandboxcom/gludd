---
# Run the REAL sprint_plan role against the mock daemon.
- name: Converge - run sprint_plan role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8820', true) }}"
  tasks:
    - name: Invoke sprint_plan (explicit capacity=10, write_back=false)
      ansible.builtin.include_role:
        name: general_ludd.agent.sprint_plan
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-sprint-plan-{{ mock_port }}"
        sprint_name: "Sprint-Test-1"
        sprint_capacity: 10
        write_back: false

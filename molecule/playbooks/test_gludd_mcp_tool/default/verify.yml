---
- name: Verify - gludd_mcp_tool crossed the daemon dispatch boundary
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    result_path: >-
      {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/mcp-tool-result.json
  tasks:
    - name: Load persisted mcp_tool result
      ansible.builtin.slurp:
        src: "{{ result_path }}"
      register: raw

    - name: Parse result
      ansible.builtin.set_fact:
        res: "{{ raw.content | b64decode | from_json }}"

    - name: Assert the MCP call returned the dispatcher output
      ansible.builtin.assert:
        that:
          - not res.failed
          - not res.changed
          - res.result is defined
          - res.result == '[mock-daemon] dispatch executed successfully.'
          - res.server == "filesystem"
          - res.tool == "read_file"
          - "'POST /api/dispatch' in res.mock_requests"
        fail_msg: "gludd_mcp_tool did not complete one MCP dispatch: {{ res }}"
        success_msg: "gludd_mcp_tool: live daemon dispatch contract verified"

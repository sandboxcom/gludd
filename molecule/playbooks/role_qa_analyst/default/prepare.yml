---
# qa_analyst prepare: start mock daemon + seed the 3 sub-artifact JSONs that
# the qa_analyst role slurps (test_matrix, coverage, flaky).
# Seeds three scenarios:
#   1) pass: pass_rate=0.98, coverage=95%, flaky=0 → score≈0.775 (fail with default threshold=0.8)
#      Use lower threshold=0.75 via converge vars → verdict=pass
#   2) flaky: pass_rate=0.98, coverage=95%, flaky=2 → score≈0.755 → with threshold=0.75 → conditional
#   3) fail: pass_rate=0.50, coverage=40%, flaky=5 → score≈0.25 → verdict=fail
#
# Score formula: 0.5*pass_rate + 0.3*(cov/100) - 0.2*(min(flaky,10)/10)
#   pass:  0.5*0.98 + 0.3*0.95 - 0.2*0   = 0.49 + 0.285 - 0   = 0.775
#   flaky: 0.5*0.98 + 0.3*0.95 - 0.2*0.2 = 0.49 + 0.285 - 0.04 = 0.735
#   fail:  0.5*0.50 + 0.3*0.40 - 0.2*0.5 = 0.25 + 0.12  - 0.10 = 0.27
#
# Converge uses pass_threshold=0.72 so:
#   pass:  0.775 >= 0.72 + flaky=0 → verdict=pass
#   flaky: 0.735 >= 0.72 + flaky=2 → verdict=conditional
#   fail:  0.27  < 0.72            → verdict=fail
- name: Prepare - mock daemon + qa sub-artifact fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8848', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8848', true) }}.pid"
    artifact_base: "/tmp/gludd-qa-fixtures-{{ mock_port }}"
  tasks:
    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ lookup('env', 'VIRTUAL_ENV') | default('/usr', true) }}/bin/python3
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    # ---- pass scenario: score=0.775, threshold=0.72 → pass ----
    - name: Create pass fixtures dir
      ansible.builtin.file:
        path: "{{ artifact_base }}/pass"
        state: directory
        mode: "0755"

    - name: Seed pass test_matrix (98% pass rate, no gaps)
      ansible.builtin.copy:
        content: |
          {
            "role": "test_matrix",
            "status": "completed",
            "total_tests": 100,
            "passed_tests": 98,
            "failed_tests": 2,
            "pass_rate": 0.98,
            "gaps": []
          }
        dest: "{{ artifact_base }}/pass/test_matrix.json"
        mode: "0644"

    - name: Seed pass coverage (95% coverage)
      ansible.builtin.copy:
        content: |
          {
            "role": "coverage",
            "status": "completed",
            "coverage_pct": 95.0,
            "modules_below_threshold": []
          }
        dest: "{{ artifact_base }}/pass/coverage.json"
        mode: "0644"

    - name: Seed pass flaky (0 flaky tests)
      ansible.builtin.copy:
        content: |
          {
            "role": "flaky",
            "status": "completed",
            "flaky_tests": []
          }
        dest: "{{ artifact_base }}/pass/flaky.json"
        mode: "0644"

    # ---- flaky (conditional) scenario: score=0.735, threshold=0.72 → conditional ----
    - name: Create flaky fixtures dir
      ansible.builtin.file:
        path: "{{ artifact_base }}/flaky"
        state: directory
        mode: "0755"

    - name: Seed flaky test_matrix (98% pass rate, 2 gaps)
      ansible.builtin.copy:
        content: |
          {
            "role": "test_matrix",
            "status": "completed",
            "total_tests": 100,
            "passed_tests": 98,
            "failed_tests": 2,
            "pass_rate": 0.98,
            "gaps": ["module_x", "module_y"]
          }
        dest: "{{ artifact_base }}/flaky/test_matrix.json"
        mode: "0644"

    - name: Seed flaky coverage (95% coverage)
      ansible.builtin.copy:
        content: |
          {
            "role": "coverage",
            "status": "completed",
            "coverage_pct": 95.0,
            "modules_below_threshold": []
          }
        dest: "{{ artifact_base }}/flaky/coverage.json"
        mode: "0644"

    - name: Seed flaky artifact (2 flaky tests → conditional verdict expected)
      ansible.builtin.copy:
        content: |
          {
            "role": "flaky",
            "status": "completed",
            "flaky_tests": [
              {"name": "test_integration_db::test_retry_on_timeout", "flap_count": 3},
              {"name": "test_event_loop::test_concurrent_tasks", "flap_count": 2}
            ]
          }
        dest: "{{ artifact_base }}/flaky/flaky.json"
        mode: "0644"

    # ---- fail scenario: score=0.27 < 0.72 → fail ----
    - name: Create fail fixtures dir
      ansible.builtin.file:
        path: "{{ artifact_base }}/fail"
        state: directory
        mode: "0755"

    - name: Seed fail test_matrix (50% pass rate, 3 gaps)
      ansible.builtin.copy:
        content: |
          {
            "role": "test_matrix",
            "status": "completed",
            "total_tests": 100,
            "passed_tests": 50,
            "failed_tests": 50,
            "pass_rate": 0.5,
            "gaps": ["module_a", "module_b", "module_c"]
          }
        dest: "{{ artifact_base }}/fail/test_matrix.json"
        mode: "0644"

    - name: Seed fail coverage (40% coverage)
      ansible.builtin.copy:
        content: |
          {
            "role": "coverage",
            "status": "completed",
            "coverage_pct": 40.0,
            "modules_below_threshold": ["module_a", "module_b", "module_c"]
          }
        dest: "{{ artifact_base }}/fail/coverage.json"
        mode: "0644"

    - name: Seed fail flaky artifact (5 flaky tests)
      ansible.builtin.copy:
        content: |
          {
            "role": "flaky",
            "status": "completed",
            "flaky_tests": [
              {"name": "test_a", "flap_count": 5},
              {"name": "test_b", "flap_count": 4},
              {"name": "test_c", "flap_count": 3},
              {"name": "test_d", "flap_count": 2},
              {"name": "test_e", "flap_count": 1}
            ]
          }
        dest: "{{ artifact_base }}/fail/flaky.json"
        mode: "0644"

---
# Exercise the REAL gludd_metrics module against the mock daemon.
- name: Converge - load metrics from the mock daemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8794', true) }}"
  tasks:
    - name: Call gludd_metrics against the mock daemon
      general_ludd.agent.gludd_metrics:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
      register: metrics_result

    - name: Persist the injected gludd_metrics facts for verify
      ansible.builtin.copy:
        content: "{{ ansible_facts['gludd_metrics'] | to_nice_json }}"
        dest: "/tmp/gludd-mock-{{ mock_port }}-metrics.json"
        mode: "0644"

    - name: Show injected metrics facts
      ansible.builtin.debug:
        var: ansible_facts['gludd_metrics']

---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8803"
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # release_build: enable_build=false so no actual build runs; report-only path.
  # Non-idempotent if enable_build=true (version stamp + artifact), but with
  # enable_build=false the role only writes a dry-run artifact — idempotent.
  test_sequence:
    - syntax
    - prepare
    - converge
    - verify

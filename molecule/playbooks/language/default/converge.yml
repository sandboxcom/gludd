---
- name: Converge - language collection
  hosts: localhost
  connection: local
  gather_facts: false
  force_handlers: true
  vars:
    molecule_mock_daemon_psk: "molecule-language-psk"
    language_artifact_root: "/tmp/gludd-molecule-language"
  handlers:
    - name: Stop scenario-owned mock daemon
      ansible.builtin.include_tasks: >-
        {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/mock_daemon_stop.yml
  tasks:
    - name: Start scenario-owned mock daemon
      ansible.builtin.include_tasks: >-
        {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/mock_daemon_start.yml

    - name: Invoke bom_detect
      ansible.builtin.include_role:
        name: general_ludd.language.bom_detect
      vars:
        input_bytes: "efbbbf48656c6c6f"
        strip_bom: true
        artifact_dir: "{{ language_artifact_root }}/bom-detect"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke encoding_detect
      ansible.builtin.include_role:
        name: general_ludd.language.encoding_detect
      vars:
        input_bytes: "48656c6c6f"
        target_encoding: "utf-16"
        detect_mojibake: true
        artifact_dir: "{{ language_artifact_root }}/encoding-detect"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke font_analyze
      ansible.builtin.include_role:
        name: general_ludd.language.font_analyze
      vars:
        font_file: ""
        check_tables: false
        check_metrics: false
        check_features: false
        check_variable: false
        check_monospace: false
        check_web_font: false
        artifact_dir: "{{ language_artifact_root }}/font-analyze"

    - name: Invoke homoglyph_scan
      ansible.builtin.include_role:
        name: general_ludd.language.homoglyph_scan
      vars:
        input_text: "Hello"
        check_confusables: true
        check_invisible: true
        check_bidi: true
        check_mixed_script: true
        artifact_dir: "{{ language_artifact_root }}/homoglyph-scan"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Create i18n source directory
      ansible.builtin.file:
        path: "{{ language_artifact_root }}/i18n-source"
        state: directory
        mode: "0755"

    - name: Write sample source file with gettext calls
      ansible.builtin.copy:
        dest: "{{ language_artifact_root }}/i18n-source/main.py"
        content: |
          _("Hello World")
          _("Welcome")
          ngettext("item", "items", 5)
        mode: "0644"

    - name: Invoke i18n_extract
      ansible.builtin.include_role:
        name: general_ludd.language.i18n_extract
      vars:
        source_dir: "{{ language_artifact_root }}/i18n-source"
        output_dir: "{{ language_artifact_root }}/i18n-output"
        artifact_dir: "{{ language_artifact_root }}/i18n-extract"

    - name: Invoke locale_format
      ansible.builtin.include_role:
        name: general_ludd.language.locale_format
      vars:
        locale: "de-DE"
        value: "1234.56"
        value_type: "number"
        artifact_dir: "{{ language_artifact_root }}/locale-format"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke phonetic_transcribe
      ansible.builtin.include_role:
        name: general_ludd.language.phonetic_transcribe
      vars:
        input_text: "HELLO WORLD"
        method: "arpabet"
        cmu_dict_lookup: true
        artifact_dir: "{{ language_artifact_root }}/phonetic-transcribe"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke unicode_analyze
      ansible.builtin.include_role:
        name: general_ludd.language.unicode_analyze
      vars:
        input_text: "Hello 😀 café"
        include_codepoints: true
        include_normalization: true
        include_grapheme_clusters: false
        include_surrogates: true
        include_utf_encodings: true
        include_version_info: false
        artifact_dir: "{{ language_artifact_root }}/unicode-analyze"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke language_detect
      ansible.builtin.include_role:
        name: general_ludd.language.language_detect
      vars:
        input_text: "Hello world"
        artifact_dir: "{{ language_artifact_root }}/language-detect"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke translate
      ansible.builtin.include_role:
        name: general_ludd.language.translate
      vars:
        input_text: "Hello"
        source_language: "auto"
        target_language: "fr"
        artifact_dir: "{{ language_artifact_root }}/translate"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

    - name: Invoke transliterate
      ansible.builtin.include_role:
        name: general_ludd.language.transliterate
      vars:
        input_text: "Hello"
        target_script: "Latin"
        scheme: ""
        artifact_dir: "{{ language_artifact_root }}/transliterate"
        daemon_url: "{{ mock_daemon_url }}"
        psk: "{{ molecule_mock_daemon_psk }}"

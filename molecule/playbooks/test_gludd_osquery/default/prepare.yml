---
# gludd_osquery runs `osqueryi --json <query>`. A real osquery binary is not
# assumed in CI, so we drop a tiny fake `osqueryi` that prints canned JSON rows
# regardless of the query, and start the mock daemon (required by the
# test_module_scenarios_start_the_mock_daemon coverage check + readiness sentinel).
- name: Prepare - write fake osqueryi + start mock daemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8779', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8779', true) }}.pid"
    fake_bin: "/tmp/gludd-fake-osqueryi-{{ mock_port }}"

  tasks:
    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ (lookup('env', 'VIRTUAL_ENV') + '/bin/python3') if lookup('env', 'VIRTUAL_ENV') else 'python3' }}
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    - name: Write a fake osqueryi that prints canned JSON rows
      ansible.builtin.copy:
        dest: "{{ fake_bin }}"
        mode: "0755"
        content: |
          #!/bin/sh
          # Fake osqueryi for molecule: ignores the query, prints two rows as JSON.
          if [ "$1" = "--version" ]; then
            echo "osqueryi version 5.10.2 (fake)"
            exit 0
          fi
          printf '[\n{"pid":"1","name":"init"},\n{"pid":"42","name":"python3"}\n]\n'

---
- name: Verify native git-release artifact role executed
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8864', true) }}"
    out_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/.molecule-git-release-{{ mock_port }}"
    marker: "{{ out_dir }}/artifact_verify_ran.ok"
  tasks:
    - name: Assert collection galaxy.yml is discoverable
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/git_release/galaxy.yml"
      register: galaxy_stat
      failed_when: not galaxy_stat.stat.exists

    - name: Assert artifact_verify role tasks are discoverable
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/collections/ansible_collections/general_ludd/git_release/roles/artifact_verify/tasks/main.yml"
      register: role_stat
      failed_when: not role_stat.stat.exists

    - name: Assert execution marker present
      ansible.builtin.stat:
        path: "{{ marker }}"
      register: marker_stat
      failed_when: not marker_stat.stat.exists

    - name: Report
      ansible.builtin.debug:
        msg: "git_release.artifact_verify executed natively; collection discoverable."

    # ---- cleanup ----
    - name: Remove marker dir
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: absent
      failed_when: false

---
# gludd_worktree runs REAL git worktree operations. Prepare creates a throwaway
# git repo with an initial commit. The mock daemon is also started (coverage policy).
- name: Prepare - throwaway git repo + mock daemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8780', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8780', true) }}.pid"
    repo_path: "/tmp/gludd-worktree-repo-{{ mock_port }}"
    worktree_path: "/tmp/gludd-worktree-wt-{{ mock_port }}"

  tasks:
    - name: Remove any stale throwaway repos and worktrees
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ repo_path }}"
        - "{{ worktree_path }}"

    - name: Create throwaway git repo with an initial commit
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p "{{ repo_path }}"
          cd "{{ repo_path }}"
          git init -q
          git config user.email "mock@molecule.local"
          git config user.name "Molecule Mock"
          git config commit.gpgsign false
          echo "seed" > README.md
          git add README.md
          git commit -q -m "seed commit"
      changed_when: true

---
# Run the REAL velocity_report role against the mock daemon.
- name: Converge - run velocity_report role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8823', true) }}"
  tasks:
    - name: Invoke velocity_report (window=5)
      ansible.builtin.include_role:
        name: general_ludd.agent.velocity_report
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-velocity-report-{{ mock_port }}"
        window: 5

---
- name: Verify - ai_parallel_dispatch fanned out, barrier-joined, satisfied join
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8851', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8851', true) }}.pid"
    artifact: "/tmp/gludd-ai-parallel-dispatch-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8851', true) }}/ai_parallel_dispatch.json"
  tasks:
    - name: Assert JSON artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: "{{ not art.stat.exists }}"

    - name: Load JSON artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse JSON artifact
      ansible.builtin.set_fact:
        result: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert dispatch + barrier-join result fields
      ansible.builtin.assert:
        that:
          - result.role == 'ai_parallel_dispatch'
          - result.join_policy == 'required'
          - result.max_in_flight | int == 2
          - result.dispatched | length == 5
          # Required subset must have returned for the join to be satisfied.
          - result.required | sort == ['planner', 'reviewer'] | sort
          - result.required_returned | sort == ['planner', 'reviewer'] | sort
          - result.satisfied | bool
          # Each returned call carries the mock daemon's text + usage.
          - result.results.planner.text is defined
          - "'mock-daemon' in result.results.planner.text"
          - result.results.planner.usage.total_tokens | int == 15
          - result.results.reviewer.usage.total_tokens | int == 15
        fail_msg: "ai_parallel_dispatch artifact wrong: {{ result }}"
        success_msg: >-
          ai_parallel_dispatch: 5 calls fanned out (max_in_flight=2),
          required subset {{ result.required_returned }} barrier-joined,
          join '{{ result.join_policy }}' satisfied.

    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-ai-parallel-dispatch-{{ mock_port }}"
        state: absent
      failed_when: false

---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8851"
  playbooks:
    destroy: default/destroy.yml
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # Model fan-out is intentionally non-idempotent (each call is changed=true) —
  # skip the idempotence check, like test_gludd_model_call.
  test_sequence:
    - destroy
    - syntax
    - prepare
    - converge
    - verify
    - destroy

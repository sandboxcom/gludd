---
# Molecule scenario: full daemon lifecycle.
#
# Exercises the REAL `./gludd daemon` command end-to-end:
#   start -> health probe -> API calls -> SIGTERM -> clean exit -> cleanup.
#
# Unlike the mock_daemon scenarios (which stand up server.py to exercise the
# gludd_* ansible modules against canned responses), this scenario drives the
# real daemon binary so its lifespan, signal handling, and shutdown hygiene
# are observed directly. Side effects checked in verify.yml:
#   - no zombie processes after SIGTERM
#   - no leftover socket files
#   - log output contains no tracebacks
#   - PID file (if any) is cleaned up
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    # Isolate this scenario from any host daemon on the default 8000 port.
    GLUDD_DAEMON_LIFECYCLE_PORT: "8767"
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
# The converge playbook is inherently non-idempotent: it starts a daemon,
# exercises it, sends SIGTERM, and verifies cleanup. Re-running converge
# would start a new daemon, kill it again, and always report changed.
scenario:
  test_sequence:
    - syntax
    - prepare
    - converge
    - verify

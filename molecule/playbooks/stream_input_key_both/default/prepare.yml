---
# Start mock daemon + seed /tmp/fixture-both.log with TRIGGER-delimited segments.
- name: Prepare - mock daemon + seeded fixture log (both mode)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8845', true) }}"
    pidfile: "/tmp/gludd-mock-{{ mock_port }}.pid"
    fixture_log: "/tmp/gludd-input-key-both-fixture.log"
  tasks:
    - name: Kill any stale mock daemon on this port
      ansible.builtin.shell:
        cmd: >-
          pid="{{ pidfile }}" &&
          if [ -f "$pid" ]; then kill "$(cat $pid)" 2>/dev/null || true; rm -f "$pid"; fi;
          lsof -ti tcp:{{ mock_port }} 2>/dev/null | xargs -r kill -9 2>/dev/null || true
      changed_when: false
      failed_when: false

    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ lookup('env', 'VIRTUAL_ENV') | default('/usr', true) }}/bin/python3
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    - name: Seed fixture log with TRIGGER-delimited segments
      ansible.builtin.copy:
        content: |
          INFO x
          INFO y
          TRIGGER
          INFO z
          INFO w
          TRIGGER
          INFO a
        dest: "{{ fixture_log }}"
        mode: "0644"

    - name: Confirm fixture exists
      ansible.builtin.stat:
        path: "{{ fixture_log }}"
      register: fix_stat
      failed_when: not fix_stat.stat.exists

---
# Molecule scenario: smoke-test the BUILT gludd binary inside a Linux container.
#
# Runs the PyInstaller single-file bundle (dist/gludd, from `make
# build-executable`) inside an ubuntu:24.04 container to verify the binary:
#   - boots with no import / missing-file errors,
#   - answers `version` / `--help` / `project paths`,
#   - starts its daemon and serves `/healthz`,
#   - accepts a job via POST /api/todos,
#   - exits cleanly on an invalid flag and on a port clash.
#
# NOTE on driver choice: gludd's CLI has no `--version` flag (use the `version`
# subcommand), no `daemon start` subcommand (use `daemon`), exposes health at
# `/healthz` (not `/health`), and has no `/api/playbook/run` endpoint (jobs are
# submitted via POST /api/todos). This scenario adapts the generic task brief
# to those real surfaces so the smoke test is functional.
#
# REQUIRES: Docker on the runner plus the separately packaged
# molecule-plugins[docker] dependency. See this scenario's README.md for
# official installation guidance and long-lived community driver-discovery
# reports. Run via `make molecule-test SCENARIO=binary_smoke_linux`.
driver:
  name: docker
platforms:
  - name: gludd-test-linux
    image: ubuntu:24.04
    # ubuntu:24.04's default CMD exits immediately; keep the container alive
    # for the duration of the scenario so ansible can run tasks inside it.
    command: "sleep infinity"
    # The scenario validates Gludd's binary, not a generated Molecule base
    # image.  Use Ubuntu directly and bootstrap Python via raw transport in the
    # first converge play so preparation remains small and observable.
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: default/cleanup.yml
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

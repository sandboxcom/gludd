---
# Verify: assert every binary-smoke invariant against the outputs persisted by
# converge.yml. Runs inside the same container (the backgrounded daemon from
# converge is still up).
- name: Verify - gludd binary smoke invariants
  hosts: all
  gather_facts: false
  become: false
  force_handlers: true
  vars:
    gludd_bin: /usr/local/bin/gludd
    daemon_host: "127.0.0.1"
    daemon_psk: "binary-smoke-linux-test-psk"
    daemon_pidfile: /tmp/gludd-binary-smoke-daemon.json
    daemon_async_file: /tmp/gludd-binary-smoke-async-id
    daemon_endpoint_file: /tmp/gludd-daemon-endpoint.json
  handlers:
    - name: Stop packaged binary daemon
      ansible.builtin.include_tasks: >-
        {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/playbooks/binary_smoke_linux/default/stop_daemon.yml
  tasks:
    - name: Load the packaged daemon endpoint manifest
      ansible.builtin.slurp:
        src: "{{ daemon_endpoint_file }}"
      register: _binary_daemon_manifest_raw

    - name: Decode the packaged daemon endpoint contract
      ansible.builtin.set_fact:
        binary_daemon_manifest: >-
          {{ _binary_daemon_manifest_raw.content | b64decode | from_json }}

    - name: Validate and expose the discovered endpoint
      ansible.builtin.assert:
        that:
          - binary_daemon_manifest.base_url is match('^http://127[.]0[.]0[.]1:[1-9][0-9]*$')
          - binary_daemon_manifest.port | int > 0
          - binary_daemon_manifest.port | int < 65536
          - binary_daemon_manifest.pid | string is match('^[1-9][0-9]*$')
          - binary_daemon_manifest.executable == gludd_bin
          - binary_daemon_manifest.process_start_ticks | string is match('^[1-9][0-9]*$')
          - binary_daemon_manifest.pid_file == daemon_pidfile
          - binary_daemon_manifest.async_job_id | length > 0
        fail_msg: "packaged daemon endpoint manifest is malformed"

    - name: Set the verified endpoint for all smoke assertions
      ansible.builtin.set_fact:
        daemon_url: "{{ binary_daemon_manifest.base_url }}"
        daemon_port: "{{ binary_daemon_manifest.port | int }}"

    - name: Arm guaranteed packaged daemon teardown
      ansible.builtin.command:
        argv:
          - /bin/true
      changed_when: true
      notify: Stop packaged binary daemon

    # ===================================================================
    # CLI outputs: version / help / project paths
    # ===================================================================
    - name: Load persisted CLI outputs
      ansible.builtin.slurp:
        src: /tmp/gludd-cli-outputs.txt
      register: _cli_raw

    - name: Parse CLI outputs
      ansible.builtin.set_fact:
        cli_outputs: "{{ _cli_raw.content | b64decode }}"

    - name: Assert version is a SemVer string
      ansible.builtin.assert:
        that:
          - "'general-ludd-agent' in cli_outputs"
          - "cli_outputs | regex_search('\\\\d+\\\\.\\\\d+\\\\.\\\\d+') | length > 0"
        fail_msg: "version did not print a SemVer: {{ cli_outputs }}"
        success_msg: "version printed a SemVer"

    - name: Assert --help lists all top-level subcommands
      ansible.builtin.assert:
        that:
          - "'daemon' in cli_outputs"
          - "'project' in cli_outputs"
          - "'version' in cli_outputs"
          - "'models' in cli_outputs"
        fail_msg: "--help missing expected subcommands: {{ cli_outputs }}"
        success_msg: "--help lists daemon/project/version/models (+more)"

    - name: Assert binary reports the external collection plane
      ansible.builtin.assert:
        that:
          - "'Collection search path' in cli_outputs"
          - "'=== project paths (rc=0) ===' in cli_outputs"
          - "cli_outputs | regex_findall('\\(missing\\)') | length == 1"
          - "(cli_outputs | regex_search('BUNDLED.*collections.*\\(missing\\)')) is not none"
        fail_msg: >
          'gludd project paths' did not report the external collection plane cleanly:
          {{ cli_outputs }}
        success_msg: "project paths reported the external collection plane"

    - name: Assert no Python traceback / import / missing-file errors in CLI output
      ansible.builtin.assert:
        that:
          - "'Traceback' not in cli_outputs"
          - "'ModuleNotFoundError' not in cli_outputs"
          - "'ImportError' not in cli_outputs"
          - "'Missing base YAML definition file' not in cli_outputs"
          - "'No module named' not in cli_outputs"
        fail_msg: "CLI output contained a boot/import error: {{ cli_outputs }}"
        success_msg: "no traceback / ImportError / ModuleNotFoundError / missing-base-YAML"

    # ===================================================================
    # Invalid flag error path
    # ===================================================================
    - name: Load persisted invalid-flag result
      ansible.builtin.slurp:
        src: /tmp/gludd-bad-flag.txt
      register: _bad_raw

    - name: Parse invalid-flag result
      ansible.builtin.set_fact:
        bad_flag_text: "{{ _bad_raw.content | b64decode }}"

    - name: Assert invalid flag exits non-zero with a clean (non-traceback) error
      ansible.builtin.assert:
        that:
          # rc= line is non-zero (argparse rejects unknown flags with exit 2).
          - "(bad_flag_text | regex_search('rc=[1-9][0-9]*')) is not none"
          - "'Traceback' not in bad_flag_text"
          - "'ModuleNotFoundError' not in bad_flag_text"
        fail_msg: "invalid-flag did not fail cleanly: {{ bad_flag_text }}"
        success_msg: "invalid flag rejected cleanly (non-zero, no traceback)"

    # ===================================================================
    # Daemon health: /healthz still 200
    # ===================================================================
    - name: GET /healthz (daemon must still be answering)
      ansible.builtin.uri:
        url: "{{ daemon_url }}/healthz"
        method: GET
        status_code: [200]
        return_content: true
      register: health_check

    - name: Assert health endpoint returns 200
      ansible.builtin.assert:
        that:
          - health_check.status == 200
        fail_msg: "healthz did not return 200: status={{ health_check.status }}"
        success_msg: "healthz returned 200"

    # ===================================================================
    # Job submission: daemon accepted the trivial job
    # ===================================================================
    - name: Load persisted job submission result
      ansible.builtin.slurp:
        src: /tmp/gludd-job-submit.json
      register: _job_raw

    - name: Parse job submission result
      ansible.builtin.set_fact:
        job_result: "{{ _job_raw.content | b64decode | from_json }}"

    - name: Assert the daemon processed the job request (todo_id present)
      ansible.builtin.assert:
        that:
          - "job_result.todo_id is defined or job_result['todo_id'] is defined"
          - "'Traceback' not in (job_result | string)"
        fail_msg: "daemon did not accept the job: {{ job_result }}"
        success_msg: "daemon accepted the trivial job via POST /api/todos"

    # ===================================================================
    # Occupied-port error path
    # ===================================================================
    - name: Load persisted port-clash result
      ansible.builtin.slurp:
        src: /tmp/gludd-port-clash.txt
      register: _clash_raw

    - name: Parse port-clash result
      ansible.builtin.set_fact:
        clash_text: "{{ _clash_raw.content | b64decode }}"

    - name: Assert the port-clash was handled gracefully
      ansible.builtin.assert:
        that:
          # Either it exited non-zero, or it logged an address-in-use signal —
          # and either way it MUST NOT have produced an uncaught traceback.
          - >
            (clash_text | regex_search('EXIT_RC=[1-9][0-9]*')) is not none
            or ('in use' in (clash_text | lower)) or ('address already' in (clash_text | lower))
          - "'Traceback' not in clash_text"
        fail_msg: "port clash was not handled gracefully: {{ clash_text }}"
        success_msg: "port clash handled gracefully (non-zero or address-in-use, no traceback)"

    # ===================================================================
    # Daemon async record: process is live and no traceback surfaced
    # ===================================================================
    - name: Inspect the still-running daemon async record
      ansible.builtin.async_status:
        jid: "{{ binary_daemon_manifest.async_job_id }}"
        mode: status
      register: binary_daemon_status
      changed_when: false
      failed_when: binary_daemon_status.finished | bool

    - name: Assert the daemon process has emitted no uncaught traceback
      ansible.builtin.assert:
        that:
          - "'Traceback (most recent call last)' not in (binary_daemon_status.stdout | default(''))"
          - "'Traceback (most recent call last)' not in (binary_daemon_status.stderr | default(''))"
        fail_msg: "packaged daemon async output contained a traceback"
        success_msg: "packaged daemon async output is traceback-free"

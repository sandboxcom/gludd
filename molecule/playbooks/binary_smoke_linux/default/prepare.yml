---
# Prepare (runs on the CONTROLLER, before the container consumes the binary):
# verify the top-level Make target produced a genuine Linux binary at
# dist/linux/gludd. The build runs before Molecule so its progress streams
# directly instead of being buffered inside an Ansible command task.
- name: Prepare - ensure the built gludd binary exists on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    binary_path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/dist/linux/gludd"
  tasks:
    - name: Sanity-check the project directory is set
      ansible.builtin.assert:
        that:
          - project_dir | length > 0
          - project_dir != "None"
        fail_msg: "MOLECULE_PROJECT_DIRECTORY is unset; cannot build the Linux binary."

    - name: Confirm dist/linux/gludd exists
      ansible.builtin.stat:
        path: "{{ binary_path }}"
      register: _bin

    - name: Assert the binary is present and executable
      ansible.builtin.assert:
        that:
          - _bin.stat.exists | bool
          - _bin.stat.executable | bool
        fail_msg: >
          dist/linux/gludd not found or not executable after build.
          Run `make build-linux-executable` on the controller and re-run this scenario.

    - name: Report binary path
      ansible.builtin.debug:
        msg: "gludd Linux binary ready: {{ binary_path }}"

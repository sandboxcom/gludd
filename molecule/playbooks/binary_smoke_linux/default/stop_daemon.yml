---
- name: Inspect the packaged daemon PID record
  ansible.builtin.stat:
    path: "{{ daemon_pidfile }}"
  register: _binary_daemon_pidfile

- name: Load the packaged daemon PID record
  ansible.builtin.slurp:
    src: "{{ daemon_pidfile }}"
  register: _binary_daemon_pid_raw
  when: _binary_daemon_pidfile.stat.exists

- name: Decode the packaged daemon ownership record
  ansible.builtin.set_fact:
    _binary_daemon_pid_record: >-
      {{ _binary_daemon_pid_raw.content | b64decode | from_json }}
  when: _binary_daemon_pidfile.stat.exists

- name: Validate the packaged daemon ownership record
  ansible.builtin.assert:
    that:
      - _binary_daemon_pid_record is mapping
      - _binary_daemon_pid_record.pid | string is match('^[1-9][0-9]*$')
      - _binary_daemon_pid_record.pid | int == binary_daemon_manifest.pid | int
      - _binary_daemon_pid_record.daemon_url == daemon_url
      - binary_daemon_manifest.executable == gludd_bin
      - binary_daemon_manifest.process_start_ticks | string is match('^[1-9][0-9]*$')
    fail_msg: "binary smoke daemon PID record is malformed or belongs to another endpoint"
  when: _binary_daemon_pidfile.stat.exists

- name: Inspect only the PID named by the packaged daemon
  ansible.builtin.command:
    argv:
      - /bin/ps
      - -p
      - "{{ _binary_daemon_pid_record.pid | string }}"
      - -o
      - pid=
  register: _binary_daemon_ps
  changed_when: false
  failed_when: _binary_daemon_ps.rc not in [0, 1]
  when: _binary_daemon_pidfile.stat.exists

- name: Inspect the pinned packaged daemon start identity
  ansible.builtin.command:
    argv:
      - /bin/cat
      - "/proc/{{ _binary_daemon_pid_record.pid | string }}/stat"
  register: _binary_daemon_stat
  changed_when: false
  failed_when: _binary_daemon_stat.rc not in [0, 1]
  when:
    - _binary_daemon_pidfile.stat.exists
    - _binary_daemon_ps.rc == 0

- name: Inspect the pinned packaged daemon executable identity
  ansible.builtin.command:
    argv:
      - /usr/bin/readlink
      - -f
      - "/proc/{{ _binary_daemon_pid_record.pid | string }}/exe"
  register: _binary_daemon_executable
  changed_when: false
  failed_when: _binary_daemon_executable.rc not in [0, 1]
  when:
    - _binary_daemon_pidfile.stat.exists
    - _binary_daemon_ps.rc == 0

- name: Recheck the PID after packaged daemon identity inspection
  ansible.builtin.command:
    argv:
      - /bin/ps
      - -p
      - "{{ _binary_daemon_pid_record.pid | string }}"
      - -o
      - stat=
  register: _binary_daemon_final_ps
  changed_when: false
  failed_when: _binary_daemon_final_ps.rc not in [0, 1]
  when: _binary_daemon_pidfile.stat.exists

- name: Decode the current packaged daemon start identity
  ansible.builtin.set_fact:
    _binary_daemon_current_start_ticks: >-
      {{
        (
          _binary_daemon_stat.stdout
          | regex_replace('^.*[)]\\s+', '')
        ).split()[19]
      }}
  when:
    - _binary_daemon_pidfile.stat.exists
    - _binary_daemon_ps.rc == 0
    - _binary_daemon_stat.rc == 0

- name: Establish exact packaged daemon ownership
  ansible.builtin.set_fact:
    _binary_daemon_pid_live: >-
      {{
        _binary_daemon_final_ps.rc == 0
        and 'Z' not in (_binary_daemon_final_ps.stdout | trim)
      }}
    _binary_daemon_start_ticks_match: >-
      {{
        (_binary_daemon_stat.rc | default(1)) == 0
        and (_binary_daemon_current_start_ticks | default('') | string)
          == (binary_daemon_manifest.process_start_ticks | string)
      }}
    _binary_daemon_executable_matches: >-
      {{
        (_binary_daemon_executable.rc | default(1)) == 0
        and (_binary_daemon_executable.stdout | default('') | trim)
          == binary_daemon_manifest.executable
        and binary_daemon_manifest.executable == gludd_bin
      }}
    _binary_daemon_owned: >-
      {{
        _binary_daemon_final_ps.rc == 0
        and 'Z' not in (_binary_daemon_final_ps.stdout | trim)
        and (_binary_daemon_stat.rc | default(1)) == 0
        and (_binary_daemon_current_start_ticks | default('') | string)
          == (binary_daemon_manifest.process_start_ticks | string)
        and (_binary_daemon_executable.rc | default(1)) == 0
        and (_binary_daemon_executable.stdout | default('') | trim)
          == binary_daemon_manifest.executable
        and binary_daemon_manifest.executable == gludd_bin
      }}
  when: _binary_daemon_pidfile.stat.exists

- name: Refuse to signal a reused or foreign PID
  ansible.builtin.assert:
    that:
      - not _binary_daemon_pid_live | bool or _binary_daemon_owned | bool
    fail_msg: >-
      binary smoke daemon PID was reused by a foreign process:
      pid_live={{ _binary_daemon_pid_live | bool }},
      expected_start_ticks={{ binary_daemon_manifest.process_start_ticks }},
      observed_start_ticks={{ _binary_daemon_current_start_ticks | default('unavailable') }},
      expected_executable={{ binary_daemon_manifest.executable }},
      observed_executable={{ _binary_daemon_executable.stdout | default('unavailable') | trim }}
  when: _binary_daemon_pidfile.stat.exists

- name: Stop only the proven packaged daemon
  ansible.builtin.command:
    argv:
      - /bin/kill
      - -TERM
      - "{{ _binary_daemon_pid_record.pid | string }}"
  changed_when: true
  when:
    - _binary_daemon_pidfile.stat.exists
    - _binary_daemon_owned | bool

- name: Prove the packaged daemon endpoint is closed
  ansible.builtin.wait_for:
    host: "{{ daemon_host }}"
    port: "{{ daemon_port | int }}"
    state: stopped
    timeout: 15
  when:
    - _binary_daemon_pidfile.stat.exists
    - not _binary_daemon_pid_live | bool or _binary_daemon_owned | bool

- name: Prove the daemon wrapper released its PID record
  ansible.builtin.wait_for:
    path: "{{ daemon_pidfile }}"
    state: absent
    timeout: 15
  when:
    - _binary_daemon_pidfile.stat.exists
    - not _binary_daemon_pid_live | bool or _binary_daemon_owned | bool

- name: Remove the completed Ansible async record
  ansible.builtin.async_status:
    jid: "{{ binary_daemon_manifest.async_job_id }}"
    mode: cleanup
  changed_when: false
  when: binary_daemon_manifest.async_job_id | default('') | length > 0

- name: Remove only binary-smoke lifecycle files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ daemon_async_file }}"
    - "{{ daemon_endpoint_file }}"
    - /tmp/gludd-binary-smoke-clash.json
  loop_control:
    label: "{{ item }}"

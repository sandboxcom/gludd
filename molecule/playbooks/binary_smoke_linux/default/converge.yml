---
# Converge: install + exercise the built gludd binary inside the Linux container.
#
# Coverage map (each step persists its output to /tmp for verify.yml):
#   1. apt: ca-certificates + curl
#   2. copy dist/gludd into the container + chmod +x
#   3. gludd version            -> SemVer
#   4. gludd --help             -> subcommand listing
#   5. gludd project paths      -> bundled path resolution
#   6. ERROR: gludd --invalid-flag -> non-zero, clean argparse error
#   7. start gludd daemon (backgrounded) + poll /healthz up to 30s
#   8. POST /api/todos          -> daemon accepts a trivial job
#   9. ERROR: second gludd daemon on the occupied port -> graceful failure
- name: Bootstrap Python for Ansible modules
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Install Python when the stock Ubuntu image does not provide it
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          exit 0
        fi
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y python3
      register: python_bootstrap
      changed_when: python_bootstrap.stdout | length > 0

- name: Converge - smoke test the gludd binary in a Linux container
  hosts: all
  gather_facts: true
  become: false
  vars:
    gludd_bin: /usr/local/bin/gludd
    daemon_host: "127.0.0.1"
    daemon_psk: "binary-smoke-linux-test-psk"
    daemon_pidfile: /tmp/gludd-binary-smoke-daemon.json
    daemon_async_file: /tmp/gludd-binary-smoke-async-id
    daemon_endpoint_file: /tmp/gludd-daemon-endpoint.json
    host_binary: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/dist/linux/gludd"
  tasks:
    - name: Install minimal runtime deps (ca-certificates, curl)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        update_cache: true
        cache_valid_time: 600

    - name: Copy the built gludd binary into the container
      ansible.builtin.copy:
        src: "{{ host_binary }}"
        dest: "{{ gludd_bin }}"
        mode: "0755"
        owner: root
        group: root

    # The copy sets mode 0755 explicitly; this chmod is belt-and-suspenders so
    # a binary that arrives with a strange umask is still executable.
    - name: Ensure the binary is executable (chmod +x)
      ansible.builtin.file:
        path: "{{ gludd_bin }}"
        mode: "0755"

    # --- (3) version: prints "general-ludd-agent <semver>" -----------------
    - name: Run 'gludd version'
      ansible.builtin.command: "{{ gludd_bin }} version"
      register: gludd_version
      changed_when: false

    # --- (4) --help: lists all subcommands ---------------------------------
    - name: Run 'gludd --help'
      ansible.builtin.command: "{{ gludd_bin }} --help"
      register: gludd_help
      changed_when: false

    # --- (5) project paths: resolves bundled config/templates/playbooks dirs
    - name: Run 'gludd project paths'
      ansible.builtin.command: "{{ gludd_bin }} project paths"
      register: gludd_paths
      changed_when: false
      failed_when: false

    - name: Persist CLI outputs for verify
      ansible.builtin.copy:
        content: |
          === version (rc={{ gludd_version.rc }}) ===
          {{ gludd_version.stdout }}
          {{ gludd_version.stderr }}
          === --help (rc={{ gludd_help.rc }}) ===
          {{ gludd_help.stdout }}
          {{ gludd_help.stderr }}
          === project paths (rc={{ gludd_paths.rc }}) ===
          {{ gludd_paths.stdout }}
          {{ gludd_paths.stderr }}
        dest: /tmp/gludd-cli-outputs.txt
        mode: "0644"

    # --- (6) ERROR PATH: invalid flag --------------------------------------
    # argparse must reject an unknown flag with exit code 2 and a clean
    # "error: unrecognized arguments" message — NOT a Python traceback.
    - name: Run 'gludd --invalid-flag' (expect non-zero, clean error)
      ansible.builtin.command: "{{ gludd_bin }} --invalid-flag"
      register: gludd_bad_flag
      changed_when: false
      failed_when: false

    - name: Persist invalid-flag result
      ansible.builtin.copy:
        content: "rc={{ gludd_bad_flag.rc }}\nstdout={{ gludd_bad_flag.stdout }}\nstderr={{ gludd_bad_flag.stderr }}\n"
        dest: /tmp/gludd-bad-flag.txt
        mode: "0644"

    # --- (7) bounded daemon lease + exact readiness ------------------------
    - name: Allocate a private port in the container network namespace
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - -c
          - >-
            import socket;
            candidate = socket.socket();
            candidate.bind(('127.0.0.1', 0));
            print(candidate.getsockname()[1]);
            candidate.close()
      register: allocated_daemon_port
      changed_when: false

    - name: Derive the private daemon endpoint
      ansible.builtin.set_fact:
        daemon_port: "{{ allocated_daemon_port.stdout | int }}"
        daemon_url: "http://127.0.0.1:{{ allocated_daemon_port.stdout | int }}"

    - name: Start the packaged daemon with a bounded lease
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --signal=TERM
          - --kill-after=10s
          - 900s
          - "{{ gludd_bin }}"
          - daemon
          - --host
          - "{{ daemon_host }}"
          - --port
          - "{{ daemon_port | string }}"
          - --pid-file
          - "{{ daemon_pidfile }}"
      environment:
        GLUDD_AUTH_PSK: "{{ daemon_psk }}"
      changed_when: true
      async: 910
      poll: 0
      register: binary_daemon_job

    - name: Persist the exact async job identifier
      ansible.builtin.copy:
        content: "{{ binary_daemon_job.ansible_job_id }}\n"
        dest: "{{ daemon_async_file }}"
        mode: "0600"

    - name: Wait for the daemon to publish its PID ownership record
      ansible.builtin.wait_for:
        path: "{{ daemon_pidfile }}"
        state: present
        timeout: 30

    - name: Load the packaged daemon PID ownership record
      ansible.builtin.slurp:
        src: "{{ daemon_pidfile }}"
      register: daemon_pid_record_raw

    - name: Decode the packaged daemon PID ownership record
      ansible.builtin.set_fact:
        daemon_pid_record: >-
          {{ daemon_pid_record_raw.content | b64decode | from_json }}

    - name: Capture the packaged daemon process start identity
      ansible.builtin.command:
        argv:
          - /bin/cat
          - "/proc/{{ daemon_pid_record.pid }}/stat"
      register: daemon_process_stat
      changed_when: false

    - name: Capture the packaged daemon executable identity
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - -f
          - "/proc/{{ daemon_pid_record.pid }}/exe"
      register: daemon_process_executable
      changed_when: false

    - name: Pin the packaged daemon process identity
      ansible.builtin.set_fact:
        daemon_process_start_ticks: >-
          {{
            (
              daemon_process_stat.stdout
              | regex_replace('^.*[)]\\s+', '')
            ).split()[19]
          }}

    - name: Validate the packaged daemon process identity
      ansible.builtin.assert:
        that:
          - daemon_pid_record.pid | string is match('^[1-9][0-9]*$')
          - daemon_pid_record.daemon_url == daemon_url
          - daemon_process_start_ticks | string is match('^[1-9][0-9]*$')
          - daemon_process_executable.stdout | trim == gludd_bin
        fail_msg: "packaged daemon process identity could not be pinned"

    - name: Wait for the private loopback socket to accept connections
      ansible.builtin.wait_for:
        host: "{{ daemon_host }}"
        port: "{{ daemon_port | int }}"
        state: started
        timeout: 30

    - name: Require one exact /healthz response
      ansible.builtin.uri:
        url: "{{ daemon_url }}/healthz"
        method: GET
        status_code: 200
        return_content: true
      register: health_wait
      changed_when: false
      failed_when: >-
        health_wait.status != 200
        or health_wait.json.status | default('') != 'healthy'

    - name: Persist endpoint and process ownership for verify
      ansible.builtin.copy:
        content: >-
          {{ {
            'async_job_id': binary_daemon_job.ansible_job_id,
            'base_url': daemon_url,
            'executable': daemon_process_executable.stdout | trim,
            'pid': daemon_pid_record.pid | int,
            'pid_file': daemon_pidfile,
            'port': daemon_port | int,
            'process_start_ticks': daemon_process_start_ticks
          } | to_nice_json }}
        dest: "{{ daemon_endpoint_file }}"
        mode: "0600"

    # --- (8) job submission via the daemon API -----------------------------
    # There is no /api/playbook/run endpoint; jobs are submitted as todos and
    # the event loop maps work_type -> playbook. Verifying the daemon ACCEPTS
    # + QUEUES the job proves request processing end-to-end.
    - name: Submit a trivial job (POST /api/todos)
      ansible.builtin.uri:
        url: "{{ daemon_url }}/api/todos"
        method: POST
        headers:
          Authorization: "Bearer {{ daemon_psk }}"
        body_format: json
        body:
          title: "binary-smoke-linux-noop"
          work_type: "noop"
          queue: "core"
          priority: "medium"
        status_code: [200, 201]
        return_content: true
      register: job_submit

    - name: Persist job submission result
      ansible.builtin.copy:
        content: "{{ job_submit.json | default({}) | to_nice_json }}"
        dest: /tmp/gludd-job-submit.json
        mode: "0644"

    # --- (9) ERROR PATH: occupied port -------------------------------------
    # A second daemon binding the SAME port must fail (non-zero) and do so
    # gracefully — no uncaught Python traceback.
    - name: Run a second daemon on the occupied port (expect graceful failure)
      ansible.builtin.command:
        argv:
          - "{{ gludd_bin }}"
          - daemon
          - --host
          - "{{ daemon_host }}"
          - --port
          - "{{ daemon_port | string }}"
          - --pid-file
          - /tmp/gludd-binary-smoke-clash.json
      environment:
        GLUDD_AUTH_PSK: "{{ daemon_psk }}"
      register: port_clash
      changed_when: false
      failed_when: false

    - name: Persist port-clash result
      ansible.builtin.copy:
        content: |
          EXIT_RC={{ port_clash.rc }}
          stdout={{ port_clash.stdout }}
          stderr={{ port_clash.stderr }}
        dest: /tmp/gludd-port-clash.txt
        mode: "0644"

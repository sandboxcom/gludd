---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8897"
  playbooks:
    cleanup: "${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/cleanup.yml"
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # ornith_self_improve writes a patch + opens a PR + files a human-todo —
  # intentionally non-idempotent; skip idempotence.
  test_sequence:
    - cleanup
    - syntax
    - prepare
    - converge
    - verify
    - cleanup

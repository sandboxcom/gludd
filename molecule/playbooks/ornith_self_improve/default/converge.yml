---
- name: Converge - run ornith_self_improve role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8897', true) }}"
    mock_repo_path: "/tmp/gludd-ornith-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8897', true) }}"
  tasks:
    - name: Reset mock-daemon request log (isolate this role's endpoint hits)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/__requests/reset"
        method: POST
        status_code: 200

    - name: Invoke ornith_self_improve
      ansible.builtin.include_role:
        name: general_ludd.agent.ornith_self_improve
      vars:
        ornith_enabled: true
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        # The role auto-picks from the mock's rejected pairs (all 3 target
        # playbooks/agent_orchestrate.yml, so the rejection threshold is met).
        target_artifacts: []
        max_artifacts_per_run: 1
        require_minimum_rejection_count: 3
        lookback_days: 14
        repo_path: "{{ mock_repo_path }}"
        parent_agent_todo_id: "TODO-MOCK-OSI-1"
        artifact_dir: "/tmp/gludd-ornith-self-improve-{{ mock_port }}"

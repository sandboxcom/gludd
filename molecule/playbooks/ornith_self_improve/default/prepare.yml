---
- name: Prepare - mock daemon + throwaway git repo for ornith_self_improve
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8897', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8897', true) }}.pid"
    repo_path: "/tmp/gludd-ornith-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8897', true) }}"
  tasks:
    - name: Remove stale throwaway repo
      ansible.builtin.file:
        path: "{{ repo_path }}"
        state: absent

    - name: Create throwaway git repo with the target artifact already present
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p "{{ repo_path }}/playbooks"
          cd "{{ repo_path }}"
          git init -q
          git config user.email "mock@molecule.local"
          git config user.name "Molecule Mock"
          git config commit.gpgsign false
          echo "seed" > README.md
          cat > playbooks/agent_orchestrate.yml <<'YAML'
          ---
          - name: old agent orchestrate
            hosts: localhost
            gather_facts: false
            tasks:
              - name: placeholder
                ansible.builtin.debug:
                  msg: "old version"
          YAML
          git add .
          git commit -q -m "seed commit with target artifact"
        executable: /bin/bash
      changed_when: true

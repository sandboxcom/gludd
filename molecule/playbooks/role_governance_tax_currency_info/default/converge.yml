---
- name: Converge - run tax_currency_info governance role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8902', true) }}"
    stub_dir: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/default"
  tasks:
    - name: Invoke tax_currency_info role with stub module_util
      ansible.builtin.include_role:
        name: general_ludd.governance.tax_currency_info
      vars:
        tax_currency_info_enabled: true
        tax_currency_info_country: "US"
        tax_currency_info_list_countries: false
        tax_currency_info_output_dir: "/tmp/gludd-governance-tax-{{ mock_port }}"
        _tax_currency_module: "{{ stub_dir }}/tax_currency_stub.py"

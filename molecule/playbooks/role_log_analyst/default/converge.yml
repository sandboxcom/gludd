---
# Run the REAL log_analyst role against the mock daemon and fixture log.
- name: Converge - run log_analyst role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8845', true) }}"
  tasks:
    - name: Invoke log_analyst
      ansible.builtin.include_role:
        name: general_ludd.agent.log_analyst
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-log-analyst-{{ mock_port }}"
        log_source: "/tmp/gludd-log-analyst-fixture-{{ mock_port }}/agent.log"
        error_rate_threshold: 0.1
        cost_outlier_factor: 2.0

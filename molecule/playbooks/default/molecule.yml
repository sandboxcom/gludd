---
# Canonical discovery anchor for Molecule 26.x. Individual Gludd scenarios own
# their resources, so the default scenario deliberately has no lifecycle work.
shared_state: false
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
scenario:
  test_sequence: []

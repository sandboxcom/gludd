---
# Run the REAL story_create role against the mock daemon.
- name: Converge - run story_create role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8817', true) }}"
  tasks:
    - name: Invoke story_create (enable_model_call=false, write_back=false)
      ansible.builtin.include_role:
        name: general_ludd.agent.story_create
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-story-create-{{ mock_port }}"
        request_text: "As a developer I want to add integration tests so that the agent pipeline is fully validated"
        enable_model_call: false
        write_back: false

---
- name: Verify - gludd_observe completed bounded and failure-isolated fan-out
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8897', true) }}"
    daemon_url: "http://127.0.0.1:{{ mock_port }}"
    scenario_state_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/gludd-observe-runtime"
    result_file: "{{ scenario_state_dir }}/observe.json"
  tasks:
    - name: Inspect the private scenario directory
      ansible.builtin.stat:
        path: "{{ scenario_state_dir }}"
      register: state_dir_stat

    - name: Inspect the private result artifact
      ansible.builtin.stat:
        path: "{{ result_file }}"
      register: result_file_stat

    - name: Assert private lifecycle and artifact permissions
      ansible.builtin.assert:
        that:
          - state_dir_stat.stat.isdir | default(false)
          - state_dir_stat.stat.mode == '0700'
          - result_file_stat.stat.isreg | default(false)
          - result_file_stat.stat.mode == '0600'
        fail_msg: "gludd_observe Molecule state is not private"

    - name: Load the deterministic operation summary
      ansible.builtin.slurp:
        src: "{{ result_file }}"
      register: result_raw

    - name: Parse the operation summary
      ansible.builtin.set_fact:
        observe_summary: "{{ result_raw.content | b64decode | from_json }}"

    - name: Read the mock daemon request log
      ansible.builtin.uri:
        url: "{{ daemon_url }}/__requests"
        method: GET
        return_content: true
        status_code: 200
      register: request_log
      changed_when: false

    - name: Assert result semantics and real endpoint fan-out
      ansible.builtin.assert:
        that:
          - observe_summary.query_timestamps == [10.0, 20.0, 30.0]
          - observe_summary.timeline_sources == ['prod-metrics', 'prod-logs', 'prod-traces', 'broken-events']
          - observe_summary.timeline_error_count | int == 1
          - observe_summary.timeline_error_source == 'broken-events'
          - observe_summary.source_count | int == 4
          - observe_summary.correlation_group_size | int == 4
          - observe_summary.topology.services.checkout == ['web-01']
          - observe_summary.topology.hosts['web-01'] == ['checkout']
          - request_log.json.requests | select('equalto', 'GET /api/observe/sources') | list | length == 4
          - request_log.json.requests | select('equalto', 'POST /api/observe/query') | list | length == 13
        fail_msg: "gludd_observe Molecule evidence incomplete: {{ observe_summary }} / {{ request_log.json }}"
        success_msg: "gludd_observe exercised all operations over 17 module HTTP requests"

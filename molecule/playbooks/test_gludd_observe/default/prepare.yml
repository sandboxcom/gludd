---
- name: Prepare private result state for gludd_observe
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    scenario_state_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/gludd-observe-runtime"
  tasks:
    - name: Create a private result directory inside Molecule state
      ansible.builtin.file:
        path: "{{ scenario_state_dir }}"
        state: directory
        mode: "0700"

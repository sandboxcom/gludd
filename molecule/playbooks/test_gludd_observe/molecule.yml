---
driver:
  name: default
shared_state: false
platforms: []
provisioner:
  name: ansible
  config_options:
    defaults:
      gathering: explicit
      host_key_checking: false
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8897"
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  playbooks:
    cleanup: default/cleanup.yml
    destroy: default/destroy.yml
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

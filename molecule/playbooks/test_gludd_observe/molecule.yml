---
driver:
  name: default
shared_state: false
platforms: []
provisioner:
  name: ansible
  config_options:
    defaults:
      gathering: explicit
      host_key_checking: false
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    PYTHONPATH: "${MOLECULE_PROJECT_DIRECTORY}/src"
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  playbooks:
    cleanup: "${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/mock_daemon_cleanup.yml"
    destroy: "${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/mock_daemon_destroy.yml"
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

---
- name: Verify - searxng_search modules executed cleanly
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load artifact
      ansible.builtin.slurp:
        path: /tmp/gludd-molecule-searxng/artifact.json
      register: _artifact

    - name: Parse artifact
      ansible.builtin.set_fact:
        _result: "{{ _artifact.content | b64decode | from_json }}"

    - name: Assert flight search executed
      ansible.builtin.assert:
        that:
          - _result.flight_success | bool
        fail_msg: "flight search module did not execute cleanly"
        success_msg: "flight search module executed cleanly"

    - name: Assert hotel search executed
      ansible.builtin.assert:
        that:
          - _result.hotel_success | bool
        fail_msg: "hotel search module did not execute cleanly"
        success_msg: "hotel search module executed cleanly"

    - name: Assert event search executed
      ansible.builtin.assert:
        that:
          - _result.event_success | bool
        fail_msg: "event search module did not execute cleanly"
        success_msg: "event search module executed cleanly"

    - name: Cleanup artifact dir
      ansible.builtin.file:
        path: /tmp/gludd-molecule-searxng
        state: absent

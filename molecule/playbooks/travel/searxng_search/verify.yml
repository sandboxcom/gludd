---
- name: Verify - searxng_search modules executed cleanly
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert flight search executed
      ansible.builtin.assert:
        that:
          - flight_success is defined
          - flight_success | bool
        fail_msg: "flight search failed or fact not cached: {{ flight_output | default('undefined') }}"
        success_msg: "flight search module executed cleanly"

    - name: Assert hotel search executed
      ansible.builtin.assert:
        that:
          - hotel_success is defined
          - hotel_success | bool
        fail_msg: "hotel search failed or fact not cached: {{ hotel_output | default('undefined') }}"
        success_msg: "hotel search module executed cleanly"

    - name: Assert event search executed
      ansible.builtin.assert:
        that:
          - event_success is defined
          - event_success | bool
        fail_msg: "event search failed or fact not cached: {{ event_output | default('undefined') }}"
        success_msg: "event search module executed cleanly"

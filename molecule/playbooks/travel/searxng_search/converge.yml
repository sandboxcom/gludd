---
- name: Converge - exercise searxng_search module
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Flight search via SearXNG
      general_ludd.travel.searxng_search:
        query: "flights JFK to CDG September 2026"
        category: flights
        max_results: 5
        timeout: 10
      register: _flight
      ignore_errors: true
      check_mode: true

    - name: Cache flight search result for verify
      ansible.builtin.set_fact:
        flight_success: "{{ not (_flight is failed | default(false)) }}"
        flight_output: "{{ _flight | default({}) }}"
      cacheable: true

    - name: Hotel search via SearXNG
      general_ludd.travel.searxng_search:
        query: "hotels near Eiffel Tower Paris"
        category: hotels
        max_results: 5
        timeout: 10
      register: _hotel
      ignore_errors: true
      check_mode: true

    - name: Cache hotel search result for verify
      ansible.builtin.set_fact:
        hotel_success: "{{ not (_hotel is failed | default(false)) }}"
        hotel_output: "{{ _hotel | default({}) }}"
      cacheable: true

    - name: Event search via SearXNG
      general_ludd.travel.searxng_search:
        query: "events Paris September 2026"
        category: events
        max_results: 5
        timeout: 10
      register: _event
      ignore_errors: true
      check_mode: true

    - name: Cache event search result for verify
      ansible.builtin.set_fact:
        event_success: "{{ not (_event is failed | default(false)) }}"
        event_output: "{{ _event | default({}) }}"
      cacheable: true

---
- name: Converge - exercise searxng_search module
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create artifact directory
      ansible.builtin.file:
        path: /tmp/gludd-molecule-searxng
        state: directory
        mode: "0755"

    - name: Flight search via SearXNG
      general_ludd.travel.searxng_search:
        query: "flights JFK to CDG September 2026"
        category: flights
        max_results: 5
        timeout: 10
      register: _flight
      ignore_errors: true
      check_mode: true

    - name: Hotel search via SearXNG
      general_ludd.travel.searxng_search:
        query: "hotels near Eiffel Tower Paris"
        category: hotels
        max_results: 5
        timeout: 10
      register: _hotel
      ignore_errors: true
      check_mode: true

    - name: Event search via SearXNG
      general_ludd.travel.searxng_search:
        query: "events Paris September 2026"
        category: events
        max_results: 5
        timeout: 10
      register: _event
      ignore_errors: true
      check_mode: true

    - name: Build artifact facts
      ansible.builtin.set_fact:
        _artifact_data:
          flight_success: "{{ not (_flight is failed | default(false)) }}"
          hotel_success: "{{ not (_hotel is failed | default(false)) }}"
          event_success: "{{ not (_event is failed | default(false)) }}"

    - name: Write artifact for verify
      ansible.builtin.copy:
        content: "{{ _artifact_data | to_nice_json }}"
        dest: /tmp/gludd-molecule-searxng/artifact.json
        mode: "0644"

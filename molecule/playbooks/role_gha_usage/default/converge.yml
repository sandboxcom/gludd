---
- name: Converge - run gha_usage role against mock gh+daemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "8854"
    mock_gh_dir: "/tmp/gludd-gha-usage-mock"
  environment:
    PATH: "{{ mock_gh_dir }}:/usr/bin:/bin:/usr/local/bin"
  tasks:
    - name: Invoke gha_usage
      ansible.builtin.include_role:
        name: general_ludd.agent.gha_usage
      vars:
        gha_repo: "mock-org/mock-repo"
        gha_org: "mock-org"
        gha_api_base: "http://127.0.0.1:{{ mock_port }}"

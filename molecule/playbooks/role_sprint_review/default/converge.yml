---
# Run the REAL sprint_review role against the mock daemon.
- name: Converge - run sprint_review role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8824', true) }}"
  tasks:
    - name: Invoke sprint_review
      ansible.builtin.include_role:
        name: general_ludd.agent.sprint_review
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-sprint-review-{{ mock_port }}"
        sprint_name: "Sprint-Test-1"

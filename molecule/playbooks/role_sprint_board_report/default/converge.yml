---
# Run the REAL sprint_board_report role against the mock daemon.
- name: Converge - run sprint_board_report role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8822', true) }}"
  tasks:
    - name: Invoke sprint_board_report
      ansible.builtin.include_role:
        name: general_ludd.agent.sprint_board_report
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-sprint-board-report-{{ mock_port }}"
        sprint_name: "Sprint-Test-1"

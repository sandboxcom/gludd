---
# Run the REAL standup_report role against the mock daemon.
- name: Converge - run standup_report role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8821', true) }}"
  tasks:
    - name: Invoke standup_report
      ansible.builtin.include_role:
        name: general_ludd.agent.standup_report
      vars:
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        artifact_dir: "/tmp/gludd-standup-report-{{ mock_port }}"

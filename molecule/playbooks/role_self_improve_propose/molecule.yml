---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
  playbooks:
    cleanup: "${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/mock_daemon_cleanup.yml"
    destroy: "${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/mock_daemon_destroy.yml"
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # self_improve_propose creates a REAL git worktree and runs an agent over HTTP;
  # the worktree branch already exists after the first converge, so a second
  # converge is not idempotent. Skip the idempotence step.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

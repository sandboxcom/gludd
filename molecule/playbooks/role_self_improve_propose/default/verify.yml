---
- name: Verify - self_improve_propose produced a proposal + real candidate worktree
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}.pid"
    repo_path: "/tmp/gludd-self-improve-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    worktree_base: "/tmp/gludd-self-improve-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    artifact: "/tmp/gludd-self-improve-propose-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}/proposal.json"
  tasks:
    - name: Assert proposal artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: not art.stat.exists

    - name: Load proposal artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse proposal artifact
      ansible.builtin.set_fact:
        proposal: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert the REAL candidate worktree directory was created
      ansible.builtin.stat:
        path: "{{ worktree_base }}/candidate"
      register: wt
      failed_when: not wt.stat.exists

    - name: Assert proposal fields (introspect -> lowest-coverage target -> worktree)
      ansible.builtin.assert:
        that:
          - proposal.role == 'self_improve_propose'
          - proposal.status == 'proposed'
          - proposal.candidate_worktree == (worktree_base ~ '/candidate')
          # Mock /api/facts codebase.coverage.low_coverage lowest line_rate file
          # is src/general_ludd/util/helpers.py (0.31) -> chosen as the target.
          - proposal.target_module == 'src/general_ludd/util/helpers.py'
          - proposal.signals.coverage.low_coverage | length == 2
          - proposal.signals.churn is defined
          - proposal.signals.debt is defined
        fail_msg: "self_improve_propose proposal wrong: {{ proposal }}"
        success_msg: >-
          self_improve_propose: target={{ proposal.target_module }} in a real
          git worktree at {{ proposal.candidate_worktree }}

    # ---- cleanup ----
    - name: Remove throwaway repo + candidate worktree + artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ repo_path }}"
        - "{{ worktree_base }}"
        - "/tmp/gludd-self-improve-propose-{{ mock_port }}"
      failed_when: false

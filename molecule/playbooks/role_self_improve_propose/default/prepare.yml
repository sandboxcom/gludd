---
# self_improve_propose reads codebase facts (gludd_introspect -> GET /api/facts),
# picks the lowest-coverage file as the target, creates an isolated candidate
# git worktree (gludd_worktree, REAL git), runs the agent (gludd_agent_run ->
# POST /admin/models/call), and writes a proposal artifact. Prepare starts the
# mock daemon and builds a throwaway git repo containing the target file.
- name: Prepare - mock daemon + throwaway git repo for self_improve_propose
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}.pid"
    repo_path: "/tmp/gludd-self-improve-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    worktree_base: "/tmp/gludd-self-improve-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
  tasks:
    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ lookup('env', 'VIRTUAL_ENV') | default('/usr', true) }}/bin/python3
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    - name: Remove any stale repo / worktree base
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ repo_path }}"
        - "{{ worktree_base }}"

    - name: Create throwaway git repo containing the lowest-coverage target file
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p "{{ repo_path }}/src/general_ludd/util"
          cd "{{ repo_path }}"
          git init -q
          git config user.email "mock@molecule.local"
          git config user.name "Molecule Mock"
          git config commit.gpgsign false
          echo "def helper(x): return x  # TODO: needs tests" > src/general_ludd/util/helpers.py
          git add src/general_ludd/util/helpers.py
          git commit -q -m "seed commit"
      changed_when: true

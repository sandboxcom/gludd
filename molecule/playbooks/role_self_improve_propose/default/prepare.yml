---
# self_improve_propose prepare:
#   1. Start the reusable mock daemon (serves /api/facts codebase block for
#      gludd_introspect and /admin/models/call for gludd_agent_run).
#   2. Seed a throwaway git repo with an initial commit so gludd_worktree can
#      create a REAL isolated candidate worktree off it. The role was reverted in
#      CI precisely because it had no real seeded repo/worktree — this provides it.
- name: Prepare - mock daemon + seeded throwaway git repo for self_improve_propose
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}.pid"
    repo_path: "/tmp/gludd-self-improve-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    worktree_base: "/tmp/gludd-self-improve-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
  tasks:
    - name: Remove any stale throwaway repo + candidate worktree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ repo_path }}"
        - "{{ worktree_base }}"

    - name: Create throwaway git repo with an initial commit
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p "{{ repo_path }}/src/general_ludd/util"
          cd "{{ repo_path }}"
          git init -q
          git config user.email "mock@molecule.local"
          git config user.name "Molecule Mock"
          git config commit.gpgsign false
          echo "seed" > README.md
          echo "def helpers():\n    return 1" > src/general_ludd/util/helpers.py
          git add -A
          git commit -q -m "seed commit"
      changed_when: true

---
# Run the REAL self_improve_propose role end-to-end:
#   gludd_introspect (HTTP /api/facts codebase block) ->
#   pick lowest-coverage target file ->
#   gludd_worktree (REAL git worktree on the seeded repo) ->
#   gludd_agent_run (HTTP /admin/models/call) ->
#   write proposal.json artifact.
- name: Converge - run self_improve_propose role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    repo_path: "/tmp/gludd-self-improve-repo-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    worktree_base: "/tmp/gludd-self-improve-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
  force_handlers: true
  handlers:
    - name: Stop scenario-owned mock daemon
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/mock_daemon_stop.yml"
  tasks:
    - name: Acquire a private ready mock-daemon session
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/mock_daemon_start.yml"

    - name: Invoke self_improve_propose (opted in)
      ansible.builtin.include_role:
        name: general_ludd.agent.self_improve_propose
      vars:
        self_improve_enabled: true
        daemon_url: "{{ mock_daemon_url }}"
        psk: ""
        candidate_branch: "molecule/self-improve-candidate"
        agent_max_iterations: 2
        artifact_dir: "/tmp/gludd-self-improve-propose-{{ mock_port }}"

---
# Run the REAL self_improve_propose role end-to-end against the mock daemon,
# explicitly opting in (self_improve_enabled=true) so it does real work.
- name: Converge - run self_improve_propose role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    repo_path: "/tmp/gludd-self-improve-repo-{{ mock_port }}"
    worktree_base: "/tmp/gludd-self-improve-{{ mock_port }}"
  tasks:
    - name: Invoke self_improve_propose (enabled)
      ansible.builtin.include_role:
        name: general_ludd.agent.self_improve_propose
      vars:
        self_improve_enabled: true
        daemon_url: "http://127.0.0.1:{{ mock_port }}"
        psk: ""
        repo_path: "{{ repo_path }}"
        worktree_base: "{{ worktree_base }}"
        candidate_branch: "auto/self-improve/MOCK-CANDIDATE"  # pragma: allowlist secret
        artifact_dir: "/tmp/gludd-self-improve-propose-{{ mock_port }}"

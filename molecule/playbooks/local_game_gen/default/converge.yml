---
- name: Converge — run local_game_gen role behavioral pipeline
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    game_name: "snake"
    model_repo: "bartowski/Qwen2.5-0.5B-Instruct-GGUF"
    model_file: "Qwen2.5-0.5B-Instruct-Q5_K_M.gguf"
  tasks:
    - name: Invoke local_game_gen role
      ansible.builtin.include_role:
        name: general_ludd.agent.local_game_gen
        vars:
          game_name: "snake"
          # max_attempts=3 yields two real generation attempts (attempt 1 plus
          # one corrective-prompt retry) so the CI molecule run exercises the
          # rejection-retry loop; fail_on_rejection=false keeps model-quality
          # rejection observable instead of failing the scenario.
          max_attempts: 3
          fail_on_rejection: false

---
- name: Verify - feature_audit wrote its audit artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8827', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8827', true) }}.pid"
    artifact: "/tmp/gludd-feature-audit-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8827', true) }}/feature_audit.json"
    artifact_md: "/tmp/gludd-feature-audit-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8827', true) }}/feature_audit.md"
  tasks:
    - name: Assert JSON artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: not art.stat.exists

    - name: Load JSON artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse JSON artifact
      ansible.builtin.set_fact:
        result: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert artifact fields
      ansible.builtin.assert:
        that:
          - result.role == 'feature_audit'
          - result.status is defined
          - result.summary is defined
          - result.total is defined
          - result.total | int == 2
          - result.features is defined
          - result.features | length == 2
          - result.verified_count is defined
          - result.implemented_count is defined
          - result.requested_count is defined
          - result.regressed_count is defined
          # Mock daemon returns 2 implemented features; no regressions
          - result.status == 'clean'
        fail_msg: "feature_audit artifact wrong: {{ result }}"
        success_msg: "feature_audit ran end-to-end against mock; status={{ result.status }}, total={{ result.total }}"

    - name: Assert markdown artifact exists
      ansible.builtin.stat:
        path: "{{ artifact_md }}"
      register: art_md
      failed_when: not art_md.stat.exists

    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-feature-audit-{{ mock_port }}"
        state: absent
      failed_when: false

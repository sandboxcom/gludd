---
# Start the mock daemon (extended with POST /admin/stream/dispatch) and create
# a fake audio device file (zeros) so gludd_stream's tail loop has something
# to read without real audio hardware.
- name: Prepare - mock daemon + fake audio device
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8841', true) }}"
    pidfile: "/tmp/gludd-mock-{{ mock_port }}.pid"
    mock_audio: "/tmp/mock-audio.wav"
  tasks:
    - name: Kill any stale mock daemon on this port
      ansible.builtin.shell:
        cmd: >-
          pid="{{ pidfile }}" &&
          if [ -f "$pid" ]; then kill "$(cat $pid)" 2>/dev/null || true; rm -f "$pid"; fi;
          lsof -ti tcp:{{ mock_port }} 2>/dev/null | xargs -r kill -9 2>/dev/null || true
      changed_when: false
      failed_when: false

    - name: Launch mock daemon (background, nohup)
      ansible.builtin.shell:
        cmd: >-
          nohup {{ lookup('env', 'VIRTUAL_ENV') | default('/usr', true) }}/bin/python3
          "{{ project_dir }}/molecule/mock_daemon/server.py"
          --port {{ mock_port }} --host 127.0.0.1 --pidfile "{{ pidfile }}"
          > /tmp/gludd-mock-{{ mock_port }}.log 2>&1 &
      changed_when: true

    - name: Wait for mock daemon /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mock_port }}/healthz"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 0.5

    # 64 KiB of zeros — enough for one size_threshold/silence chunk without
    # the module's tail loop blocking forever.
    - name: Create fake audio device file (zeros)
      ansible.builtin.shell:
        cmd: "dd if=/dev/zero of={{ mock_audio }} bs=1024 count=64 2>/dev/null"
      changed_when: true

    - name: Confirm device file exists
      ansible.builtin.stat:
        path: "{{ mock_audio }}"
      register: device_stat
      failed_when: not device_stat.stat.exists

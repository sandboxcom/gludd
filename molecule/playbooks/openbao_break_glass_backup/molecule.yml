---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8794"
    # lookup('env', 'VAULT_TOKEN') in the role reads the controller's os.environ,
    # not the play's `environment:` directive — so the mock token must be present
    # in the provisioner env for the openbao_token_source=env path to resolve it.
    VAULT_TOKEN: "mock-token"
  config_options:
    defaults:
      collections_path: "${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections"
  playbooks:
    cleanup: "${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/cleanup.yml"
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # Snapshot+GPG-encrypt is intentionally non-idempotent (creates a new
  # timestamped file each run); skip the idempotence step.
  test_sequence:
    - cleanup
    - syntax
    - prepare
    - converge
    - verify
    - cleanup

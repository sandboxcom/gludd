---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8794"
    # lookup('env', 'VAULT_TOKEN') in the role reads the controller's os.environ,
    # not the play's `environment:` directive — so the mock token must be present in provisioner env.
    VAULT_TOKEN: "mock-token"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # Snapshot+GPG-encrypt is intentionally non-idempotent (creates a new
  # timestamped file each run); skip the idempotence step.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy

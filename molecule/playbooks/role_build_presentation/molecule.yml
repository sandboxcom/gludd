---
driver:
  name: default
platforms: []
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    GLUDD_MOCK_PORT: "8783"
  playbooks:
    prepare: default/prepare.yml
    converge: default/converge.yml
    verify: default/verify.yml
verifier:
  name: ansible
scenario:
  # build_presentation is build-only by default (no git push); idempotence is
  # safe to test against the mock daemon.
  test_sequence:
    - syntax
    - prepare
    - converge
    - verify

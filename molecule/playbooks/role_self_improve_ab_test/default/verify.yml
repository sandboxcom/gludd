---
# Verify the crash-isolation held:
#   * the playbook process SURVIVED (marker file written after the role)
#   * the owned daemon session was available through the complete A/B call
#   * ab_verdict.promote == false and b.crashed == true
- name: Verify - parent survived a crashing candidate; promote refused
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    verdict_path: "/tmp/gludd-self-improve-ab/ab_verdict.json"
    marker: "/tmp/gludd-ab-parent-alive.marker"
  tasks:
    - name: Assert parent-liveness marker exists (play survived the crash)
      ansible.builtin.stat:
        path: "{{ marker }}"
      register: marker_stat
      failed_when: not marker_stat.stat.exists

    - name: Load ab_verdict artifact
      ansible.builtin.slurp:
        src: "{{ verdict_path }}"
      register: verdict_raw

    - name: Parse ab_verdict
      ansible.builtin.set_fact:
        verdict: "{{ verdict_raw.content | b64decode | from_json }}"

    - name: Assert fail-closed crash isolation
      ansible.builtin.assert:
        that:
          - verdict.promote == false
          - verdict.b.crashed == true
          - verdict.a.ok == true
        fail_msg: "crash isolation FAILED: {{ verdict }}"
        success_msg: >-
          Crash isolation held: parent survived os._exit(139),
          owned daemon call completed, promote=false, b.crashed=true.

    # ---- cleanup ----
    - name: Remove scenario artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/gludd-self-improve-ab"
        - "/tmp/gludd-ab-baseline"
        - "/tmp/gludd-ab-crash-candidate"
        - "/tmp/gludd-ab-parent-alive.marker"
      failed_when: false

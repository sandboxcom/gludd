---
- name: Verify - retrospective produced non-empty well/ill/actions from seeded data
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mock_port: "{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8825', true) }}"
    pidfile: "/tmp/gludd-mock-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8825', true) }}.pid"
    artifact: "/tmp/gludd-retrospective-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8825', true) }}/retrospective.json"
    artifact_md: "/tmp/gludd-retrospective-{{ lookup('env', 'GLUDD_MOCK_PORT') | default('8825', true) }}/retrospective.md"
  tasks:
    - name: Assert JSON artifact exists
      ansible.builtin.stat:
        path: "{{ artifact }}"
      register: art
      failed_when: not art.stat.exists

    - name: Load JSON artifact
      ansible.builtin.slurp:
        src: "{{ artifact }}"
      register: art_raw

    - name: Parse JSON artifact
      ansible.builtin.set_fact:
        result: "{{ art_raw.content | b64decode | from_json }}"

    - name: Assert role identity
      ansible.builtin.assert:
        that:
          - result.role == 'retrospective'
          - result.status == 'completed'
        fail_msg: "retrospective artifact wrong: {{ result }}"

    - name: "Assert well[] is non-empty (seeded: success_rate=0.92 -> always adds items)"
      ansible.builtin.assert:
        that:
          - result.well is defined
          - result.well | length >= 1
        fail_msg: "well[] empty — expected at least 1 item from seeded success_rate=0.92"
        success_msg: "well={{ result.well | length }} items"

    - name: "Assert ill[] is non-empty (seeded: failures=2 -> always adds failure item)"
      ansible.builtin.assert:
        that:
          - result.ill is defined
          - result.ill | length >= 1
        fail_msg: "ill[] empty — expected failure item from seeded failures=2"
        success_msg: "ill={{ result.ill | length }} items"

    - name: "Assert actions[] is non-empty (seeded: failures present -> always adds action)"
      ansible.builtin.assert:
        that:
          - result.actions is defined
          - result.actions | length >= 1
        fail_msg: "actions[] empty — expected action item from seeded failures"
        success_msg: "actions={{ result.actions | length }} items"

    - name: Assert history context from seeded data
      ansible.builtin.assert:
        that:
          - result.history.total_runs | int == 25
          - result.history.success_rate | float == 0.92
          - result.history.failures | int == 2
        fail_msg: "history context wrong: {{ result.history }}"
        success_msg: "history total_runs={{ result.history.total_runs }} success_rate={{ result.history.success_rate }}"

    - name: Assert inbox_messages reflects seeded /api/messages (at least 1)
      ansible.builtin.assert:
        that:
          - result.inbox_messages | int >= 1
        fail_msg: "inbox_messages should be >= 1 (seeded MSG-MOCK-IN-1), got {{ result.inbox_messages }}"
        success_msg: "inbox_messages={{ result.inbox_messages }}"

    - name: Assert narrative is present
      ansible.builtin.assert:
        that:
          - result.narrative is defined
          - result.narrative | length > 0
        fail_msg: "narrative missing"

    - name: Assert markdown artifact exists
      ansible.builtin.stat:
        path: "{{ artifact_md }}"
      register: art_md
      failed_when: not art_md.stat.exists

    # ---- cleanup: stop daemon ----
    - name: Stop mock daemon
      ansible.builtin.shell:
        cmd: "kill $(cat {{ pidfile }}) 2>/dev/null || true; rm -f {{ pidfile }}"
      changed_when: false
      failed_when: false

    - name: Remove artifact dir
      ansible.builtin.file:
        path: "/tmp/gludd-retrospective-{{ mock_port }}"
        state: absent
      failed_when: false

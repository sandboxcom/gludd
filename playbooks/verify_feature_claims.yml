---
- name: Verify feature claims are backed by real evidence
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: "Run full feature-claim verification (pytest for test: refs)"
      ansible.builtin.command:
        cmd: uv run python scripts/gen_status_table.py --check --fast
        chdir: "{{ playbook_dir }}/.."
      register: _verify_result
      changed_when: false
      failed_when: _verify_result.rc != 0

    - name: Report verification output
      ansible.builtin.debug:
        var: _verify_result.stdout_lines
      when: _verify_result.stdout_lines | default([]) | length > 0

    - name: Report verification errors
      ansible.builtin.debug:
        var: _verify_result.stderr_lines
      when: _verify_result.stderr_lines | default([]) | length > 0

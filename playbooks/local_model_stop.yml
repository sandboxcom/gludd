---
- name: Stop local model inference server
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_id: "local-0"
    server_pid: null
    pid_file: "/tmp/gludd-model-{{ server_id }}.pid"

  tasks:
    - name: Report local model cleanup start
      ansible.builtin.debug:
        msg: "local model cleanup started for {{ server_id }}"

    - name: Resolve and reconcile the owned local model process
      block:
        - name: Inspect the optional PID file
          ansible.builtin.stat:
            path: "{{ pid_file }}"
            follow: false
          register: _pid_file_stat
          when:
            - server_pid is none
            - pid_file is defined

        - name: Read the regular PID file when present
          ansible.builtin.slurp:
            src: "{{ pid_file }}"
          register: _pid_slurp
          failed_when: false
          when:
            - server_pid is none
            - pid_file is defined
            - _pid_file_stat.stat.exists | default(false)
            - _pid_file_stat.stat.isreg | default(false)

        - name: Resolve the optional process identity
          ansible.builtin.set_fact:
            _local_model_pid_candidate: >-
              {{ (server_pid | string)
                 if server_pid is not none
                 else (_pid_slurp.content | default('') | b64decode | trim) }}

        - name: Reject a malformed process identity
          ansible.builtin.assert:
            that:
              - _local_model_pid_candidate is match('^[1-9][0-9]*$')
            fail_msg: "refusing malformed local-model PID identity"
          when: _local_model_pid_candidate | length > 0
      always:
        - name: Terminate the owned process and retire its PID file
          block:
            - name: Kill server process with SIGTERM
              ansible.builtin.command:
                argv:
                  - /bin/kill
                  - -TERM
                  - "{{ _local_model_pid_candidate }}"
              register: _term_result
              failed_when: false
              changed_when: _term_result.rc == 0
              when: >-
                (_local_model_pid_candidate | default(''))
                is match('^[1-9][0-9]*$')

            - name: Wait for process to exit
              ansible.builtin.command:
                argv:
                  - /bin/ps
                  - -p
                  - "{{ _local_model_pid_candidate }}"
              register: _ps_result
              until: _ps_result.rc != 0
              failed_when: false
              changed_when: false
              retries: 10
              delay: 1
              when: >-
                (_local_model_pid_candidate | default(''))
                is match('^[1-9][0-9]*$')
          rescue:
            - name: Force kill a process that outlived the grace period
              ansible.builtin.command:
                argv:
                  - /bin/kill
                  - -KILL
                  - "{{ _local_model_pid_candidate }}"
              register: _kill_result
              failed_when: false
              changed_when: _kill_result.rc == 0
              when: >-
                (_local_model_pid_candidate | default(''))
                is match('^[1-9][0-9]*$')
          always:
            - name: Remove PID file
              ansible.builtin.file:
                path: "{{ pid_file }}"
                state: absent
              when: pid_file is defined

    - name: Capture server stopped fact
      ansible.builtin.set_fact:
        gludd_local_server:
          server_id: "{{ server_id }}"
          status: stopped

    - name: Report local model cleanup completion
      ansible.builtin.debug:
        msg: "local model cleanup completed for {{ server_id }}"

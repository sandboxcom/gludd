---
# Execute the full agent_task lifecycle for self-improvement work.

- name: Self-improve harness
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    job_id: "{{ job_id | default('SI-00000000') }}"
    todo_id: "{{ todo_id | default('none') }}"
    artifact_dir: "{{ artifact_dir | default('/tmp/harness-self-improve') }}"
    repo_path: "{{ repo_path | default('') }}"
    daemon_url: "{{ daemon_url | default('http://localhost:8000') }}"
    model_profile: "{{ model_profile | default('') }}"

  tasks:
    - name: Validate self-improvement request
      ansible.builtin.assert:
        that:
          - todo_id != 'none'
          - todo_id is match('^[A-Za-z0-9_.:-]{1,128}$')
          - repo_path | length > 0
          - repo_path | length <= 4096
          - artifact_dir | length > 0
          - artifact_dir | length <= 4096
        fail_msg: Self-improvement requires bounded repo_path and todo_id inputs.

    - name: Create artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Run full agent task for self-improvement
      ansible.builtin.include_role:
        name: general_ludd.agent.agent_task
      vars:
        repo_path: "{{ repo_path }}"
        todo_id: "{{ todo_id }}"
        work_type: "self_improvement"
        skill_name: ""
        quality_gate_cmd: "make test-count"
        artifact_dir: "{{ artifact_dir }}"
        daemon_url: "{{ daemon_url }}"
        model_profile: "{{ model_profile }}"

    - name: Report self-improve completion
      ansible.builtin.debug:
        msg: "Self-improve playbook completed for job {{ job_id }}"

---
- name: Molecule test runner
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    job_id: "{{ job_id | default('MOLECULE-00000000') }}"
    todo_id: "{{ todo_id | default('none') }}"
    test_dir: "{{ test_dir | default('.') }}"
    scenario: "{{ scenario | default('') }}"
    artifact_dir: "{{ artifact_dir | default('/tmp/harness-molecule-test') }}"

  tasks:
    - name: Validate bounded Molecule request
      ansible.builtin.assert:
        that:
          - test_dir | length > 0
          - test_dir | length <= 4096
          - scenario is match('^[A-Za-z0-9_.-]{1,128}$')
        fail_msg: Molecule test requires bounded test_dir and scenario inputs.

    - name: Create artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Run bounded Molecule scenario
      ansible.builtin.command:
        argv:
          - uv
          - run
          - molecule
          - test
          - --scenario-name
          - "{{ scenario }}"
        chdir: "{{ test_dir }}"
      environment:
        MOLECULE_EPHEMERAL_DIRECTORY: "{{ artifact_dir }}/ephemeral/{{ scenario }}"
      register: molecule_result
      changed_when: false
      async: 900
      poll: 10

    - name: Write molecule test artifact
      ansible.builtin.copy:
        content: |
          {
            "job_id": "{{ job_id }}",
            "todo_id": "{{ todo_id }}",
            "playbook": "molecule_test.yml",
            "scenario": "{{ scenario }}",
            "status": "success",
            "return_code": {{ molecule_result.rc }}
          }
        dest: "{{ artifact_dir }}/molecule_test_result.json"
        mode: "0644"
      when: not ansible_check_mode

    - name: Report molecule test completion
      ansible.builtin.debug:
        msg: "Molecule test passed for job {{ job_id }} scenario {{ scenario }}"

---
# spec_lifecycle.yml — entry point for the general_ludd.agent.spec_lifecycle role.
#
# Drives the Spec-Driven Development 3-stage pipeline (drafts -> active ->
# archive) using the A-B-C documentation flow. The operation is selected by
# the `operation` variable (init, create_task, approve_task, complete_task,
# discard_task, list, revise, repair, interview, map_codebase,
# diagram_architecture).
#
# See collections/.../roles/spec_lifecycle/README.md for the full matrix.

- name: Spec-Driven Development lifecycle
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    operation: "{{ operation | default('') }}"
    spec_root: "{{ spec_root | default(playbook_dir ~ '/.spec.md') }}"
    task_name: "{{ task_name | default('') }}"
    task_size: "{{ task_size | default('medium') }}"
    artifact_dir: "{{ artifact_dir | default(spec_root ~ '/_artifacts') }}"
    enable_model_call: "{{ enable_model_call | default(false) | bool }}"
    daemon_url: "{{ daemon_url | default('http://localhost:8000') }}"
    psk: "{{ psk | default('') }}"
    model_profile: "{{ model_profile | default('') }}"

  tasks:
    - name: Invoke spec_lifecycle role
      ansible.builtin.include_role:
        name: general_ludd.agent.spec_lifecycle
      vars:
        operation: "{{ operation }}"
        spec_root: "{{ spec_root }}"
        task_name: "{{ task_name }}"
        task_size: "{{ task_size }}"
        artifact_dir: "{{ artifact_dir }}"
        enable_model_call: "{{ enable_model_call }}"
        daemon_url: "{{ daemon_url }}"
        psk: "{{ psk }}"
        model_profile: "{{ model_profile }}"

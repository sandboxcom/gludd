repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^config/self-improve/catalog-truth\.json$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        exclude: ^tests/(unit/test_adversarial_detector|e2e/test_remaining_batch2_workflows)\.py$
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Upstream intentionally refreshes baseline line metadata. Keep that
        # mutating maintenance path explicit; normal gates use the local
        # disposable-copy wrapper below.
        stages: [manual]
        exclude: >
          (?x)^(
            uv.lock|
            .secrets.baseline|
            \.opencode/plugin-hashes\.json|
            dist/.*|
            \.venv/.*|
            \.opencode/node_modules/.*|
            \.mypy_cache/.*|
            \.pytest_cache/.*|
            \.ruff_cache/.*|
            __pycache__/.*
          )$

  - repo: local
    hooks:
      - id: detect-secrets-readonly
        name: Detect secrets
        entry: uv run python scripts/detect_secrets_readonly.py
        language: system
        pass_filenames: true
        require_serial: true
        exclude: >
          (?x)^(
            uv.lock|
            .secrets.baseline|
            \.opencode/plugin-hashes\.json|
            dist/.*|
            \.venv/.*|
            \.opencode/node_modules/.*|
            \.mypy_cache/.*|
            \.pytest_cache/.*|
            \.ruff_cache/.*|
            __pycache__/.*
          )$

      - id: scan-conflicts
        name: scan for git conflict markers
        entry: python scripts/scan_conflicts.py
        language: system
        pass_filenames: true

      - id: workflow-yaml
        name: validate GitHub Actions workflow YAML and release graph
        entry: scripts/hooks/pre-commit-workflow-yaml
        language: system
        files: ^\.github/workflows/build\.yml$
        pass_filenames: false
        require_serial: true

      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy type check
        entry: make _precommit-mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: check-tdd-compliance
        name: TDD compliance (source files need tests)
        entry: uv run python scripts/check_tdd_compliance.py
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: check-disk
        name: automatic inactive-worktree cache cleanup and disk check
        entry: make check-disk CHECK_DISK_VALIDATE_ONLY=0
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: collect-check
        name: test collection check
        entry: make collect-check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: verify-secrets
        name: Verify secrets baseline
        entry: make verify-secrets
        language: system
        files: ^\.secrets\.baseline$
        pass_filenames: false
        require_serial: true

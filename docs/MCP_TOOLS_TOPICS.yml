general_ludd.agent.gludd_abtest:
  DOCUMENTATION:
    description:
    - Runs a baseline (A = current C(src)) and a candidate (B = candidate
    - worktree) under the SAME workload, each in a FRESH interpreter child
    - process via C(general_ludd.abtest.run_ab). The candidate is NEVER imported
    - into this process, so a candidate built to crash the whole app
    - (C(os._exit), segfault, infinite loop, OOM) CANNOT take down the Ansible
    - controller or the daemon.
    - 'Fail-closed: B is promoted ONLY if A passed and B ran ok, did not crash,'
    - did not time out, and stayed within a duration slack. Any crash/timeout
    - yields C(promote=false).
    - Runs in-process (same venv as C(general_ludd)); does NOT call the daemon.
    module: gludd_abtest
    options:
      baseline_root: {}
      candidate_root: {}
      expect_attr: {}
      mem_limit_mb: {}
      module: {}
      repo_root: {}
      timeout: {}
      verdict_path: {}
    short_description: Crash-isolated A/B test of a candidate code variant in a fresh
      subprocess
  EXAMPLES:
  - general_ludd.agent.gludd_abtest:
      candidate_root: /tmp/candidate-worktree
      module: general_ludd.example.leaf
      repo_root: /repo
      verdict_path: /tmp/ab_verdict.json
    name: A/B test a candidate worktree (crash-isolated)
    register: ab
  RETURN:
    promote:
      description: Whether the candidate may be promoted.
      returned: always
      type: bool
    verdict:
      description: The A/B verdict (a, b, promote, reason).
      returned: always
      type: dict
  module: gludd_abtest
general_ludd.agent.gludd_accounting:
  DOCUMENTATION:
    description:
    - C(state=all) calls C(GET /api/accounting) and returns accounting snapshots for
      ALL known projects as C(ansible_facts.gludd_accounting).
    - C(state=project) calls C(GET /api/accounting/{project_id}) and returns the accounting
      snapshot for a single project.
    - Both operations are read-only. PSK-authed; check-mode safe.
    module: gludd_accounting
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      project_id:
        description: Project ID to fetch when C(state=project).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      state:
        choices:
        - all
        - project
        default: all
        description: Operation to perform.
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Fetch per-project accounting snapshots via the daemon
  EXAMPLES:
  - general_ludd.agent.gludd_accounting: null
    name: Load accounting for all projects
    register: acct_result
  - general_ludd.agent.gludd_accounting:
      project_id: my-project
      state: project
    name: Load accounting for a specific project
    register: acct_proj
  - ansible.builtin.debug:
      msg: '{{ acct_result.accounting }}'
    name: Show accounting snapshot
  RETURN:
    accounting:
      description: List of accounting snapshots (state=all) or single snapshot dict
        (state=project).
      returned: always
      type: raw
    ansible_facts:
      description: Contains C(gludd_accounting) with the accounting list or snapshot.
      returned: always
      type: dict
    project_id:
      description: Project ID (state=project only).
      returned: when state=project
      type: str
  module: gludd_accounting
general_ludd.agent.gludd_agent_run:
  DOCUMENTATION:
    description:
    - 'W6.8 decision: uses the existing C(ToolCallLoop) from'
    - C(execution.tool_loop) — langgraph/langchain are declared deps with
    - zero production callers, so option (b) was chosen (keep ToolCallLoop;
    - note that langgraph removal is deferred to W4.5 deps-audit).
    - Accepts a prompt and optional tool list, iterates model/tool calls up
    - to C(max_iterations) times, and returns the final answer and tool call
    - history.
    - Check mode skips the model call and returns a placeholder.
    module: gludd_agent_run
    options:
      daemon_url: {}
      max_iterations: {}
      model_profile: {}
      prompt: {}
      psk: {}
      system_prompt: {}
      timeout: {}
      tools: {}
    short_description: Run the agent tool-call loop (prompt + tools → answer)
  EXAMPLES:
  - general_ludd.agent.gludd_agent_run:
      max_iterations: 5
      prompt: '{{ rendered_skill_body }}

        Task: {{ todo_title }}'
    name: Run agent loop
    register: agent_result
  - ansible.builtin.debug:
      msg: 'Agent answer: {{ agent_result.answer }}'
    name: Use agent answer
  RETURN:
    answer:
      description: Final text answer from the agent.
      returned: success
      type: str
    iterations:
      description: Number of loop iterations completed.
      returned: success
      type: int
    tool_calls:
      description: List of tool calls made during the loop.
      returned: success
      type: list
    usage:
      description: Aggregate token usage (if available from gateway).
      returned: success
      type: dict
  module: gludd_agent_run
general_ludd.agent.gludd_break_glass:
  DOCUMENTATION:
    description:
    - Wraps the OpenBao HTTP API for the two break-glass endpoints C(/v1/sys/storage/raft/snapshot)
      (GET — snapshot) and C(/v1/sys/storage/raft/restore) (POST — restore).
    - Mode C(snapshot) fetches the current raft snapshot bytes and writes them to
      C(output_path).
    - Mode C(restore) POSTs the bytes from C(restore_source) back into a running OpenBao
      server.
    - The C(token) argument is marked C(no_log=True); OpenBao tokens MUST NOT leak
      into Ansible task output.
    - This module is safe to call from C(check_mode) for snapshot (it does nothing
      destructive); restore is refused in check_mode.
    module: gludd_break_glass
    notes:
    - Uses Python stdlib urllib only — no hvac dependency on the Ansible controller.
    - Fails closed on any non-200 response from OpenBao.
    options:
      mode:
        choices:
        - snapshot
        - restore
        default: snapshot
        description: Operation mode.
        type: str
      openbao_addr:
        description: Base URL of the OpenBao server (e.g. https://127.0.0.1:8200).
        required: true
        type: str
      output_path:
        default: ''
        description: Path where the snapshot bytes are written (mode=snapshot).
        type: str
      restore_source:
        default: ''
        description: Path to read bytes from for mode=restore (raw or GPG file). The
          caller is responsible for GPG-decrypting prior to invocation; this module
          reads bytes verbatim and POSTs them.
        type: str
      token:
        description: OpenBao bearer token with snapshot/restore privileges.
        no_log: true
        required: true
        type: str
    short_description: OpenBao raft snapshot and restore (break-glass backup)
  EXAMPLES:
  - general_ludd.agent.gludd_break_glass:
      mode: snapshot
      openbao_addr: https://127.0.0.1:8200
      output_path: /tmp/openbao-snapshot.bin
      token: '{{ vault_token }}'
    name: Snapshot OpenBao raft store to a temp file
    register: snap
  - general_ludd.agent.gludd_break_glass:
      mode: restore
      openbao_addr: https://127.0.0.1:8200
      restore_source: /tmp/openbao-snapshot.bin
      token: '{{ vault_token }}'
    name: Restore OpenBao from a decrypted snapshot file
  RETURN:
    raft_applied:
      description: True when OpenBao returned 200/204 from the restore endpoint.
      returned: when mode=restore
      type: bool
    restored_at:
      description: ISO-8601 UTC timestamp the restore POST completed.
      returned: when mode=restore
      type: str
    saved_at:
      description: ISO-8601 UTC timestamp the snapshot was written.
      returned: when mode=snapshot
      type: str
    sha256:
      description: SHA-256 hex digest of the snapshot bytes (mode=snapshot).
      returned: when mode=snapshot
      type: str
    size_bytes:
      description: Size of the snapshot written to output_path (mode=snapshot).
      returned: when mode=snapshot
      type: int
  module: gludd_break_glass
general_ludd.agent.gludd_db:
  DOCUMENTATION:
    description:
    - Performs todo and resource operations against the daemon's REST API.
    - Supported ops: C(todo_get), C(todo_create), C(todo_update_status), C(resource_preference).
    - C(todo_create) issues POST /api/todos on the daemon (never raw SQLite).
    - NEVER opens the SQLite file directly (single-writer rule).
    - Check mode skips write operations.
    module: gludd_db
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      description:
        default: ''
        description: Todo description (todo_create).
        type: str
      op:
        choices:
        - todo_get
        - todo_create
        - todo_update_status
        - resource_preference
        description: Operation to perform.
        required: true
        type: str
      priority:
        default: medium
        description: Todo priority — low, medium, high, critical (todo_create).
        type: str
      project_id:
        description: Optional project identifier (todo_create).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      queue:
        default: core
        description: Queue to place the todo in (todo_create).
        type: str
      resource_type:
        description: Resource type (required for resource_preference).
        type: str
      role:
        default: ''
        description:
        - Capability role on whose behalf the op runs.
        - The per-role capability policy (default-DENY) gates which ops are permitted;
          an unknown role may perform no ops.
        type: str
      status:
        description: New status string (required for todo_update_status).
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      title:
        description: Todo title (required for todo_create).
        type: str
      todo_id:
        description: Todo identifier (required for todo_get/todo_update_status).
        type: str
      work_type:
        default: code
        description: Work type for the todo (todo_create).
        type: str
    short_description: Todo/resource CRUD via daemon HTTP API (never raw SQLite)
  EXAMPLES:
  - general_ludd.agent.gludd_db:
      op: todo_get
      todo_id: TODO-abc123
    name: Fetch a todo
    register: todo
  - general_ludd.agent.gludd_db:
      description: As a developer, I want X.
      op: todo_create
      queue: core
      title: Implement feature X
      work_type: code
    name: Create a todo
    register: created
  - general_ludd.agent.gludd_db:
      op: todo_update_status
      status: done
      todo_id: TODO-abc123
    name: Mark todo complete
  - general_ludd.agent.gludd_db:
      op: resource_preference
      resource_type: model
    name: Read resource preference
    register: pref
  RETURN:
    created:
      description: Whether a todo was created.
      returned: when op=todo_create
      type: bool
    preference:
      description: Resource preference value.
      returned: when op=resource_preference
      type: str
    todo:
      description: Todo record (todo_get, todo_create).
      returned: when op=todo_get or op=todo_create
      type: dict
    updated:
      description: Whether the status was changed.
      returned: when op=todo_update_status
      type: bool
  module: gludd_db
general_ludd.agent.gludd_dispatch:
  DOCUMENTATION:
    description:
    - C(state=dispatch) POSTs a tool-call to C(POST /api/dispatch) with a C(kind)/C(name)/C(args)
      body and returns the dispatch result as C(ansible_facts.gludd_dispatch).
    - C(state=available) calls C(GET /api/dispatch/available) and returns the list
      of dispatchable tool handlers.
    - C(state=recent) calls C(GET /api/dispatch/recent) and returns the most recent
      dispatch records.
    - PSK-authed; check-mode safe on C(state=available) and C(state=recent). C(state=dispatch)
      skips the API call in check mode and returns an empty result.
    module: gludd_dispatch
    options:
      args:
        description: Tool-call arguments dict (required for state=dispatch).
        type: dict
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      kind:
        description: Tool-call kind (required for state=dispatch).
        type: str
      name:
        description: Tool-call name / handler identifier (required for state=dispatch).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      state:
        choices:
        - dispatch
        - available
        - recent
        default: available
        description: Operation to perform.
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Interact with the daemon's dynamic-dispatch API
  EXAMPLES:
  - general_ludd.agent.gludd_dispatch:
      args:
        command: echo hello
      kind: tool
      name: shell
      state: dispatch
    name: Dispatch a tool call
    register: dispatch_result
  - general_ludd.agent.gludd_dispatch:
      state: available
    name: List available dispatch handlers
    register: available_result
  - general_ludd.agent.gludd_dispatch:
      state: recent
    name: Fetch recent dispatch records
    register: recent_result
  RETURN:
    ansible_facts:
      description: Contains C(gludd_dispatch) with the dispatch result or records.
      returned: always
      type: dict
    handlers:
      description: List of available dispatch handler dicts (state=available).
      returned: when state=available
      type: list
    records:
      description: List of recent dispatch record dicts (state=recent).
      returned: when state=recent
      type: list
    result:
      description: The dispatch outcome (state=dispatch).
      returned: when state=dispatch
      type: dict
  module: gludd_dispatch
general_ludd.agent.gludd_embed:
  DOCUMENTATION:
    description:
    - With C(op=similar) (the default) queries the daemon's read-only C(POST /api/embeddings/similar)
      endpoint and returns the ranked similar canonical task types under C(ansible_facts.gludd_embed)
      so a playbook (or the model running a job) can borrow a good model/prompt from
      a semantically-neighboring task type.
    - With C(op=compare) queries C(POST /api/embeddings/compare) to measure the pairwise
      similarity of two strings (C(text_a)/C(text_b)) produced by separate bots/agents
      — so a role can decide how to proceed (near-duplicate strings -> merge/dedupe;
      divergent -> escalate). Supply C(texts) (2+) instead for the full pairwise similarity
      matrix. The snapshot is injected under C(ansible_facts.gludd_embed).
    - With C(op=search) queries C(POST /api/embeddings/search) to take a string a
      bot produced (C(text)) and search a real corpus with it (RAG search), returning
      the C(top_k) most-similar items ranked by cosine similarity. C(corpus) selects
      the corpus — C(skills) (the live skill registry, descriptions matched on the
      fly), C(task_types) (the canonical task types), C(prompts) (the persisted prompt
      profiles), C(traces) (recent execution traces, work_type/phase/span descriptions
      matched on the fly), or C(events) (recent audit events, event_type/entity_type
      and a summary of the details JSON matched on the fly). The snapshot is injected
      under C(ansible_facts.gludd_embed).
    - Read-only and check-mode safe — it performs no writes (C(changed=False)).
    - Similarity is computed over the same embedding layer the adaptive router uses
      (HashEmbedder offline, OpenAIEmbedder when C(OPENAI_API_KEY) is set on the daemon).
    module: gludd_embed
    options:
      corpus:
        choices:
        - skills
        - task_types
        - prompts
        - traces
        - events
        default: skills
        description:
        - The real corpus to search when C(op=search). C(skills) matches the live
          skill registry; C(task_types) matches the canonical task types; C(prompts)
          matches the persisted prompt profiles (each prompt_text embedded on the
          fly); C(traces) matches recent execution traces (each trace's work_type/phase
          labels/span descriptions embedded on the fly); C(events) matches recent
          audit events (each event's event_type/entity_type and a summary of its details
          JSON embedded on the fly).
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      include_embedding:
        default: false
        description: When true, the query embedding vector is returned in the snapshot.
        type: bool
      include_embeddings:
        default: false
        description:
        - When true, the computed embedding vectors are returned — the pairwise vectors
          for C(op=compare), or the query vector for C(op=search).
        type: bool
      op:
        choices:
        - similar
        - compare
        - search
        default: similar
        description:
        - Which embeddings operation to run. C(similar) ranks canonical task types
          for C(text); C(compare) measures pairwise similarity of C(text_a)/C(text_b)
          (or a C(texts) batch); C(search) takes C(text) and searches the C(corpus)
          for the C(top_k) most-similar items.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      text:
        description:
        - The work description to match against the canonical task types (C(op=similar))
          or the query string to search the corpus with (C(op=search)). Required for
          both.
        type: str
      text_a:
        description: First string to compare. Used (with C(text_b)) when C(op=compare).
        type: str
      text_b:
        description: Second string to compare. Used (with C(text_a)) when C(op=compare).
        type: str
      texts:
        description:
        - Batch form for C(op=compare) — a list of 2+ strings; returns the pairwise
          similarity matrix instead of a single score.
        elements: str
        type: list
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      top_k:
        default: 5
        description:
        - Number of items to return (1-20) — similar task types for C(op=similar),
          or corpus matches for C(op=search).
        type: int
      work_type:
        description:
        - Optional filter — restrict the result to this canonical task-type value
          (e.g. C(bug_fix), C(feature), C(refactor)).
        type: str
    short_description: Embedding similarity over the daemon's bert surface
  EXAMPLES:
  - general_ludd.agent.gludd_embed:
      text: Track down why the request handler intermittently returns 500s
    name: Find task types similar to this work
    register: embed
  - ansible.builtin.debug:
      msg: Closest type is {{ ansible_facts.gludd_embed.results[0].task_type }} ({{
        ansible_facts.gludd_embed.results[0].similarity_score }})
    name: Use the closest task type's routing
    when: ansible_facts.gludd_embed.results | length > 0
  - general_ludd.agent.gludd_embed:
      op: compare
      text_a: '{{ agent_one_output }}'
      text_b: '{{ agent_two_output }}'
    name: Compare two strings from separate agents to decide merge vs escalate
    register: cmp
  - ansible.builtin.debug:
      msg: near-duplicate, dedupe
    name: Treat near-duplicates as a merge
    when: ansible_facts.gludd_embed.similarity | default(0) > 0.9
  - general_ludd.agent.gludd_embed:
      corpus: skills
      op: search
      text: '{{ bot_request }}'
      top_k: 3
    name: Search the skills corpus with a string the bot produced
    register: hit
  - ansible.builtin.debug:
      msg: Best skill is {{ ansible_facts.gludd_embed.results[0].name }} ({{ ansible_facts.gludd_embed.results[0].similarity_score
        }})
    name: Use the best-matching skill
    when: ansible_facts.gludd_embed.results | length > 0
  RETURN: "RETURN:\n  ansible_facts:\n    description: Facts dict containing the C(gludd_embed)\
    \ snapshot.\n    type: dict\n    returned: always\n    contains:\n      gludd_embed:\n\
    \        description:\n          - For C(op=similar): the snapshot with C(results)\
    \ (ranked task types),\n            C(query_embedding_dim), C(embedding_method),\
    \ and optionally\n            C(query_embedding).\n          - For C(op=compare):\
    \ the snapshot with C(similarity) (pairwise form) or\n            C(matrix) (batch\
    \ form), C(embedding_method), C(dim), and optionally\n            C(embeddings).\n\
    \          - For C(op=search): the snapshot with C(corpus), C(results) (ranked\n\
    \            items, each with C(rank)/C(name)/C(source_text)/C(similarity_score)/\n\
    \            C(metadata)), C(query_embedding_dim), C(embedding_method), and\n\
    \            optionally C(query_embedding).\n        type: dict\n        returned:\
    \ always"
  module: gludd_embed
general_ludd.agent.gludd_environment:
  DOCUMENTATION:
    description:
    - Queries the daemon's read-only C(GET /api/environment) endpoint and returns
      the consolidated environment brief under C(ansible_facts.gludd_environment)
      so a playbook (or the model running a job) can see the environment it runs inside
      and how to optimize for the task.
    - Read-only and check-mode safe — it performs no writes.
    - Exposes C(models) (roster, NO secrets), C(routing), C(budget), C(compute), C(tools),
      C(skills), C(queues), C(system), and C(optimization) (advisor hints + per-work-type
      recommended profiles).
    - The model roster NEVER contains api keys, tokens, or credential aliases.
    module: gludd_environment
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      priority:
        choices:
        - cost
        - quality
        - latency
        default: quality
        description:
        - Optimization priority forwarded to the advise endpoint. Only used when C(work_type)
          is set.
        type: str
      prompt_tokens:
        description:
        - Optional prompt size (tokens) forwarded to the advise endpoint so the cost
          projection and context-fit hint are accurate. Only used when C(work_type)
          is set.
        type: int
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      work_type:
        description:
        - When set, ALSO query C(GET /api/environment/advise?work_type=...) and merge
          the per-task recommendation under C(ansible_facts.gludd_environment.advice).
          Free-form work kind, e.g. C(feature), C(bugfix), C(refactor), C(review),
          C(docs), C(chat).
        - When unset (the default) no advise call is made and no C(advice) key is
          added.
        type: str
    short_description: Inject the consolidated environment + optimization brief as
      ansible_facts
  EXAMPLES:
  - general_ludd.agent.gludd_environment: null
    name: Load gludd environment brief
    register: env
  - ansible.builtin.debug:
      msg: Use {{ ansible_facts.gludd_environment.optimization.recommended_profile_for.mechanical
        }}
    name: Prefer the recommended profile for mechanical work
  - ansible.builtin.debug:
      msg: Budget pressure detected
    name: Warn when budget pressure is flagged
    when: ansible_facts.gludd_environment.optimization.hints | selectattr('signal',
      'equalto', 'budget') | list | length > 0
  RETURN:
    ansible_facts:
      contains:
        gludd_environment:
          description:
          - Environment brief with C(models), C(routing), C(budget), C(compute), C(tools),
            C(skills), C(queues), C(system), and C(optimization).
          returned: always
          type: dict
      description: Facts dict containing the C(gludd_environment) snapshot.
      returned: always
      type: dict
  module: gludd_environment
general_ludd.agent.gludd_facts:
  DOCUMENTATION:
    description:
    - Queries the daemon's read-only C(GET /api/facts) aggregation endpoint and returns
      the structured snapshot under C(ansible_facts.gludd) so a playbook can branch
      on live data in C(when:) / C(vars:).
    - Read-only and check-mode safe — it performs no writes.
    - Exposes C(gludd.work), C(gludd.todos), C(gludd.models), C(gludd.history), and
      C(gludd.messages).
    module: gludd_facts
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      project_id:
        description: Optional project scope for the facts snapshot.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Inject live daemon facts (work/todo/model/history/messages)
      as ansible_facts
  EXAMPLES:
  - general_ludd.agent.gludd_facts: null
    name: Load gludd facts
    register: facts
  - general_ludd.agent.gludd_facts: null
    name: Only proceed when there is backlog
  - ansible.builtin.debug:
      msg: Backlog is {{ gludd.todos.backlog_size }}
    name: Branch on backlog size
    when: gludd.todos.backlog_size | int > 0
  RETURN:
    ansible_facts:
      contains:
        gludd:
          description: The aggregated facts snapshot (work/todos/models/history/messages).
          returned: always
          type: dict
      description: Facts dict containing the C(gludd) snapshot.
      returned: always
      type: dict
  module: gludd_facts
general_ludd.agent.gludd_features:
  DOCUMENTATION:
    description:
    - C(state=list) calls C(GET /api/features) and returns all features (optionally
      filtered by status/category) as C(ansible_facts.gludd_features).
    - C(state=verify) calls C(POST /api/features/verify) to trigger the server-side
      FeatureVerifier pass and returns the verification summary + per-feature results.
    - Both operations are read-only from the controller perspective; the daemon may
      persist verification results internally on a C(state=verify) call.
    - PSK-authed; check-mode safe on C(state=list). C(state=verify) skips the API
      call in check mode and returns an empty summary.
    module: gludd_features
    options:
      category:
        description: Filter by feature category when C(state=list).
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      project_id:
        description: Optional project scope for the verify call.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      state:
        choices:
        - list
        - verify
        default: list
        description: Operation to perform.
        type: str
      status:
        choices:
        - requested
        - implemented
        - verified
        - regressed
        description: Filter by feature status when C(state=list).
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Fetch and verify the feature database via the daemon
  EXAMPLES:
  - general_ludd.agent.gludd_features: null
    name: Load all features as facts
    register: feat_result
  - general_ludd.agent.gludd_features:
      state: list
      status: verified
    name: List only verified features
    register: verified_feats
  - general_ludd.agent.gludd_features:
      state: verify
    name: Trigger server-side verification pass
    register: verify_result
  - ansible.builtin.debug:
      msg: '{{ verify_result.summary }}'
    name: Show verification summary
  RETURN:
    ansible_facts:
      description: Contains C(gludd_features) with the feature list (state=list).
      returned: when state=list
      type: dict
    features:
      description: List of feature dicts (state=list).
      returned: when state=list
      type: list
    results:
      description: Per-feature verification result list (state=verify).
      returned: when state=verify
      type: list
    summary:
      description: Verification summary dict (state=verify).
      returned: when state=verify
      type: dict
    total:
      description: Total number of features returned (state=list).
      returned: when state=list
      type: int
  module: gludd_features
general_ludd.agent.gludd_gate_check:
  DOCUMENTATION:
    description:
    - Reads the C(.gate-status) file written by C(make gate) and determines
    - whether the gate run is complete (a terminal marker is present) and
    - whether it passed.
    - C(gate_complete) is C(true) when the file exists and contains either
    - 'C(=== GATE: PASSED ===) or C(=== GATE: FAILED ===).'
    - C(gate_passed) is C(true) when the file exists, is complete, and
    - 'contains C(=== GATE: PASSED ===).'
    - Check-mode safe — this module performs no writes.
    - Wraps the same logic as C(scripts/gate_fresh_check.py).
    module: gludd_gate_check
    options:
      gate_path: {}
      state: {}
    short_description: Check whether a .gate-status file is complete and passed
  EXAMPLES:
  - general_ludd.agent.gludd_gate_check:
      gate_path: .gate-status
      state: check
    name: Check whether the gate is complete
    register: gate_result
  - ansible.builtin.assert:
      fail_msg: Gate did not pass — fix failures before proceeding.
      success_msg: Gate passed.
      that: gate_result.gate_passed
    name: Assert gate passed
  - ansible.builtin.meta: end_play
    name: Block commit if gate incomplete
    when: not gate_result.gate_complete
  RETURN: "RETURN:\n  gate_complete:\n    description:\n      - Whether the gate file\
    \ exists and contains a terminal marker\n        (C(=== GATE: PASSED ===) or C(===\
    \ GATE: FAILED ===)).\n    type: bool\n    returned: always\n  gate_passed:\n\
    \    description:\n      - Whether the gate file exists, is complete, and contains\n\
    \        C(=== GATE: PASSED ===).\n    type: bool\n    returned: always\n  gate_path:\n\
    \    description: The absolute path of the file that was checked.\n    type: str\n\
    \    returned: always"
  module: gludd_gate_check
general_ludd.agent.gludd_git:
  DOCUMENTATION:
    description:
    - Exposes gludd's hardened C(general_ludd.git_automation.GitAutomation)
    - control plane to roles/playbooks so an agent-authored job can perform git
    - operations WITHOUT reimplementing the safety logic.
    - This is a thin B(delegating wrapper) — it does not reimplement git. The
    - 'Python core provides per-repo C(.git/index.lock) serialization (issue #63),'
    - a bounded subprocess timeout, a non-interactive git environment,
    - leading-dash ref rejection, C(--) end-of-options separators, worktree-path
    - traversal guards, and typed results the daemon also consumes synchronously.
    - Keeping that core in Python (rather than a pure role) preserves those
    - guarantees; this module simply makes the same operations available on the
    - Ansible execution seam.
    - 'Idempotent where git is: C(init) reports C(changed=false) for an existing'
    - repository; C(branch) is a no-op if the branch already exists; C(commit)
    - reports C(changed=false) when there is nothing to commit.
    - Check-mode safe — read-only C(worktree_list) runs; mutating ops are skipped
    - in check mode and report the change they WOULD make.
    module: gludd_git
    options:
      branch: {}
      clone_allow_local: {}
      clone_url: {}
      files: {}
      gate_cmd: {}
      git_clone_timeout: {}
      message: {}
      op: {}
      path: {}
      remote: {}
      sha: {}
      source: {}
      state_reconciled_preserve_head_file: {}
      state_reconciled_preserve_heads: {}
      strategy: {}
      tag: {}
      target: {}
      target_dir: {}
      todo_id: {}
      worktree_path: {}
    short_description: Git control-plane ops (init/commit/branch/worktree/merge/push)
      via git_automation
  EXAMPLES:
  - general_ludd.agent.gludd_git:
      op: init
      path: /workspace/myrepo
    name: Initialize an automation repository
  - general_ludd.agent.gludd_git:
      message: 'auto: apply model-suggested fix'
      op: commit
      path: /tmp/worktrees/fix-auto-20260612
    name: Commit changes in worktree
    register: git_result
  - general_ludd.agent.gludd_git:
      branch: fix/auto-20260612
      op: branch
      path: /workspace/myrepo
    name: Create branch
  - general_ludd.agent.gludd_git:
      op: worktree_list
      path: /workspace/myrepo
    name: List worktrees
    register: wts
  - general_ludd.agent.gludd_git:
      branch: agent/TODO-1234/feature
      op: worktree_create
      path: /workspace/myrepo
      worktree_path: /workspace/myrepo-wt-1234
    name: Add an agent worktree on a new branch
  - general_ludd.agent.gludd_git:
      op: merge
      path: /workspace/myrepo
      source: agent/TODO-1234/feature
      strategy: ff
      target: main
    name: Fast-forward merge a green branch
  - general_ludd.agent.gludd_git:
      branch: main
      op: push
      path: /workspace/myrepo
    name: Push a branch to origin (bounded by the control-plane timeout)
  RETURN:
    branch:
      description: Branch name (op=branch/current_branch).
      returned: when op=branch/current_branch
      type: str
    result:
      description: Typed result dict for init/worktree/merge/push ops.
      returned: when op in (worktree_list, worktree_create, worktree_remove, merge,
        push)
      type: dict
    sha:
      description: Commit SHA (op=commit only).
      returned: when op=commit and changed=true
      type: str
  module: gludd_git
general_ludd.agent.gludd_human_todo:
  DOCUMENTATION:
    description:
    - Agents use this module to ask a human for something they cannot get on their
      own — a permission escalation, an external action, a decision, missing input,
      or another blocker. It is the structured replacement for "I gave up" log lines
      and event errors.
    - C(state=present) files a new human-todo via POST /api/human-todos. When C(parent_agent_todo_id)
      is set, the parent agent todo is moved to C(blocked_on_human) and will not be
      dispatched until the human resolves the request.
    - C(state=done) marks an existing human-todo done (human provided what was asked).
      C(state=dismissed) records that the human declined, so the agent knows to try
      a different approach.
    - Check mode skips write operations.
    module: gludd_human_todo
    options:
      agent_id:
        default: agent
        description: Filing agent's identifier (state=present).
        type: str
      body:
        description: Full markdown context — what's needed, why, links (state=present).
        type: str
      category:
        choices:
        - permission_escalation
        - external_action
        - decision
        - input_request
        - blocker
        default: blocker
        description: Request category (state=present).
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      human_resolution:
        description: What the human did/said (required for state=done).
        type: str
      human_resolver:
        default: operator
        description: Identifier of the human acting (done/dismissed).
        type: str
      id:
        description: Existing human-todo id (required for state=done/dismissed).
        type: str
      parent_agent_todo_id:
        description: Agent todo id that's blocked on this request (optional).
        type: str
      priority:
        choices:
        - low
        - medium
        - high
        - urgent
        default: medium
        description: Request priority (state=present).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      reason:
        description: Why the request is dismissed (required for state=dismissed).
        type: str
      state:
        choices:
        - present
        - done
        - dismissed
        default: present
        description: Desired state.
        type: str
      tags:
        default: []
        description: Optional tags for the request (state=present).
        elements: str
        type: list
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      title:
        description: Short human-readable summary (state=present).
        type: str
    short_description: File or resolve a bot→human request (HumanTodo) via the daemon
  EXAMPLES:
  - general_ludd.agent.gludd_human_todo:
      agent_id: implement_change_role
      body: 'I need to update the prod config but the current capability policy

        denies filesystem writes outside the workspace. Tried: gludd_db

        resource_preference, env-var override. Both rejected.

        '
      category: permission_escalation
      parent_agent_todo_id: TODO-abc123
      priority: high
      state: present
      title: Need write access to /etc/gludd/prod.conf
    name: Agent blocks on a permission escalation
    register: human_req
  - general_ludd.agent.gludd_human_todo:
      body: Model gateway returns 401 on every call; key is not in OpenBao or env.
      category: input_request
      priority: urgent
      state: present
      title: OPENAI_API_KEY not set in environment
    name: Agent asks for a missing API key
  - general_ludd.agent.gludd_human_todo:
      human_resolution: OPENAI_API_KEY rotated and loaded into OpenBao at secret/gludd/openai.
      human_resolver: shawn
      id: HTODO-...
      state: done
    name: Human marks the request done (the key is now set)
  RETURN:
    human_todo:
      description: The created/updated human-todo record.
      returned: always
      type: dict
    id:
      description: The human-todo id.
      returned: always
      type: str
  module: gludd_human_todo
general_ludd.agent.gludd_introspect:
  DOCUMENTATION:
    description:
    - Queries the daemon's read-only C(GET /api/facts) endpoint and returns the C(codebase)
      self-introspection block under C(ansible_facts.gludd.codebase) so a self-improvement
      playbook can pick a high-value target (low coverage intersect high churn intersect
      debt).
    - Read-only and check-mode safe — performs no writes.
    - Exposes C(gludd.codebase.churn), C(gludd.codebase.complexity), C(gludd.codebase.coverage),
      C(gludd.codebase.debt), C(gludd.codebase.dead_code), C(gludd.codebase.missing_tests),
      C(gludd.codebase.perf_cost), and C(gludd.codebase.recent_failures). Each facet
      is C(null) when its source is unavailable — nothing is faked.
    module: gludd_introspect
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Inject codebase self-knowledge facts (churn/complexity/coverage/debt)
      as ansible_facts
  EXAMPLES:
  - general_ludd.agent.gludd_introspect: null
    name: Load codebase introspection facts
    register: introspect
  - ansible.builtin.debug:
      msg: '{{ gludd.codebase.coverage.low_coverage }}'
    name: Pick a low-coverage target
    when: gludd.codebase.coverage is not none
  RETURN:
    ansible_facts:
      contains:
        gludd:
          description: Dict with a C(codebase) key holding the introspection snapshot.
          returned: always
          type: dict
      description: Facts dict containing the C(gludd.codebase) snapshot.
      returned: always
      type: dict
  module: gludd_introspect
general_ludd.agent.gludd_langchain_generate:
  DOCUMENTATION:
    description:
    - Sends a prompt to the daemon's POST /admin/models/call endpoint, which runs
      the generation through the LangChain-backed model gateway.
    - When C(response_schema) is supplied the returned text is fence-stripped and
      parsed as JSON; a parse failure is returned as a clean module failure rather
      than a traceback.
    - This module is stdlib-only; it never imports LangChain itself. All LangChain
      work happens server-side in the daemon.
    module: gludd_langchain_generate
    notes:
    - Check mode skips the actual model call and returns a placeholder.
    - C(model_profile) and C(route_task_type) are mutually exclusive.
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      max_tokens:
        default: 2048
        description: Maximum tokens to generate.
        type: int
      model_profile:
        description: 'Explicit model profile ID to use. Mutually exclusive with C(route_task_type).

          '
        type: str
      prompt:
        description: The prompt text to send to the model.
        required: true
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      response_schema:
        default: null
        description: 'When set, the model output is parsed as JSON (after stripping
          any Markdown code fences). The dict itself documents the expected shape.

          '
        type: dict
      route_task_type:
        description: 'Task type string for adaptive routing. Mutually exclusive with
          C(model_profile).

          '
        type: str
      system:
        default: ''
        description: Optional system instruction prepended to the request.
        type: str
      timeout:
        default: 120
        description: Request timeout in seconds.
        type: int
    short_description: Generate text (optionally structured JSON) via the daemon
  EXAMPLES:
  - general_ludd.agent.gludd_langchain_generate:
      model_profile: default
      prompt: Summarize the CI failure below in one sentence.
    name: Generate free-form text
    register: gen_result
  - general_ludd.agent.gludd_langchain_generate:
      prompt: Return the package name and version as JSON.
      response_schema:
        name: str
        version: str
    name: Generate structured JSON
    register: structured_result
  RETURN:
    model_profile_id:
      description: Profile that was actually used.
      returned: success
      type: str
    structured:
      description: 'Parsed JSON object when C(response_schema) was provided; otherwise
        null.

        '
      returned: success
      type: dict
    text:
      description: Generated text from the model (raw, fences intact).
      returned: success
      type: str
    usage:
      description: Token usage dict (prompt_tokens, completion_tokens, total_tokens).
      returned: success
      type: dict
  module: gludd_langchain_generate
general_ludd.agent.gludd_langgraph_decision:
  DOCUMENTATION:
    description:
    - Sends a decision prompt plus a list of allowed option tokens to the
    - daemon's POST /admin/models/call endpoint and asks the model to reply
    - 'with JSON of the form {"decision": ..., "rationale": ...}.'
    - The reply is fence-stripped and JSON-parsed; the chosen decision is
    - validated against C(options). On any failure (bad JSON, decision not in
    - the option set) the module falls back to the first option, marks
    - C(valid)=false, and records a warning rather than crashing.
    - This module is stdlib-only; it never imports LangGraph/LangChain.
    module: gludd_langgraph_decision
    options:
      daemon_url: {}
      model_profile: {}
      options: {}
      prompt: {}
      psk: {}
      route_task_type: {}
      system: {}
      timeout: {}
    short_description: Ask the model to choose one option from a fixed set
  EXAMPLES:
  - general_ludd.agent.gludd_langgraph_decision:
      model_profile: default
      options:
      - canary
      - blue_green
      - all_at_once
      prompt: Given the diff is large and risky, pick a rollout strategy.
    name: Choose a deployment strategy
    register: decision_result
  - ansible.builtin.debug:
      msg: Chose {{ decision_result.decision }} ({{ decision_result.rationale }})
    name: Use the decision token
  RETURN:
    decision:
      description: The chosen option token (always one of C(options)).
      returned: success
      type: str
    model_profile_id:
      description: Profile that was actually used.
      returned: success
      type: str
    rationale:
      description: Short rationale string from the model (may be empty).
      returned: success
      type: str
    raw:
      description: Raw model text (fences intact) for debugging.
      returned: success
      type: str
    valid:
      description: 'True if the model returned valid JSON with a decision in C(options);
        false if the module fell back to the first option.

        '
      returned: success
      type: bool
  module: gludd_langgraph_decision
general_ludd.agent.gludd_langgraph_workflow:
  DOCUMENTATION:
    description:
    - Sends a message list to the daemon's POST /admin/models/workflow endpoint, which
      executes a LangGraph generate -> review -> retry loop server-side and returns
      the best content plus quality metadata.
    - This module is stdlib-only; it never imports LangGraph itself. All graph execution
      happens in the daemon.
    module: gludd_langgraph_workflow
    notes:
    - Check mode skips the workflow and returns a placeholder.
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      enable_graph:
        default: true
        description: 'When false, the daemon runs a single-shot generation instead
          of the full graph (useful for debugging or when no review is wanted).

          '
        type: bool
      max_retries:
        default: 2
        description: Maximum generate/review retries before giving up.
        type: int
      model_profile:
        default: default
        description: Model profile ID for the workflow.
        type: str
      prompt:
        description: The user prompt to send to the workflow.
        required: true
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      quality_threshold:
        default: 0.6
        description: Minimum quality score (0-1) the output must reach.
        type: float
      system:
        default: ''
        description: Optional system instruction; prepended as a system message.
        type: str
      timeout:
        default: 300
        description: Request timeout in seconds.
        type: int
      work_type:
        default: code
        description: Kind of work the graph is producing (e.g. code, docs, plan).
        type: str
    short_description: Run a multi-step LangGraph generate/review workflow
  EXAMPLES:
  - general_ludd.agent.gludd_langgraph_workflow:
      prompt: Implement a function that reverses a linked list.
      quality_threshold: 0.7
      work_type: code
    name: Run a code-generation workflow
    register: wf_result
  - general_ludd.agent.gludd_langgraph_workflow:
      enable_graph: false
      prompt: Draft a release note for v1.2.0.
      work_type: docs
    name: Single-shot generation (no graph)
    register: wf_oneshot
  RETURN:
    content:
      description: Best content the workflow produced.
      returned: success
      type: str
    model:
      description: Model/profile that produced the content.
      returned: success
      type: str
    prompt_profile:
      description: Prompt profile used by the graph.
      returned: success
      type: str
    quality_score:
      description: Quality score (0-1) of the returned content.
      returned: success
      type: float
    retries:
      description: Number of retries the graph performed.
      returned: success
      type: int
    workflow_warnings:
      description: Any warnings emitted by the workflow.
      returned: success
      type: list
  module: gludd_langgraph_workflow
general_ludd.agent.gludd_make:
  DOCUMENTATION:
    description:
    - Runs a C(make) target through the C(MakeRunner) subprocess wrapper with proper
      sanitized environment, bounded output capture, and per-target timeout.
    - Supports both blocking and streaming modes.
    - Returns structured result (rc, stdout_tail, stderr_tail, success, phases).
    module: gludd_make
    notes:
    - Uses C(MakeRunner) from C(general_ludd.commands.make).
    - Phase markers of the form C(=== PHASE NAME ===) in stdout are extracted automatically.
    - The C(no_log) flag suppresses Ansible logging of parameters and results.
    options:
      cwd:
        description: Working directory for the C(make) invocation.
        required: false
        type: str
      env_extra:
        description: Extra environment variables to pass into the subprocess.
        required: false
        type: dict
      extra_args:
        default: []
        description: Additional arguments passed as C(make) variable assignments (e.g.
          C([TESTFILE=tests/unit/test_foo.py])).
        elements: str
        required: false
        type: list
      no_log:
        default: false
        description: Prevent logging of this invocation (for sensitive targets).
        required: false
        type: bool
      stream:
        default: false
        description: Whether to stream output with phase-marker callbacks.
        required: false
        type: bool
      target:
        description: The make target to run (e.g. C(test), C(lint), C(gate)).
        required: true
        type: str
      timeout_s:
        description: Per-target timeout in seconds. Defaults to 300s.
        required: false
        type: int
    short_description: Run a make target via the MakeRunner abstraction
  EXAMPLES:
  - general_ludd.agent.gludd_make:
      target: test
    name: Run make test
    register: result
  - general_ludd.agent.gludd_make:
      extra_args:
      - TESTFILE=tests/unit/test_foo.py
      target: test-specific
    name: Run make test-specific for one file
    register: result
  - general_ludd.agent.gludd_make:
      target: gate
      timeout_s: 3600
    name: Run make gate with long timeout
    register: gate_result
  - ansible.builtin.assert:
      fail_msg: Gate failed — {{ gate_result.stdout_tail[-200:] }}
      success_msg: Gate passed.
      that: gate_result.success
    name: Assert gate passed
  - general_ludd.agent.gludd_make:
      target: lint
    name: Run make lint
    register: lint_result
  - general_ludd.agent.gludd_make:
      env_extra:
        DEBUG: '1'
      target: test
    name: Run make with extra env
    register: debug_test_result
  RETURN:
    duration_s:
      description: Wall-clock duration of the run in seconds.
      returned: always
      type: float
    error:
      description: Error message when spawn or exec fails.
      returned: on error
      type: str
    exit_code:
      description: Process exit code (C(None) if spawn failed).
      returned: always
      type: int
    oom_killed:
      description: C(true) when the process was killed by OOM (exit -9 or 137).
      returned: always
      type: bool
    phases:
      description: Phase markers extracted from stdout.
      returned: always
      type: list
    stderr_tail:
      description: Last 16000 characters of stderr.
      returned: always
      type: str
    stdout_tail:
      description: Last 16000 characters of stdout.
      returned: always
      type: str
    success:
      description: C(true) when exit code is 0 and no timeout or OOM kill.
      returned: always
      type: bool
    target:
      description: The make target that was run.
      returned: always
      type: str
    timed_out:
      description: C(true) when the command exceeded its timeout.
      returned: always
      type: bool
  module: gludd_make
general_ludd.agent.gludd_mcp_tool:
  DOCUMENTATION:
    description:
    - 'Per the W3.9 decision in TASKS.md (MCP honestly fenced): the daemon'
    - loads C(mcp_servers) config but passes C(mcp_client=None) — no MCP
    - tools can be called through the daemon today.
    - This module exists so playbooks can reference C(general_ludd.agent.gludd_mcp_tool)
    - without import errors; it always returns C(not_implemented=true) and
    - 'C(failed=false) so callers can C(when: not mcp_result.not_implemented)'
    - gate around it cleanly.
    - When MCP wiring (W3.9 option a) is completed, replace the body of this
    - module and remove this note.
    module: gludd_mcp_tool
    options:
      arguments: {}
      daemon_url: {}
      psk: {}
      server: {}
      timeout: {}
      tool: {}
    short_description: Invoke an MCP tool (honest placeholder — not yet wired)
  EXAMPLES:
  - general_ludd.agent.gludd_mcp_tool:
      arguments:
        path: /workspace/myfile.py
      server: filesystem
      tool: read_file
    name: Attempt MCP tool call
    register: mcp_result
  - ansible.builtin.debug:
      msg: 'MCP result: {{ mcp_result.result }}'
    name: Only use result if MCP is wired
    when: not mcp_result.not_implemented
  RETURN:
    not_implemented:
      description: Always true until W3.9 option (a) is completed.
      returned: always
      type: bool
    reason:
      description: Explanation of why MCP is not yet available.
      returned: always
      type: str
    result:
      description: Tool result (empty until wired).
      returned: always
      type: dict
  module: gludd_mcp_tool
general_ludd.agent.gludd_message:
  DOCUMENTATION:
    description:
    - Talks to the daemon message-queue API so agents/roles can coordinate.
    - C(state=send) posts a message to a recipient role/agent (or C(broadcast)).
    - C(state=receive) fetches the inbox for C(recipient); messages are returned both
      as C(ansible_facts.gludd_inbox) and a C(messages) list. Pass C(ack=true) to
      mark every received message read in the same task.
    - C(state=ack) marks a single C(message_id) read.
    - Check mode skips the write side of C(send)/C(ack); C(receive) is always safe.
    module: gludd_message
    options:
      ack:
        default: false
        description: When receiving, also mark each returned message read.
        type: bool
      body:
        default: ''
        description: Message body (send). May carry sensitive content — not logged.
        no_log: true
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      message_id:
        description: Message id to ack (required for ack).
        type: str
      priority:
        choices:
        - low
        - normal
        - high
        - urgent
        default: normal
        description: Message priority (send).
        type: str
      project_id:
        description: Optional project scope.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      recipient:
        description: Recipient role/agent name, or C(broadcast) (send/receive).
        type: str
      sender:
        description: Sender role/agent name (required for send).
        type: str
      state:
        choices:
        - send
        - receive
        - ack
        description: Operation to perform.
        required: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      topic:
        default: ''
        description: Message topic (send).
        type: str
      ttl_seconds:
        description: Optional time-to-live in seconds (send); expired messages are
          purged.
        type: int
      unread:
        default: true
        description: When receiving, only return unread messages.
        type: bool
    short_description: Inter-agent message queue — send, receive, or ack messages
      via the daemon
  EXAMPLES:
  - general_ludd.agent.gludd_message:
      body: 'PR #42 is ready'
      recipient: reviewer
      sender: coder
      state: send
      topic: ready-for-review
    name: Send a message to the reviewer role
  - general_ludd.agent.gludd_message:
      recipient: broadcast
      sender: planner
      state: send
      topic: standup
    name: Broadcast to everyone
  - general_ludd.agent.gludd_message:
      ack: true
      recipient: coder
      state: receive
    name: Receive and ack my inbox
    register: mail
  - general_ludd.agent.gludd_message:
      message_id: MSG-ABC123
      state: ack
    name: Ack one message
  RETURN:
    acked:
      description: Whether the message was acked (ack, or receive with ack=true).
      returned: when state=ack or state=receive
      type: bool
    ansible_facts:
      description: Contains C(gludd_inbox) with the received messages (receive).
      returned: when state=receive
      type: dict
    message:
      description: The created message (send).
      returned: when state=send
      type: dict
    messages:
      description: List of inbox messages (receive).
      returned: when state=receive
      type: list
  module: gludd_message
general_ludd.agent.gludd_metrics:
  DOCUMENTATION:
    description:
    - Queries the daemon's read-only C(GET /api/metrics) endpoint and returns the
      metrics snapshot under C(ansible_facts.gludd_metrics) so a playbook can branch
      on live cost/usage/benchmark data in C(when:) / C(vars:).
    - Read-only and check-mode safe — it performs no writes.
    - Exposes agent-level metrics, global per-model usage, per-project cost, and benchmark
      rankings (when benchmark data is available).
    - Reuses the daemon's MetricsCollector / BenchmarkRepository — no stat logic is
      recomputed client-side.
    module: gludd_metrics
    options:
      agent_id:
        description: Optional agent filter (single agent's summary).
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      project_id:
        description: Optional project filter (per-project agents + cost).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Inject live daemon metrics (agents/usage/cost/benchmarks) as
      ansible_facts
  EXAMPLES:
  - general_ludd.agent.gludd_metrics: null
    name: Load gludd metrics
    register: metrics
  - ansible.builtin.debug:
      msg: 'Running agents: {{ ansible_facts.gludd_metrics.running_agents }}'
    name: Branch on total agent count
  - general_ludd.agent.gludd_metrics:
      project_id: alpha
    name: Per-project cost only
    register: alpha_metrics
  - ansible.builtin.fail:
      msg: Project cost too high
    name: Halt when a project blew its cost budget
    when: (ansible_facts.gludd_metrics.cost_by_project['alpha'] | default(0) | float)
      > 10.0
  RETURN:
    ansible_facts:
      contains:
        gludd_metrics:
          description:
          - Metrics snapshot with C(agents), C(total_agents), C(running_agents), C(global_model_usage),
            C(cost_by_project), and C(benchmark_rankings).
          returned: always
          type: dict
      description: Facts dict containing the C(gludd_metrics) snapshot.
      returned: always
      type: dict
  module: gludd_metrics
general_ludd.agent.gludd_model_call:
  DOCUMENTATION:
    description:
    - Sends a prompt to the daemon's POST /admin/models/call endpoint.
    - Supports direct model profile selection or adaptive routing by task type.
    - Returns the generated text plus usage metadata.
    module: gludd_model_call
    notes:
    - Check mode skips the actual model call and returns a placeholder.
    - C(model_profile) and C(route_task_type) are mutually exclusive.
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      max_tokens:
        default: 2048
        description: Maximum tokens to generate.
        type: int
      model_profile:
        description: 'Explicit model profile ID to use. Mutually exclusive with C(route_task_type).

          '
        type: str
      prompt:
        description: The prompt text to send to the model.
        required: true
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      route_task_type:
        description: 'Task type string for adaptive routing (uses /admin/code/suggest-model
          logic). Mutually exclusive with C(model_profile).

          '
        type: str
      timeout:
        default: 120
        description: Request timeout in seconds.
        type: int
    short_description: Run a model generation via the daemon API
  EXAMPLES:
  - general_ludd.agent.gludd_model_call:
      model_profile: default
      prompt: 'Write a docstring for function foo(x: int) -> str'
    name: Call model directly
    register: model_result
  - general_ludd.agent.gludd_model_call:
      prompt: Explain the test failure below
      route_task_type: code_review
    name: Use adaptive routing
    register: routed_result
  RETURN:
    model_profile_id:
      description: Profile that was actually used.
      returned: success
      type: str
    text:
      description: Generated text from the model.
      returned: success
      type: str
    usage:
      description: Token usage dict (prompt_tokens, completion_tokens, total_tokens).
      returned: success
      type: dict
  module: gludd_model_call
general_ludd.agent.gludd_observe:
  DOCUMENTATION:
    description:
    - Provides the Ansible seam for the cross-source C(GluddObserve) facade.
    - Discovers only operator-registered sources from C(GET /api/observe/sources)
      and queries them by registered name through C(POST /api/observe/query). Callers
      cannot supply connector URLs, preserving the daemon's SSRF boundary.
    - Supports merged queries, timelines, incident correlation, and service/host topology
      without duplicating the canonical normalization logic.
    - Read-only and check-mode safe. A failing connector is isolated into the returned
      C(errors) list instead of aborting successful sources.
    module: gludd_observe
    options:
      by:
        default: trace_id
        description: Canonical join key for C(correlate_incident).
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the Gludd daemon.
        type: str
      end:
        description: Optional inclusive end epoch for query and timeline operations.
        type: float
      kinds:
        default:
        - logs
        - traces
        - metrics
        - events
        description: Connector kinds admitted to the operation.
        elements: str
        type: list
      op:
        choices:
        - query_sources
        - timeline
        - correlate_incident
        - topology
        description: Cross-source operation to run.
        required: true
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon authentication.
        no_log: true
        type: str
      role:
        default: observe
        description: Capability identity recorded with the result for operator attribution.
        type: str
      seed:
        default: {}
        description: Normalized incident record used by C(correlate_incident).
        type: dict
      spec:
        default: {}
        description: Backend query specification forwarded to each registered source.
        type: dict
      start:
        description: Optional inclusive start epoch for query and timeline operations.
        type: float
      timeout:
        default: 30
        description: Per-request timeout in seconds.
        type: int
      window_s:
        default: 300.0
        description: Half-window around the incident seed timestamp, in seconds.
        type: float
    short_description: Correlate registered observability sources through the Gludd
      daemon
  EXAMPLES:
  - general_ludd.agent.gludd_observe:
      end: 1785581100
      kinds:
      - logs
      - traces
      - metrics
      op: timeline
      psk: '{{ vault_gludd_psk }}'
      start: 1785580800
    name: Build a time-ordered incident timeline
    register: timeline
  - general_ludd.agent.gludd_observe:
      by: trace_id
      op: correlate_incident
      seed:
        labels:
          trace_id: trace-123
        ts: 1785580950
    name: Correlate an incident by trace ID
  RETURN:
    ansible_facts:
      contains:
        gludd_observe:
          description:
          - Result payload. It contains C(records), C(groups), or C(topology) depending
            on C(op), plus isolated connector C(errors).
          returned: always
          type: dict
      description: Facts containing the selected C(gludd_observe) operation result.
      returned: always
      type: dict
  module: gludd_observe
general_ludd.agent.gludd_open_code:
  DOCUMENTATION:
    description:
    - Codifies the repeated back-and-forth tool-call patterns opencode agents perform
      by bundling multiple tool calls into single Ansible tasks.
    - Each action maps to a make target that composites the underlying checks.
    - Check-mode safe — all actions report the change they WOULD make without executing
      the underlying command.
    - All actions run locally via C(ansible.builtin.command) executing make targets
      in the repository root; no daemon round-trips are needed.
    module: gludd_open_code
    options:
      action:
        choices:
        - gate_check
        - push_and_verify
        - commit_ship
        - test_batch
        - status_check
        description:
        - The bundled operation to perform.
        - C(gate_check) — lint + typecheck + collect in one call (make gate-fast).
        - C(push_and_verify) — push master + verify remote SHA + poll CI (make ci-push-and-verify).
        - C(commit_ship) — add + commit + push + verify in one call (make ship).
        - C(test_batch) — run multiple test files in one invocation (make test-batch).
        - C(status_check) — regenerate status table + verify it is current (make status-update).
        required: true
        type: str
      branch:
        default: master
        description: Branch name for push_and_verify or commit_ship (defaults to master).
        type: str
      ci_timeout:
        default: 600
        description: Maximum seconds to wait for CI when wait_for_ci=true.
        type: int
      commit_msg:
        description: Commit message (required when action=commit_ship).
        type: str
      repo_path:
        default: .
        description: Path to the git repository root where make targets are defined.
        type: str
      test_files:
        description:
        - Space-separated list of test file paths (required when action=test_batch).
        - Passed as the C(TESTFILES) variable to C(make test-batch).
        elements: str
        type: list
      wait_for_ci:
        default: true
        description: When true, push_and_verify polls CI after push until completion
          or timeout.
        type: bool
    short_description: Batched opencode agent tool patterns — gate, push, commit,
      test, status
  EXAMPLES:
  - general_ludd.agent.gludd_open_code:
      action: gate_check
      repo_path: /workspace/gludd
    name: Run fast gate check (lint + typecheck + collect)
    register: gate_result
  - general_ludd.agent.gludd_open_code:
      action: commit_ship
      commit_msg: 'feat: add batched opencode patterns'
      repo_path: /workspace/gludd
    name: Commit all changes and ship to remote
    register: ship_result
  - general_ludd.agent.gludd_open_code:
      action: push_and_verify
      branch: master
      ci_timeout: 600
      repo_path: /workspace/gludd
      wait_for_ci: true
    name: Push master and poll CI until green
    register: push_result
  - general_ludd.agent.gludd_open_code:
      action: test_batch
      repo_path: /workspace/gludd
      test_files:
      - tests/unit/test_module_a.py
      - tests/unit/test_module_b.py
    name: Run a batch of test files
    register: test_result
  - general_ludd.agent.gludd_open_code:
      action: status_check
      repo_path: /workspace/gludd
    name: Regenerate and verify README status table
    register: status_result
  RETURN:
    action:
      description: The action that was performed.
      returned: always
      sample: gate_check
      type: str
    changed:
      description: Whether the action changed system state.
      returned: always
      sample: true
      type: bool
    cmd:
      description: The full command that was executed (or would be in check mode).
      returned: always
      sample: make gate-fast
      type: str
    elapsed_seconds:
      description: Wall-clock duration of the command execution.
      returned: when command ran
      sample: 12.34
      type: float
    rc:
      description: Return code of the command (None in check mode).
      returned: always
      sample: 0
      type: int
    skipped:
      description: True when run in check mode (no command executed).
      returned: always
      sample: false
      type: bool
    stderr:
      description: Standard error of the command.
      returned: always
      type: str
    stdout:
      description: Standard output of the command (truncated to last 2000 chars).
      returned: always
      type: str
  module: gludd_open_code
general_ludd.agent.gludd_ornith:
  DOCUMENTATION:
    description:
    - Bidirectional seam for the gludd × Ornith symbiotic loop. Two states: null
    - C(state=pairs) — fetch the most-recent training pairs whose outcome matches
      a comma-separated status list (e.g. C(rejected_by_gate,rejected_by_review,reverted)).
      These are the artifacts that NEED improvement. Hits the daemon's C(GET /admin/ornith/pairs)
      endpoint.
    - C(state=improve) — invoke the daemon's model gateway (C(POST /admin/models/call))
      with a structured "improve this artifact" prompt and return the proposed diff.
      The caller is responsible for writing the diff to disk, opening a PR, and filing
      a human-todo for review. The PR is NEVER auto-merged — the human-todo is the
      gate.
    - Check mode skips both the network call and the model invocation.
    module: gludd_ornith
    options:
      agent_id:
        default: ornith_self_improve
        description: Filing agent identifier (recorded in the daemon audit row).
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      limit:
        default: 10
        description: Maximum pairs to return (state=pairs).
        type: int
      lookback_days:
        default: 14
        description: Restrict to pairs invoked within the last N days (state=pairs).
        type: int
      max_iterations:
        default: 5
        description: Max tool-call iterations for the improvement rollout.
        type: int
      model_profile:
        default: ''
        description: Model profile to route the improvement call through.
        type: str
      project_id:
        default: ''
        description: Optional project filter (state=pairs).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      state:
        choices:
        - pairs
        - improve
        default: improve
        description: Desired state.
        type: str
      status:
        default: rejected_by_gate,rejected_by_review,reverted
        description: Comma-separated outcome statuses to filter on (state=pairs).
        type: str
      target_files:
        default: []
        description: List of artifact paths to improve (state=improve).
        elements: str
        type: list
      task_description:
        default: ''
        description: 'The structured task prompt for the improvement rollout (state=improve).
          The role passes a templated string that names the artifact and cites the
          failure outcomes.

          '
        type: str
      timeout:
        default: 120
        description: Request timeout in seconds.
        type: int
    short_description: Pull rejected Ornith training pairs and invoke improvement
      rollouts
  EXAMPLES:
  - general_ludd.agent.gludd_ornith:
      limit: 10
      lookback_days: 14
      state: pairs
      status: rejected_by_gate,rejected_by_review,reverted
    name: Pull the rejected training pairs
    register: pairs
  - general_ludd.agent.gludd_ornith:
      max_iterations: 5
      state: improve
      target_files:
      - playbooks/agent_orchestrate.yml
      task_description: Improve this playbook based on the 3 gate failures attached.
    name: Invoke Ornith to improve an artifact
    register: rollout
  RETURN:
    count:
      description: Number of pairs returned (state=pairs).
      returned: when state=pairs
      type: int
    pairs:
      description: List of matching training pairs (state=pairs).
      returned: when state=pairs
      type: list
    patch:
      description: The proposed improvement text (state=improve).
      returned: when state=improve
      type: str
    usage:
      description: Token usage from the model call (state=improve).
      returned: when state=improve
      type: dict
  module: gludd_ornith
general_ludd.agent.gludd_osquery:
  DOCUMENTATION:
    description:
    - Runs a B(read-only) C(SELECT) query against C(osqueryi --json) and returns the
      result rows under C(ansible_facts.gludd_osquery) so a playbook (or the model
      running a job) can branch on real system state — processes, users, mounts, network
      interfaces, installed packages, system_info, etc.
    - SECURITY — only C(SELECT) queries are permitted. The query is validated to start
      with C(SELECT) (after optional C(WITH ...) CTEs) and is rejected if it contains
      any mutating / side-effecting keyword (C(INSERT)/C(UPDATE)/C(DELETE)/C(DROP)/C(CREATE)/C(ALTER)/C(ATTACH)/
      C(DETACH)/C(PRAGMA)/C(REPLACE)/C(VACUUM)). osquery's virtual tables are mostly
      read-only, but this module refuses to even hand a write-shaped query to the
      binary.
    - The osquery binary is resolved from the daemon's filestore (C(binaries/osquery),
      downloaded on first use by the BinaryBootstrapper) when running in the same
      venv as the daemon; otherwise it falls back to an C(osqueryi) on the system
      C(PATH).
    - Runs the binary via an explicit argument list (never C(shell=True)).
    - Read-only and check-mode safe — it performs no writes. In check mode the query
      is validated and the binary located, but osquery is not executed.
    module: gludd_osquery
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon (reserved for future remote resolution).
        type: str
      osquery_path:
        default: ''
        description:
        - Explicit path to the C(osqueryi) binary. When unset the module resolves
          it from the daemon filestore, then from the system C(PATH).
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      query:
        description: A single read-only osquery SQL C(SELECT) statement.
        required: true
        type: str
      timeout:
        default: 10
        description: Subprocess timeout in seconds for the osqueryi call.
        type: int
    short_description: Query live system state via osquery and inject rows as ansible_facts
  EXAMPLES:
  - general_ludd.agent.gludd_osquery:
      query: SELECT pid, name, state FROM processes LIMIT 20
    name: List running processes
    register: procs
  - ansible.builtin.debug:
      msg: nginx is running
    name: Branch on a process being present
    when: ansible_facts.gludd_osquery.rows | selectattr('name', 'equalto', 'nginx')
      | list | length > 0
  - general_ludd.agent.gludd_osquery:
      query: SELECT hostname, cpu_brand, physical_memory FROM system_info
    name: System info
  RETURN:
    ansible_facts:
      contains:
        gludd_osquery:
          contains:
            count:
              description: Number of rows returned.
              type: int
            query:
              description: The validated query that was executed.
              type: str
            rows:
              description: List of result rows (each a dict of column->value).
              type: list
          description: The osquery result — C(rows), C(count), and the C(query) run.
          returned: always
          type: dict
      description: Facts dict containing the C(gludd_osquery) result.
      returned: always
      type: dict
  module: gludd_osquery
general_ludd.agent.gludd_ping:
  DOCUMENTATION:
    description:
    - Pings the general_ludd daemon by calling /healthz.
    - Returns C(pong=true) and C(daemon_reachable) flag.
    - Safe to use in check mode (read-only).
    module: gludd_ping
    notes:
    - Always reports C(changed=false) — this is a read-only probe.
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 10
        description: Request timeout in seconds.
        type: int
    short_description: Verify daemon reachability
  EXAMPLES:
  - general_ludd.agent.gludd_ping:
      daemon_url: http://localhost:8000
    name: Ping the daemon
    register: ping_result
  - ansible.builtin.assert:
      that: ping_result.daemon_reachable
    name: Assert daemon reachable
  RETURN:
    daemon_reachable:
      description: Whether /healthz responded 200.
      returned: always
      type: bool
    daemon_url:
      description: URL that was probed.
      returned: always
      type: str
    pong:
      description: Always true when module succeeds.
      returned: always
      type: bool
  module: gludd_ping
general_ludd.agent.gludd_proc_monitor:
  DOCUMENTATION:
    description:
    - Queries the daemon's managed-process stats API and returns per-process resource
      utilization under C(ansible_facts.gludd_proc_monitor) so a playbook (or the
      model running a job) can branch on real process health — CPU, memory (RSS/VMS),
      I/O counters, open file descriptors, thread count, context switches, open files
      and held locks.
    - When C(pid) is C(0) (the default) the module enumerates every gludd-managed
      process via C(GET /admin/processes) and then fetches stats for each B(alive)
      process. A process that exits mid-scan (its per-pid stats call returns C(404))
      is skipped rather than failing the whole task.
    - When C(pid) is greater than C(0) only that single process's stats are returned.
    - B(Read-only) and B(check-mode safe) — it performs no writes. In check mode no
      daemon call is made and an empty fact set is returned (mirroring C(gludd_osquery)).
    - Talks to the daemon over HTTP via the shared C(GluddClient) (stdlib C(urllib)
      only — no third-party deps in the managed-node venv).
    module: gludd_proc_monitor
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      pid:
        default: 0
        description:
        - PID of a single gludd-managed process to monitor. When C(0) (the default)
          B(all) managed processes are monitored.
        type: int
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 10
        description: Per-request timeout in seconds for daemon calls.
        type: int
    short_description: Report resource utilization, I/O and locks for gludd-managed
      processes
  EXAMPLES:
  - general_ludd.agent.gludd_proc_monitor: null
    name: Monitor all gludd-managed processes
    register: procs
  - ansible.builtin.debug:
      msg: a managed process exceeds 1 GiB RSS
    name: Branch on a process using too much memory
    when: ansible_facts.gludd_proc_monitor.processes | selectattr('memory.rss', 'gt',
      1073741824) | list | length > 0
  - general_ludd.agent.gludd_proc_monitor:
      pid: 4242
    name: Monitor a single process by pid
  RETURN:
    ansible_facts:
      contains:
        gludd_proc_monitor:
          contains:
            count:
              description: Number of process stats dicts returned.
              type: int
            processes:
              description:
              - List of per-process stats dicts. Each contains C(pid), C(cpu_percent),
                C(memory) (C(rss)/C(vms)), C(io) (C(read_bytes)/C(write_bytes)/C(read_count)/C(write_count)
                or C(null)), C(num_fds), C(num_threads), C(num_ctx_switches), C(status),
                C(open_files) and C(locks).
              type: list
          description: The managed-process monitor result — C(processes) and C(count).
          returned: always
          type: dict
      description: Facts dict containing the C(gludd_proc_monitor) result.
      returned: always
      type: dict
  module: gludd_proc_monitor
general_ludd.agent.gludd_process:
  DOCUMENTATION:
    description:
    - Talks to the general_ludd daemon's managed-process API so a playbook (or the
      model running a job) can enumerate the processes the daemon launched, inspect
      a live process's resource usage, or deliver a signal to one — all without ever
      calling C(kill)/C(ps) directly on the managed node.
    - C(action=list) calls C(GET /admin/processes) and returns the registry of managed
      processes under C(ansible_facts.gludd_process).
    - C(action=status) calls C(GET /admin/processes/{pid}/stats) and returns a live
      psutil snapshot for one process under C(ansible_facts.gludd_process.stats).
    - C(action=signal) calls C(POST /admin/processes/{pid}/signal) to deliver a signal
      (optionally to the whole process group). Signal delivery is a state change,
      so it reports C(changed=True) on success.
    - SECURITY — for C(action=signal) the signal name is validated client-side against
      a small allow-list before any request is sent (defence in depth; the daemon
      enforces the same set server-side). Disallowed signal names are rejected without
      contacting the daemon.
    - Read-only and check-mode safe for C(list)/C(status). In check mode a C(signal)
      request is B(not) sent — the module reports the change it would make (C(changed=True))
      instead.
    module: gludd_process
    options:
      action:
        choices:
        - list
        - signal
        - status
        description:
        - The operation to perform. C(list) enumerates managed processes, C(status)
          fetches a live stats snapshot for one C(pid), and C(signal) delivers a signal
          to one C(pid).
        required: true
        type: str
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the general_ludd daemon.
        type: str
      group:
        default: false
        description:
        - When C(true) and C(action=signal), deliver the signal to the target's whole
          process group rather than the single process.
        type: bool
      pid:
        default: 0
        description:
        - Target process id. Required (and must be C(> 0)) for C(action=signal) and
          C(action=status). Ignored for C(action=list).
        type: int
      psk:
        default: ''
        description: Pre-shared key for daemon auth (Bearer / X-PSK).
        no_log: true
        type: str
      signal:
        default: SIGTERM
        description:
        - Signal name to deliver when C(action=signal). Must be one of the allow-listed
          names (C(SIGTERM), C(SIGINT), C(SIGHUP), C(SIGQUIT), C(SIGUSR1), C(SIGUSR2),
          C(SIGKILL), C(SIGSTOP), C(SIGCONT)).
        type: str
      timeout:
        default: 10
        description: Per-request HTTP timeout in seconds.
        type: int
    short_description: List, signal, and inspect daemon-managed processes
  EXAMPLES:
  - general_ludd.agent.gludd_process:
      action: list
    name: List all daemon-managed processes
    register: managed
  - ansible.builtin.debug:
      msg: '{{ ansible_facts.gludd_process.count }} managed processes'
    name: Show how many managed processes are alive
  - general_ludd.agent.gludd_process:
      action: status
      pid: 4242
    name: Inspect one managed process
  - general_ludd.agent.gludd_process:
      action: signal
      group: true
      pid: 4242
      signal: SIGTERM
    name: Gracefully terminate a managed process group
  RETURN:
    ansible_facts:
      contains:
        gludd_process:
          contains:
            count:
              description: Number of managed processes (C(action=list)).
              type: int
            processes:
              description: List of managed-process records (C(action=list)).
              type: list
            stats:
              description: psutil snapshot for one process (C(action=status)).
              type: dict
          description: The process-API result for the requested action.
          returned: always
          type: dict
      description: Facts dict containing the C(gludd_process) result.
      returned: always
      type: dict
    note:
      description: Human-readable note describing a check-mode no-op.
      returned: when action is signal in check mode
      type: str
    pid:
      description: The target pid for a C(signal)/C(status) action.
      returned: when action is signal or status
      type: int
    signal:
      description: The signal that was (or would be) delivered.
      returned: when action is signal
      type: str
  module: gludd_process
general_ludd.agent.gludd_push_guard:
  DOCUMENTATION:
    description:
    - Wraps the ForcePushTracker (scripts/push_rate_guard.py) as an idempotent
    - Ansible module.
    - Tracks consecutive GLUDD_FORCE_PUSH bypasses in a JSON state file and
    - rejects further bypasses when the configured C(max_bypasses) threshold
    - is exceeded within C(window_hours).
    - 'Supports three states: C(check) to query whether a bypass is allowed,'
    - C(record) to persist a bypass event, and C(reset) to clear the counter
    - (normal push).
    - Check-mode safe — C(check) and C(record) report what would change
    - without mutating the state file.
    module: gludd_push_guard
    options:
      max_bypasses: {}
      state: {}
      state_file: {}
      window_hours: {}
    short_description: Enforce push-rate guard via force-push bypass tracking
  EXAMPLES:
  - general_ludd.agent.gludd_push_guard:
      max_bypasses: 3
      state: check
    name: Check if a force-push bypass is currently allowed
    register: guard
  - ansible.builtin.fail:
      msg: 'Force-push blocked: {{ guard.current_count }} bypasses already'
    name: Block push playbook when bypass is denied
    when: not guard.bypass_allowed
  - general_ludd.agent.gludd_push_guard:
      state: record
    name: Record a successful force-push bypass
  - general_ludd.agent.gludd_push_guard:
      state: reset
      state_file: /var/tmp/my-force-track.json
    name: Reset the bypass counter after a normal push
  RETURN:
    bypass_allowed:
      description:
      - Whether a force-push bypass is currently permitted.
      - Only returned when C(state=check).
      returned: when state is 'check'
      type: bool
    current_count:
      description:
      - Number of bypass entries currently within the window.
      returned: when state is 'check'
      type: int
    max_bypasses:
      description:
      - Configured maximum consecutive bypasses before blocking.
      returned: when state is 'check'
      type: int
    recorded:
      description:
      - Whether a bypass was recorded in this invocation.
      - Only returned when C(state=record).
      returned: when state is 'record'
      type: bool
    reset:
      description:
      - Whether the counter was reset in this invocation.
      - Only returned when C(state=reset).
      returned: when state is 'reset'
      type: bool
    state_file:
      description:
      - Path to the JSON state file used for tracking.
      returned: always
      type: str
    window_hours:
      description:
      - Configured rolling window in hours.
      returned: when state is 'check'
      type: float
  module: gludd_push_guard
general_ludd.agent.gludd_rag:
  DOCUMENTATION:
    description:
    - With C(op=add_document) ingests text into an in-memory vector store backed by
      the L(rag module_utils,ansible_collections.general_ludd.agent.plugins.module_utils.rag).
    - With C(op=query) embeds a question, retrieves the top-k closest chunks, builds
      a prompt with them as context, and asks the daemon model gateway for an answer.
    - The pipeline uses the pluggable embedder from C(rag.py) (HashEmbedder by default,
      or a daemon-backed embedder when the daemon is reachable).
    - Check-mode safe for C(op=query) — returns a placeholder answer.
    module: gludd_rag
    options:
      chunk_overlap:
        default: 200
        description: Overlap between chunks in characters.
        type: int
      chunk_size:
        default: 1000
        description: Target chunk size in characters.
        type: int
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon (for model calls in C(op=query)).
        type: str
      metadata:
        default: {}
        description: Key-value metadata attached to the document (C(op=add_document)
          only).
        type: dict
      op:
        choices:
        - add_document
        - query
        default: query
        description: Which RAG operation to run.
        type: str
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      text:
        description:
        - Document text to ingest when C(op=add_document), or the question to answer
          when C(op=query).
        required: true
        type: str
      timeout:
        default: 120
        description: Request timeout in seconds.
        type: int
      top_k:
        default: 5
        description: Number of closest chunks to retrieve for context (C(op=query)
          only).
        type: int
    short_description: Retrieval-Augmented Generation pipeline via module_utils.rag
  EXAMPLES:
  - general_ludd.agent.gludd_rag:
      metadata:
        destination: Paris
        region: Europe
        source: travel_brochure
      op: add_document
      text: 'Paris: The City of Light. Visit the Eiffel Tower, Louvre Museum,

        and Notre-Dame Cathedral. Best visited April-June or September-October.

        Famous for croissants, café culture, and the Seine river cruises.

        '
    name: Add travel brochures to the RAG store
    register: paris_doc
  - general_ludd.agent.gludd_rag:
      op: query
      text: What are the best cities in Europe for art museums?
      top_k: 3
    name: Query the RAG pipeline for travel recommendations
    register: rag_answer
  - ansible.builtin.debug:
      msg: '{{ rag_answer.answer }}'
    name: Display the answer
  RETURN:
    answer:
      description: Model-generated answer using retrieved context (C(op=query)).
      returned: when op=query
      type: str
    chunk_count:
      description: Number of chunks created from the document (C(op=add_document)).
      returned: when op=add_document
      type: int
    retrieved_chunks:
      description: The context chunks that were retrieved and fed to the model.
      returned: when op=query
      type: list
    stored_total:
      description: Total vector entries in the store after the operation.
      returned: always
      type: int
  module: gludd_rag
general_ludd.agent.gludd_reload:
  DOCUMENTATION:
    description:
    - 'Wraps C(general_ludd.reload.hot_reloader.HotReloader.reload_code_module):'
    - snapshots the live module bytes, C(os.replace)s the candidate source over
    - the live path, C(importlib.reload)s the module, then runs a health gate
    - (a C(/readyz) poll). If the health gate fails or the reload raises, the
    - original bytes are restored and the module is reloaded again — the live
    - module ends up exactly as it started.
    - 'Fail-closed: a missing/non-importable target, a missing candidate, or a'
    - failed health gate all yield C(success=false).
    - Runs in-process (same venv as C(general_ludd)).
    module: gludd_reload
    options:
      candidate_source_path: {}
      config_dir: {}
      health_timeout: {}
      health_url: {}
      module_name: {}
      result_path: {}
    short_description: Hot-rotate a validated leaf code module with health-gated auto-rollback
  EXAMPLES:
  - general_ludd.agent.gludd_reload:
      candidate_source_path: /tmp/candidate/src/general_ludd/example/leaf.py
      health_url: http://127.0.0.1:8000/readyz
      module_name: general_ludd.example.leaf
      result_path: /tmp/promotion_result.json
    name: Hot-rotate a validated leaf module
    register: reload_result
  RETURN:
    rolled_back:
      description: Whether the reload was rolled back after a failed health gate.
      returned: always
      type: bool
    success:
      description: Whether the hot-rotation succeeded and passed the health gate.
      returned: always
      type: bool
  module: gludd_reload
general_ludd.agent.gludd_scapy:
  DOCUMENTATION:
    description:
    - Wraps the C(general_ludd.networking.scapy_adapter) so networking playbooks can
      craft, send, sniff, and analyze packets directly.
    - Read-only actions (C(read_pcap), C(analyze_pcap), C(dissect_packet)) are check-mode
      safe and return C(changed=False).
    - Mutating actions (C(write_pcap), C(craft_packet), C(send_packet), C(sniff_packets))
      require the adapter binary (C(scapy)) and return C(changed=True) on success.
    - All actions run via the adapter's Python API (never C(shell=True)).
    module: gludd_scapy
    options:
      action:
        choices:
        - read_pcap
        - write_pcap
        - craft_packet
        - send_packet
        - sniff_packets
        - analyze_pcap
        - dissect_packet
        description: The Scapy operation to perform.
        required: true
        type: str
      count:
        default: 1
        description: Packet count for C(sniff_packets) or repeat count for C(send_packet).
        type: int
      interface:
        default: eth0
        description: Network interface for C(send_packet) or C(sniff_packets).
        type: str
      output_format:
        choices:
        - json
        - hex
        default: json
        description: Output format for C(dissect_packet) — C(json) or C(hex).
        type: str
      packet_fields:
        description: Per-layer field overrides for C(craft_packet) or C(dissect_packet).
        type: dict
      packets:
        description: List of packet dicts for C(craft_packet) batch construction.
        elements: dict
        type: list
      pcap_path:
        description: Filesystem path to a pcap file for read/write/analyze actions.
        type: str
      protocol_stack:
        description: Ordered protocol layers for C(craft_packet), e.g. C(["Ether",
          "IP", "TCP"]).
        elements: str
        type: list
      timeout:
        default: 30
        description: Sniff timeout in seconds.
        type: int
    short_description: Packet crafting, sniffing, and pcap manipulation via Scapy
  EXAMPLES:
  - general_ludd.agent.gludd_scapy:
      action: dissect_packet
      packet_fields:
        raw_hex: 00010203040506deadbeef00010800...
    name: Decode a packet from hex
    register: decoded
  - general_ludd.agent.gludd_scapy:
      action: craft_packet
      packet_fields:
        ICMP:
          type: 8
        IP:
          dst: 8.8.8.8
      protocol_stack:
      - Ether
      - IP
      - ICMP
    name: Craft an ICMP echo request
    register: crafted
  - general_ludd.agent.gludd_scapy:
      action: sniff_packets
      count: 5
      interface: eth0
      timeout: 10
    name: Sniff DNS queries on eth0 for 10s
    register: sniffed
  - general_ludd.agent.gludd_scapy:
      action: analyze_pcap
      pcap_path: /tmp/capture.pcap
    name: Read and summarize a pcap
    register: analysis
  RETURN:
    result:
      contains:
        action:
          description: The action that was executed.
          type: str
        output:
          description: Action-specific output (packet hex/dicts, sniffed packets,
            analysis summary).
          type: raw
        summary:
          description: Human-readable summary when applicable.
          type: str
      description: Action-specific result payload.
      returned: always
      type: dict
  module: gludd_scapy
general_ludd.agent.gludd_schedule:
  DOCUMENTATION:
    description:
    - Posts a list of work-item descriptors to C(POST /api/schedule) and returns the
      ordered concurrency-safe batches as C(ansible_facts.gludd_schedule).
    - Each work item specifies its exclusive resource requirements, upstream dependencies,
      and whether it is greenfield (no shared-resource conflicts).
    - The daemon scheduler topologically sorts items, then groups them into batches
      where items within a batch may run concurrently and all dependencies are satisfied
      by strictly earlier batches.
    - PSK-authed; check-mode safe (skips the API call and returns empty batches).
    module: gludd_schedule
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      items:
        description: 'List of work-item descriptor dicts.  Each dict must contain
          C(id) (str, required) and may contain C(resources) (list[str], default []),
          C(depends_on) (list[str], default []), and C(is_greenfield) (bool, default
          false).

          '
        elements: dict
        required: true
        type: list
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
    short_description: Compute concurrency-safe execution batches via the daemon scheduler
  EXAMPLES:
  - general_ludd.agent.gludd_schedule:
      items:
      - depends_on: []
        id: TASK-001
        is_greenfield: false
        resources:
        - db
      - depends_on:
        - TASK-001
        id: TASK-002
        is_greenfield: false
        resources:
        - db
      - depends_on: []
        id: TASK-003
        is_greenfield: true
        resources: []
    name: Compute execution plan for work items
    register: schedule_result
  - ansible.builtin.debug:
      msg: 'Batches: {{ schedule_result.batches }}'
    name: Show the execution batches
  RETURN:
    ansible_facts:
      description: Contains C(gludd_schedule) with the ordered batches.
      returned: always
      type: dict
    batch_count:
      description: Number of batches in the plan.
      returned: always
      type: int
    batches:
      description: 'Ordered list of batches.  Each batch is a list of work-item ids
        that may run concurrently.  Batches are ordered so that all dependencies of
        items in batch N appear in batches 0..N-1.

        '
      returned: always
      type: list
    item_count:
      description: Number of work items submitted.
      returned: always
      type: int
  module: gludd_schedule
general_ludd.agent.gludd_skill:
  DOCUMENTATION:
    description:
    - Looks up a skill by name or trigger pattern and renders its body with Jinja2
      C(StrictUndefined) — an unknown variable is an error, not silent empty text.
    - Uses the shared C(render_skill) renderer also wired into C(execution.engine)
      so playbook and prompt paths render identically.
    - Frontmatter C(required_vars) list is checked before rendering; missing vars
      fail the task with the variable name in the error message.
    module: gludd_skill
    options:
      name:
        description: Skill name (exact match). Mutually exclusive with C(trigger).
        type: str
      skills_path:
        default: ''
        description: 'Directory to scan for skill markdown files. Defaults to C(.opencode/skills)
          relative to the playbook directory, then C(~/.config/general_ludd/skills).

          '
        type: str
      trigger:
        description: Trigger text for fuzzy/pattern matching. Mutually exclusive with
          C(name).
        type: str
      variables:
        default: {}
        description: Dict of template variables to inject.
        type: dict
    short_description: Select and render a skill with Jinja2 variables
  EXAMPLES:
  - general_ludd.agent.gludd_skill:
      name: code-review
      variables:
        language: python
        project_name: myproject
    name: Render a skill
    register: skill_result
  - ansible.builtin.set_fact:
      system_prompt: '{{ skill_result.rendered_body }}'
    name: Use rendered body as model prompt prefix
  RETURN:
    rendered_body:
      description: Skill body after Jinja2 rendering.
      returned: success
      type: str
    required_vars:
      description: Variables declared in skill frontmatter.
      returned: success
      type: list
    skill_name:
      description: Resolved skill name.
      returned: success
      type: str
  module: gludd_skill
general_ludd.agent.gludd_slurm_deploy:
  DOCUMENTATION:
    description:
    - Submits a Slurm batch job that launches C(vllm serve) or C(llama_cpp.server)
      on an allocated GPU node and polls until the server is servable (writes a servable.json
      artifact with servable_url).
    - Wraps C(general_ludd.infra.slurm_deployment.VllmSlurmDeployment) and C(LlamacppSlurmDeployment).
    - Use this when the operator has a Slurm cluster and Slurm should arbitrate GPU
      access (fairshare + accounting). For cloud GPU, use Terraform; for local dev,
      use C(make local-model-vllm).
    module: gludd_slurm_deploy
    notes:
    - Returns C(changed=true) when a job was submitted, C(false) in check mode.
    - C(servable_url) is empty until the artifact file appears with a non-null URL;
      on failure, C(error) carries the diagnostics.
    options:
      artifact_dir:
        description: 'Shared-filesystem directory the batch script writes servable.json
          to. Must be readable from the controller host.

          '
        required: true
        type: str
      engine:
        choices:
        - vllm
        - llamacpp
        description: Which model server to deploy.
        required: true
        type: str
      extra_args:
        default: []
        description: Extra argv tokens to pass to vllm serve / llama_cpp.server.
        elements: str
        type: list
      gpu_count:
        default: 1
        description: Number of GPUs to request per node.
        type: int
      gpu_type:
        default: a100
        description: GPU type Slurm should allocate (e.g. a100, h100).
        type: str
      max_ctx:
        default: 32768
        description: Maximum model context length.
        type: int
      max_hours:
        default: 4
        description: Job walltime in hours.
        type: int
      mem_gb:
        default: 32
        description: Host memory to request (GB).
        type: int
      model_id:
        description: Model id (HuggingFace id or path to .gguf for llamacpp).
        required: true
        type: str
      module_loads:
        default: []
        description: List of environment modules to load on the compute node.
        elements: str
        type: list
      partition:
        default: gpu
        description: Slurm partition to submit to.
        type: str
      poll_interval:
        default: 5.0
        description: Seconds between polls of the artifact file.
        type: float
      poll_timeout:
        default: 300
        description: Seconds to wait for the server to become servable.
        type: int
      port:
        default: 8000
        description: Port the model server binds on the compute node.
        type: int
    short_description: Deploy a vLLM or llama.cpp model server on a Slurm cluster
  EXAMPLES:
  - general_ludd.agent.gludd_slurm_deploy:
      artifact_dir: /scratch/gludd/job-{{ job_id }}
      engine: vllm
      gpu_count: 2
      gpu_type: a100
      max_hours: 4
      model_id: meta-llama/Llama-3.1-8B-Instruct
      port: 8000
    name: Deploy vLLM on Slurm
    register: deploy
  - ansible.builtin.assert:
      that: deploy.servable_url | length > 0
    name: Wait for servable
  RETURN:
    engine:
      description: Engine that was deployed.
      returned: always
      type: str
    error:
      description: Diagnostics on failure (empty on success).
      returned: always
      type: str
    job_id:
      description: Submitted Slurm job id (empty in check mode).
      returned: always
      type: str
    model_id:
      description: Model id that was deployed.
      returned: always
      type: str
    servable_url:
      description: URL the model server is reachable at (empty on timeout/failure).
      returned: always
      type: str
  module: gludd_slurm_deploy
general_ludd.agent.gludd_spend:
  DOCUMENTATION:
    description:
    - C(state=get) calls C(GET /api/spend) and returns the current spend snapshot
      as C(ansible_facts.gludd_spend).
    - C(state=configure) calls C(POST /api/spend/configure) to update the spend-limiter
      settings (limit_usd and/or window_seconds).
    - PSK-authed; check-mode safe on C(state=get). C(state=configure) skips the API
      call in check mode and returns an empty diff.
    module: gludd_spend
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      limit_usd:
        description: Spend limit in USD (configure only).
        type: float
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      state:
        choices:
        - get
        - configure
        default: get
        description: Operation to perform.
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      window_seconds:
        description: Rolling window size in seconds (configure only).
        type: int
    short_description: Fetch and configure the daemon spend-limiter
  EXAMPLES:
  - general_ludd.agent.gludd_spend: null
    name: Fetch current spend snapshot as facts
    register: spend_result
  - ansible.builtin.debug:
      msg: 'Remaining: ${{ ansible_facts.gludd_spend.remaining_usd }}'
    name: Show remaining budget
  - general_ludd.agent.gludd_spend:
      limit_usd: 10.0
      state: configure
      window_seconds: 86400
    name: Configure spend limit
    register: configure_result
  RETURN:
    ansible_facts:
      description: Contains C(gludd_spend) with the spend snapshot (state=get).
      returned: when state=get
      type: dict
    configured:
      description: Updated configuration dict (state=configure).
      returned: when state=configure
      type: dict
    spend:
      description: Spend snapshot dict (state=get).
      returned: when state=get
      type: dict
  module: gludd_spend
general_ludd.agent.gludd_stream:
  DOCUMENTATION:
    description:
    - Opens a device (e.g. C(/dev/video0), C(hw:0,0), C(pulse), C(rtsp://...), a file
      path) via the appropriate capture tool (ffmpeg / tail / cat) and streams bytes
      into a rolling in-memory buffer.
    - When the configured C(dispatch_trigger) fires (size threshold, interval, silence
      detection, or external MQ message), the current buffer is written to C(artifact_dir/chunk-<n>.bin)
      and POSTed to the daemon's C(/admin/stream/dispatch) endpoint.
    - The dispatch clones the *calling role* (the role invoking this module), injects
      the chunk as a named variable, and runs the clone on that chunk. An optional
      C(external_processor) (whisper.cpp / ffmpeg / agent) is invoked on the chunk
      before the cloned role's tasks run.
    - The module stops when the C(stop_condition) fires (timeout, EOF, external MQ
      message, or max dispatches), drains the remaining buffer with a final dispatch,
      closes the device subprocess, and returns.
    - Check mode skips device capture and HTTP dispatch; it returns a synthetic result
      describing the would-have-run pipeline.
    module: gludd_stream
    options:
      artifact_dir:
        default: ''
        description: Directory to write buffer chunks before dispatch. Defaults to
          tempfile.gettempdir().
        type: str
      buffer_size:
        default: 1048576
        description: Maximum bytes/frames to retain in the rolling buffer before discarding
          oldest.
        type: int
      daemon_url:
        description: Base URL of the gludd daemon.
        required: true
        type: str
      device:
        description: Input device path or URL (e.g. C(/dev/video0), C(hw:0,0), C(rtsp://...)).
        required: true
        type: str
      device_kind:
        choices:
        - video
        - audio
        - text
        - binary
        description: Hint for which capture tool / external processor to use.
        required: true
        type: str
      dispatch_role_clone:
        description: 'Dict controlling role cloning. When C(clone_current_role=true),
          the daemon clones the calling role and injects the buffered chunk.

          '
        suboptions:
          clone_current_role:
            default: true
            description: Whether to clone the current calling role.
            type: bool
          extra_vars:
            default: {}
            description: Additional vars passed to the cloned role.
            type: dict
          inject_as:
            default: stream_chunk
            description: Variable name the chunk path is injected as.
            type: str
        type: dict
      dispatch_trigger:
        description: 'Dict describing when to dispatch the current buffer. Exactly
          one of C(size_threshold), C(interval), C(silence_detection), C(external),
          C(input_key).

          '
        suboptions:
          bytes:
            description: Threshold in bytes (type=size_threshold).
            type: int
          include_key_in_after:
            default: true
            description: 'When true, the matched key bytes are prepended to the dispatched
              after_key payload (type=input_key). The key is always consumed from
              the working search buffer so repeated keys delimit successive chunks.

              '
            type: bool
          key:
            description: 'The input key to match in the byte stream (type=input_key).
              Either a UTF-8 string (encoded to bytes for matching) or a list of byte
              ints for binary streams.

              '
            type: raw
          max_bytes_after:
            default: 1048576
            description: 'Cap on the post-key buffer; flushes the after-chunk when
              reached (type=input_key, modes after/both).

              '
            type: int
          max_bytes_before:
            default: 1048576
            description: Cap on the pre-key buffer (type=input_key).
            type: int
          min_silence_ms:
            description: Minimum silence length in ms (type=silence_detection).
            type: int
          mode:
            choices:
            - before
            - after
            - both
            default: before
            description: 'How to dispatch around the key (type=input_key). C(before)
              dispatches the buffer accumulated up to (excluding) the key. C(after)
              dispatches the buffer accumulated past the key when the next key fires
              or C(max_bytes_after) is reached. C(both) dispatches BOTH the pre-key
              buffer and the post-key buffer as two separate dispatches sharing the
              same C(stream_chunk_index).

              '
            type: str
          seconds:
            description: Interval or timeout in seconds (type=interval).
            type: float
          topic:
            description: MQ topic whose first message triggers dispatch (type=external).
            type: str
          type:
            choices:
            - size_threshold
            - interval
            - silence_detection
            - external
            - input_key
            description: Trigger kind.
            type: str
        type: dict
      external_processor:
        description: 'Optional tool the cloned role invokes on the chunk before its
          own tasks.

          '
        suboptions:
          args:
            default: []
            description: Extra args passed to the tool.
            elements: str
            type: list
          timeout_seconds:
            default: 60
            description: Per-chunk processor timeout.
            type: int
          tool:
            choices:
            - whisper.cpp
            - ffmpeg
            - agent
            description: Tool name.
            type: str
        type: dict
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      stop_condition:
        description: Dict describing when to stop listening.
        suboptions:
          count:
            description: Max dispatches before stopping (type=max_dispatches).
            type: int
          seconds:
            description: Timeout in seconds (type=timeout).
            type: float
          topic:
            description: MQ topic whose first message stops the stream (type=external).
            type: str
          type:
            choices:
            - timeout
            - eof
            - external
            - max_dispatches
            description: Stop kind.
            type: str
        type: dict
    short_description: Stream input signals (video/audio/text/binary) and dispatch
      buffered chunks to a cloned role
  EXAMPLES:
  - general_ludd.agent.gludd_stream:
      buffer_size: 524288
      daemon_url: http://localhost:8000
      device: hw:0,0
      device_kind: audio
      dispatch_role_clone:
        clone_current_role: true
        inject_as: stream_chunk
      dispatch_trigger:
        min_silence_ms: 800
        type: silence_detection
      external_processor:
        args:
        - --language
        - en
        timeout_seconds: 60
        tool: whisper.cpp
      psk: '{{ gludd_psk }}'
      stop_condition:
        seconds: 300
        type: timeout
    name: Stream microphone and transcribe speech
    register: stream_out
  - ansible.builtin.debug:
      msg: 'transcription task: {{ stream_out.last_task_id }}'
    name: Use the last transcription task id
  - general_ludd.agent.gludd_stream:
      buffer_size: 2097152
      daemon_url: http://localhost:8000
      device: /dev/video0
      device_kind: video
      dispatch_role_clone:
        clone_current_role: true
        extra_vars:
          detection_target: person
        inject_as: stream_chunk
      dispatch_trigger:
        bytes: 2097152
        type: size_threshold
      external_processor:
        timeout_seconds: 120
        tool: agent
      psk: '{{ gludd_psk }}'
      stop_condition:
        count: 5
        type: max_dispatches
    name: Stream webcam and detect features per chunk
    register: stream_out
  - general_ludd.agent.gludd_stream:
      buffer_size: 1048576
      daemon_url: http://localhost:8000
      device: /var/log/app.log
      device_kind: text
      dispatch_role_clone:
        clone_current_role: true
        inject_as: stream_chunk
      dispatch_trigger:
        seconds: 10
        type: interval
      psk: '{{ gludd_psk }}'
      stop_condition:
        type: eof
    name: Tail an app log and dispatch every 10s
    register: stream_out
  - general_ludd.agent.gludd_stream:
      daemon_url: http://localhost:8000
      device: /tmp/fixture.log
      device_kind: binary
      dispatch_role_clone:
        clone_current_role: true
        inject_as: stream_chunk
      dispatch_trigger:
        key: TRIGGER
        mode: before
        type: input_key
      psk: '{{ gludd_psk }}'
      stop_condition:
        type: eof
    name: Stream a log and dispatch the lead-up to each TRIGGER marker
    register: stream_out
  - general_ludd.agent.gludd_stream:
      daemon_url: http://localhost:8000
      device: hw:0,0
      device_kind: audio
      dispatch_role_clone:
        clone_current_role: true
        inject_as: stream_chunk
      dispatch_trigger:
        include_key_in_after: true
        key: '{{ silence_marker_bytes }}'
        max_bytes_after: 65536
        mode: both
        type: input_key
      psk: '{{ gludd_psk }}'
      stop_condition:
        seconds: 600
        type: timeout
    name: Audio VAD — dispatch speech (before_key) + silence/continuation (after_key)
    register: stream_out
  RETURN:
    bytes_processed:
      description: Total bytes streamed through the buffer.
      returned: success
      type: int
    chunks:
      description: List of artifact chunk paths written to artifact_dir.
      elements: str
      returned: success
      type: list
    dispatches:
      description: Number of dispatches performed.
      returned: success
      type: int
    last_task_id:
      description: task_id returned by the final dispatch.
      returned: success
      type: str
    stopped_by:
      description: Which stop_condition fired (timeout, eof, external, max_dispatches).
      returned: success
      type: str
  module: gludd_stream
general_ludd.agent.gludd_traces:
  DOCUMENTATION:
    description:
    - Queries the daemon's read-only C(GET /api/traces) endpoint and returns the recent
      execution-trace snapshot under C(ansible_facts.gludd_traces) so a playbook can
      branch on live trace data in C(when:) / C(vars:).
    - Read-only and check-mode safe — it performs no writes.
    - Exposes a bounded list of recent traces (trace_id, todo_id, work_type, total_cost_usd,
      total_tokens, success_rate, span_count, spans), a by-phase aggregate summary,
      and the OpenTelemetry exporter status (C(available) / C(disabled)).
    - Traces are sourced ONLY from the daemon's in-process recent-traces buffer (genuinely-captured
      telemetry); no spans are fabricated. When no OTLP collector is configured the
      otel exporter status is honestly C(disabled).
    module: gludd_traces
    options:
      daemon_url:
        default: http://localhost:8000
        description: Base URL of the daemon.
        type: str
      limit:
        default: 20
        description: Maximum number of recent traces to return.
        type: int
      psk:
        default: ''
        description: Pre-shared key for daemon auth.
        no_log: true
        type: str
      timeout:
        default: 30
        description: Request timeout in seconds.
        type: int
      todo_id:
        description: Optional filter — only traces for this todo.
        type: str
    short_description: Inject recent execution traces (spans/cost/phase) as ansible_facts
  EXAMPLES:
  - general_ludd.agent.gludd_traces: null
    name: Load recent traces
    register: traces
  - ansible.builtin.debug:
      msg: Captured {{ ansible_facts.gludd_traces.count }} traces
    name: Show how many traces were captured
  - general_ludd.agent.gludd_traces:
      limit: 5
      todo_id: TODO-abc123
    name: Only traces for a specific todo
    register: todo_traces
  - ansible.builtin.debug:
      msg: generate phase cost is high
    name: Warn when the generate phase is expensive
    when: "(ansible_facts.gludd_traces.by_phase['generate'].total_cost_usd\n  | default(0)\
      \ | float) > 1.0"
  RETURN:
    ansible_facts:
      contains:
        gludd_traces:
          description:
          - Trace snapshot with C(count), C(total_recorded), C(recent) (bounded list
            of traces with spans), C(by_phase) aggregate, and C(otel_exporter_status).
          returned: always
          type: dict
      description: Facts dict containing the C(gludd_traces) snapshot.
      returned: always
      type: dict
  module: gludd_traces
general_ludd.agent.gludd_worktree:
  DOCUMENTATION:
    description:
    - Creates or removes a git worktree via git_automation.repo.GitAutomation.
    - Idempotent — C(changed=false) when the desired state already exists.
    - In check mode reports what would change without modifying the filesystem.
    module: gludd_worktree
    options:
      branch:
        description: Branch name for the new worktree.
        required: true
        type: str
      repo_path:
        description: Path to the git repository root.
        required: true
        type: str
      state:
        choices:
        - present
        - absent
        default: present
        description: C(present) to create, C(absent) to remove.
        type: str
      worktree_path:
        description: Filesystem path for the new worktree.
        required: true
        type: str
    short_description: Manage git worktrees (idempotent)
  EXAMPLES:
  - general_ludd.agent.gludd_worktree:
      branch: fix/auto-20260612
      repo_path: /workspace/myrepo
      worktree_path: /tmp/worktrees/fix-auto-20260612
    name: Create a worktree
    register: wt
  - general_ludd.agent.gludd_worktree:
      branch: fix/auto-20260612
      repo_path: /workspace/myrepo
      state: absent
      worktree_path: /tmp/worktrees/fix-auto-20260612
    name: Remove worktree on cleanup
  RETURN:
    branch:
      description: Branch name.
      returned: always
      type: str
    state:
      description: Resulting state (present or absent).
      returned: always
      type: str
    worktree_path:
      description: Path of the worktree.
      returned: always
      type: str
  module: gludd_worktree

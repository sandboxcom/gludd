# docs/features.yml
#
# Declarative manifest for the README "Feature & Task Completion Status" table.
# This file is the SINGLE SOURCE OF TRUTH for feature metadata.
#
# Generator: scripts/gen_status_table.py
# Gate:      make check-status-table   (--check --fast; no pytest)
# Regenerate: make gen-status-table   (--write --fast)
#
# Schema per feature:
#   id           : unique slug (snake_case)
#   title        : display name (verbatim README row)
#   pct          : integer 0-100 (human-maintained; reflects partial completion)
#   pct_note     : optional string appended to pct display (e.g. "(local)")
#   evidence_refs: list of structured refs for FeatureVerifier
#                  test:path[::selector]  — file checked (fast), pytest run (full)
#                  file:path::symbol      — path + symbol present in file (always fast)
#                  role:name              — collections/.../roles/<name>/ dir
#                  module:name            — plugins/modules/<name>.py
#                  molecule:scenario      — molecule/playbooks/<scenario>/ dir
#   notes        : short evidence narrative for the Evidence column


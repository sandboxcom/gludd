<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'SF Mono', Menlo, Monaco, monospace">
  <style>
    .step-box { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .step-number { fill: #58a6ff; font-size: 28px; font-weight: bold; text-anchor: middle; }
    .step-label { fill: #c9d1d9; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .step-desc { fill: #8b949e; font-size: 12px; text-anchor: middle; }
    .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead-loop); }
    .loop-label { fill: #d29922; font-size: 13px; text-anchor: middle; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead-loop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" fill="#58a6ff" font-size="18" font-weight="600" text-anchor="middle">The Work Cycle</text>

  <!-- Step 1: Claim -->
  <rect class="step-box" x="50" y="120" width="140" height="100"/>
  <text class="step-number" x="120" y="155">1</text>
  <text class="step-label" x="120" y="185">Claim</text>
  <text class="step-desc" x="120" y="205">grab next task</text>

  <!-- Step 2: Dispatch -->
  <rect class="step-box" x="240" y="120" width="140" height="100"/>
  <text class="step-number" x="310" y="155">2</text>
  <text class="step-label" x="310" y="185">Dispatch</text>
  <text class="step-desc" x="310" y="205">AI writes code</text>

  <!-- Step 3: Review -->
  <rect class="step-box" x="430" y="120" width="140" height="100"/>
  <text class="step-number" x="500" y="155">3</text>
  <text class="step-label" x="500" y="185">Review</text>
  <text class="step-desc" x="500" y="205">AI checks work</text>

  <!-- Step 4: Save -->
  <rect class="step-box" x="620" y="120" width="140" height="100"/>
  <text class="step-number" x="690" y="155">4</text>
  <text class="step-label" x="690" y="185">Save</text>
  <text class="step-desc" x="690" y="205">code to git</text>

  <!-- Arrows between steps -->
  <path class="arrow" d="M 190 170 L 240 170"/>
  <path class="arrow" d="M 380 170 L 430 170"/>
  <path class="arrow" d="M 570 170 L 620 170"/>

  <!-- Loop back arrow -->
  <path class="arrow" d="M 690 220 Q 690 320 400 320 Q 120 320 120 220" stroke-dasharray="5,3"/>
  <text class="loop-label" x="400" y="345">repeat &mdash; every second, 24/7</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Three Layers of Safety</text>
  <text x="400" y="76" text-anchor="middle" font-size="14" fill="#64748b">Each layer catches what the others miss</text>

  <!-- ===== Layer 1: Config Permissions (top) ===== -->
  <g filter="url(#shadow3)">
    <rect x="120" y="115" width="560" height="110" rx="14" fill="#1e3a8a" stroke="#1e40af" stroke-width="2"/>
  </g>
  <text x="150" y="150" font-size="28">⚙️</text>
  <text x="195" y="148" font-size="13" font-weight="700" fill="#bfdbfe">LAYER 1 · HARD GATE</text>
  <text x="195" y="173" font-size="19" font-weight="700" fill="#ffffff">Config Permissions</text>
  <text x="195" y="196" font-size="12" fill="#dbeafe">What the agent is allowed to do — enforced before any command runs.</text>
  <text x="195" y="214" font-size="11" fill="#93c5fd" font-style="italic">file: opencode.json</text>
  <text x="650" y="148" text-anchor="end" font-size="11" font-weight="600" fill="#bfdbfe">can't be bypassed</text>

  <!-- ===== Layer 2: Runtime Hooks (middle) ===== -->
  <g filter="url(#shadow3)">
    <rect x="120" y="245" width="560" height="110" rx="14" fill="#7c2d12" stroke="#9a3412" stroke-width="2"/>
  </g>
  <text x="150" y="280" font-size="28">🪝</text>
  <text x="195" y="278" font-size="13" font-weight="700" fill="#fed7aa">LAYER 2 · REAL-TIME CHECK</text>
  <text x="195" y="303" font-size="19" font-weight="700" fill="#ffffff">Runtime Hooks</text>
  <text x="195" y="326" font-size="12" fill="#ffedd5">Catches violations the moment they happen — with a helpful message.</text>
  <text x="195" y="344" font-size="11" fill="#fdba74" font-style="italic">folder: .opencode/plugin/*.ts</text>
  <text x="650" y="278" text-anchor="end" font-size="11" font-weight="600" fill="#fed7aa">guides, doesn't just block</text>

  <!-- ===== Layer 3: Agent Prompt (bottom) ===== -->
  <g filter="url(#shadow3)">
    <rect x="120" y="375" width="560" height="110" rx="14" fill="#3b0764" stroke="#5b21b6" stroke-width="2"/>
  </g>
  <text x="150" y="410" font-size="28">📖</text>
  <text x="195" y="408" font-size="13" font-weight="700" fill="#ddd6fe">LAYER 3 · TAUGHT RULES</text>
  <text x="195" y="433" font-size="19" font-weight="700" fill="#ffffff">Agent Prompt</text>
  <text x="195" y="456" font-size="12" fill="#ede9fe">Teaches the agent the rules so it chooses correctly on its own.</text>
  <text x="195" y="474" font-size="11" fill="#c4b5fd" font-style="italic">file: AGENTS.md</text>
  <text x="650" y="408" text-anchor="end" font-size="11" font-weight="600" fill="#ddd6fe">proactive, not reactive</text>

  <!-- Stack arrows on left side (showing they build on each other) -->
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 80 180)">outermost</text>
  <text x="80" y="440" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 80 440)">innermost</text>

  <!-- Footer explanation -->
  <text x="400" y="525" text-anchor="middle" font-size="13" fill="#475569">No single layer is enough.</text>
  <text x="400" y="545" text-anchor="middle" font-size="12" fill="#64748b">A rule ignored by the prompt is still caught by the hook.</text>
  <text x="400" y="563" text-anchor="middle" font-size="12" fill="#64748b">A hook bypassed is still blocked by the config permission.</text>
</svg>

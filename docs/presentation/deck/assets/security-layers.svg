<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="-apple-system, 'SF Mono', Menlo, Monaco, monospace">
  <style>
    .layer-box { stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .layer-1 { fill: #1f6feb; }
    .layer-2 { fill: #238636; }
    .layer-3 { fill: #6e40c9; }
    .layer-title { fill: #fff; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .layer-desc { fill: #c9d1d9; font-size: 12px; text-anchor: middle; }
    .layer-detail { fill: #8b949e; font-size: 11px; text-anchor: middle; }
    .title { fill: #58a6ff; font-size: 18px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text class="title" x="350" y="30">Three Layers of Protection</text>

  <!-- Layer 1: Permissions -->
  <rect class="layer-box layer-1" x="100" y="60" width="500" height="90"/>
  <text class="layer-title" x="350" y="90">Layer 1 &mdash; Permissions</text>
  <text class="layer-desc" x="350" y="115">Hard rules on what gludd is allowed to do</text>
  <text class="layer-detail" x="350" y="135">Defined in config files &middot; blocks actions before they happen</text>

  <!-- Layer 2: Runtime Guards -->
  <rect class="layer-box layer-2" x="100" y="170" width="500" height="90"/>
  <text class="layer-title" x="350" y="200">Layer 2 &mdash; Runtime Guards</text>
  <text class="layer-desc" x="350" y="225">11 plugins watch every action in real time</text>
  <text class="layer-detail" x="350" y="245">Catches mistakes, blocks bad commits, enforces quality</text>

  <!-- Layer 3: Prompt Rules -->
  <rect class="layer-box layer-3" x="100" y="280" width="500" height="90"/>
  <text class="layer-title" x="350" y="310">Layer 3 &mdash; Prompt Rules</text>
  <text class="layer-desc" x="350" y="335">The AI is instructed to follow safe practices</text>
  <text class="layer-detail" x="350" y="355">Written into the agent's instructions &middot; proactive guidance</text>

  <!-- Bottom note -->
  <text x="350" y="410" fill="#d29922" font-size="13" text-anchor="middle" font-style="italic">
    14 of 15 security findings fixed &middot; 1 remains open and tracked
  </text>
</svg>

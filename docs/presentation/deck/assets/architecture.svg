<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'SF Mono', Menlo, Monaco, monospace">
  <style>
    .box { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .box-user { fill: #1f6feb; stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .box-ai { fill: #238636; stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .box-gate { fill: #d29922; stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .box-git { fill: #6e40c9; stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .label { fill: #c9d1d9; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .sublabel { fill: #8b949e; font-size: 11px; text-anchor: middle; }
    .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { fill: #79c0ff; font-size: 11px; text-anchor: middle; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- User -->
  <rect class="box-user" x="30" y="200" width="130" height="70"/>
  <text class="label" x="95" y="230" fill="#fff">You</text>
  <text class="sublabel" x="95" y="250" fill="#c9d1d9">type a task</text>

  <!-- gludd daemon -->
  <rect class="box" x="250" y="170" width="160" height="130"/>
  <text class="label" x="330" y="210">gludd</text>
  <text class="sublabel" x="330" y="230">the agent</text>
  <text class="sublabel" x="330" y="250">picks up tasks</text>
  <text class="sublabel" x="330" y="270">assigns the work</text>

  <!-- AI Models -->
  <rect class="box-ai" x="500" y="80" width="160" height="100"/>
  <text class="label" x="580" y="120" fill="#fff">AI writes code</text>
  <text class="sublabel" x="580" y="145" fill="#c9d1d9">24 model providers</text>
  <text class="sublabel" x="580" y="160" fill="#c9d1d9">GPT-4, Claude, DeepSeek...</text>

  <!-- AI Reviewer -->
  <rect class="box-ai" x="500" y="290" width="160" height="100"/>
  <text class="label" x="580" y="330" fill="#fff">AI reviews</text>
  <text class="sublabel" x="580" y="355" fill="#c9d1d9">different model</text>
  <text class="sublabel" x="580" y="370" fill="#c9d1d9">checks the work</text>

  <!-- Quality gate -->
  <rect class="box-gate" x="720" y="185" width="150" height="100"/>
  <text class="label" x="795" y="225">Quality gate</text>
  <text class="sublabel" x="795" y="250">tests + security</text>

  <!-- Git -->
  <rect class="box-git" x="500" y="420" width="160" height="60"/>
  <text class="label" x="580" y="445" fill="#fff">Code saved to git</text>
  <text class="sublabel" x="580" y="465" fill="#c9d1d9">your project</text>

  <!-- Arrows -->
  <path class="arrow" d="M 160 235 L 250 235"/>
  <text class="arrow-label" x="205" y="225">task</text>

  <path class="arrow" d="M 410 210 L 500 130"/>
  <text class="arrow-label" x="450" y="155">write</text>

  <path class="arrow" d="M 660 130 L 720 210"/>
  <text class="arrow-label" x="710" y="155">check</text>

  <path class="arrow" d="M 795 285 L 660 330"/>
  <text class="arrow-label" x="745" y="315">review</text>

  <path class="arrow" d="M 580 390 L 580 420"/>
  <text class="arrow-label" x="610" y="408">save</text>

  <!-- Loop back arrow -->
  <path class="arrow" d="M 250 290 Q 200 400 330 420 L 500 450" stroke-dasharray="5,3"/>
  <text class="arrow-label" x="300" y="395">next task</text>
</svg>
